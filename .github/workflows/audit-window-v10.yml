name: Audit WINDOW V1.0 Quality

on:
  push:
    branches:
      - window-v1.0-quality-gates
    paths:
      - '.github/workflows/audit-window-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-window-v10
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate V1.0 code contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/global-cams/sync_windows_to_r2.py
          node scripts/validate_global_cams.mjs

      - name: Audit current production manifest
        run: |
          set -euo pipefail
          python scripts/global-cams/sync_windows_to_r2.py --audit-existing
          python - <<'PY'
          import json
          rows=json.load(open(".window-build/audit-existing.json",encoding="utf-8"))
          print("V1_PASS_COUNT=",len(rows))
          if rows:
              print("MIN_DURATION=",min(float(x["duration_seconds"]) for x in rows))
              print("MAX_DURATION=",max(float(x["duration_seconds"]) for x in rows))
              print("MIN_SCORE=",min(int(x["quality_score"]) for x in rows))
              print("MIN_WIDTH=",min(int(x["width"]) for x in rows))
              print("MIN_HEIGHT=",min(int(x["height"]) for x in rows))
          PY

      - name: Upload audit evidence
        uses: actions/upload-artifact@v6
        with:
          name: window-v10-existing-audit
          path: .window-build/audit-existing.json
          retention-days: 7
