name: Ooglex Macro Official Data Pipeline
on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: asset-compass-ledger-main
  cancel-in-progress: false
jobs:
  treasury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run macro parsing unit tests
        run: python3 -m unittest discover -s tests -p 'test_macro_*.py' -v
      - name: Download official Treasury yields and validate
        run: python3 scripts/update_asset_scores.py
      - name: Download BLS CPI and labor-market observations
        run: python3 scripts/update_macro_bls.py
      - name: Download New York Fed effective funds rate
        run: python3 scripts/update_macro_nyfed.py
      - name: Fetch BEA core PCE and Federal Reserve H41 (FRED public mirror)
        run: python3 -m scripts.update_macro_fed_bea
      - name: Download Federal Reserve liquidity components individually
        run: python3 -m scripts.update_macro_liquidity
      - name: Download official NY Fed recession model workbook
        run: |
          python3 -m pip install -q xlrd==2.0.2
          python3 -m scripts.update_nyfed_recession
      - name: Evaluate guarded asset scoring model
        run: python3 scripts/score_macro_assets.py
      - name: Build traceable research-only six-factor observations
        run: python3 -m scripts.build_asset_compass_factor_observations
      - name: Archive first-seen macro observations (not original publication vintages)
        run: python3 -m scripts.archive_asset_compass_observations
      - name: Check historical archive readiness
        run: python3 -m scripts.check_asset_compass_history_readiness
      - name: Audit actual committed snapshot inputs and source gaps
        run: |
          python3 -m scripts.diagnose_asset_compass_sources_v28 \
            --output /tmp/asset-compass-v29-source-audit.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("/tmp/asset-compass-v29-source-audit.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### Macro source delivery audit (V29)\n")
              f.write(f"Present required series: {r['required_present_in_snapshot']}/{r['required_series_count']}  \n")
              f.write(f"Missing source fields: {', '.join(r['missing_from_snapshot']) or 'none'}  \n")
              f.write(f"Present but not archived: {', '.join(r['present_but_not_archived']) or 'none'}  \n")
              f.write("Missing is not zero; source response errors require collector logs. No live scores unlocked.\n")
          PY
      - name: Commit verified snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json data/asset-compass-observation-ledger.jsonl data/asset-compass-history-readiness.json data/asset-compass-factor-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): refresh official Treasury snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
