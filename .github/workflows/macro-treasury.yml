name: Ooglex Macro Treasury Snapshot
on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  treasury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download official Treasury yields and validate
        run: python3 scripts/update_asset_scores.py
      - name: Commit verified snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): refresh official Treasury snapshot"
            git push
          fi
