name: Ooglex Macro Official Data Pipeline
on:
  schedule:
    - cron: '40 23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  treasury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run macro parsing unit tests
        run: python3 -m unittest discover -s tests -p 'test_macro_*.py' -v
      - name: Download official Treasury yields and validate
        run: python3 scripts/update_asset_scores.py
      - name: Download BLS CPI and labor-market observations
        run: python3 scripts/update_macro_bls.py
      - name: Download New York Fed effective funds rate
        run: python3 scripts/update_macro_nyfed.py
      - name: Fetch BEA core PCE and Federal Reserve H41 (FRED public mirror)
        run: python3 -m scripts.update_macro_fed_bea
      - name: Download Federal Reserve liquidity components individually
        run: python3 -m scripts.update_macro_liquidity
      - name: Evaluate guarded asset scoring model
        run: python3 scripts/score_macro_assets.py
      - name: Archive first-seen macro observations (not original publication vintages)
        run: python3 -m scripts.archive_asset_compass_observations
      - name: Check historical archive readiness
        run: python3 -m scripts.check_asset_compass_history_readiness
      - name: Commit verified snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json data/asset-compass-observation-ledger.jsonl data/asset-compass-history-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): refresh official Treasury snapshot"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
