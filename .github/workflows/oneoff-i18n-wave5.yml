name: One-off i18n wave5 rollout

on:
  push:
    branches: [feature/i18n-wave5]
    paths:
      - '.github/workflows/oneoff-i18n-wave5.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/i18n-wave5
          fetch-depth: 0

      - name: Rebase onto latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main

      - name: Inject final i18n layer
        run: |
          python - <<'PY'
          from pathlib import Path

          terminal = [
              'apps/finance-terminal/index.html',
              'apps/finance-terminal/security.html',
              'apps/finance-terminal/trends.html',
              'apps/finance-terminal/compare.html',
              'apps/finance-terminal/screen.html',
              'apps/finance-terminal/quote.html',
              'apps/finance-terminal/terms.html',
              'apps/finance-terminal/privacy.html',
              'apps/finance-terminal/legacy.html',
          ]
          wave4 = [
              'apps/calculators/index.html',
              'apps/ai-chat/index.html',
          ]
          tag = '<script src="/assets/i18n-wave5.js?v=cd93f423" defer></script>'

          for name in terminal:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'i18n-wave5.js' in s:
                  continue
              needle = '<script src="/assets/i18n.js?v=72e8d1ca" defer></script>'
              if needle not in s:
                  raise SystemExit(f'missing i18n anchor: {name}')
              s = s.replace(needle, needle + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')

          for name in wave4:
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if 'i18n-wave5.js' in s:
                  continue
              needle = '<script src="/assets/i18n-wave4.js?v=dd610995" defer></script>'
              if needle not in s:
                  raise SystemExit(f'missing wave4 anchor: {name}')
              s = s.replace(needle, needle + '\n' + tag, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate final sweep
        run: |
          node --check assets/i18n-wave5.js
          python - <<'PY'
          from pathlib import Path
          targets = [
              'apps/finance-terminal/index.html','apps/finance-terminal/security.html',
              'apps/finance-terminal/trends.html','apps/finance-terminal/compare.html',
              'apps/finance-terminal/screen.html','apps/finance-terminal/quote.html',
              'apps/finance-terminal/terms.html','apps/finance-terminal/privacy.html',
              'apps/finance-terminal/legacy.html','apps/calculators/index.html',
              'apps/ai-chat/index.html'
          ]
          for name in targets:
              text = Path(name).read_text(encoding='utf-8')
              assert text.count('i18n-wave5.js') == 1, name
          js = Path('assets/i18n-wave5.js').read_text(encoding='utf-8')
          for token in ['Security Description', 'Equity Screener', 'Mortgage Calculator', 'Cloud AI', 'Terms of Use']:
              assert token in js, token
          print('wave5 validation ok:', len(targets), 'pages')
          PY
          if [ -f scripts/validate_terminal.py ]; then python scripts/validate_terminal.py; fi
          git diff --check

      - name: Commit rollout and remove one-off workflow
        run: |
          rm -f .github/workflows/oneoff-i18n-wave5.yml
          git add assets/i18n-wave5.js apps/finance-terminal apps/calculators/index.html apps/ai-chat/index.html .github/workflows/oneoff-i18n-wave5.yml
          git commit -m 'feat(i18n): finish deep-page English coverage' || true
          git push --force-with-lease origin HEAD:feature/i18n-wave5
