name: Deploy Jamendo proxy

# 流光播放器「全球曲库」的 Jamendo 目录代理。合并到 main 且本目录有改动时部署，也可手动运行。
# 需要：仓库里已在用的 CLOUDFLARE_API_TOKEN，以及新增的仓库 Secret JAMENDO_CLIENT_ID。
# 绑定自定义域名 music-api.ooglex.com（中国大陆可访问；workers.dev 打不开），不改 www 的解析，不新增付费服务。
on:
  workflow_dispatch:
    inputs:
      probe_only:
        description: "只探测 Jamendo 原始返回，不部署"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'workers/jamendo-proxy/**'
      - '.github/workflows/deploy-jamendo-proxy.yml'

permissions:
  contents: read

concurrency:
  group: deploy-jamendo-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::未配置 CLOUDFLARE_API_TOKEN。与环球 TV、SEC 代理共用这枚令牌。"
            exit 1
          fi
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::未配置 JAMENDO_CLIENT_ID。到仓库 Settings → Secrets and variables → Actions 添加（值取自 devportal.jamendo.com 的应用程序页），再重跑本工作流。"
            exit 1
          fi

      - name: Test
        working-directory: workers/jamendo-proxy
        run: node --test worker.test.mjs

      # 直接问 Jamendo 一次，只打印结构（条数、域名、字段类型），不打印 client_id 或完整地址。
      - name: Probe Jamendo upstream
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          cid = os.environ["JAMENDO_CLIENT_ID"].strip()
          base = "https://api.jamendo.com/v3.0/tracks/"
          # 2026-10-27 实测：tags 与 fuzzytags 会各自间歇性返回 0 条，Worker 因此落空时换参数重试。
          variants = [("all", {})]
          for g in ["pop", "jazz", "world"]:
              variants += [("tags=" + g, {"tags": g}), ("fuzzytags=" + g, {"fuzzytags": g})]
          for label, extra in variants:
              q = {"client_id": cid, "format": "json", "limit": "3", "order": "popularity_month",
                   "audioformat": "mp32", "imagesize": "200", "include": "licenses"}
              q.update(extra)
              try:
                  with urllib.request.urlopen(base + "?" + urllib.parse.urlencode(q), timeout=15) as r:
                      code, d = r.status, json.load(r)
              except Exception as e:
                  print(label, "request failed:", type(e).__name__); continue
              h = d.get("headers", {})
              res = d.get("results") or []
              print(label, "HTTP", code, "status", h.get("status"), "code", h.get("code"), "results", len(res),
                    "warnings", str(h.get("warnings", ""))[:120])
              for t in res[:2]:
                  def host(u):
                      try: return urllib.parse.urlsplit(str(u)).scheme + "://" + urllib.parse.urlsplit(str(u)).hostname
                      except Exception: return repr(u)[:40]
                  print("  id", type(t.get("id")).__name__, repr(t.get("id"))[:12],
                        "| audio", host(t.get("audio")), "| license", str(t.get("license_ccurl"))[:60],
                        "| image", host(t.get("image")), "| share", host(t.get("shareurl")))
          PY

      - name: Deploy Jamendo proxy Worker
        if: ${{ !inputs.probe_only }}
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/jamendo-proxy
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Store Jamendo client_id in the Worker secret
        if: ${{ !inputs.probe_only }}
        working-directory: workers/jamendo-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$JAMENDO_CLIENT_ID" | npx --yes wrangler@4 secret put JAMENDO_CLIENT_ID --name ooglex-jamendo-proxy > /dev/null
          echo "client_id 已写入 Worker Secret（不打印）。"

      - name: Health check
        if: ${{ !inputs.probe_only }}
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -u
          if [ -z "$URL" ]; then
            echo "::warning::wrangler 没有返回地址。请到 Cloudflare 控制台 Workers → ooglex-jamendo-proxy 查看 workers.dev 地址。"
            exit 0
          fi
          URL="${URL%/}"
          echo "接口地址：$URL"
          echo "### Jamendo 代理已部署" >> "$GITHUB_STEP_SUMMARY"
          echo "把这个地址填进 \`apps/music-player/data/global.json\` 的 \`api\`：\`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          # 新建的 workers.dev 地址要几十秒才生效（期间 Cloudflare 回 error code 1042），最多等约 90 秒。
          for i in $(seq 1 18); do
            if curl -sS -m 10 -H 'Origin: https://www.ooglex.com' "$URL/health" | grep -q '"configured":true'; then
              echo "/health 正常（第 $i 次）"; break
            fi
            sleep 5
          done
          # 自定义域名（中国大陆用这个）。首次绑定时证书签发可能要几分钟，最多等约 3 分钟。
          CUSTOM=https://music-api.ooglex.com
          ok=""
          for i in $(seq 1 36); do
            if curl -sS -m 10 -H 'Origin: https://www.ooglex.com' "$CUSTOM/health" 2>/dev/null | grep -q '"configured":true'; then
              ok=1; echo "$CUSTOM/health 正常（第 $i 次）"; break
            fi
            sleep 5
          done
          [ -n "$ok" ] || echo "::warning::$CUSTOM 还没通。证书或 DNS 可能仍在生效，稍后在 Actions 页手动重跑本工作流确认。页面会先退回 workers.dev。"
          [ -n "$ok" ] && URL="$CUSTOM"
          # Worker 向上游最多等 15 秒，这里多留几秒，避免检查先断开。
          code=$(curl -sS -m 22 -o /tmp/tracks.json -w '%{http_code}' -H 'Origin: https://www.ooglex.com' "$URL/tracks?tag=pop" || echo 000)
          echo "/tracks?tag=pop → HTTP $code"
          if [ "$code" = "200" ]; then
            python3 -c "import json;d=json.load(open('/tmp/tracks.json'));print('status', d['status'], '曲目', len(d['tracks']))"
          else
            head -c 300 /tmp/tracks.json || true
            echo "::warning::试查询没有成功。常见原因：Jamendo 账号还没激活，或 client_id 填错。"
          fi
