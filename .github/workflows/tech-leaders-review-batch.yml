name: Tech Leaders Review Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/tech-leaders/executive_candidate_queue.csv"
      - "scripts/tech-leaders/build_review_batch.py"
      - ".github/workflows/tech-leaders-review-batch.yml"

permissions:
  contents: write

concurrency:
  group: tech-leaders-review-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build 150-row multi-person review batch
        run: |
          python scripts/tech-leaders/build_review_batch.py

      - name: Validate review batch
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          csv_path = Path("data/tech-leaders/review_batch_150.csv")
          json_path = Path("data/tech-leaders/review_batch_150.json")
          meta_path = Path("data/tech-leaders/review_batch_150.meta.json")

          rows = list(csv.DictReader(csv_path.open(encoding="utf-8")))
          payload = json.loads(json_path.read_text(encoding="utf-8"))
          meta = json.loads(meta_path.read_text(encoding="utf-8"))

          assert len(rows) == 150, len(rows)
          assert payload["count"] == 150
          assert meta["count"] == 150
          assert payload["mode"] == "multi_person_current_and_legacy"
          assert meta["rules"]["existing_catalog_matches_are_eligible"] is True
          assert len({r["ticker"] for r in rows}) == 150
          assert all(r["review_status"] in {"expand_existing", "needs_research"} for r in rows)
          assert not any(r["x_identity_status"] == "verified" for r in rows)
          assert not any(r["role_status"] == "current" and not r["role_source_url"] for r in rows)
          assert all(r["recommended_categories"] for r in rows)
          assert all(r["target_roles"] for r in rows)
          assert all(r["exchange"] in {"NYSE", "NASDAQ"} for r in rows)
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Commit refreshed review batch
        run: |
          FILES="data/tech-leaders/review_batch_150.csv data/tech-leaders/review_batch_150.json data/tech-leaders/review_batch_150.meta.json"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No review-batch changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "data: refresh tech-leaders multi-person review batch"
          # Multiple Tech Leaders generators can finish at nearly the same time.
          # Keep each workflow independent, then retry a rejected main push after
          # rebasing onto the newest remote main. This avoids both lost writes
          # and GitHub concurrency-group pending-run cancellation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase generated artifact commit onto main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to push generated artifact after 5 attempts"
          exit 1
