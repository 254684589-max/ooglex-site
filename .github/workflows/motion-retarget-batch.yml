name: ACCAD martial experimental retarget batch
on:
  push:
    branches: [agent/motion-studio-retarget-v466]
    paths:
      - 'motion-studio/**'
      - '.github/workflows/motion-retarget-batch.yml'
  pull_request:
    branches: [main]
    paths:
      - 'motion-studio/**'
      - '.github/workflows/motion-retarget-batch.yml'
permissions:
  contents: read
concurrency:
  group: motion-retarget-v466
  cancel-in-progress: true
jobs:
  batch:
    if: github.ref == 'refs/heads/agent/motion-studio-retarget-v466' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/motion-studio-retarget-v466')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            motion-studio
      - name: Require committed experimental batch
        run: test -s motion-studio/assets/research/retarget-batch/manifest.json
      - name: Verify every output and provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,math,sys
          from pathlib import Path
          sys.path.insert(0,'motion-studio/tools')
          from import_kinemiq import glb
          root=Path('motion-studio')
          m=json.loads((root/'assets/research/retarget-batch/manifest.json').read_text())
          assert m['attempted']==55 and len(m['records'])+len(m['rejected'])==55
          assert m['records'] and m['unique_motion_credit']==m['official_kinemiq_exports']==m['visual_certified_count']==0
          ids=set()
          for x in m['records']:
              for item in [x,x['source'],x['target']]:
                  assert hashlib.sha256((root/item['path']).read_bytes()).hexdigest()==item['sha256']
              d=glb((root/x['path']).read_bytes())
              assert d['meshes'] and d['skins'] and len(d['animations'][0]['channels'])==23
              assert x['frames']==x['source']['frames'] and x['skin_joints']==66
              assert d['asset']['extras']['license']=='CC BY 3.0'
              assert math.isfinite(x['max_primary_direction_error_deg']) and x['max_primary_direction_error_deg']<.05
              assert not x['visual_certified'] and not x['ik_certified'] and not x['godot_certified']
              assert x['source']['id'] not in ids
              ids.add(x['source']['id'])
          print('Verified',len(ids),'experimental GLBs;',len(m['rejected']),'rejected; no new unique motion credit')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify actual experimental GLB browser playback
        run: node motion-studio/tools/smoke_retarget.mjs .
