name: Commodity Source Probe

# 只读探测：候选行情来源在 Actions 机房到底取不取得到。
# 不写仓库、不提交任何数据，只把探测报告作为构建产物留存。
#
# 这是常备工具：往任何行情清单里加代码之前先跑一次，只登记确实取得到、且名称与
# 计价单位都对得上的代码。2026-08-28 的教训——凭印象登记的 B0=F 实测取不到，那一行
# unavailable 把日更管道标成 degraded 并弄红了发布校验；同轮的 QA=F 虽然取得到，
# 返回的却是 GBP/AUD 汇率而不是原油。两种错误这个探测都能在落地前拦下。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commodity-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Probe candidate sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 可选：有则走官方API，缺则退到免密钥CSV
          PROBE_OUTPUT: /tmp/commodity-probe/report.json
        run: python scripts/probe_commodity_sources.py

      - name: Upload probe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: commodity-probe-${{ github.run_attempt }}
          path: /tmp/commodity-probe/report.json
          if-no-files-found: warn
          retention-days: 7
