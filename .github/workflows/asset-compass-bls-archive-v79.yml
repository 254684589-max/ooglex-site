name: Asset Compass V79-V83 BLS Archive Research
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/asset_compass_bls_archive_v79.py'
      - 'scripts/asset_compass_release_values_v53.py'
      - 'scripts/asset_compass_payroll_lineage_v111.py'
      - 'scripts/asset_compass_archive_crosscheck_v131.py'
      - 'tests/test_asset_compass_bls_archive_v79.py'
      - '.github/workflows/asset-compass-bls-archive-v79.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m py_compile scripts/asset_compass_bls_archive_v79.py scripts/asset_compass_release_values_v53.py scripts/asset_compass_payroll_lineage_v111.py
      - run: python3 -m unittest discover -s tests -p 'test_asset_compass_bls_archive_v79.py' -v
      - run: python3 -m scripts.asset_compass_bls_archive_v79 --private-dir /tmp/ooglex-bls-v79-private --metadata /tmp/ooglex-bls-v79-metadata.json --extended-years --require-complete
      - name: Compare archived CPI and unemployment headlines with current official series
        run: python3 -m scripts.asset_compass_archive_crosscheck_v131 --archive /tmp/ooglex-bls-v79-private/extracted-research.json --output /tmp/ooglex-bls-current-crosscheck.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v79-bls-archive-coverage
          path: |
            /tmp/ooglex-bls-v79-metadata.json
            /tmp/ooglex-bls-current-crosscheck.json
          retention-days: 30
          if-no-files-found: error
