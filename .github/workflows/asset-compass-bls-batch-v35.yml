name: Asset Compass V35 Three-Release BLS Evidence
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/asset-compass-bls-batch-v35.yml'
      - 'scripts/capture_asset_compass_bls_batch_v35.py'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V34 and V35 provenance tests without live requests
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_bls_release_v34.py' -v
          python3 -m unittest discover -s tests -p 'test_asset_compass_bls_batch_v35.py' -v
      - name: Fetch three real archived CPI releases with individual failure results
        run: |
          python3 -m scripts.capture_asset_compass_bls_batch_v35 \
            --output /tmp/ooglex-v35-cpi-manifest.json --fail-if-incomplete
      - name: Publish actual receipt totals with zero historical PIT claims
        if: always()
        run: |
          if [ -f /tmp/ooglex-v35-cpi-manifest.json ]; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("/tmp/ooglex-v35-cpi-manifest.json").read_text())
          assert r["eligible_for_point_in_time_backtest"] is False
          assert r["historical_pit_series_approved"] == 0
          assert r["public_repository_contains_raw_release_files"] is False
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### V35 verified archive capture attempts\n")
              f.write(f"Requested: {r['requested_archives']}  \n")
              f.write(f"Fetched now: {r['fetched_archives']}  \n")
              f.write(f"Failed: {r['failed_archives']}  \n")
              for ident, item in r["entries"].items():
                  f.write(f"- {ident}: {item['status']}\n")
              f.write("GitHub runner did NOT retain raw HTML. Manifest is temporary (30-day artifact).\n")
              f.write("No original release-time, byte-availability or PIT authorization certification.\n")
          PY
          else
            echo '::error::V35 manifest missing: fetch or initialization failed.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ooglex-v35-cpi-evidence-receipts
          path: /tmp/ooglex-v35-cpi-manifest.json
          if-no-files-found: warn
          retention-days: 30
