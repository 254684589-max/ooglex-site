name: One-off i18n wave3 rollout

on:
  push:
    paths:
      - .github/workflows/oneoff-i18n-wave3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inject third-wave i18n scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          assets = [Path('assets/i18n.js'), Path('assets/i18n-pages.js'), Path('assets/i18n-wave3.js')]
          versions = {p.name: hashlib.sha256(p.read_bytes()).hexdigest()[:8] for p in assets}
          tags = [f'<script src="/assets/{p.name}?v={versions[p.name]}" defer></script>' for p in assets]
          block = '\n'.join(tags)

          targets = [
              Path('apps/asset-ranking/index.html'),
              Path('apps/house-prices/index.html'),
              Path('apps/world-economy/index.html'),
              Path('apps/superinvestors/index.html'),
              Path('apps/major-rankings/index.html'),
              Path('apps/whats-latest/index.html'),
              Path('apps/markets/index.html'),
          ]

          changed = []
          for p in targets:
              s = p.read_text(encoding='utf-8')
              original = s
              for name in ('i18n.js', 'i18n-pages.js', 'i18n-wave3.js'):
                  s = re.sub(r'\n?\s*<script src="/assets/' + re.escape(name) + r'\?v=[^"]+" defer></script>', '', s)
              m = re.search(r'(<script src="/assets/theme\.js\?v=[^"]+" defer></script>)', s)
              if m:
                  s = s[:m.end()] + '\n' + block + s[m.end():]
              elif '</head>' in s:
                  s = s.replace('</head>', block + '\n</head>', 1)
              else:
                  raise SystemExit(f'no injection anchor: {p}')
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          print('versions', versions)
          print('changed', len(changed))
          for p in changed: print(p)
          PY

      - name: Validate rollout
        run: |
          node --check assets/i18n-wave3.js
          python - <<'PY'
          from pathlib import Path
          import hashlib
          names = ['i18n.js', 'i18n-pages.js', 'i18n-wave3.js']
          versions = {n: hashlib.sha256(Path('assets', n).read_bytes()).hexdigest()[:8] for n in names}
          targets = [
              Path('apps/asset-ranking/index.html'), Path('apps/house-prices/index.html'),
              Path('apps/world-economy/index.html'), Path('apps/superinvestors/index.html'),
              Path('apps/major-rankings/index.html'), Path('apps/whats-latest/index.html'),
              Path('apps/markets/index.html'),
          ]
          for p in targets:
              s = p.read_text(encoding='utf-8')
              for n in names:
                  needle = f'/assets/{n}?v={versions[n]}'
                  assert s.count(needle) == 1, (p, needle, s.count(needle))
          print('validated', len(targets), 'pages')
          PY
          git diff --check

      - name: Commit rollout and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-i18n-wave3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/i18n-wave3.js apps/asset-ranking/index.html apps/house-prices/index.html apps/world-economy/index.html apps/superinvestors/index.html apps/major-rankings/index.html apps/whats-latest/index.html apps/markets/index.html .github/workflows/oneoff-i18n-wave3.yml
          git commit -m "feat(i18n): translate third-wave pages"
          git pull --rebase origin main
          git push origin HEAD:main
