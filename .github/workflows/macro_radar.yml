name: Macro Radar

# 每日刷新「宏观雷达 · Macro Radar」：跑取数脚本（Yahoo行情 + FRED/EIA官方API）→
# 生成 apps/macro-radar/data.json → 提交回仓库。密钥只从仓库Secrets注入。
# 数据源失败时保留上次有效值，并在数据中记录降级状态。
on:
  # 定点 cron 会被 GitHub 推迟数小时，改由 scheduler.yml 每日在 21:00 UTC 窗口开启后统一触发。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-macro-radar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Build macro radar data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # 可选：有则接入 FRED 宏观管道
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}     # 可选：有则更新 EIA RWTC 现货数据
        run: python scripts/macro-radar/build_radar.py

      - name: Build regime history (时光机)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/macro-radar/build_history.py

      - name: Validate macro source health and recovery
        run: python scripts/validate_macro_source_health.py --report /tmp/market-workflow-diagnostics/macro-radar-source-health.json

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset macro-radar --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/macro-radar-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh macro radar"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）；不用
          # `git pull --rebase --autostash`，避免弹栈冲突把 <<<<<<< 标记写进 JSON。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: macro-radar-workflow-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/macro-radar-*.json
          if-no-files-found: warn
          retention-days: 14
