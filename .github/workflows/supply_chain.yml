name: Supply Chain Graph

# 生成产业链图谱发布文件：读站内标普成分股清单 + SEC 申报 → 生成
# apps/supply-chain/{nodes,health,identity,smelters}.json 与 edges/<代码>.json → 提交回仓库。
#
# 上游有两处：站内 apps/companies/sp500.json（由 companies.yml 每日生成），以及 SEC
# EDGAR（CIK/SIC 与 Form SD 冲突矿产申报）。SEC 那两步都是 continue-on-error——
# 取数失败时构建读上一份缓存继续，不产出空数据、不让整条管道失败。没有密钥。
# 调度上排在 companies 成功之后（与 asset_ranking 同一梯队）。
#
# Form SD 一年一报（每年 5 月 31 日前），抽取器因此不是每天都有新东西可取；
# 它按申报号判断是否变化，没变就不重下文档。
#
# 四道校验都在提交之前跑，任一失败即不提交：
#   validate_asset_versions          —— 静态资源版本号（全站，防「新数据 + 旧代码」）
#   validate_supply_chain_extraction —— 关系抽取规则的断言与写盘契约（离线）
#   validate_supply_chain_graph      —— 发布文件契约，核心是「无证据不上图」
#   validate_supply_chain_page       —— 浏览器渲染契约
# 后者会拒绝任何没有可核验出处的关系边，也会拒绝把板块级推断显示成公司级结论。
on:
  # 定点 cron 会被 GitHub 推迟数小时，改由 scheduler.yml 每日在窗口开启后统一触发。
  workflow_dispatch:
    inputs:
      # Form SD 抽取器自带申报季闸门（5–7 月以外不发请求）。改了解析规则或要补
      # 字段时需要在季外重跑一次，这个开关就是干这个的。
      # 用 choice 而不是留空的字符串：workflow_dispatch 会把空字符串替换成默认值，
      # 「留空 = 关闭」这种约定在这里不成立（上一轮 --tickers 就是这么踩的）。
      force_form_sd:
        description: '季外强制重跑 Form SD 抽取器（改了解析规则或要补字段时用）'
        required: false
        default: 'no'
        type: choice
        options: ['no', 'yes']

permissions:
  contents: write

concurrency:
  group: market-data-supply-chain-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 联网取 SEC 实体标识（CIK + SIC）。SIC 把板块级分不开的公司分开——
      # 苹果 3571 品牌整合 / 英伟达 3674 中间制造 / 微软 7372 平台服务。
      # 失败不中断：构建脚本读不到缓存时自动退回板块级口径，不产出空数据。
      - name: Fetch SEC company identity (CIK + SIC)
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/supply-chain/fetch_company_identity.py

      # Form SD 冲突矿产申报 → 冶炼厂关系边。这是本板块唯一有出处的关系数据。
      # 语义是「该冶炼厂出现在申报人的供应链中」，不是直接供货关系。
      # **一年只跑一次**：脚本自带季节闸门，非申报季（5–7 月以外）直接退出，
      # 不发任何请求。Form SD 一年一报，天天扫 495 家既拿不到新东西也白占带宽。
      # 失败不中断：边文件是上一次的产物，读不到新数据就沿用，不删不改。
      - name: Extract Form SD smelter lists
        continue-on-error: true
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          python scripts/supply-chain/extract_form_sd.py \
            ${{ inputs.force_form_sd == 'yes' && '--force' || '' }}

      # 冶炼厂中文译名表。与带出处的申报数据分开发布——边文件里是申报原文，
      # 译名是我们加的标注，混在一起会让「哪些是原文」分不清。
      - name: Build smelter Chinese name table
        run: python scripts/supply-chain/build_smelter_names_zh.py

      - name: Build supply chain graph nodes
        run: python scripts/supply-chain/build_chain_nodes.py

      # 静态资源版本号。**这一条是全站的，不只管产业链**——仓库没有 PR 触发的
      # CI，而本工作流每天都跑，是唯一稳定的关口。
      # 缘由：2026-09-03 苹果的公司页在用户手机上显示「本页已收录 20245 条」，
      # 真实是 0。数据是新的、代码是缓存里的旧的——因为 <script src> 没有版本号。
      - name: Validate static asset versions (site-wide)
        run: python scripts/validate_asset_versions.py

      - name: Validate extraction rules
        run: python scripts/validate_supply_chain_extraction.py

      - name: Validate graph contract and evidence
        run: python scripts/validate_supply_chain_graph.py

      # 页面契约：产业链总览与单家公司视图，三档宽度渲染、覆盖率声明可见、
      # 逐家显示判定依据与可核验链接、待接入项不得因选中而看起来已核验。
      # 数据对了但页面把推断显示成结论，同样是骗人，所以这道也在提交前跑。
      - name: Validate page contract (browser)
        run: node scripts/validate_supply_chain_page.mjs

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 只暂存本工作流拥有的路径，不夹带任何其他改动。
          git add apps/supply-chain/nodes.json apps/supply-chain/health.json \
                  apps/supply-chain/identity.json apps/supply-chain/smelters.json \
                  apps/supply-chain/names-zh.json apps/supply-chain/edges
          if git diff --cached --quiet; then
            echo "生成结果与仓库一致，跳过提交和推送"
            exit 0
          fi
          git commit -m "data: refresh supply chain graph nodes and Form SD edges"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的
          # 版本为准（rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1
