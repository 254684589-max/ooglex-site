name: One-off account nav state

on:
  push:
    paths:
      - '.github/workflows/oneoff-account-nav-state.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch homepage account nav state
        run: python scripts/oneoff_patch_account_nav.py
      - name: Commit patch
        run: |
          git diff --check
          if git diff --quiet -- assets/theme.js; then
            echo "No change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/theme.js
          git commit -m "feat(auth): reflect session in homepage account nav"
          git push origin HEAD:main
