name: One-off remove music control

on:
  push:
    paths:
      - '.github/workflows/oneoff-remove-music-control.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove homepage music control and audio code
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # 1) Remove the visible mute/play button from the homepage nav.
          text, n_button = re.subn(
              r'^\s*<button id="music-toggle"[^\n]*</button>\s*\n',
              '',
              text,
              count=1,
              flags=re.M,
          )

          # 2) Remove homepage-only music button styling.
          text, n_css = re.subn(
              r'\n\s*#music-toggle \{.*?\n\s*#music-toggle\.playing \{.*?\}\n',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          text = text.replace(
              '#language-toggle:focus-visible, #music-toggle:focus-visible {',
              '#language-toggle:focus-visible {'
          )

          # 3) Remove the inline Web Audio background-music implementation.
          text, n_audio = re.subn(
              r'\n\s*<script>\s*\n\s*/\* 背景音乐：.*?</script>\s*\n(?=\s*</body>)',
              '\n',
              text,
              count=1,
              flags=re.S,
          )

          if (n_button != 1:
              raise SystemExit(f'Expected 1 music button, removed {n_button}')
          if n_css != 1:
              raise SystemExit(f'Expected 1 music CSS block, removed {n_css}')
          if n_audio != 1:
              raise SystemExit(f'Expected 1 inline audio block, removed {n_audio}')
          if text == original:
              raise SystemExit('No changes made')
          if 'id="music-toggle"' in text:
              raise SystemExit('music-toggle still present in homepage markup')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleaned homepage and remove this one-off workflow
        run: |
          rm .github/workflows/oneoff-remove-music-control.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/oneoff-remove-music-control.yml
          git commit -m "chore(ui): remove homepage music control"
          git push origin HEAD:main
