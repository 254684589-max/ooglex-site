name: What's Latest

# 刷新「最新消息是什么？」：聚合 Google News 中文要闻 + Yahoo 市场快照 → 写 apps/whats-latest/data.json。
# 新闻时效性强，故每 6 小时跑一次（仍属每日多次更新）。数据源均免登录，无需任何密钥。
on:
  workflow_dispatch:
  schedule:
    - cron: '15 */6 * * *'   # 每 6 小时（00:15 / 06:15 / 12:15 / 18:15 UTC）

permissions:
  contents: write

concurrency:
  group: market-data-whats-latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests feedparser

      - name: Build news data
        run: python scripts/whats-latest/build_news.py

      - name: Validate source health and recovery
        run: python scripts/validate_supporting_source_health.py --dataset whats-latest --report /tmp/market-workflow-diagnostics/whats-latest-source-health.json

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset whats-latest --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/whats-latest-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh latest news"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）；不用
          # `git pull --rebase --autostash`，避免弹栈冲突把 <<<<<<< 标记写进 JSON。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Fail unsuccessful source attempt after preserving diagnostics
        run: python scripts/validate_supporting_source_health.py --dataset whats-latest --require-published

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: whats-latest-workflow-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/whats-latest-*.json
          if-no-files-found: warn
          retention-days: 14
