name: Asset Tracker 4H Series

# 4 小时线：把 Yahoo 的 1 小时行情按 UTC 对齐聚合成 4 小时桶，写 apps/asset-tracker/hourly.json。
# 收盘口径的 data.json 由 asset_tracker.yml 生成、盘中层由 asset_tracker_intraday.yml 生成，
# 本工作流这两者一个字都不动。
#
# 诚实边界：这不是交易所原生的 4 小时 K 线——Yahoo 对外只提供 1 小时粒度，4 小时桶由本站
# 聚合而来，与交易所自己划分的 4 小时周期不一定对齐；文件里逐条标 aggregated=true，
# 页面也照实写出来。也不是实时行情：这里每 4 小时跑一轮。
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */4 * * *'   # 每个 4 小时桶收口后 7 分钟，取到的最后一个桶才是完整的

permissions:
  contents: write

concurrency:
  group: market-data-asset-tracker-hourly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Build four-hour series
        run: python scripts/asset-tracker/build_hourly.py

      - name: Validate four-hour series contract
        run: python scripts/validate_asset_tracker_hourly.py

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset asset-tracker-hourly --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/asset-tracker-hourly-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh four-hour series"
          # 与日更/盘中同样的安全推送：遇远端新提交就 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 2))
          done
          echo "多次重试后仍未推送成功"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asset-tracker-hourly-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
