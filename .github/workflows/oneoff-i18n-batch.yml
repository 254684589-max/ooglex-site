name: One-off subpage i18n rollout

on:
  push:
    paths:
      - '.github/workflows/oneoff-i18n-batch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject shared i18n into priority pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re

          asset = Path('assets/i18n.js')
          ver = hashlib.sha256(asset.read_bytes()).hexdigest()[:8]
          tag = f'<script src="/assets/i18n.js?v={ver}" defer></script>'

          targets = [
              Path('account/index.html'),
              Path('apps/billionaires/index.html'),
              Path('apps/macro-radar/index.html'),
          ]
          targets += sorted(Path('apps/finance-terminal').glob('*.html'))
          targets += sorted(Path('apps/supply-chain').glob('*.html'))

          changed = []
          for p in targets:
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              if '/assets/i18n.js?' in s:
                  continue
              # Prefer placing it immediately after the shared theme script so theme controls
              # can hear the languagechange event. Account has no theme.js, so use </head>.
              m = re.search(r'(<script src="/assets/theme\.js\?v=[^"]+" defer></script>)', s)
              if m:
                  s = s[:m.end()] + '\n' + tag + s[m.end():]
              elif '</head>' in s:
                  s = s.replace('</head>', tag + '</head>', 1)
              else:
                  raise SystemExit(f'no injection anchor: {p}')
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))

          print('i18n version', ver)
          print('changed', len(changed))
          for p in changed:
              print(p)
          PY
      - name: Validate rollout
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          ver = hashlib.sha256(Path('assets/i18n.js').read_bytes()).hexdigest()[:8]
          must = [
              Path('account/index.html'),
              Path('apps/billionaires/index.html'),
              Path('apps/macro-radar/index.html'),
              Path('apps/finance-terminal/index.html'),
              Path('apps/supply-chain/index.html'),
          ]
          needle = f'/assets/i18n.js?v={ver}'
          for p in must:
              s = p.read_text(encoding='utf-8')
              assert needle in s, (p, needle)
          print('validated', needle)
          PY
          git diff --check
      - name: Commit rollout and remove one-off workflow
        run: |
          rm .github/workflows/oneoff-i18n-batch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add account apps/finance-terminal apps/supply-chain apps/billionaires/index.html apps/macro-radar/index.html .github/workflows/oneoff-i18n-batch.yml
          git commit -m "feat(i18n): roll English layer into priority subpages"
          git push origin HEAD:main
