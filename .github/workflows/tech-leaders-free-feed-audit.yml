name: Tech Leaders Free Feed Audit

# 每天检查科技领袖名录里所有本人公开 X 账号能否取到公开动态，并深取历史回填线上缓存。
# 在 Actions 里直接运行 cloudflare/pro-api/worker.js 的 free-feed 逻辑（内存存储、一次性本地密钥），
# 不调用线上 Worker；在 main 上运行时用现有的 Cloudflare 部署凭据把历史帖子合并写回 R2（只增不删）。
# 结果写入 data/tech-leaders/free_feed_health.json，并在运行摘要里列出取不到动态的账号。
on:
  workflow_dispatch:
    inputs:
      posts:
        description: '每个账号请求的帖子数（100 = 同时检查历史深度）'
        required: false
        default: '100'
      backfill:
        description: '把取到的历史合并写回线上 R2 缓存（true/false）'
        required: false
        default: 'true'
  schedule:
    - cron: '43 1 * * *'   # 每天 01:43 UTC（北京时间 09:43）

permissions:
  contents: write

concurrency:
  group: tech-leaders-free-feed-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Audit free feed availability for every personal X account
        # 每天深取每个账号最多 100 条，并把历史合并写回线上 R2：线上 Worker 从 Cloudflare 机房翻页常被限流，
        # 由这里补齐「加载更多」需要的历史。只在 main 上写线上数据；其他分支只检查不写。
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          POSTS: ${{ github.event.inputs.posts || '100' }}
          BACKFILL: ${{ github.ref == 'refs/heads/main' && (github.event.inputs.backfill || 'true') == 'true' && '--backfill-r2' || '' }}
        run: node scripts/tech-leaders/audit_free_feed.mjs --out data/tech-leaders/free_feed_health.json --concurrency 3 --posts "$POSTS" $BACKFILL

      - name: Validate report JSON
        run: python3 -m json.tool data/tech-leaders/free_feed_health.json >/dev/null

      - name: Print history depth summary
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open("data/tech-leaders/free_feed_health.json", encoding="utf-8"))
          rows = d.get("rows") or []
          req = rows[0].get("requested_posts") if rows else None
          ok = [r for r in rows if r.get("ok")]
          buckets = collections.Counter()
          for r in ok:
              n = r.get("post_count") or 0
              buckets["100" if n >= 100 else "50-99" if n >= 50 else "20-49" if n >= 20 else "10-19" if n >= 10 else "1-9"] += 1
          print("DEPTH requested=%s ok=%d failed=%d buckets=%s" % (req, len(ok), len(rows) - len(ok), dict(buckets)))
          for r in rows:
              print("DEPTHROW %s|%s|%s|%s|%s" % (r.get("handle"), r.get("post_count"), (r.get("oldest_post_at") or "")[:10], (r.get("latest_post_at") or "")[:10], r.get("error") or ""))
          PY

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-feed-audit-${{ github.event.inputs.posts || '100' }}
          path: data/tech-leaders/free_feed_health.json

      - name: Commit audit report
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tech-leaders/free_feed_health.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "chore: sync Tech Leaders free feed audit [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase audit report onto main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to push audit report after 5 attempts"
          exit 1
