name: Tech Leaders Free Feed Audit

# 每天检查科技领袖名录里所有本人公开 X 账号能否取到公开动态。
# 在 Actions 里直接运行 cloudflare/pro-api/worker.js 的 free-feed 逻辑（内存存储、一次性本地密钥），
# 不调用线上 Worker，不需要任何 Secret，也不会改动线上缓存或用户会话。
# 结果写入 data/tech-leaders/free_feed_health.json，并在运行摘要里列出取不到动态的账号。
on:
  workflow_dispatch:
    inputs:
      posts:
        description: '每个账号请求的帖子数（默认 21；100 = 检查历史深度，此时只上传报告产物、不提交）'
        required: false
        default: '21'
  schedule:
    - cron: '43 1 * * *'   # 每天 01:43 UTC（北京时间 09:43）

permissions:
  contents: write

concurrency:
  group: tech-leaders-free-feed-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Audit free feed availability for every personal X account
        run: node scripts/tech-leaders/audit_free_feed.mjs --out data/tech-leaders/free_feed_health.json --concurrency 3 --posts "${{ github.event.inputs.posts || '21' }}"

      - name: Validate report JSON
        run: python3 -m json.tool data/tech-leaders/free_feed_health.json >/dev/null

      - name: Print history depth summary
        run: |
          python3 - <<'PY'
          import json, collections
          d = json.load(open("data/tech-leaders/free_feed_health.json", encoding="utf-8"))
          rows = d.get("rows") or []
          req = rows[0].get("requested_posts") if rows else None
          ok = [r for r in rows if r.get("ok")]
          buckets = collections.Counter()
          for r in ok:
              n = r.get("post_count") or 0
              buckets["100" if n >= 100 else "50-99" if n >= 50 else "20-49" if n >= 20 else "10-19" if n >= 10 else "1-9"] += 1
          print("DEPTH requested=%s ok=%d failed=%d buckets=%s" % (req, len(ok), len(rows) - len(ok), dict(buckets)))
          for r in rows:
              print("DEPTHROW %s|%s|%s|%s|%s" % (r.get("handle"), r.get("post_count"), (r.get("oldest_post_at") or "")[:10], (r.get("latest_post_at") or "")[:10], r.get("error") or ""))
          PY

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        with:
          name: free-feed-audit-${{ github.event.inputs.posts || '21' }}
          path: data/tech-leaders/free_feed_health.json

      - name: Commit audit report
        if: github.ref == 'refs/heads/main' && (github.event.inputs.posts || '21') == '21'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tech-leaders/free_feed_health.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "chore: sync Tech Leaders free feed audit [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase audit report onto main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to push audit report after 5 attempts"
          exit 1
