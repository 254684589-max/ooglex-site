name: Asset Compass V61 Historical Original Release PIT Audit
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit_asset_compass_pit_release_v61.py'
      - 'tests/test_asset_compass_pit_release_v61.py'
      - '.github/workflows/asset-compass-pit-v61.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_asset_compass_pit_release_v61.py'
      - 'tests/test_asset_compass_pit_release_v61.py'
      - '.github/workflows/asset-compass-pit-v61.yml'
permissions:
  contents: write
concurrency:
  group: asset-compass-ledger-main
  cancel-in-progress: false
jobs:
  pit-evidence-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: V61 test first-release, real timestamp offset, chronological revisions and score lock
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_pit_release_v61.py' -v
          python3 -m scripts.audit_asset_compass_pit_release_v61 --output /tmp/asset-compass-pit-v61.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/asset-compass-pit-v61.json').read_text())
          assert report['required_macro_series']==14
          assert report['independently_certified_original_release_series']==0
          assert report['investable_total_return_certified_assets']==0
          assert report['oos_validated_assets']==0
          assert report['official_0_to_100_scores_published']==0
          assert report['eligible_for_historical_pit_backtest'] is False
          print('PIT source references catalogued; no false historical certification')
          PY
  persist-main:
    needs: pit-evidence-gates
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build immutable source-identity-derived V61 gaps report
        run: python3 -m scripts.audit_asset_compass_pit_release_v61
      - name: Persist only public status metadata, never raw proprietary vintages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/asset-compass-pit-admission-v61.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(asset-compass): V61 original-release PIT evidence remains unverified'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((i*3))
          done
          exit 1
