name: Tech Leaders Page Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/tech-leaders/index.html"
      - "apps/tech-leaders/leaders*.json"
      - "assets/tech-leaders-password-gate.js"
      - "scripts/tech-leaders/validate_page_js.mjs"
      - "scripts/tech-leaders/page_runtime_smoke.mjs"
      - ".github/workflows/tech-leaders-page-gate.yml"
  push:
    branches: [main]
    paths:
      - "apps/tech-leaders/index.html"
      - "apps/tech-leaders/leaders*.json"
      - "assets/tech-leaders-password-gate.js"
      - "scripts/tech-leaders/validate_page_js.mjs"
      - "scripts/tech-leaders/page_runtime_smoke.mjs"
      - ".github/workflows/tech-leaders-page-gate.yml"

permissions:
  contents: read

concurrency:
  group: tech-leaders-page-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inline JavaScript syntax gate
        run: node scripts/tech-leaders/validate_page_js.mjs

      - name: Install smoke-test DOM
        run: npm install --no-save --no-package-lock jsdom@24

      - name: Runtime page smoke test
        run: node scripts/tech-leaders/page_runtime_smoke.mjs

      - name: Verify deployed page and catalog
        if: github.event_name == 'push'
        env:
          GATE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import re
          import time
          import urllib.request

          sha = __import__("os").environ["GATE_SHA"]
          page_url = f"https://ooglex.com/apps/tech-leaders/?gate={sha}"
          catalog_url = f"https://pro-api.ooglex.com/v1/tech-leaders/catalog?catalog=leaders.json&gate={sha}"

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Ooglex Tech Leaders Page Gate/1.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return resp.read().decode("utf-8")

          last = "not_started"
          for attempt in range(1, 61):
              try:
                  html = fetch(page_url)
                  data = json.loads(fetch(catalog_url))
                  leaders = data if isinstance(data, list) else (data.get("leaders") or data.get("people") or [])
                  active = [
                      p for p in leaders
                      if (p.get("active_status") or p.get("admission_status") or "active") == "active"
                  ]

                  route_at = html.find('var CATALOG_URL=API_BASE+"/v1/tech-leaders/catalog?catalog="')
                  if route_at < 0:
                      raise RuntimeError("protected_catalog_router_missing")
                  route = html[route_at:route_at + 2200]
                  if "\\n" in route:
                      raise RuntimeError("literal_backslash_n_in_router")

                  hero = re.search(r'id=["\']hero-account-count["\'][^>]*>\s*(\d+)\s+公开账号', html)
                  if not hero:
                      raise RuntimeError("hero_count_missing")
                  full_count = int(hero.group(1))
                  marker = data.get("ooglexAccess") or {}
                  if marker.get("mode") != "preview" or float(marker.get("ratio", 0)) != 0.10:
                      raise RuntimeError(f"preview_marker_invalid:{marker}")
                  if not active:
                      raise RuntimeError("no_preview_profiles")
                  if len(active) > max(1, (full_count + 9) // 10):
                      raise RuntimeError(f"preview_exceeds_10_percent:{len(active)}/{full_count}")

                  print(json.dumps({
                      "status": "pass",
                      "attempt": attempt,
                      "live_preview_count": len(active),
                      "full_catalog_count": full_count,
                      "ratio": marker.get("ratio"),
                  }, ensure_ascii=False))
                  break
              except Exception as exc:
                  last = f"{type(exc).__name__}:{exc}"
                  print(f"attempt {attempt}/60: {last}")
                  if attempt == 60:
                      raise SystemExit(f"Live deployment smoke failed: {last}")
                  time.sleep(5)
          PY
