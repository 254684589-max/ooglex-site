name: Companies Intraday

# 标普500成分股的盘中快照：只刷新「最新价 + 相对前收涨跌」这一层，
# 写 apps/companies/intraday.json。收盘口径的 data.json / sp500.json 由 companies.yml
# 每日生成，本工作流一个字都不动它们。热力图与气泡图开盘后能跟着动，靠的就是这一层。
#
# 为什么是逐标的取：2026-08-29 机房实测全部批量接口都不通（v8 spark 两个宿主四组参数
# 均 400、v7 quote 要 crumb 返回 401、Stooq 批量 CSV 404），没有「一次问五百个」这条路。
# 因此一轮就是五百次请求，只在美股交易时段跑，不整天空转。
#
# 诚实边界：这不是实时行情。约30分钟一轮，交易所自身还有延迟（美股常见15分钟），
# 页面上写明「盘中快照 · 刷新周期约30分钟 · 非实时」。
on:
  workflow_dispatch:
  schedule:
    # 美股 9:30–16:00 ET = 13:30–20:00 UTC（夏令时）/ 14:30–21:00 UTC（冬令时），
    # 两头各留一档覆盖两种时制；只在工作日跑。避开整点高峰分钟。
    - cron: '9,39 13-21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: market-data-companies-intraday-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Build intraday snapshot
        run: python scripts/companies/build_intraday.py

      - name: Validate intraday snapshot
        run: python scripts/validate_asset_tracker_intraday.py --dataset companies

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset companies-intraday --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/companies-intraday-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh S&P 500 intraday quotes"
          # 与日更那条同样的安全推送：遇远端新提交就 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 2))
          done
          echo "多次重试后仍未推送成功"; exit 1

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: companies-intraday-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/
          if-no-files-found: ignore
          retention-days: 14
