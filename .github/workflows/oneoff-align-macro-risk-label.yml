name: One-off align macro risk label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-align-macro-risk-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align data hub English product label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/data-hub/app.js')
          s = p.read_text(encoding='utf-8')
          old = 'folder: "macro-radar", en: "Regime", name: "宏观风险监测"'
          new = 'folder: "macro-radar", en: "MACRO RISK MONITOR", name: "宏观风险监测"'
          if old not in s:
              raise SystemExit('Expected data-hub macro label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          node --check apps/data-hub/app.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/data-hub/app.js
          git commit -m 'fix(ui): align macro risk monitor label'
          git push origin HEAD:main
