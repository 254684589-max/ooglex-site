name: SOFR historical candidate review (not published)
on:
  workflow_dispatch:
    inputs:
      review_date:
        description: 'One historical date YYYY-MM-DD; no production writes'
        required: true
        type: string
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline contract tests
        run: |
          python -m unittest discover -s tests -p test_swap_spreads_candidates.py -v
          python -m unittest discover -s tests -p test_swap_spreads_coverage.py -v
      - name: Create review artifact only
        env:
          REVIEW_DATE: ${{ inputs.review_date }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REVIEW_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Expected YYYY-MM-DD"; exit 1; }
          python scripts/build_swap_spread_candidates.py --date "$REVIEW_DATE" --output /tmp/sofr-v6-candidates.json
          git diff --exit-code -- macro/swap-spreads-history.json
      - name: Retain private review report for 7 days
        uses: actions/upload-artifact@v4
        with:
          name: sofr-candidate-review
          path: /tmp/sofr-v6-candidates.json
          retention-days: 7
