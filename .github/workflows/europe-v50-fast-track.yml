name: Europe Company-Location Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "apps/tech-leaders/leaders.json"
      - ".github/workflows/europe-v50-fast-track.yml"
  push:
    branches: [main]
    paths:
      - "apps/tech-leaders/leaders.json"
      - ".github/workflows/europe-v50-fast-track.yml"

permissions:
  contents: read

concurrency:
  group: europe-company-location-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Europe classification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("apps/tech-leaders/leaders.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          leaders = d.get("leaders") or []

          ids = [str(x.get("id") or "") for x in leaders if x.get("id")]
          handles = [str(x.get("handle") or "").lower() for x in leaders if x.get("handle")]
          assert len(ids) == len(set(ids)), "duplicate ids"
          assert len(handles) == len(set(handles)), "duplicate handles"

          forbidden = {"欧洲背景", "欧洲前高管", "欧洲科技"}
          for x in leaders:
              for field in ("categories", "themes", "chips", "index_tags"):
                  vals = x.get(field) or []
                  if isinstance(vals, list):
                      bad = forbidden.intersection(str(v) for v in vals)
                      assert not bad, f"{x.get('name')}: obsolete Europe labels remain in {field}: {sorted(bad)}"
              assert str(x.get("category") or "") not in forbidden
              assert str(x.get("primary_category") or "") not in forbidden

          categories = d.get("categories") or []
          assert not forbidden.intersection(categories), "obsolete Europe categories remain in catalog"
          assert "欧洲" in categories, "Europe category missing"

          policy = d.get("region_policy") or {}
          assert policy.get("version") == "company-location-v1", "Europe region policy is not company-location-v1"

          europe = [x for x in leaders if "欧洲" in (x.get("categories") or [])]
          print(json.dumps({
              "leaders": len(leaders),
              "europe": len(europe),
              "policy": policy.get("version")
          }, ensure_ascii=False))
          PY
