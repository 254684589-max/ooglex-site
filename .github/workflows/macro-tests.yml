name: Ooglex Macro Unit Tests
on:
  pull_request:
    paths:
      - 'scripts/update_asset_scores.py'
      - 'scripts/update_macro_bls.py'
      - 'scripts/update_macro_nyfed.py'
      - 'scripts/backtest_asset_compass.py'
      - 'scripts/score_macro_assets.py'
      - 'macro/model-config.json'
      - 'tests/test_macro_*.py'
      - '.github/workflows/macro-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python3 -m compileall -q scripts tests
      - name: Unit tests without network
        run: python3 -m unittest discover -s tests -p 'test_macro_*.py' -v
      - name: Verify actual Treasury, BLS and NY Fed feeds
        run: |
          python3 scripts/update_asset_scores.py
          python3 scripts/update_macro_bls.py
          python3 scripts/update_macro_nyfed.py
          python3 scripts/score_macro_assets.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/asset-scores.json').read_text())
          assert d['rates']['us10y'] is not None
          assert d['bls']['series']['cpi']['yoy_percent'] is not None
          assert d['nyfed']['effr_percent'] is not None
          assert all(asset['score'] is None for asset in d['assets'].values())
          print('Verified official records:',d['observation_date'],d['bls']['series']['cpi']['period'],d['nyfed']['observation_date'])
          PY
      - name: Save verified official snapshot to this feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/global-asset-score-v1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): save verified official indicators"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
