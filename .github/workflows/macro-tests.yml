name: Ooglex Macro Unit Tests
on:
  pull_request:
    paths:
      - 'scripts/update_asset_scores.py'
      - 'scripts/update_macro_bls.py'
      - 'scripts/update_macro_nyfed.py'
      - 'scripts/backtest_asset_compass.py'
      - 'scripts/build_asset_compass_history.py'
      - 'scripts/audit_asset_compass_prices.py'
      - 'scripts/prepare_asset_compass_returns.py'
      - 'scripts/asset_compass_vintages.py'
      - 'scripts/asset_compass_walkforward.py'
      - 'macro/migrations/**'
      - 'docs/ASSET_COMPASS_V9_POINT_IN_TIME.md'
      - 'macro/index.html'
      - '.github/workflows/deploy_protected_pages.yml'
      - 'apps/asset-tracker/history.json'
      - 'apps/asset-ranking/crypto.json'
      - 'scripts/score_macro_assets.py'
      - 'macro/model-config.json'
      - 'tests/test_macro_*.py'
      - '.github/workflows/macro-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python3 -m compileall -q scripts tests
      - name: Unit tests without network
        run: python3 -m unittest discover -s tests -p 'test_macro_*.py' -v
      - name: Verify SQLite point-in-time schema and OOS tests
        run: |
          python3 -m unittest discover -s tests -p 'test_macro_vintages.py' -v
      - name: Audit existing asset prices without claiming validated returns
        run: |
          python3 scripts/audit_asset_compass_prices.py --output /tmp/asset-compass-price-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/asset-compass-price-audit.json').read_text())
          assert r['report_type']=='price_coverage_audit'
          assert r['assets']['bitcoin']['observation_count'] > 0
          assert r['assets']['bitcoin']['source'] == 'CoinGecko'
          assert r['validated_for_live_scoring'] is False
          assert r['licensing_review_required'] is True
          assert all(not a['eligible_for_return_backtest'] for a in r['assets'].values())
          print('Asset coverage verified:',{k:v['observation_count'] for k,v in r['assets'].items()})
          PY
      - name: Verify actual Treasury, BLS and NY Fed feeds
        run: |
          python3 scripts/update_asset_scores.py
          python3 scripts/update_macro_bls.py
          python3 scripts/update_macro_nyfed.py
          python3 scripts/score_macro_assets.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/asset-scores.json').read_text())
          assert d['rates']['us10y'] is not None
          assert d['bls']['series']['cpi']['value'] is not None
          assert d['bls']['series']['unemployment']['value'] is not None
          assert d['bls']['series']['payroll']['value'] is not None
          assert d['nyfed']['effr_percent'] is not None
          assert all(asset['score'] is None for asset in d['assets'].values())
          print('Verified official records:',d['observation_date'],d['bls']['series']['cpi']['period'],d['nyfed']['observation_date'],'CPI YoY available=',d['bls']['completeness']['cpi_yoy_available'])
          PY
      - name: Validate two years of official Treasury history
        run: |
          python3 -m scripts.build_asset_compass_history --start-year 2025 --end-year 2026 --output /tmp/asset-compass-treasury-history.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/asset-compass-treasury-history.json').read_text())
          assert report['observation_count'] >= 100
          assert report['not_valid_for_point_in_time_backtest'] is True
          assert report['original_release_vintages_available'] is False
          print('Historical Treasury verification:', report['observation_count'],report['start_date'],report['end_date'])
          PY
      - name: Save verified official snapshot to this feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/global-asset-score-v1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): save verified official indicators"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
