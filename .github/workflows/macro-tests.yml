name: Ooglex Macro Unit Tests
on:
  pull_request:
    paths:
      - 'scripts/update_asset_scores.py'
      - 'scripts/update_macro_bls.py'
      - 'scripts/update_macro_nyfed.py'
      - 'scripts/update_macro_fed_bea.py'
      - 'scripts/update_macro_liquidity.py'
      - 'scripts/inspect_nyfed_recession_workbook.py'
      - 'scripts/update_nyfed_recession.py'
      - 'scripts/backtest_asset_compass.py'
      - 'scripts/build_asset_compass_history.py'
      - 'scripts/build_asset_compass_history_resilient_v42.py'
      - 'scripts/build_asset_compass_history_fred_v42.py'
      - '.github/workflows/macro-tests.yml'
      - 'scripts/audit_asset_compass_prices.py'
      - 'scripts/prepare_asset_compass_returns.py'
      - 'scripts/asset_compass_vintages.py'
      - 'scripts/asset_compass_walkforward.py'
      - 'scripts/archive_asset_compass_observations.py'
      - 'scripts/check_asset_compass_history_readiness.py'
      - 'scripts/audit_asset_compass_oos_evidence.py'
      - 'docs/ASSET_COMPASS_V11_EVIDENCE_GATE.md'
      - 'docs/ASSET_COMPASS_V12_INDICATOR_ALIGNMENT.md'
      - '.github/workflows/macro-treasury.yml'
      - 'macro/migrations/**'
      - 'docs/ASSET_COMPASS_V9_POINT_IN_TIME.md'
      - 'macro/index.html'
      - 'macro/overview.html'
      - 'macro/attribution.html'
      - 'macro/research.html'
      - 'macro/compass-pages.js'
      - 'macro/compass-pages.css'
      - '.github/workflows/deploy_protected_pages.yml'
      - 'apps/asset-tracker/history.json'
      - 'apps/asset-ranking/crypto.json'
      - 'scripts/score_macro_assets.py'
      - 'scripts/build_asset_compass_factor_observations.py'
      - 'macro/model-config.json'
      - 'tests/test_macro_*.py'
      - '.github/workflows/macro-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile scripts
        run: python3 -m compileall -q scripts tests
      - name: Verify Asset Compass four-page JavaScript syntax
        run: node --check macro/compass-pages.js
      - name: Unit tests without network
        run: python3 -m unittest discover -s tests -p 'test_macro_*.py' -v
      - name: Verify SQLite point-in-time schema and OOS tests
        run: |
          python3 -m unittest discover -s tests -p 'test_macro_vintages.py' -v
      - name: Verify independent research evidence gate is locked
        run: |
          python3 -m unittest discover -s tests -p 'test_macro_oos_evidence.py' -v
          python3 - <<'PY'
          import json
          from scripts.audit_asset_compass_oos_evidence import inspect_evidence
          report={"report_type":"expanding_window_research_diagnostic","results":{}}
          result=inspect_evidence(report,{})
          assert result["validated_for_live_scoring"] is False
          assert result["oos_backtest_certified"] is False
          assert result["data_license_certified"] is False
          print("Independent evidence review remains locked")
          PY
      - name: Verify core CPI indicator and NY Fed source registry
        run: python3 -m unittest discover -s tests -p 'test_macro_core_cpi_v12.py' -v
      - name: Audit existing asset prices without claiming validated returns
        run: |
          python3 scripts/audit_asset_compass_prices.py --output /tmp/asset-compass-price-audit.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/asset-compass-price-audit.json').read_text())
          assert r['report_type']=='price_coverage_audit'
          assert r['assets']['bitcoin']['observation_count'] > 0
          assert r['assets']['bitcoin']['source'] == 'CoinGecko'
          assert r['validated_for_live_scoring'] is False
          assert r['licensing_review_required'] is True
          assert all(not a['eligible_for_return_backtest'] for a in r['assets'].values())
          print('Asset coverage verified:',{k:v['observation_count'] for k,v in r['assets'].items()})
          PY
      - name: Verify six-factor evidence fails closed against actual stored snapshot
        run: |
          python3 -m scripts.build_asset_compass_factor_observations --output /tmp/ooglex-factor-observations.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("/tmp/ooglex-factor-observations.json").read_text())
          assert report["schema_version"]==1
          assert report["validated_for_live_scoring"] is False
          assert report["factor_signals_calibrated"] is False
          assert report["independent_factor_group_count_certified"] is False
          assert report["groups"]["risk"]["observations"]==[]
          assert report["groups"]["asset_specific"]["observations"]==[]
          for group in report["groups"].values():
              for observation in group["observations"]:
                  assert observation["qualifies_as_model_factor_signal"] is False
                  assert observation["validated_historical_release_time"] is False
          print("Research-only six factor observation report verified")
          PY
      - name: Verify actual Treasury, BLS and NY Fed feeds
        run: |
          python3 scripts/update_asset_scores.py
          python3 scripts/update_macro_bls.py
          python3 scripts/update_macro_nyfed.py
          python3 scripts/score_macro_assets.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/asset-scores.json').read_text())
          assert d['rates']['us10y'] is not None
          assert d['bls']['series']['cpi']['value'] is not None
          assert d['bls']['series']['core_cpi']['value'] is not None
          assert d['bls']['series']['core_cpi']['unit']=='index'
          assert d['bls']['series']['unemployment']['value'] is not None
          assert d['bls']['series']['payroll']['value'] is not None
          assert d['nyfed']['effr_percent'] is not None
          assert all(asset['score'] is None for asset in d['assets'].values())
          print('Verified official records:',d['observation_date'],d['bls']['series']['cpi']['period'],d['nyfed']['observation_date'],'CPI YoY available=',d['bls']['completeness']['cpi_yoy_available'])
          PY
      - name: Verify live BEA core PCE and Federal Reserve H41 public mirrors
        run: |
          python3 -m scripts.update_macro_fed_bea
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/asset-scores.json").read_text())
          for key,field,symbol in (
              ("bea","core_pce","PCEPILFE"),
              ("fed_h41","total_assets","WALCL")
          ):
              if key in d:
                  obs=d[key][field]
                  assert obs["source_series_id"] == symbol
                  assert obs["release_timestamp_verified"] is False
                  assert obs["source_url"].startswith("https://fred.stlouisfed.org/")
                  assert "cosd=" in obs["source_url"]
                  print("VERIFIED SOURCE:",symbol,obs.get("observation_period",obs.get("observation_date")))
              else:
                  print("SOURCE NOT VERIFIED:",symbol,"No inferred values")
          assert all(a["score"] is None for a in d["assets"].values())
          PY
      - name: Inspect official New York Fed monthly recession probability workbook (diagnostic only)
        run: |
          python3 -m pip install -q xlrd==2.0.2
          python3 -m scripts.inspect_nyfed_recession_workbook
      - name: Verify official NY Fed recession model 12-month target date
        run: |
          python3 -m scripts.update_nyfed_recession
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/asset-scores.json').read_text())
          r=d.get('nyfed_recession_model')
          assert r, 'No independently verified NY Fed model observation'
          y,m=map(int,r['observation_period'].split('-'))
          ty,tm=map(int,r['target_period'].split('-'))
          assert (ty*12+tm)-(y*12+m)==12
          assert 0<=r['probability_percent']<=100
          assert r['official_forecast'] is False
          assert r['release_timestamp_verified'] is False
          print('NYFED RECESSION VERIFIED:',r['observation_period'],r['target_period'],r['probability_percent'])
          PY
      - name: Verify live reserve balances TGA and overnight RRP separately
        run: |
          python3 -m scripts.update_macro_liquidity
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/asset-scores.json").read_text())
          l=d.get("liquidity") or {}
          for key,symbol,units in (
            ("reserves","WRESBAL","millions_usd"),
            ("tga","WTREGEN","millions_usd"),
            ("overnight_rrp","RRPONTSYD","billions_usd")
          ):
            if key in l:
              r=l[key]
              assert r["source_series_id"]==symbol and r["unit"]==units
              assert r["release_timestamp_verified"] is False
              assert r["value"]>=0 and "cosd=" in r["source_url"]
              print("VERIFIED LIQUIDITY SOURCE:",symbol,r["observation_date"],r["value"],units)
            else:
              print("SOURCE NOT VERIFIED:",symbol)
          assert all(a["score"] is None for a in d["assets"].values())
          PY
      - name: Verify immutable first-seen archival and fail-closed readiness
        run: |
          python3 -m scripts.archive_asset_compass_observations --snapshot data/asset-scores.json --ledger /tmp/macro-observations.jsonl
          python3 -m scripts.archive_asset_compass_observations --snapshot data/asset-scores.json --ledger /tmp/macro-observations.jsonl
          python3 -m scripts.check_asset_compass_history_readiness --archive /tmp/macro-observations.jsonl --output /tmp/macro-readiness.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          archive=[json.loads(line) for line in Path('/tmp/macro-observations.jsonl').read_text().splitlines()]
          result=json.loads(Path('/tmp/macro-readiness.json').read_text())
          assert len(archive)>=8 and len(archive)==len({(r['series_id'],r['observation_period']) for r in archive})
          assert all(r['official_release_time_known'] is False for r in archive)
          assert any(r['series_id']=='bls.core_cpi' for r in archive)
          assert any(r['series_id']=='nyfed_recession.probability' for r in archive)
          for key in ('reserves','tga','overnight_rrp'):
              if key in json.loads(Path('data/asset-scores.json').read_text()).get('liquidity',{}):
                  assert any(r['series_id']=='liquidity.'+key for r in archive)
          if "bea" in json.loads(Path("data/asset-scores.json").read_text()):
              assert any(r['series_id']=='bea.core_pce' for r in archive)
              assert any(r['series_id']=='fed_h41.total_assets' for r in archive)
          assert result['validated_for_live_scoring'] is False
          assert result['eligible_for_point_in_time_backtest'] is False
          print('First-seen archived macro observations verified:',len(archive))
          PY
      - name: Validate two years of Treasury yields using direct Treasury first and explicit H15 FRED fallback
        run: |
          python3 -m scripts.build_asset_compass_history_resilient_v42 --start-year 2025 --output /tmp/asset-compass-treasury-history.json
          python3 -m scripts.validate_asset_compass_treasury_trends_v42 --input /tmp/asset-compass-treasury-history.json --minimum 100
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/asset-compass-treasury-history.json').read_text())
          assert report['observation_count'] >= 100
          assert report['not_valid_for_point_in_time_backtest'] is True
          assert report['original_release_vintages_available'] is False
          print('Historical Treasury-market yield verification:', report['source'],report['observation_count'],report['start_date'],report['end_date'])
          PY
      - name: Save verified official snapshot to this feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feature/global-asset-score-v1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asset-scores.json
          if ! git diff --cached --quiet; then
            git commit -m "data(macro): save verified official indicators"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi
