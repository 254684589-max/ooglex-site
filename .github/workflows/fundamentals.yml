name: Fundamentals (SEC XBRL)

# 取公司报表项 → 算 PE/PB/PS/ROE 等比率 → 生成 apps/companies/fundamentals.json → 提交回仓库。
# 数据源：SEC EDGAR XBRL frames（美国政府公开披露，零密钥）。
#
# 正式更新只由 workflow_dispatch 触发，**没有加进 scheduler.yml 的每日轮转**：
# PR 另有只读 preview 任务，校验真实产出并保存审核文件，不推送数据、不部署。
#
# 治理与其余行情管道同一套：独立并发锁、生成前同步目标分支、路径守卫只放行
# apps/companies/fundamentals.json（与公司榜同目录但所有权不同，守卫拦的就是这种情形）、
# 无变化不提交、推送被拒时 rebase 重试、诊断留 14 天。
#
# 运行前需要设一个仓库变量（Variable，不是 Secret —— 它不是密钥，值也会写进 User-Agent 发给 SEC）：
#   Settings → Secrets and variables → Actions → Variables → New repository variable
#   名字 SEC_CONTACT，值填你愿意对 SEC 公开的联系邮箱。
# SEC 要求自动化访问在 User-Agent 里声明联系方式；没设这个变量脚本会直接失败并说明，
# 不会用默认值去撞 SEC 的限流策略。
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/fundamentals/**'
      - 'scripts/validate_fundamentals.py'
      - 'assets/terminal/**'
      - 'apps/finance-terminal/**'
      - '.github/workflows/fundamentals.yml'

permissions:
  contents: write

concurrency:
  group: market-data-fundamentals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 放在最前面：它只读一个环境变量，不需要仓库内容。没设就该立刻报错，
      # 而不是白跑完 checkout / 同步分支 / 装 Python 再失败（实测那样要 17 秒）。
      - name: Check SEC_CONTACT is set
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          if [ -z "$SEC_CONTACT" ]; then
            echo "::error::未设置仓库变量 SEC_CONTACT。SEC 要求自动化访问在 User-Agent 里声明联系方式。"
            echo "::error::直接打开这个地址（别靠侧边栏点，四个子项长得一样）："
            echo "::error::  https://github.com/$GITHUB_REPOSITORY/settings/variables/actions"
            echo "::error::两处最容易点错，都确认一下："
            echo "::error::  1) 必须是 Secrets and variables 下的【Actions】那一项。"
            echo "::error::     同一个子菜单里的 Agents / Codespaces / Dependabot 是四个互不相通的"
            echo "::error::     变量仓库 —— Agents 那个是给 Copilot 编码代理用的，工作流读不到。"
            echo "::error::     认页面标题：要的是 Actions secrets and variables，"
            echo "::error::     写着 Agents secrets and variables 或 for the Copilot cloud agent 的就是走错了。"
            echo "::error::  2) 在那一页里填【Repository variables】那一栏，不是上面的 Environment variables"
            echo "::error::     —— 本工作流没声明 environment:，读的是 vars.SEC_CONTACT，只认仓库级变量。"
            echo "::error::Name 必须正好是 SEC_CONTACT（全大写加下划线）；Value 填你愿意对 SEC 公开的联系邮箱。"
            echo "::error::它是明文变量而不是 Secret —— 因为这个值本来就要发给 SEC，不是密钥。"
            exit 1
          fi
          echo "SEC_CONTACT 已设置（值不回显）"

      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build fundamentals
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/fundamentals/build_fundamentals.py

      - name: Validate fundamentals contract
        run: python scripts/validate_fundamentals.py

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset fundamentals --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/fundamentals-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh fundamentals (SEC XBRL)"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: fundamentals-workflow-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/fundamentals-*.json
          if-no-files-found: warn
          retention-days: 14

  preview:
    # 在同仓库 PR 内先验真实取数；只保存短期审核产物，不推分支、不部署。
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate a fresh fundamentals preview
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/fundamentals/build_fundamentals.py
      - name: Verify actual data and ratios
        run: python scripts/validate_fundamentals.py
      - name: Save validated data for review
        uses: actions/upload-artifact@v6
        with:
          name: fundamentals-preview-${{ github.run_id }}
          path: apps/companies/fundamentals.json
          if-no-files-found: error
          retention-days: 7
