name: Asset Ranking

# 每日刷新「全球资产市值排行榜（前 250，不限品类）」→ 生成 apps/asset-ranking/data.json → 提交回仓库。
# 商品/贵金属/汇率取 Yahoo Finance，加密货币取 CoinGecko，公司复用 apps/companies/data.json，均免密钥。
# 排在 companies 工作流之后运行，以复用当日最新的公司市值（顺序由 scheduler.yml 保证）。
on:
  # 定点 cron 会被 GitHub 推迟数小时，改由 scheduler.yml 在 companies 当日运行成功后统一触发。
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-asset-ranking-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Build asset ranking
        run: python scripts/asset-ranking/build_ranking.py

      - name: Validate per-record provenance
        run: python scripts/validate_market_data_quality.py --dataset asset-ranking

      - name: Validate source health and recovery
        run: python scripts/validate_market_source_health.py --dataset asset-ranking --report /tmp/market-workflow-diagnostics/asset-ranking-source-health.json

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset asset-ranking --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/asset-ranking-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh global asset ranking"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）；不用
          # `git pull --rebase --autostash`，避免弹栈冲突把 <<<<<<< 标记写进 JSON。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asset-ranking-workflow-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/asset-ranking-*.json
          if-no-files-found: warn
          retention-days: 14
