name: Asset Compass V60 Return Accounting Readiness

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_asset_compass_returns_v60.py'
      - 'tests/test_asset_compass_return_accounting_v60.py'
      - '.github/workflows/asset-compass-return-audit-v60.yml'
      - 'docs/ASSET_COMPASS_V60_RETURN_ACCOUNTING.md'
  push:
    branches: [main]
    paths:
      - 'scripts/build_asset_compass_returns_v60.py'
      - 'tests/test_asset_compass_return_accounting_v60.py'
      - '.github/workflows/asset-compass-return-audit-v60.yml'

permissions:
  contents: write

concurrency:
  group: asset-compass-ledger-main
  cancel-in-progress: false

jobs:
  validate-v60:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile real-return accounting gates
        run: python3 -m py_compile scripts/build_asset_compass_returns_v60.py tests/test_asset_compass_return_accounting_v60.py
      - name: Confirm non-trading sample reconciliation and anti-fraud tests
        run: python3 -m unittest discover -s tests -p 'test_asset_compass_return_accounting_v60.py' -v
      - name: Build actual data-driven readiness manifest without inventing total returns
        run: |
          python3 -m scripts.build_asset_compass_returns_v60 --output /tmp/asset-compass-v60-readiness.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/asset-compass-v60-readiness.json").read_text())
          assert d["accounting_contracts_defined"] == 6
          assert d["actual_investable_ledgers_certified"] == 0
          assert d["audited_asset_total_return_count"] == 0
          assert d["historical_first_release_certified_source_count"] == 0
          assert d["oos_validated_assets"] == 0
          assert d["official_0_to_100_scores_published"] == 0
          assert d["validated_for_live_scoring"] is False
          assert all(a["official_score"] is None for a in d["assets"].values())
          print("V60 actual accounting contract census: 6, audited investable returns: 0")
          PY

  persist-readiness-main:
    needs: validate-v60
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build V60 original V59-source SHA provenance from main
        run: python3 -m scripts.build_asset_compass_returns_v60
      - name: Ensure no unlicensed price history or false 0-100 scores
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/asset-compass-return-readiness-v60.json").read_text())
          assert len(d["assets"])==6 and all(v["official_score"] is None for v in d["assets"].values())
          assert all(v["investable_total_return_certified"] is False for v in d["assets"].values())
          assert all(v["public_redistribution_licensed"] is False for v in d["assets"].values())
          assert not any("results" in v for v in d["assets"].values())
          print("V60 safe to persist summary-only accounting readiness; no protected datasets")
          PY
      - name: Commit only the public safe accounting contract, never input histories
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/asset-compass-return-readiness-v60.json
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'data(asset-compass): V60 six asset return accounting readiness; no approved returns'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo 'V60 readiness persisted to main'
              exit 0
            fi
            sleep $((i*3))
          done
          echo '::error::V60 verified summary could not be persisted'
          exit 1
