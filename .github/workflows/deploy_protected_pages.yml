name: Deploy Protected Ooglex Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Connector/API-authored commits do not always emit a workflow-triggering push event.
  # Hourly fallback keeps the public GitHub Pages artifact converged with main.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate WINDOW curator Python
        run: |
          python -m py_compile scripts/global-cams/sync_windows_to_r2.py
          python - <<'PY'
          import importlib.util
          spec=importlib.util.spec_from_file_location("window_curator","scripts/global-cams/sync_windows_to_r2.py")
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          good={"title":"File:Tokyo snowfall night skyline.webm","extmetadata":{"ImageDescription":{"value":"Snow falling over the city skyline at night"}}}
          bad={"title":"File:Tokyo protest parade.webm","extmetadata":{"ImageDescription":{"value":"crowd event"}}}
          gs,_=mod.quality_score(good,"snow")
          bs,_=mod.quality_score(bad,"street")
          assert gs >= 5, gs
          assert bs < 0, bs

          cfg={"min_duration_seconds":30,"max_duration_seconds":300,"min_width":1280,"min_height":720,"require_landscape":True,"preferred_duration_min_seconds":60,"preferred_duration_max_seconds":180}
          assert mod.technical_gate({"duration_seconds":29.9,"width":1920,"height":1080},cfg)[0] is False
          assert mod.technical_gate({"duration_seconds":30,"width":1280,"height":720},cfg)[0] is True
          assert mod.technical_gate({"duration_seconds":60,"width":1080,"height":1920},cfg)[0] is False
          v1,breakdown=mod.v1_quality_score(good,{"duration_seconds":90,"width":1920,"height":1080},gs,cfg)
          assert v1 >= 60, (v1,breakdown)
          assert sum(breakdown.values()) == v1, (v1,breakdown)
          print("WINDOW V1 quality gates OK:",gs,bs,v1,breakdown)
          PY

      - name: Validate Global Cams V0.7
        run: node scripts/validate_global_cams.mjs

      - name: Smoke Global Cams responsive layout
        run: |
          set +e
          node scripts/smoke_global_cams.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::未找到 Chrome/Chromium，本次跳过环球实景三档浏览器冒烟"
            exit 0
          fi
          exit "$code"

      - name: Build FREE/PRO payload split
        run: python scripts/pro/build_pro_datasets.py

      - name: Verify required terminal fundamentals
        run: python scripts/validate_fundamentals.py

      - name: Verify terminal source health and availability
        run: node scripts/validate_terminal_health.mjs

      - name: Build original-page 10 percent previews
        run: python scripts/pro/build_rich_previews.py

      - name: Build Billionaires Top 10 preview and full payload
        run: python scripts/pro/build_billionaires_pro.py

      - name: Build Finance Column 10 percent preview and full payload
        run: node scripts/pro/build_finance_column_pro.mjs

      - name: Build protected public site
        run: python scripts/build_public_site.py --pro-cutover

      - name: Verify fundamentals are included in the public artifact
        run: cmp apps/companies/fundamentals.json .site/apps/companies/fundamentals.json

      - name: Apply Billionaires PRO cutover
        run: python scripts/pro/apply_billionaires_cutover.py

      - name: Verify no PRO-only data leaked into artifact
        run: python scripts/validate_pro_public_cutover.py

      # 会员校验走跨域 Worker，大陆直连时该域名会「挂住」。这道闸门确保权限校验
      # 永远不会成为同源静态数据的前置条件，否则不开 VPN 的用户只能看到空壳页面。
      - name: Verify previews load without the entitlement worker
        run: |
          set +e
          node scripts/macro-radar/verify-cn.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::未找到 Chrome，本次跳过大陆网络验证"
            exit 0
          fi
          exit $code

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload protected Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Verify live Global Cams V1.1
        run: node scripts/verify_global_cams_live.mjs
