name: Deploy Ooglex Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 恢复收费改造前的公开访问方式：
      # 直接部署仓库里的原版完整页面与数据，不注入 FREE/PRO 权限适配器，
      # 浏览器访问研究页面时不再依赖 Supabase / workers.dev。
      # 账户、Supabase、PRO Worker/R2 代码仍保留在仓库中，未来收费时可重新启用。
      - name: Build original full public site
        run: python scripts/build_public_site.py --include-pro-private

      - name: Verify legacy public access
        run: |
          test -f .site/index.html
          test -f .site/apps/macro-radar/data.json
          test -f .site/apps/supply-chain/nodes.json
          test -f .site/apps/billionaires/data.json
          if grep -R "ooglex-pro-api" .site/apps/macro-radar .site/apps/supply-chain .site/apps/billionaires >/dev/null 2>&1; then
            echo "::error::PRO network adapter was injected into public research pages"
            exit 1
          fi
          if test -f .site/account/schema.sql; then
            echo "::error::account/schema.sql must not be published"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
