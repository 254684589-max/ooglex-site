name: Deploy Protected Ooglex Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Connector/API-authored commits do not always emit a workflow-triggering push event.
  # Hourly fallback keeps the public GitHub Pages artifact converged with main.
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Global Cams V0.3
        run: node scripts/validate_global_cams.mjs

      - name: Smoke Global Cams responsive layout
        run: |
          set +e
          node scripts/smoke_global_cams.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::未找到 Chrome/Chromium，本次跳过环球实景三档浏览器冒烟"
            exit 0
          fi
          exit "$code"

      - name: Build FREE/PRO payload split
        run: python scripts/pro/build_pro_datasets.py

      - name: Verify required terminal fundamentals
        run: python scripts/validate_fundamentals.py

      - name: Verify terminal source health and availability
        run: node scripts/validate_terminal_health.mjs

      - name: Build original-page 10 percent previews
        run: python scripts/pro/build_rich_previews.py

      - name: Build Billionaires Top 10 preview and full payload
        run: python scripts/pro/build_billionaires_pro.py

      - name: Build Finance Column 10 percent preview and full payload
        run: node scripts/pro/build_finance_column_pro.mjs

      - name: Build protected public site
        run: python scripts/build_public_site.py --pro-cutover

      - name: Verify fundamentals are included in the public artifact
        run: cmp apps/companies/fundamentals.json .site/apps/companies/fundamentals.json

      - name: Apply Billionaires PRO cutover
        run: python scripts/pro/apply_billionaires_cutover.py

      - name: Verify no PRO-only data leaked into artifact
        run: python scripts/validate_pro_public_cutover.py

      # 会员校验走跨域 Worker，大陆直连时该域名会「挂住」。这道闸门确保权限校验
      # 永远不会成为同源静态数据的前置条件，否则不开 VPN 的用户只能看到空壳页面。
      - name: Verify previews load without the entitlement worker
        run: |
          set +e
          node scripts/macro-radar/verify-cn.mjs
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::未找到 Chrome，本次跳过大陆网络验证"
            exit 0
          fi
          exit $code

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload protected Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages


  global-cams-v03-test:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/global-cams-v03'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Deploy isolated V0.3 test Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          workingDirectory: workers/global-cams-api
          command: deploy --config wrangler.test.toml
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify test Worker health and pagination
        shell: bash
        run: |
          set -euo pipefail
          base="https://ooglex-global-cams-api-test.zlq6600e.workers.dev"
          curl -fsS "$base/health" > /tmp/health.json
          curl -fsS -H 'Origin: https://www.ooglex.com'             "$base/v1/webcams?lat=35.6762&lng=139.6503&radius=50&limit=50&offset=0&lang=zh" > /tmp/page0.json
          curl -fsS -H 'Origin: https://www.ooglex.com'             "$base/v1/webcams?lat=35.6762&lng=139.6503&radius=50&limit=50&offset=50&lang=zh" > /tmp/page50.json
          node - <<'NODE'
          const fs = require('fs');
          const h = JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const a = JSON.parse(fs.readFileSync('/tmp/page0.json','utf8'));
          const b = JSON.parse(fs.readFileSync('/tmp/page50.json','utf8'));
          if (!h.ok || !h.windyConfigured) throw new Error('test Worker health/secret failed');
          if (a.status !== 'ok' || b.status !== 'ok') throw new Error('webcam API status failed');
          console.log('offsets:', a.offset, b.offset);
          if (a.offset !== 0 || b.offset !== 50) throw new Error('offset passthrough failed');
          if (!(a.total > 50) || a.total !== b.total) throw new Error('unexpected Tokyo pagination total');
          if (!Array.isArray(a.webcams) || !Array.isArray(b.webcams) || !a.webcams.length || !b.webcams.length) throw new Error('empty pagination page');
          const first = new Set(a.webcams.map(x => String(x.id)));
          const overlap = b.webcams.filter(x => first.has(String(x.id)));
          if (overlap.length) throw new Error('pagination pages overlap');
          console.log('Global Cams test Worker pagination passed:', { total: a.total, page0: a.webcams.length, page50: b.webcams.length });
          NODE
