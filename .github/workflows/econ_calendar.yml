name: Econ Calendar

# 刷新「全球经济日历」：抓 Forex Factory 公开周历 → 写 apps/econ-calendar/data.json。
# 数据源免登录、无需密钥。每天跑两次，以便事件公布后回填实际值。
on:
  # 每日一跑由 scheduler.yml 在 21:00 UTC 窗口开启后统一触发；此处保留 12:30 UTC 一跑
  # （允许被 GitHub 推迟，时效要求低），用于当天事件公布后回填实际值。
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * *'

permissions:
  contents: write

concurrency:
  group: market-data-econ-calendar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync target branch before generation
        run: |
          if [ "$GITHUB_REF_TYPE" != "branch" ]; then
            echo "仅允许从分支运行数据更新，当前引用类型：$GITHUB_REF_TYPE"
            exit 1
          fi
          git fetch --no-tags origin "$GITHUB_REF_NAME"
          git checkout -B "$GITHUB_REF_NAME" FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: pip install requests

      - name: Build econ calendar data
        run: python scripts/econ-calendar/build_calendar.py

      - name: Validate source health and recovery
        run: python scripts/validate_supporting_source_health.py --dataset econ-calendar --report /tmp/market-workflow-diagnostics/econ-calendar-source-health.json

      - name: Guard and stage owned outputs
        id: stage
        run: python scripts/market_workflow_governance.py stage --dataset econ-calendar --github-output "$GITHUB_OUTPUT" --report /tmp/market-workflow-diagnostics/econ-calendar-workflow.json

      - name: Commit and push data
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh econ calendar"
          # 数据文件由本工作流独占生成。推送遇远端新提交时 rebase 重试，冲突以本次生成的版本为准
          # （rebase 中 ours/theirs 语义互换，-X theirs 才是本地工作分支一侧）；不用
          # `git pull --rebase --autostash`，避免弹栈冲突把 <<<<<<< 标记写进 JSON。
          for i in 1 2 3 4 5; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "已推送"; exit 0
            fi
            echo "推送被拒，拉取远端后重试（$i）"
            if ! git fetch --no-tags origin "$GITHUB_REF_NAME"; then
              sleep $((i * 3)); continue
            fi
            if ! git rebase -X theirs "origin/$GITHUB_REF_NAME"; then
              git rebase --abort || true
              sleep $((i * 3)); continue
            fi
            sleep $((i * 3))
          done
          echo "推送多次失败"; exit 1

      - name: Report no data changes
        if: steps.stage.outputs.changed == 'false'
        run: echo "生成结果与仓库一致，跳过提交和推送"

      - name: Fail unsuccessful source attempt after preserving diagnostics
        run: python scripts/validate_supporting_source_health.py --dataset econ-calendar --require-published

      - name: Upload workflow diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: econ-calendar-workflow-${{ github.run_attempt }}
          path: /tmp/market-workflow-diagnostics/econ-calendar-*.json
          if-no-files-found: warn
          retention-days: 14
