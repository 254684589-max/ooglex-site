name: 100STYLE first real BVH recordings
on:
  pull_request:
    branches: [main]
    paths:
      - 'motion-studio/tools/import_100style.py'
      - '.github/workflows/motion-100style-import.yml'
  push:
    branches: [agent/motion-studio-mesh2motion-v463]
    paths:
      - 'motion-studio/tools/import_100style.py'
      - '.github/workflows/motion-100style-import.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/agent/motion-studio-mesh2motion-v463' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/motion-studio-mesh2motion-v463')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/motion-studio-mesh2motion-v463
          sparse-checkout: |
            motion-studio
      - name: Verify original 100STYLE sequences
        run: python3 motion-studio/tools/import_100style.py
      - name: Commit verified raw sequences
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-studio/assets/100style
          git diff --cached --quiet && exit 0
          git commit -m "data(motion): verified original 100STYLE recordings"
          git pull --rebase origin agent/motion-studio-mesh2motion-v463
          git push origin HEAD:agent/motion-studio-mesh2motion-v463
