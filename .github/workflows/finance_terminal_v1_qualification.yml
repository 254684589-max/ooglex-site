name: Finance Terminal V1 Qualification
run-name: Stable V1 qualification · ${{ github.ref_name }}

# 只在金融终端开发分支编排四条核心数据管道。新增脚本或跨日周期标记推送会运行；
# 标记只负责开发观察触发，周期仍按远端workflow_dispatch证据复算。不会合并main或部署。
on:
  push:
    branches:
      - 'agent/finance-terminal-*'
    paths:
      - 'scripts/finance_terminal_qualification.py'
      - 'scripts/validate_finance_terminal_qualification.py'
      - 'scripts/finance_terminal_cycle_trigger.py'
      - 'scripts/validate_finance_terminal_cycle_trigger.py'
      - '.github/finance-terminal-v1-cycle.json'
      - 'scripts/finance_terminal_readiness_snapshot.py'
      - 'scripts/validate_finance_terminal_readiness_snapshot.py'
      - 'scripts/finance_terminal_release_gate.py'
      - 'scripts/validate_finance_terminal_release_gate.py'
      - 'scripts/validate_finance_terminal.py'
      - 'apps/finance-terminal/app.js'
      - 'apps/finance-terminal/index.html'
      - 'apps/finance-terminal/legal.css'
      - 'apps/finance-terminal/terms.html'
      - 'apps/finance-terminal/privacy.html'
      - 'scripts/finance_terminal_market_licenses.py'
      - 'scripts/validate_finance_terminal_market_licenses.py'
      - 'scripts/validate_finance_terminal_browser.mjs'
      - 'scripts/finance_terminal_browser_evidence.mjs'
      - 'scripts/validate_finance_terminal_browser_evidence.mjs'
      - 'scripts/finance_terminal_proxy_runtime_history.py'
      - 'scripts/validate_finance_terminal_proxy_runtime_history.py'
      - 'apps/finance-terminal/market-source-readiness.json'
      - 'scripts/asset-tracker/build_assets.py'
      - 'scripts/market_data_quality.py'
      - 'scripts/validate_market_data_quality.py'
      - 'scripts/market_source_health.py'
      - 'scripts/validate_market_source_health.py'
      - '.github/workflows/asset_tracker.yml'
      - '.github/workflows/finance_terminal_v1_qualification.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: finance-terminal-v1-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-data-pipelines:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout qualification source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate qualification orchestration contract
        run: |
          python scripts/validate_finance_terminal_qualification.py
          python scripts/validate_finance_terminal_cycle_trigger.py

      - name: Run four-pipeline development qualification
        id: qualification
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/finance_terminal_qualification.py \
            --branch "$GITHUB_REF_NAME" \
            --timeout-minutes 55 \
            --report-json /tmp/finance-terminal-qualification/qualification.json \
            --report-md /tmp/finance-terminal-qualification/qualification.md \
            --fail-on-blocked

      - name: Add qualification summary
        if: always()
        run: |
          if [ -f /tmp/finance-terminal-qualification/qualification.md ]; then
            cat /tmp/finance-terminal-qualification/qualification.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "资格验收未生成报告。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-v1-qualification-${{ github.run_attempt }}
          path: /tmp/finance-terminal-qualification/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail blocked qualification
        if: steps.qualification.outcome != 'success'
        run: |
          echo "至少一条核心数据管道未成功，稳定V1资格验收保持阻断。"
          exit 1

  refresh-readiness-report:
    needs: qualify-data-pipelines
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest qualified branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Generate updated Beta and stable V1 report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READINESS_BRANCH: ${{ github.ref_name }}
        run: |
          python scripts/finance_terminal_release_gate.py \
            --report-json /tmp/finance-terminal-readiness/readiness.json \
            --report-md /tmp/finance-terminal-readiness/readiness.md
          cat /tmp/finance-terminal-readiness/readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build static stable V1 evidence snapshot
        id: readiness-snapshot
        run: |
          python scripts/finance_terminal_readiness_snapshot.py \
            --source-report /tmp/finance-terminal-readiness/readiness.json \
            --output apps/finance-terminal/readiness.json \
            --github-output "$GITHUB_OUTPUT"
          cp apps/finance-terminal/readiness.json \
            /tmp/finance-terminal-readiness/readiness-snapshot.json

      - name: Validate latest qualified branch
        id: final-quality
        continue-on-error: true
        run: |
          python scripts/validate_finance_terminal.py
          python scripts/validate_finance_terminal_market_licenses.py
          python scripts/validate_market_data_quality.py --dataset all
          python scripts/validate_market_source_health.py --dataset all \
            --report /tmp/finance-terminal-health/source-health.json
          python scripts/validate_macro_source_health.py \
            --report /tmp/finance-terminal-health/macro-source-health.json
          python scripts/validate_supporting_source_health.py --dataset all \
            --report /tmp/finance-terminal-health/supporting-source-health.json
          python scripts/validate_supporting_source_builders.py
          python scripts/validate_market_workflow_governance.py --dataset all
          python scripts/validate_finance_terminal_release_gate.py
          python scripts/validate_finance_terminal_qualification.py
          python scripts/validate_finance_terminal_cycle_trigger.py
          python scripts/validate_finance_terminal_readiness_snapshot.py
          python scripts/validate_finance_terminal_proxy_runtime_history.py
          python scripts/finance_terminal_readiness_snapshot.py \
            --validate-only apps/finance-terminal/readiness.json
          node scripts/validate_finance_terminal_browser_evidence.mjs
          node scripts/validate_finance_terminal_browser.mjs \
            --artifacts-dir /tmp/finance-terminal-browser

      - name: Build final bounded proxy runtime history
        if: steps.final-quality.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/finance_terminal_proxy_runtime_history.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --current-evidence /tmp/finance-terminal-browser/finance-terminal-browser-evidence.json \
            --output-json /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.json \
            --output-markdown /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.md
          cat /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Commit verified stable V1 evidence snapshot
        if: steps.final-quality.outcome == 'success' && steps.readiness-snapshot.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/finance-terminal/readiness.json
          test "$(git diff --cached --name-only)" = "apps/finance-terminal/readiness.json"
          git commit -m "data(finance): refresh stable V1 evidence"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
          done
          echo "稳定V1证据快照推送失败。"
          exit 1

      - name: Upload updated readiness evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-v1-readiness-${{ github.run_attempt }}
          path: /tmp/finance-terminal-readiness/
          if-no-files-found: error
          retention-days: 14

      - name: Upload final responsive screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-v1-responsive-${{ github.run_attempt }}
          path: /tmp/finance-terminal-browser/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload final proxy runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-v1-proxy-runtime-${{ github.run_attempt }}
          path: |
            /tmp/finance-terminal-browser/finance-terminal-browser-evidence.json
            /tmp/finance-terminal-browser/finance-terminal-browser-evidence.md
            /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.json
            /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload final source health diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-v1-source-health-${{ github.run_attempt }}
          path: /tmp/finance-terminal-health/*.json
          if-no-files-found: error
          retention-days: 14

      - name: Fail invalid qualified branch
        if: steps.final-quality.outcome != 'success'
        run: |
          echo "资格运行后的开发分支未通过完整质量检查。"
          exit 1
