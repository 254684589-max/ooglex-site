name: Asset Compass Research V18-V40 Gates
on:
  pull_request:
    paths:
      - 'scripts/asset_compass_pit_standardize.py'
      - 'macro/overview.html'
      - 'macro/compass-pages.js'
      - 'macro/compass-pages.css'
      - 'index.html'
      - 'tests/test_macro_compass_frontend_v39.py'
      - 'tests/smoke_asset_compass_frontend_v40.cjs'
      - 'docs/ASSET_COMPASS_V40_*'
      - 'docs/ASSET_COMPASS_V39_*'
      - 'scripts/asset_compass_vintage_quality.py'
      - 'scripts/asset_compass_risk_credit_v20.py'
      - 'scripts/asset_compass_asset_specific_v21.py'
      - 'scripts/asset_compass_independence_v22.py'
      - 'scripts/audit_asset_compass_real_history_v24.py'
      - 'scripts/audit_asset_compass_history_v32.py'
      - 'scripts/qualify_asset_compass_pit_v33.py'
      - 'scripts/capture_asset_compass_bls_release_v34.py'
      - 'scripts/capture_asset_compass_bls_batch_v35.py'
      - 'scripts/verify_asset_compass_private_custody_v36.py'
      - 'scripts/backup_asset_compass_private_v37.py'
      - 'scripts/sync_asset_compass_r2_v37.py'
      - 'scripts/accept_asset_compass_recovery_v38.py'
      - 'scripts/run_asset_compass_v38.sh'
      - 'docs/ASSET_COMPASS_V38_*'
      - 'docs/ASSET_COMPASS_V37_*'
      - 'docs/ASSET_COMPASS_V36_*'
      - 'docs/ASSET_COMPASS_V35_*'
      - '.github/workflows/asset-compass-bls-batch-v35.yml'
      - 'docs/ASSET_COMPASS_V34_*'
      - '.github/workflows/asset-compass-bls-release-v34.yml'
      - 'docs/ASSET_COMPASS_V33_*'
      - 'scripts/check_asset_compass_archive_continuity_v25.py'
      - 'tests/test_asset_compass_*_v*.py'
      - 'docs/ASSET_COMPASS_V1[8-9]_*'
      - 'docs/ASSET_COMPASS_V2[0-2]_*'
      - 'docs/ASSET_COMPASS_V24_*'
      - 'docs/ASSET_COMPASS_V25_*'
      - '.github/workflows/asset-compass-independent-archive.yml'
      - '.github/workflows/asset-compass-quality-v32.yml'
      - 'docs/ASSET_COMPASS_V32_*'
      - '.github/workflows/macro-treasury.yml'
      - '.github/workflows/asset-compass-research-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated encryption dependency for V37 tests
        run: python3 -m pip install cryptography==46.0.4
      - name: Syntax validation
        run: python3 -m compileall -q scripts tests
      - name: Run isolated V18-V39 research gates
        run: python3 -m unittest discover -s tests -p 'test_asset_compass_*_v*.py' -v
      - name: V39-V40 verify frontend structure, live behavior and JS syntax
        run: |
          node --check macro/compass-pages.js
          node tests/smoke_asset_compass_frontend_v40.cjs
          python3 -m unittest discover -s tests -p 'test_macro_compass_frontend_v39.py' -v
      - name: Verify production scoring remains blocked
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.score_macro_assets import score_one
          config=json.loads(Path("macro/model-config.json").read_text())
          for asset in config["weights"]:
              result=score_one(asset, {}, config, {})
              assert result["score"] is None
              assert result["status"]=="unavailable"
          print("No live scores or factor contribution unlocked")
          PY
