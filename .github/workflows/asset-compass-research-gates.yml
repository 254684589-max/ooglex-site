  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install authenticated encryption dependency for V37 tests
        run: python3 -m pip install cryptography==46.0.4
      - name: Syntax validation
        run: python3 -m compileall -q scripts tests
      - name: Run isolated V18-V57 research gates
        run: python3 -m unittest discover -s tests -p 'test_asset_compass_*_v*.py' -v
      - name: V39-V57 verify factor qualification evidence and closed scoring gates
        run: |
          node --check macro/compass-pages.js
          node tests/smoke_asset_compass_frontend_v40.cjs
          node tests/smoke_asset_compass_insights_v41.cjs
          node --check macro/treasury-trends.js
          node tests/smoke_asset_compass_trends_v42.cjs
          node tests/smoke_asset_compass_compare_v43.cjs
          node tests/smoke_asset_compass_probe_v44.cjs
          node tests/smoke_asset_compass_statistics_v45.cjs
          node tests/smoke_asset_compass_distribution_v46.cjs
          node tests/smoke_asset_compass_correlation_v47.cjs
          node tests/smoke_asset_compass_independence_v48.cjs
          node tests/smoke_asset_compass_qualification_v49.cjs
          node --check macro/asset-compass-evidence-v50.js
          node tests/smoke_asset_compass_evidence_v50.cjs
          python3 -m unittest discover -s tests -p 'test_asset_compass_treasury_trends_v42.py' -v
          python3 -m unittest discover -s tests -p 'test_asset_compass_h15_fred_v42.py' -v
          python3 -m unittest discover -s tests -p 'test_asset_compass_treasury_priority_v42.py' -v
          python3 -m unittest discover -s tests -p 'test_macro_compass_frontend_v39.py' -v
      - name: Validate V51 seven official release candidates without network
        run: |
          python3 -m scripts.capture_asset_compass_official_v51 --dry-run
          python3 -m unittest discover -s tests -p 'test_asset_compass_official_v51.py' -v
      - name: Verify V52 authenticated custody and no historical PIT promotion
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_custody_v52.py' -v
          bash -n scripts/run_asset_compass_v52.sh
      - name: V53 verify five separately typed source statistics and unchanged locked PIT status
        run: python3 -m unittest discover -s tests -p 'test_asset_compass_release_values_v53.py' -v
      - name: V54 audit model score contract and six-asset actual source-to-signal gaps
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_scoring_readiness_v54.py' -v
          python3 -m unittest discover -s tests -p 'test_macro_scoring.py' -v
          node tests/smoke_asset_compass_scoring_v54.cjs
          python3 -m scripts.build_asset_compass_scoring_readiness_v54 --output /tmp/ooglex-v54-readiness.json
      - name: V55 actual Treasury 1472-observation standardized research and safe website render
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_rate_shocks_v55.py' -v
          python3 -m scripts.build_asset_compass_rate_shocks_v55 --output /tmp/ooglex-v55-rate-shocks.json
          python3 -m scripts.build_asset_compass_rate_shocks_v55
          node tests/smoke_asset_compass_rate_shocks_v55.cjs
      - name: V56 official NFCI and EIA parser, coverage and scoring fail-closed
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_new_sources_v56.py' -v
          node --check macro/compass-pages.js
          node tests/smoke_asset_compass_new_sources_v56.cjs
      - name: V56 fetch real Chicago Fed NFCI and EIA crude inventory (not synthetic)
        run: |
          python3 -m scripts.build_asset_compass_new_sources_v56 --fetch --output /tmp/ooglex-v56-real-official-research.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/ooglex-v56-real-official-research.json").read_text())
          assert d["sources"]["nfci"]["observation_count"]>=112
          assert d["sources"]["oil_inventory"]["observation_count"]>=112
          assert d["approved_asset_scores"]==0
          assert d["independent_scoring_factor_groups_qualified"]==0
          assert d["status"]=="research_only_two_official_sources_current"
          print("V56 truly downloaded both official sources; no live scores")
          PY
      - name: V57 verify gold CFTC + Treasury auction parsers and website zero-score contract
        run: |
          python3 -m unittest discover -s tests -p 'test_asset_compass_asset_specific_v57.py' -v
          python3 -m unittest discover -s tests -p 'test_asset_compass_first_seen_v57.py' -v
          python3 -m unittest discover -s tests -p 'test_asset_compass_cross_source_v57.py' -v
          node --check macro/compass-pages.js
          node tests/smoke_asset_compass_asset_specific_v57.cjs
      - name: V57 download actual CFTC Gold and Treasury auctions, no synthesized inputs
        run: |
          python3 -m scripts.build_asset_compass_asset_specific_v57 --fetch --output /tmp/ooglex-v57-official.json
          python3 -m scripts.audit_asset_compass_cross_source_v57 \
            --v57 /tmp/ooglex-v57-official.json --output /tmp/ooglex-v57-overlap-real.json
          python3 - <<'PYOVERLAP'
          import json
          from pathlib import Path
          p=json.loads(Path("/tmp/ooglex-v57-overlap-real.json").read_text())
          assert p["source_comparison_count"]==4
          assert p["score"] is None
          assert p["historical_pit_qualified"] is False
          assert p["available_for_investment_scoring"] is False
          print("Real Gold, NFCI and Treasury factor overlap audited; 0/6 scores certified")
          PYOVERLAP
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("/tmp/ooglex-v57-official.json").read_text())
          assert d["sources"]["cftc_gold"]["observation_count"]>=105
          assert d["sources"]["treasury_30y"]["auction_count"]>=37
          assert d["approved_asset_scores"]==0
          assert d["independent_model_factor_qualified_count"]==0
          assert d["validated_for_live_scoring"] is False
          print("CFTC GOLD and 30Y Treasury auctions actually retrieved; zero official scores")
          PY
      - name: Verify production scoring remains blocked
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from scripts.score_macro_assets import score_one
          config=json.loads(Path("macro/model-config.json").read_text())
          for asset in config["weights"]:
              result=score_one(asset, {}, config, {})
              assert result["score"] is None
              assert result["status"]=="unavailable"
          print("No live scores or factor contribution unlocked")
          PY
