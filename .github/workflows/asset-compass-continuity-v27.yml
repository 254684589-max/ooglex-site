name: Asset Compass Archive Continuity V27
on:
  schedule:
    # After the independent 01:20 UTC Tue-Sat archive job.
    - cron: '30 2 * * 2-6'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/monitor_asset_compass_continuity_v27.py'
      - 'scripts/diagnose_asset_compass_sources_v28.py'
      - '.github/workflows/asset-compass-continuity-v27.yml'
permissions:
  contents: read
concurrency:
  group: asset-compass-v27-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate archive chronology and per-series observed cadence
        run: |
          python3 -m scripts.monitor_asset_compass_continuity_v27 \
            --output /tmp/asset-compass-v27-continuity.json --fail-on-critical
      - name: Diagnose upstream snapshot vs archive missing indicators
        run: |
          python3 -m scripts.diagnose_asset_compass_sources_v28 \
            --output /tmp/asset-compass-v28-source-gaps.json --fail-if-stale
      - name: Publish diagnostic summary (no market values)
        if: always()
        run: |
          if test -f /tmp/asset-compass-v27-continuity.json; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("/tmp/asset-compass-v27-continuity.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
              f.write("### Asset Compass V27 operational continuity\n")
              f.write(f"Status: **{r['monitor_status']}**\n\n")
              f.write(f"Archived versions: {r['archived_versions']}  \n")
              f.write(f"Seeded required indicators: {r['seeded_series']}/{r['required_series']}  \n")
              f.write(f"Missing indicators: {len(r['missing_required_series'])}  \n")
              f.write(f"Legacy Treasury provenance exceptions: {r['provenance_exception_count']}  \n")
              f.write(f"Critical operational alerts: {r['critical_operational_alerts']}\n")
              f.write("\nNo validated historical vintages, investment scores or trading alerts.\n")
          PY
          else
            echo '::error::No V27 diagnostic was produced; inspect ledger/schema/check steps.'
          fi
      - name: Show V28 upstream-source gap summary
        if: always()
        run: |
          if test -f /tmp/asset-compass-v28-source-gaps.json; then
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path("/tmp/asset-compass-v28-source-gaps.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\\n### V28 upstream source gap audit\\n")
              f.write(f"Present required series in snapshot: {r['required_present_in_snapshot']}/{r['required_series_count']}  \\n")
              f.write(f"Missing from snapshot: {', '.join(r['missing_from_snapshot']) or 'none'}  \\n")
              f.write(f"Present but not archived: {', '.join(r['present_but_not_archived']) or 'none'}  \\n")
              f.write(f"Snapshot age hours: {r['snapshot_age_hours']}  \\n")
              f.write("Missing source is not zero; actual collector failure cause needs source logs.\\n")
          PY
          else
            echo '::error::V28 source-gap report unavailable; inspect snapshot and archive errors.'
          fi
