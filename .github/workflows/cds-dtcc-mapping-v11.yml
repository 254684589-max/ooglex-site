name: CDS SEC product and reference entity diagnostic
on:
  pull_request:
    paths:
      - '.github/workflows/cds-dtcc-mapping-v11.yml'
      - 'scripts/cds_dtcc_mapping_v11.py'
      - 'tests/test_cds_dtcc_mapping_v11.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run diagnostic tests
        run: python3 -m unittest discover -s tests -p 'test_cds_dtcc_*v*.py' -v
      - name: Check seven-day public statutory UPI metadata
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/nasdaq100-cds-v11')
        run: python3 scripts/cds_dtcc_mapping_v11.py --end 2026-11-24 --days 7
