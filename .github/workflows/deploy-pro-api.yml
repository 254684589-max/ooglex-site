name: Deploy PRO API and Protected Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/pro-api/**'
      - 'assets/pro-access.js'
      - 'assets/pro-billionaires.js'
      - 'assets/pro-finance-column.js'
      - 'scripts/pro/build_pro_datasets.py'
      - 'scripts/pro/build_billionaires_pro.py'
      - 'scripts/pro/build_finance_column_pro.mjs'
      - 'apps/billionaires/data.json'
      - 'apps/macro-radar/**'
      - 'apps/supply-chain/**'
      - 'apps/finance-column/**'
      - 'apps/tech-leaders/**'
      - '.github/workflows/deploy-pro-api.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi

      - name: Build protected payloads
        run: |
          python scripts/pro/build_pro_datasets.py
          python scripts/pro/build_billionaires_pro.py
          node scripts/pro/build_finance_column_pro.mjs

      - name: Deploy Ooglex PRO API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/pro-api
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify PRO API custom domain
        run: |
          set -e
          ok=0
          for i in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 5 --max-time 12 https://pro-api.ooglex.com/health 2>/dev/null || true)"
            if echo "$body" | grep -q '"ok":true'; then
              echo "PRO API custom domain is ready: $body"
              ok=1
              break
            fi
            echo "Waiting for pro-api.ooglex.com ($i/24)..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pro-api.ooglex.com health check failed"
            exit 1
          fi

      - name: Upload protected R2 datasets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            r2 object put ooglex-pro-data/supply-chain/preview.json --file .pro-build/supply-chain/preview.json
            r2 object put ooglex-pro-data/supply-chain/full.json --file .pro-build/supply-chain/full.json
            r2 object put ooglex-pro-data/macro-risk/preview.json --file .pro-build/macro-risk/preview.json
            r2 object put ooglex-pro-data/macro-risk/full.json --file .pro-build/macro-risk/full.json
            r2 object put ooglex-pro-data/billionaires/preview.json --file .pro-build/billionaires/preview.json
            r2 object put ooglex-pro-data/billionaires/full.json --file .pro-build/billionaires/full.json
            r2 object put ooglex-pro-data/finance-column/preview.json --file .pro-build/finance-column/preview.json
            r2 object put ooglex-pro-data/finance-column/full.json --file .pro-build/finance-column/full.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify public preview endpoints
        run: |
          set -e
          for product in supply_chain macro_risk billionaires finance_column; do
            body="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/data/$product?mode=preview")"
            test -n "$body"
            echo "$product preview ready"
          done

      - name: Verify Tech Leaders backend
        run: |
          set -e
          body="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/tech-leaders/status")"
          echo "$body" | grep -q '"service":"tech-leaders"'
          echo "Tech Leaders backend ready: $body"
