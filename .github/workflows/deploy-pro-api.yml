name: Deploy PRO API and Protected Data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloudflare/pro-api/**'
      - 'assets/pro-access.js'
      - 'assets/pro-billionaires.js'
      - 'assets/pro-finance-column.js'
      - 'scripts/pro/build_pro_datasets.py'
      - 'scripts/pro/build_billionaires_pro.py'
      - 'scripts/pro/build_finance_column_pro.mjs'
      - 'apps/billionaires/data.json'
      - 'apps/macro-radar/**'
      - 'apps/supply-chain/**'
      - 'apps/finance-column/**'
      - 'apps/tech-leaders/**'
      - 'scripts/tech-leaders/**'
      - '.github/workflows/deploy-pro-api.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not configured"
            exit 1
          fi

      - name: Build protected payloads
        run: |
          python scripts/pro/build_pro_datasets.py
          python scripts/pro/build_billionaires_pro.py
          node scripts/pro/build_finance_column_pro.mjs

      - name: Deploy Ooglex PRO API Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare/pro-api
          command: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify PRO API custom domain
        run: |
          set -e
          ok=0
          for i in $(seq 1 24); do
            body="$(curl -fsS --connect-timeout 5 --max-time 12 https://pro-api.ooglex.com/health 2>/dev/null || true)"
            if echo "$body" | grep -q '"ok":true'; then
              echo "PRO API custom domain is ready: $body"
              ok=1
              break
            fi
            echo "Waiting for pro-api.ooglex.com ($i/24)..."
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::pro-api.ooglex.com health check failed"
            exit 1
          fi

      - name: Upload protected R2 datasets
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: |
            r2 object put ooglex-pro-data/supply-chain/preview.json --file .pro-build/supply-chain/preview.json
            r2 object put ooglex-pro-data/supply-chain/full.json --file .pro-build/supply-chain/full.json
            r2 object put ooglex-pro-data/macro-risk/preview.json --file .pro-build/macro-risk/preview.json
            r2 object put ooglex-pro-data/macro-risk/full.json --file .pro-build/macro-risk/full.json
            r2 object put ooglex-pro-data/billionaires/preview.json --file .pro-build/billionaires/preview.json
            r2 object put ooglex-pro-data/billionaires/full.json --file .pro-build/billionaires/full.json
            r2 object put ooglex-pro-data/finance-column/preview.json --file .pro-build/finance-column/preview.json
            r2 object put ooglex-pro-data/finance-column/full.json --file .pro-build/finance-column/full.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify public preview endpoints
        run: |
          set -e
          for product in supply_chain macro_risk billionaires finance_column; do
            body="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/data/$product?mode=preview")"
            test -n "$body"
            echo "$product preview ready"
          done

      - name: Verify Tech Leaders backend
        run: |
          set -e
          body="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/tech-leaders/status")"
          echo "$body" | grep -q '"service":"tech-leaders"'
          echo "Tech Leaders backend ready: $body"

      - name: Smoke test hard-zero-X-API free mode
        run: |
          set +e
          failed=0

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("apps/tech-leaders/leaders.json").read_text())
          people=data if isinstance(data,list) else data.get("leaders",data.get("people",[]))
          eligible=[
              p for p in people
              if p.get("handle")
              and p.get("admission_status")=="active"
              and (
                  p.get("x_identity_verified") is True
                  or p.get("verified_personal_x") is True
                  or "个人公开 X 账号" in str(p.get("note",""))
              )
          ]
          excluded=[p for p in people if p not in eligible]
          print(f"Native free-feed catalog coverage: {len(eligible)} personal accounts; {len(excluded)} excluded/special entries")
          print("Excluded:", ", ".join(f"{p.get('id')}(@{p.get('handle','')})" for p in excluded))
          if len(eligible) < 100:
              raise SystemExit("Expected at least 100 confirmed personal X accounts")
          PY
          for handle in ZLQ6600E elonmusk JensenHuang sama LisaSu sundarpichai satyanadella tim_cook JeffBezos ajassy demishassabis DarioAmodei ylecun AndrewYNg drfeifei miramurati AravSrinivas karpathy Benioff MichaelDell; do
            tmp="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 20 -o "$tmp" -w '%{http_code}' "https://pro-api.ooglex.com/v1/tech-leaders/free-feed?handle=$handle&limit=3")"
            body="$(cat "$tmp")"
            rm -f "$tmp"
            if [ "$code" = "200" ] && echo "$body" | grep -q '"uses_x_api":false'; then
              echo "Free feed OK for @$handle (HTTP $code)"
            else
              echo "::warning::Free feed trial for @$handle returned HTTP $code: $body"
            fi

            tmp="$(mktemp)"
            pcode="$(curl -sS --connect-timeout 5 --max-time 20 -o "$tmp" -w '%{http_code}' "https://pro-api.ooglex.com/v1/tech-leaders/free-profile?handle=$handle")"
            pbody="$(cat "$tmp")"
            rm -f "$tmp"
            if [ "$pcode" = "200" ] && echo "$pbody" | grep -q '"uses_x_api":false'; then
              echo "Free profile OK for @$handle (HTTP $pcode)"
            else
              echo "::warning::Free profile public sources unavailable for @$handle (HTTP $pcode): $pbody"
            fi
          done

          feed_json="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/tech-leaders/free-feed?handle=sundarpichai&limit=8" || true)"
          media_url="$(printf '%s' "$feed_json" | python -c 'import json,sys; d=json.load(sys.stdin) if not sys.stdin.isatty() else {}; print(next((m.get("url") or m.get("preview_image_url") or m.get("video_url") for p in d.get("posts",[]) for m in (p.get("media") or []) if (m.get("url") or m.get("preview_image_url") or m.get("video_url"))),""))' 2>/dev/null || true)"
          if [ -n "$media_url" ]; then
            proxy_url="$(python -c 'import sys,urllib.parse; print("https://pro-api.ooglex.com/v1/tech-leaders/media?url="+urllib.parse.quote(sys.argv[1],safe=""))' "$media_url")"
            mcode="$(curl -sS -L --connect-timeout 5 --max-time 25 -o /tmp/ooglex-media-smoke.bin -w '%{http_code}' "$proxy_url")"
            mtype="$(file -b --mime-type /tmp/ooglex-media-smoke.bin 2>/dev/null || true)"
            rm -f /tmp/ooglex-media-smoke.bin
            if [ "$mcode" = "200" ] || [ "$mcode" = "206" ]; then
              echo "Media proxy OK for @sundarpichai (HTTP $mcode, $mtype)"
            else
              echo "::error::Media proxy failed for @sundarpichai (HTTP $mcode)"
              failed=1
            fi
          else
            echo "::warning::No media found in current @sundarpichai sample; media proxy smoke skipped."
          fi

          feed100="$(curl -fsS --connect-timeout 5 --max-time 30 "https://pro-api.ooglex.com/v1/tech-leaders/free-feed?handle=sundarpichai&limit=100" || true)"
          if [ -n "$feed100" ]; then
            printf '%s' "$feed100" | python -c 'import json,sys; d=json.load(sys.stdin); p=d.get("posts",[]); assert d.get("uses_x_api") is False; assert len(p)<=100; print(f"Free feed 100-item ceiling OK: {len(p)} posts")' || failed=1
          else
            echo "::warning::100-item free-feed smoke returned no body"
          fi

          status="$(curl -fsS --connect-timeout 5 --max-time 20 "https://pro-api.ooglex.com/v1/tech-leaders/status")"
          echo "$status" | grep -q '"calls_api_x_com":false' || failed=1
          if [ "$failed" -ne 0 ]; then
            echo "::error::Free mode hard-zero-X-API contract missing from status endpoint"
            exit 1
          fi

      - name: Warm and verify Tech Leaders avatar cache
        run: |
          python scripts/tech-leaders/warm_avatars.py \
            --catalog apps/tech-leaders/leaders.json \
            --base-url https://pro-api.ooglex.com \
            --workers 2 \
            --retries 1
