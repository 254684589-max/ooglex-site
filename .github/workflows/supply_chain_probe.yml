name: Supply Chain Source Probe

# 只读探测：全球供应链板块的候选数据源在 Actions 机房到底取不取得到、许可能不能用。
# 不写仓库、不提交任何数据，只把探测报告作为构建产物留存。
#
# 这是「先探后建」的第一步，也是常备工具：往供应链清单里加任何一条序列、或动抽取
# 规则之前先跑一次。四个 job 互不依赖，一个失败不影响其它：
#
#   graph   —— 公司图谱主线。先跑离线抽取规则校验（不联网、快、失败即停），再实测
#              SEC EDGAR 能不能规模化抽出带出处的供应链关系。
#   extract —— Form SD 抽取器 dry-run。把真实解析出的冶炼厂名／国别／矿种打到日志里
#              供人逐条核对，不写任何文件。接不接入发布由人决定，不由脚本的自动结论决定。
#   supplier —— 第二条数据源：公司自己发布的供应商名单（一级供应商那一层）。
#              只读，回答「找得到吗／什么格式／解得开吗／许可允许吗」四件事。
#   usaspending —— 第三条数据源：美国联邦采购（分包 = 一级供应关系）。
#              选它是因为适用范围与 Form SD 正交，能补金融／房地产／公用事业
#              那几个 Form SD 结构上永远够不着的板块。
#   nolist  —— 「有申报但没抽到名单」151 家的申报文件清单。查这一档是制度上限
#              还是抽取器漏看（PDF 附件、名字以 0 开头、只看最大 4 份）。
#   flow    —— 物流通道层。IMF PortWatch、纽约联储 GSCPI、世界银行与 FRED 政府口径序列。
#   foreign —— 公司池的边界。现在池子是标普 500，单一国家指数，画不出全球产业链。
#              MSCI ACWI／S&P Global 1200 因成分股专有、再分发要授权而走不通；
#              SEC 外国私人发行人（20-F／40-F）是许可干净的替代。**要查的关键不是
#              够不够得到那些公司，是它们申不申报 Form SD**——申报才同时带来边。
#
# 许可是本领域的主要风险：BDI、Drewry WCI、Freightos FBX、Xeneta、ISM 供应商交付
# 全是商业授权，与仓库已因许可放弃的 SPX／DXY／LBMA 定盘价同类。报告里 [!!] 标记的
# 就是「技术上取得到但不许登记」的那一类，必须在落地前拦下。
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: '抽取器 dry-run 的公司（逗号分隔；写 ALL 扫全部 495 家）'
        required: false
        default: 'AAPL,NVDA,AVGO,AMAT,SWKS,TSLA,INTC,MSFT,KO,GM'
      limit:
        description: 'dry-run 最多处理几家（tickers 留空时生效）'
        required: false
        default: '0'
      quarters:
        description: '外国发行人探针回溯几个季度的 EDGAR 全量索引'
        required: false
        default: '4'
      extra_ciks:
        description: 'dry-run 临时追加不在公司池里的公司，格式 代码:CIK，逗号分隔'
        required: false
        default: ''
      body_tickers:
        description: 'body 探针要点开哪几家的申报正文（逗号分隔）'
        required: false
        default: 'LMT,ACN,DHR,MCD'
      only:
        description: '只跑哪些 job（graph/supplier/usaspending/nolist/body/extract/flow/foreign/foreignfetch；留空跑全部）'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: supply-chain-source-probe
  cancel-in-progress: false

jobs:
  graph:
    name: 公司图谱 · EDGAR 关系抽取可行性
    if: ${{ inputs.only == '' || contains(inputs.only, 'graph') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 先跑离线校验：抽取规则退化的话，联网探测的结论也没有意义。
      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Probe EDGAR relationship extraction
        env:
          # SEC 要求 User-Agent 声明身份与联系方式。留空则使用站点联系页；
          # 项目所有者可在仓库变量里设为申报用邮箱。脚本不硬编码任何个人邮箱。
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PROBE_OUTPUT: /tmp/supply-chain-probe/edgar.json
        run: python scripts/supply-chain/probe_edgar_relationships.py

      # 反查：不指望对方主动写客户名，改为拿确定的名字去搜谁提到它。
      # 首轮否决了逐家解析 10-K 的做法（见 docs/SUPPLY_CHAIN_GRAPH.md 第 8.5 节）。
      # 单独一步：正查失败不影响反查取证，反之亦然。
      - name: Probe EDGAR full-text reverse lookup
        if: ${{ !cancelled() }}
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PROBE_OUTPUT: /tmp/supply-chain-probe/edgar-reverse.json
        run: python scripts/supply-chain/probe_edgar_fulltext_reverse.py

      # Form SD 冲突矿产：有强制格式的结构化披露，冶炼厂名单里的实体是具名的，
      # 不像客户集中度那样匿名。正查与反查都否决后，这是仍可能产出真边的一条。
      - name: Probe Form SD conflict minerals
        if: ${{ !cancelled() }}
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PROBE_OUTPUT: /tmp/supply-chain-probe/edgar-formsd.json
        run: python scripts/supply-chain/probe_form_sd.py

      - name: Upload EDGAR probe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-edgar-${{ github.run_attempt }}
          path: /tmp/supply-chain-probe/edgar*.json
          if-no-files-found: warn
          retention-days: 7

  # 第二条数据源的可行性探测：公司自己发布的供应商名单。
  # 冶炼厂那层是第三层、语义是「出现在供应链中」；一级供应商 SEC 给不了，
  # 但公司自己会发布（苹果前 200 大供应商、耐克制造工厂地图）。
  # 只读，不写任何数据文件，不建任何边——先探后建。
  supplier:
    name: 供应商名单 · 第二条源可行性
    if: ${{ inputs.only == '' || contains(inputs.only, 'supplier') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Probe company-published supplier lists
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PROBE_OUTPUT: /tmp/supply-chain-probe/supplier-lists.json
        run: python scripts/supply-chain/probe_supplier_lists.py

      - name: Upload supplier list probe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-supplier-${{ github.run_attempt }}
          path: /tmp/supply-chain-probe/supplier-lists.json
          if-no-files-found: warn
          retention-days: 7

  # 第三条源：美国联邦采购。**它的价值在于适用范围与 Form SD 正交。**
  # 按板块拆开覆盖率之后看得很清楚：金融 0/70、房地产 0/29、公用事业 1/32——
  # 这些 0 不是抓取失败，Form SD 只管产品里含 3TG 的发行人，银行没有产品。
  # 要补这几个板块只能换源，而联邦采购管的是「谁向政府卖了什么」，与矿无关。
  # 真正想要的是 FFATA 强制披露的**分包**（总包商 → 分包商），那是一级供应关系。
  usaspending:
    name: 联邦采购 · 第三条源可行性
    if: ${{ inputs.only == '' || contains(inputs.only, 'usaspending') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Probe USAspending federal procurement
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/supply-chain/probe_usaspending.py

  # 「有申报但没抽到名单」那 151 家，名单到底在不在申报里。
  # 这一档是甲（本来就没列，制度上限）还是乙（在里面但抽取器没看到，是缺陷），
  # 差别是「这条源到头了」还是「还有 151 家可以补」——只能看真实文件清单。
  nolist:
    name: 有申报无名单 · 151 家的文件清单
    if: ${{ inputs.only == '' || contains(inputs.only, 'nolist') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: List documents of filings with no smelter table
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: python scripts/supply-chain/probe_form_sd_no_list.py

  # 点开指定几家申报的**每一份文档正文**。nolist 那条只列文件清单，回答不了
  # 「文件里到底有没有名单」——洛马／埃森哲／丹纳赫的报告 33–34KB 却 <table>0，
  # 只数标签只能说明「没有 HTML 表格」，不能说明「没有名单」：名单可能排成
  # 段落或列表，也可能是张图。麦当劳那份 493KB 的 PDF 同理，现有规则整份跳过。
  # **先探后建**：接 PDF 之前先看清 PDF 里有没有东西。
  body:
    name: 有申报无名单 · 点开正文看名单在不在
    if: ${{ inputs.only == '' || contains(inputs.only, 'body') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Print raw document bodies of selected filings
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          python scripts/supply-chain/probe_form_sd_body.py \
            --tickers '${{ inputs.body_tickers }}' --max-docs 3

  # Form SD 抽取器上线前的人工核对关口。**dry-run，不写任何文件。**
  # 上一轮的教训：探针的自动结论说「可进入抽取器开发」，但把抽出来的名字打出来
  # 逐条看，6 家里有 3 家是噪声。自动判定不能代替核对，所以这一步只负责把真实
  # 解析结果打到日志里给人看，是否接入发布由人决定。
  extract:
    name: Form SD 抽取器 · dry-run 人工核对
    if: ${{ inputs.only == '' || contains(inputs.only, 'extract') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 解析规则先过离线夹具。夹具挂了就没必要联网。
      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Extract Form SD smelter lists (dry run)
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          python scripts/supply-chain/extract_form_sd.py \
            --dry-run \
            --tickers '${{ inputs.tickers }}' \
            --extra-ciks '${{ inputs.extra_ciks }}' \
            --limit '${{ inputs.limit }}' \
            --sample-rows 12

  flow:
    name: 物流通道 · 来源可用性与许可
    if: ${{ inputs.only == '' || contains(inputs.only, 'flow') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Probe candidate supply chain sources
        env:
          PROBE_OUTPUT: /tmp/supply-chain-probe/flow.json
        run: python scripts/supply-chain/probe_supply_chain_sources.py

      - name: Upload flow probe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-flow-${{ github.run_attempt }}
          path: /tmp/supply-chain-probe/flow.json
          if-no-files-found: warn
          retention-days: 7

  # 外国发行人取数的 dry-run 核对。**不写任何文件**，把选出来的主代码、SIC、
  # 国别打到日志里给人看。撞码是这一步唯一会造成真实损害的事故（一家美国公司的
  # 节点被外国公司顶掉），所以核对的重点是「跳过了哪几家、为什么跳」。
  foreignfetch:
    name: 外国发行人池 · 取数 dry-run
    if: ${{ inputs.only == '' || contains(inputs.only, 'foreignfetch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Fetch foreign issuer identity (dry run)
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
        run: |
          python scripts/supply-chain/fetch_foreign_identity.py \
            --dry-run --quarters '${{ inputs.quarters }}'

  # 公司池的边界。**「扩池只增加节点，不增加边」是这一步最大的风险**，
  # 所以这个探针的核心输出只有一个数：外国发行人里同时报 Form SD 的有几家。
  # 那个数大，扩池就同时长节点和边；小，就得先解决边的来源，不是先扩池。
  # 顺带把 SEC 够不到的那几家（三星、宁德时代、西门子、施耐德、LVMH）按名字
  # 在全量登记名录里搜一遍——搜不到就是这条路的硬上限，要报出来，不能藏。
  foreign:
    name: 公司池边界 · 外国私人发行人能不能当母池
    if: ${{ inputs.only == '' || contains(inputs.only, 'foreign') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 索引解析错一行不会报错，只会悄悄少算一家。先过离线夹具。
      - name: Validate extraction rules (offline)
        run: python scripts/validate_supply_chain_extraction.py

      - name: Probe SEC foreign private issuers
        env:
          SEC_CONTACT: ${{ vars.SEC_CONTACT }}
          PROBE_OUTPUT: /tmp/supply-chain-probe/foreign-issuers.json
          PROBE_QUARTERS: ${{ inputs.quarters }}
        run: python scripts/supply-chain/probe_foreign_issuers.py

      - name: Upload foreign issuer probe report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: supply-chain-foreign-${{ github.run_attempt }}
          path: /tmp/supply-chain-probe/foreign-issuers.json
          if-no-files-found: warn
          retention-days: 7
