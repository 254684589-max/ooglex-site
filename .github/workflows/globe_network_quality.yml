name: Globe Network Quality

on:
  push:
    branches: ['codex/globe-*']
    paths: ['apps/globe/**', 'scripts/globe/**', '.github/workflows/globe_network_quality.yml']
  pull_request:
    paths: ['apps/globe/**', 'scripts/globe/**', '.github/workflows/globe_network_quality.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: globe-network-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GLOBE_WORK_DIR: /tmp/ooglex-globe-build
      GLOBE_UPSTREAM_DIR: /tmp/ooglex-globe-build/src
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install existing upstream verification dependencies
        run: |
          mkdir -p "$GLOBE_UPSTREAM_DIR"
          git -C "$GLOBE_UPSTREAM_DIR" init -q
          git -C "$GLOBE_UPSTREAM_DIR" remote add origin https://github.com/bilawalsidhu/gods-eye-view
          git -C "$GLOBE_UPSTREAM_DIR" fetch --depth 1 origin 844c25212c06cfa26ff6c0f3cb82bc9c325f4a85
          git -C "$GLOBE_UPSTREAM_DIR" checkout -q FETCH_HEAD
          npm ci --prefix "$GLOBE_UPSTREAM_DIR" --ignore-scripts --no-audit --no-fund
      - name: Syntax and existing data checks
        run: |
          git diff --check HEAD~1 HEAD
          bash -n scripts/globe/build.sh
          node --check scripts/globe/network-policy.js
          node --check scripts/globe/patch-network.mjs
          node --check scripts/globe/verify-network.mjs
          node --check scripts/globe/browser.mjs
          node --check apps/globe/app/assets/index-B3EcAr3J.js
          python3 scripts/globe/test_fetch_space_data.py
      - name: Verify committed site with all external requests stalled
        run: node scripts/globe/verify-network.mjs
      - name: Rebuild from pinned upstream with the same policy
        run: bash scripts/globe/build.sh
      - name: Verify rebuilt artifact startup
        env:
          GLOBE_VERIFY_QUICK: '1'
        run: node scripts/globe/verify-network.mjs
      - name: Existing Chinese UI and accessibility regression
        run: |
          python3 -m http.server 8902 --bind 127.0.0.1 > "$RUNNER_TEMP/globe-http.log" 2>&1 &
          GLOBE_VERIFY_URL=http://127.0.0.1:8902 node scripts/globe/verify.mjs
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: globe-network-evidence
          path: artifacts/globe
          retention-days: 7
