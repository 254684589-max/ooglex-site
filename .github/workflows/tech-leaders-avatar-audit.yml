name: Tech Leaders Avatar Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths:
      - 'apps/tech-leaders/leaders.json'
      - 'scripts/tech-leaders/sync_avatars.py'
      - 'scripts/tech-leaders/warm_avatars.py'
      - 'cloudflare/pro-api/worker.js'
      - '.github/workflows/tech-leaders-avatar-audit.yml'

permissions:
  contents: write

concurrency:
  group: tech-leaders-avatar-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Wait for avatar policy deployment
        run: |
          set -e
          ready=0
          for i in $(seq 1 60); do
            body="$(curl -fsS --connect-timeout 5 --max-time 12 https://pro-api.ooglex.com/v1/tech-leaders/status 2>/dev/null || true)"
            if echo "$body" | grep -q '"avatar_policy":"x_original_then_verified_fallback"' \
              && echo "$body" | grep -q '"avatar_cache_version":"v6-x-current-first"'; then
              echo "Avatar backend V6 X-first cache is ready."
              ready=1
              break
            fi
            echo "Waiting for avatar backend V6 X-first cache ($i/60)..."
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "::error::Avatar backend V6 X-first cache did not become ready in time"
            exit 1
          fi

      - name: Audit and synchronize avatars
        run: |
          python scripts/tech-leaders/sync_avatars.py \
            --catalog apps/tech-leaders/leaders.json \
            --base-url https://pro-api.ooglex.com \
            --audit-out apps/tech-leaders/avatar-audit.json \
            --write-catalog \
            --workers 4 \
            --retries 3

      - name: Validate generated JSON
        run: |
          python -m json.tool apps/tech-leaders/leaders.json >/dev/null
          python -m json.tool apps/tech-leaders/avatar-audit.json >/dev/null

      - name: Commit audit metadata
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/tech-leaders/leaders.json apps/tech-leaders/avatar-audit.json
          if git diff --cached --quiet; then
            echo "No avatar metadata changes."
            exit 0
          fi
          git commit -m "chore: sync Tech Leaders avatar audit [skip ci]"
          # Multiple Tech Leaders generators can finish at nearly the same time.
          # Keep each workflow independent, then retry a rejected main push after
          # rebasing onto the newest remote main. This avoids both lost writes
          # and GitHub concurrency-group pending-run cancellation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase generated artifact commit onto main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to push generated artifact after 5 attempts"
          exit 1
