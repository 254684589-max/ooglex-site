permissions:
  actions: read
  contents: read

concurrency:
  group: finance-terminal-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate data and adapters
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal.py

      - name: Validate staged data loading
        if: ${{ !cancelled() }}
        run: node scripts/validate_finance_terminal_loader.mjs

      - name: Validate per-record market data quality
        if: ${{ !cancelled() }}
        run: python scripts/validate_market_data_quality.py --dataset all

      - name: Validate source health and write diagnostics
        if: ${{ !cancelled() }}
        run: python scripts/validate_market_source_health.py --dataset all --report /tmp/finance-terminal-health/source-health.json

      - name: Validate macro source health and write diagnostics
        if: ${{ !cancelled() }}
        run: python scripts/validate_macro_source_health.py --report /tmp/finance-terminal-health/macro-source-health.json

      - name: Validate supporting source health and write diagnostics
        if: ${{ !cancelled() }}
        run: python scripts/validate_supporting_source_health.py --dataset all --report /tmp/finance-terminal-health/supporting-source-health.json

      - name: Validate supporting source failure retention
        if: ${{ !cancelled() }}
        run: python scripts/validate_supporting_source_builders.py

      - name: Validate market workflow governance
        if: ${{ !cancelled() }}
        run: python scripts/validate_market_workflow_governance.py --dataset all

      - name: Validate Beta release gate contracts
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_release_gate.py

      - name: Validate market public-display authorization contracts
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_market_licenses.py

      - name: Validate static stable V1 evidence snapshot
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_readiness_snapshot.py

      - name: Validate stable V1 qualification orchestration
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_qualification.py

      - name: Validate distinct stable V1 observation cycles
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_cycle_trigger.py

      - name: Validate supporting source qualification orchestration
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_supporting_qualification.py

      - name: Validate proxy runtime history contracts
        if: ${{ !cancelled() }}
        run: python scripts/validate_finance_terminal_proxy_runtime_history.py

      - name: Ensure CJK font for readable screenshots
        if: ${{ !cancelled() }}
        run: |
          if ! fc-list :lang=zh | grep -q .; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fi

      - name: Validate rendered page in Chrome
        if: ${{ !cancelled() }}
        run: |
          node scripts/validate_finance_terminal_browser_evidence.mjs
          node scripts/validate_finance_terminal_browser.mjs --artifacts-dir /tmp/finance-terminal-browser

      - name: Build bounded proxy runtime history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/finance_terminal_proxy_runtime_history.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --current-evidence /tmp/finance-terminal-browser/finance-terminal-browser-evidence.json \
            --output-json /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.json \
            --output-markdown /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.md

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-responsive-${{ github.run_attempt }}
          path: /tmp/finance-terminal-browser/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Upload proxy runtime evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-proxy-runtime-${{ github.run_attempt }}
          path: |
            /tmp/finance-terminal-browser/finance-terminal-browser-evidence.json
            /tmp/finance-terminal-browser/finance-terminal-browser-evidence.md
            /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.json
            /tmp/finance-terminal-browser/finance-terminal-proxy-runtime-history.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload source health diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finance-terminal-source-health-${{ github.run_attempt }}
          path: /tmp/finance-terminal-health/*.json
          if-no-files-found: error
          retention-days: 14
