name: Tech Leaders Candidate Queue

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/tech-leaders/issuer_master.csv"
      - "apps/tech-leaders/leaders.json"
      - "scripts/tech-leaders/build_candidate_queue.py"
      - ".github/workflows/tech-leaders-candidate-queue.yml"

permissions:
  contents: write

concurrency:
  group: tech-leaders-candidate-queue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build multi-person research queue
        run: |
          python scripts/tech-leaders/build_candidate_queue.py

      - name: Validate queue
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          q = Path("data/tech-leaders/executive_candidate_queue.csv")
          m = Path("data/tech-leaders/executive_candidate_queue.meta.json")
          issuer_meta = json.loads(Path("data/tech-leaders/issuer_master.meta.json").read_text(encoding="utf-8"))
          rows = list(csv.DictReader(q.open(encoding="utf-8")))
          meta = json.loads(m.read_text(encoding="utf-8"))

          assert len(rows) == meta["issuer_count"]
          assert len(rows) >= 250
          if issuer_meta.get("stage") == "v1_1_universe_1000":
              assert len(rows) >= 900
          assert meta["research_now_count"] >= min(250, len(rows))
          assert meta["policy"]["multi_person_per_issuer"] is True
          assert meta["policy"]["existing_issuer_considered_complete"] is False
          assert all(r["review_status"] in {"expand_existing", "needs_research"} for r in rows)
          assert all(r["discovery_mode"] == "multi_person_current_and_legacy" for r in rows)
          assert all(r["target_roles"] for r in rows)
          assert not any(r["x_identity_status"] == "verified" and not r["x_identity_source_url"] for r in rows)
          print(json.dumps(meta, ensure_ascii=False))
          PY

      - name: Commit refreshed review queue
        run: |
          if [ -z "$(git status --porcelain -- data/tech-leaders/executive_candidate_queue.csv data/tech-leaders/executive_candidate_queue.meta.json)" ]; then
            echo "No candidate queue changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tech-leaders/executive_candidate_queue.csv data/tech-leaders/executive_candidate_queue.meta.json
          git commit -m "data: refresh tech-leaders multi-person candidate queue"
          # Multiple Tech Leaders generators can finish at nearly the same time.
          # Keep each workflow independent, then retry a rejected main push after
          # rebasing onto the newest remote main. This avoids both lost writes
          # and GitHub concurrency-group pending-run cancellation.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Unable to rebase generated artifact commit onto main"
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Unable to push generated artifact after 5 attempts"
          exit 1
