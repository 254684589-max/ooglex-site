name: Import ACCAD motion data
on:
  push:
    branches: [agent/motion-studio-accad-v457]
    paths:
      - '.github/workflows/motion-accad-import.yml'
      - 'motion-studio/tools/import_accad.py'
      - 'motion-studio/tools/audit_accad.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/agent/motion-studio-accad-v457'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            motion-studio
      - name: Fetch and validate official BVH archives
        run: |
          python3 -m py_compile motion-studio/tools/import_accad.py
          if test -s motion-studio/assets/accad/manifest.json; then
            echo "Using committed ACCAD source data"
            exit 0
          fi
          passed=0
          for pack in Male2_bvh.zip Male1_bvh.zip Female1_bvh.zip; do
            if python3 motion-studio/tools/import_accad.py --pack "$pack"; then
              passed=$((passed+1))
            else
              echo "::warning::Unable to import $pack"
            fi
          done
          test "$passed" -gt 0
      - name: Audit all committed motion frames and generate pose thumbnails
        run: python3 motion-studio/tools/audit_accad.py
      - name: Commit validated data to integration branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motion-studio/assets/accad
          git diff --cached --quiet && exit 0
          git commit -m "data(motion): import validated ACCAD BVH assets"
          git pull --rebase origin agent/motion-studio-accad-v457
          git push origin HEAD:agent/motion-studio-accad-v457
