<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ooglex Motion Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10151d;color:#e2e8f0;font:14px system-ui,sans-serif}
header{padding:20px 24px;border-bottom:1px solid #303a46}
header a{color:#91b9c9;text-decoration:none}
h1{font-size:22px;margin:12px 0}
small,p{color:#93a5b7;line-height:1.7}
main{display:grid;grid-template-columns:280px 1fr;min-height:75vh}
aside{padding:20px;border-right:1px solid #303a46}
button,select{background:#202c39;color:#e2e8f0;border:1px solid #405364;padding:10px;border-radius:6px;cursor:pointer}
button{margin:4px 0}
label{display:block;margin:12px 0}
#files button{display:block;width:100%;text-align:left;overflow-wrap:anywhere}
#viewer{height:65vh;min-height:350px}
#viewer canvas{display:block;width:100%;height:100%}
.controls{padding:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#timeline{flex:1;min-width:100px;accent-color:#61c2b5}
#status{padding:0 15px;color:#93c7bf}
@media(max-width:700px){
main{display:flex;flex-direction:column-reverse}
aside{border-right:0}
#viewer{height:55vh}
}
</style>
<script type="importmap">
{
  "imports":{
    "three":"./vendor/build/three.module.js"
  }
}
</script>
</head>
<body>
<header>
<a href="/">← OOGLEX 首页</a>
<h1>OOGLEX MOTION STUDIO</h1>
<small>AI 3D动作资产中心 · 在线展示版</small>
</header>
<main>
<aside>
<h3>动作资产</h3>
<p>导入自己的GLB动画文件，仅在浏览器本地读取，不上传服务器。</p>
<label>选择动作文件
<input type="file" id="upload" accept=".glb" multiple>
</label>
<label>选择整个动作目录
<input type="file" id="directory" webkitdirectory multiple>
</label>
<p id="count">本地动作：0</p>
<div id="files"></div>
</aside>
<section>
<div id="viewer"></div>
<div class="controls">
<button id="play">播放 / 暂停</button>
<button id="reset">重置视角</button>
<select id="clips"></select>
<select id="speed">
<option value="0.25">0.25倍速</option>
<option value="0.5">0.5倍速</option>
<option value="1" selected>1倍速</option>
<option value="2">2倍速</option>
</select>
<input id="timeline" type="range" min="0" max="1000" value="0">
</div>
<p id="status">正在加载标准机器人……</p>
</section>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
