:root{color-scheme:dark;background:#10151b;color:#e7edf4;font:14px/1.5 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;border-bottom:1px solid #344251}main{display:grid;grid-template-columns:165px minmax(0,1fr) minmax(340px,1fr)}aside,section{padding:18px;min-width:0}aside{border-right:1px solid #344251}aside a{display:block;padding:9px;margin-bottom:8px;border:1px solid #344251;border-radius:6px}aside .active{background:#203b3a}a{color:#7ee0cf}input,button,select{font:inherit;color:inherit;background:#202a35;border:1px solid #344251;border-radius:6px;padding:8px;max-width:100%}button{cursor:pointer}button:disabled{opacity:.5}h1,h2{margin:0 0 12px}p{color:#a4b5c5}#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:8px;margin:16px 0}.clip{text-align:left;overflow-wrap:anywhere}.clip small{display:block;color:#98a9b9}.preview{background:#151e29;border-left:1px solid #344251}#viewer{height:clamp(270px,45vh,550px);width:100%}#viewer canvas{display:block}.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}#timeline,#search{width:100%;accent-color:#7ee0cf}.error{color:#ffb3a5}@media(max-width:800px){main{grid-template-columns:minmax(0,1fr)}aside{display:flex;gap:8px;flex-wrap:wrap;border:0}.preview{grid-row:2}}
</style><script type="importmap">{"imports":{"three":"./vendor/build/three.module.js"}}</script></head><body><header><strong>OOGLEX · 动作工作室 V4.6.4.1</strong></header><main><aside><a href="./index.html">Quaternius · 86</a><a href="./kaykit.html">KayKit · 161</a><a href="./accad.html">ACCAD · 299</a><a href="./kinemiq.html">KinemIQ · 35</a><a href="./mesh2motion.html">Mesh2Motion</a><a class="active" href="./100style.html">100STYLE</a></aside><section><h1>100STYLE 真人风格录制</h1><p>来自 Ian Mason、Sebastian Starke、Taku Komura 的 CC BY 4.0 原始数据。风格名并不表示独立的格斗招式；每个条目是一段未裁剪录制。</p><input id="search" type="search" placeholder="搜索风格或原始文件名"><p id="status">载入真实清单…</p><div id="cards"></div><p><a href="https://zenodo.org/records/8127870">官方原始数据与许可</a> · <a href="./assets/research/100style-inventory.json">完整目录审计</a></p></section><section class="preview"><h2 id="name">选择录制</h2><div id="viewer"></div><input id="timeline" type="range" min="0" max="0" step="1" value="0" disabled><div class="controls"><button id="play" disabled>播放</button><label><input type="checkbox" id="loop" checked>循环</label><select id="speed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option><option value="2">2倍</option></select><span id="time"></span></div><p id="details"></p><p class="error" id="error" role="alert"></p><p><a id="download" hidden>下载原始 BVH</a>　<a id="credit" hidden>下载署名</a></p><p>仅原始骨架预览，未做蒙皮重定向、动作切割或足部 IK。</p></section></main><script type="module">
import * as T from 'three';import {OrbitControls} from './vendor/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id);const scene=new T.Scene();scene.background=new T.Color(0x151e29);const camera=new T.PerspectiveCamera(42,1,.01,100);camera.position.set(3,2,4);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('viewer').append(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,1,0);controls.update();scene.add(new T.GridHelper(12,24,0x485663,0x344251));let group=new T.Group();scene.add(group);let records=[],model=null,lines=null,playing=false,elapsed=0,prior=performance.now(),token=0,creditUrl=null;
function parseBVH(text){
const halves=text.split(/\bMOTION\b/);if(halves.length!==2)throw Error('缺少 MOTION');const tok=halves[0].match(/[{}]|[^\s{}]+/g)||[];let i=0,channels=0;const nodes=[];
function take(expected){const v=tok[i++];if(v===undefined||(expected&&v!==expected))throw Error('BVH 层级格式错误');return v;}
function number(){const n=Number(take());if(!Number.isFinite(n))throw Error('非法数值');return n;}
function joint(parent,kind){const name=kind==='End'?(take('Site'),'End Site'):take();take('{');take('OFFSET');const offset=[number(),number(),number()];const n={name,parent,offset,channels:[],start:channels};const index=nodes.push(n)-1;
if(kind!=='End'){take('CHANNELS');const count=number();if(!Number.isInteger(count)||count<0||count>6)throw Error('非法通道');for(let k=0;k<count;k++){const c=take();if(!/^[XYZ](position|rotation)$/.test(c))throw Error('不支持的通道 '+c);n.channels.push(c);channels++;}}
while(tok[i]!==' }'.trim()){const k=take();if(k!=='JOINT'&&k!=='End')throw Error('未知层级 '+k);joint(index,k);}take('}');}
take('HIERARCHY');take('ROOT');joint(-1,'ROOT');if(i!==tok.length)throw Error('多余层级');
const m=halves[1].match(/Frames:\s*(\d+)\s+Frame Time:\s*([0-9.eE+-]+)\s*/);if(!m)throw Error('缺少帧头');const frames=Number(m[1]),dt=Number(m[2]),values=halves[1].slice(m.index+m[0].length).trim().split(/\s+/).map(Number);
if(frames<2||!(dt>0&&dt<1)||values.length!==frames*channels||values.some(v=>!Number.isFinite(v)))throw Error('帧数据不完整');
return {nodes,frames,dt,channels,values,duration:(frames-1)*dt};}

function pose(frame){if(!model)return;for(const n of model.nodes){const o=n.object;o.position.fromArray(n.offset);o.quaternion.identity();for(let k=0;k<n.channels.length;k++){const c=n.channels[k],v=model.values[frame*model.channels+n.start+k],axis=c[0].toLowerCase();if(c.endsWith('position'))o.position[axis]+=v;else o.quaternion.multiply(new T.Quaternion().setFromAxisAngle(new T.Vector3(axis==='x'?1:0,axis==='y'?1:0,axis==='z'?1:0),v*Math.PI/180));}}group.updateMatrixWorld(true);if(lines){const a=lines.geometry.attributes.position,v=new T.Vector3();let k=0;for(const n of model.nodes){if(n.parent>=0){n.object.getWorldPosition(v);a.setXYZ(k++,v.x,v.y,v.z);model.nodes[n.parent].object.getWorldPosition(v);a.setXYZ(k++,v.x,v.y,v.z);}}a.needsUpdate=true;}}
function mount(next){if(lines){scene.remove(lines);lines.geometry.dispose();lines.material.dispose();lines=null;}group.clear();group.position.set(0,0,0);group.scale.setScalar(1);model=next;for(const n of model.nodes){n.object=new T.Object3D();(n.parent<0?group:model.nodes[n.parent].object).add(n.object);}pose(0);const box=new T.Box3();for(const n of model.nodes)box.expandByPoint(n.object.getWorldPosition(new T.Vector3()));const size=box.getSize(new T.Vector3()),center=box.getCenter(new T.Vector3()),scale=1.8/Math.max(size.x,size.y,size.z,.001);group.scale.setScalar(scale);group.position.set(-center.x*scale,-box.min.y*scale,-center.z*scale);lines=new T.LineSegments(new T.BufferGeometry().setAttribute('position',new T.BufferAttribute(new Float32Array((model.nodes.length-1)*6),3)),new T.LineBasicMaterial({color:0xffce65}));lines.frustumCulled=false;scene.add(lines);elapsed=0;playing=true;pose(0);$('timeline').max=model.frames-1;$('timeline').disabled=false;$('play').disabled=false;$('play').textContent='暂停';}
function list(){const q=$('search').value.toLowerCase();$('cards').replaceChildren();for(const x of records.filter(x=>(x.name+' '+x.style).toLowerCase().includes(q))){const b=document.createElement('button');b.className='clip';b.textContent=x.name;const s=document.createElement('small');s.textContent=x.style+' · '+x.duration.toFixed(2)+'秒';b.append(s);b.onclick=()=>select(x);$('cards').append(b);}}
async function select(x){const id=++token;$('error').textContent='';try{const res=await fetch(x.path);if(!res.ok)throw Error('HTTP '+res.status);const bytes=await res.arrayBuffer(),hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),n=>n.toString(16).padStart(2,'0')).join('');if(hash!==x.sha256)throw Error('SHA-256 不符');const m=parseBVH(new TextDecoder().decode(bytes));if(m.frames!==x.frames||Math.abs(m.dt-x.frameTime)>1e-8)throw Error('帧信息不符');if(id!==token)return;mount(m);$('name').textContent=x.name;$('details').textContent=m.frames+' 帧 · '+(1/m.dt).toFixed(2)+' FPS · '+m.duration.toFixed(2)+' 秒 · 原始骨架';$('download').href=x.path;$('download').download=x.name+'.bvh';$('download').hidden=false;if(creditUrl)URL.revokeObjectURL(creditUrl);creditUrl=URL.createObjectURL(new Blob([x.author+' · 100STYLE\n'+x.source+'\nCC BY 4.0 https://creativecommons.org/licenses/by/4.0/\nOriginal: '+x.original+'\nNo changes to original recording.'],{type:'text/plain'}));$('credit').href=creditUrl;$('credit').download=x.name+'-ATTRIBUTION.txt';$('credit').hidden=false;}catch(e){if(id===token)$('error').textContent='加载失败：'+e.message;}}
$('search').oninput=list;$('play').onclick=()=>{if(!model)return;if(!playing&&elapsed>=model.duration)elapsed=0;playing=!playing;$('play').textContent=playing?'暂停':'播放';};$('timeline').oninput=()=>{if(model)elapsed=Number($('timeline').value)*model.dt;};new ResizeObserver(()=>{const w=$('viewer').clientWidth,h=$('viewer').clientHeight;if(w&&h){renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}}).observe($('viewer'));
function tick(now){requestAnimationFrame(tick);const delta=Math.min((now-prior)/1000,.1);prior=now;if(model){if(playing){elapsed+=delta*Number($('speed').value);if(elapsed>=model.duration){if($('loop').checked)elapsed%=model.duration;else{elapsed=model.duration;playing=false;$('play').textContent='播放';}}}const frame=Math.min(model.frames-1,Math.floor(elapsed/model.dt+1e-7));pose(frame);$('timeline').value=frame;$('time').textContent=elapsed.toFixed(2)+' / '+model.duration.toFixed(2)+' 秒';}controls.update();renderer.render(scene,camera);}requestAnimationFrame(tick);
try{const res=await fetch('./assets/100style/manifest.json');if(!res.ok)throw Error('尚未入库');const m=await res.json();if(m.schema!=='ooglex.100style.v1'||!m.records.length)throw Error('清单无效');records=m.records;$('status').textContent=records.length+' 段原始录制 · 非独立武术动作计数';list();}catch(e){$('status').textContent='尚无已验证录制：'+e.message;}
</script></body></html>
