name = "ooglex-jamendo-proxy"
main = "worker.js"
compatibility_date = "2026-10-21"
workers_dev = true

# 自定义域名：workers.dev 在中国大陆基本打不开，所以绑定 ooglex.com 下的子域名。
# 部署时由 wrangler 在现有 Cloudflare 区内创建这条主机记录（与 sec-facts.ooglex.com 同一做法）。
# workers.dev 地址保留，作为 global.json 的 apiFallback。
[[routes]]
pattern = "music-api.ooglex.com"
custom_domain = true

# client_id 不写在这里：wrangler secret put JAMENDO_CLIENT_ID

[vars]
# 浏览器页面来源。本地 127.0.0.1 / localhost 在代码里另外放行，方便验收。
ALLOWED_ORIGINS = "https://www.ooglex.com,https://ooglex.com"
