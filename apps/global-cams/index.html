<script>
/* PWA：注册 Service Worker + 「安装 App」按钮。
   支持一键安装的浏览器（安卓 Chrome / Edge、电脑 Chrome）直接弹安装框；
   其余（如 iPhone Safari）跳到 APK 下载页（含未知来源步骤，以及 Safari 添加到主屏幕；没有 IPA）。
   已安装后以独立窗口打开时不显示按钮。 */
(function(){
  'use strict';
  var standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.matchMedia('(display-mode: minimal-ui)').matches ||
                   window.navigator.standalone === true;
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js?v=4', { scope: './', updateViaCache: 'none' }).catch(function(){});
    });
  }
  var btn = document.getElementById('installApp');
  if (!btn || standalone) return;
  var deferred = null;
  btn.hidden = false;
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferred = e;
  });
  window.addEventListener('appinstalled', function(){
    deferred = null;
    btn.hidden = true;
  });
  btn.addEventListener('click', function(){
    if (!deferred) {
      location.href = '/apps/global-cams/download/';
      return;
    }
    var prompt = deferred;
    deferred = null;
    prompt.prompt();
    prompt.userChoice.then(function(choice){
      if (choice && choice.outcome === 'accepted') btn.hidden = true;
    }).catch(function(){});
  });
})();
</script>
