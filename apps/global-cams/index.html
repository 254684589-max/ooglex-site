<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环球实景 · Ooglex</title>
<meta name="description" content="转动 3D 地球，查看全球公开摄像头与实时实景。">
<link rel="canonical" href="https://www.ooglex.com/apps/global-cams/">
<meta property="og:type" content="website">
<meta property="og:title" content="环球实景 · Ooglex">
<meta property="og:description" content="转动 3D 地球，按当前区域加载全球公开摄像头与实时实景。">
<meta property="og:url" content="https://www.ooglex.com/apps/global-cams/">
<meta property="og:image" content="https://www.ooglex.com/assets/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:#0b1020;--panel2:#10172a;--line:#24304a;--line2:#344463;--text:#eef3ff;--muted:#9aa8c3;--faint:#6f7d98;--accent:#4ee7b7;--accent2:#1ca77f;--warn:#ffd36b;--danger:#ff9b9b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input{font:inherit}button{color:inherit}
button,a,input{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-shell{display:grid;grid-template-columns:380px minmax(0,1fr);width:100%;height:100vh}
.sidebar{min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0f1d,#080c16);border-right:1px solid var(--line);overflow:hidden;z-index:10}
.side-head{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;white-space:nowrap}.brand span{color:var(--accent);font-size:13px;margin-left:4px}
.side-head .live{margin-left:auto;font-size:10px;letter-spacing:.12em;color:var(--accent);border:1px solid rgba(78,231,183,.28);padding:5px 7px;border-radius:999px}
.selected{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.selected-title{margin:0 0 4px;font-size:17px;line-height:1.35;max-height:46px;overflow:hidden}
.selected-meta{min-height:18px;color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:9px}
.viewer{position:relative;aspect-ratio:16/9;background:#02040a;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center}
.viewer iframe,.viewer img{width:100%;height:100%;border:0;object-fit:cover}.viewer a{width:100%;height:100%;display:block}
.viewer-empty{padding:20px;line-height:1.7}
.selected-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--line2)}.btn.primary{background:#12382f;border-color:#246b59}.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.attribution{margin-top:8px;color:var(--faint);font-size:10.5px;line-height:1.45}.attribution a{color:var(--muted)}
.playlist-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.playlist-head strong{font-size:14px}.playlist-head span{color:var(--muted);font-size:11px}.playlist-head .spacer{flex:1}
.clear-mini{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:5px 7px;border-radius:8px}.clear-mini:hover{background:var(--panel2);color:var(--text)}
.playlist{flex:1;min-height:0;overflow:auto;padding:0 8px 12px;scrollbar-width:thin;scrollbar-color:#33415d transparent}
.cam-row{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);padding:9px 9px;cursor:pointer}
.cam-row:hover{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.04)}
.cam-row.active{background:rgba(78,231,183,.09);border-color:rgba(78,231,183,.34)}
.cam-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#d8e2f2;box-shadow:0 0 0 3px rgba(216,226,242,.08)}
.cam-row.playable .cam-dot{background:var(--accent);box-shadow:0 0 0 3px rgba(78,231,183,.09)}
.cam-main{min-width:0}.cam-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam-sub{margin-top:3px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-list{padding:28px 16px;color:var(--muted);text-align:center;font-size:12px;line-height:1.7}
.stage{position:relative;min-width:0;overflow:hidden;background:#05070f}
#globe{position:absolute;inset:0}
.topbar{position:absolute;z-index:7;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.search{flex:1;min-width:160px;max-width:430px;background:rgba(5,7,15,.84);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;padding:0 12px}
.search input{width:100%;height:42px;border:0;background:transparent;color:var(--text);font-size:13px}
.toolbar-btn,.count,.toggle{height:42px;display:inline-flex;align-items:center;justify-content:center;background:rgba(5,7,15,.84);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;color:var(--text)}
.toolbar-btn{padding:0 13px;cursor:pointer;white-space:nowrap}.toolbar-btn:hover{border-color:var(--accent)}
.toolbar-btn:disabled{opacity:.6;cursor:wait}.count{padding:0 11px;color:var(--muted);font-size:12px;white-space:nowrap}
.toggle{gap:7px;padding:0 10px;color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}.toggle input{accent-color:var(--accent)}
.status{position:absolute;z-index:6;top:66px;left:14px;max-width:min(660px,calc(100% - 28px));padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,15,.82);color:var(--muted);font-size:11.5px;line-height:1.45;backdrop-filter:blur(12px)}
.status[data-kind="live"]{color:var(--accent)}.status[data-kind="warn"]{color:var(--warn)}.status[data-kind="error"]{color:var(--danger)}
.center-readout{position:absolute;z-index:5;left:50%;bottom:17px;transform:translateX(-50%);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(5,7,15,.72);color:var(--muted);font-size:10.5px;pointer-events:none;white-space:nowrap}
.crosshair{position:absolute;z-index:4;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);border:1px solid rgba(255,255,255,.54);border-radius:50%;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 20px rgba(255,255,255,.12)}
.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,255,255,.58)}
.crosshair:before{width:12px;height:1px;left:11px;top:17px}.crosshair:after{width:1px;height:12px;left:17px;top:11px}
.globe-tools{position:absolute;z-index:7;right:14px;bottom:14px;display:grid;gap:8px}
.tool-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(5,7,15,.84);backdrop-filter:blur(12px);color:var(--text);font-size:18px;cursor:pointer}.tool-btn:hover{border-color:var(--accent)}
.legend{position:absolute;z-index:5;left:14px;bottom:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,15,.72);color:var(--muted);font-size:10.5px;pointer-events:none}
@media(max-width:1050px){.app-shell{grid-template-columns:340px minmax(0,1fr)}.toggle span{display:none}.count{display:none}}
@media(max-width:820px){
  .app-shell{grid-template-columns:1fr;grid-template-rows:55vh 45vh;grid-template-areas:"stage" "sidebar"}
  .stage{grid-area:stage}.sidebar{grid-area:sidebar;border-right:0;border-top:1px solid var(--line)}
  .side-head{padding:8px 10px 7px}.brand{font-size:16px}.selected{display:grid;grid-template-columns:minmax(150px,42%) minmax(0,1fr);grid-template-rows:auto auto 1fr;gap:0 10px;padding:8px 10px}
  .selected-title{grid-column:2;margin-top:1px;font-size:14px}.selected-meta{grid-column:2;margin-bottom:5px;font-size:10.5px}.viewer{grid-column:1;grid-row:1/4;align-self:start}
  .selected-actions{grid-column:2;margin-top:2px}.selected-actions .btn{min-height:32px;font-size:11px}.attribution{display:none}
  .playlist-head{padding:7px 10px 5px}.playlist{padding:0 5px 8px}.cam-row{padding:7px 8px}.cam-name{font-size:12px}
  .topbar{top:8px;left:8px;right:8px;gap:5px;flex-wrap:wrap}.search{order:3;flex-basis:100%;max-width:none}.search input{height:36px}.toolbar-btn,.toggle{height:36px;font-size:11px;padding:0 9px}.status{top:87px;left:8px;max-width:calc(100% - 16px);font-size:10.5px}
  .globe-tools{right:8px;bottom:8px;gap:6px}.tool-btn{width:38px;height:38px}.legend{display:none}.center-readout{bottom:10px;font-size:9.5px}
}
@media(max-width:480px){.selected{grid-template-columns:130px minmax(0,1fr)}.selected-actions{grid-template-columns:1fr}.selected-actions .btn{min-height:29px;padding:5px}.toolbar-btn[data-short="hide-mobile"]{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" aria-label="摄像头播放列表">
    <div class="side-head">
      <div class="brand">🌐 环球实景 <span>V0.3</span></div>
      <span class="live">PUBLIC CAMS</span>
    </div>
    <section class="selected" aria-live="polite">
      <h2 class="selected-title" id="camName">选择一个公开摄像头</h2>
      <div class="selected-meta" id="camMeta">点地球上的信号点，或从下方播放列表选择。</div>
      <div class="viewer" id="viewer"><div class="viewer-empty">摄像头画面将在这里播放</div></div>
      <div class="selected-actions">
        <a class="btn primary" id="openSource" href="#" target="_blank" rel="noopener" aria-disabled="true">打开官方来源</a>
        <button class="btn" id="expandViewer" type="button">放大画面</button>
      </div>
      <div class="attribution" id="attribution">仅展示主动公开发布的户外摄像头；画面与版权归原始提供方。</div>
    </section>
    <div class="playlist-head">
      <strong>播放列表</strong>
      <span id="listCount">0 个信号源</span>
      <span class="spacer"></span>
      <button class="clear-mini" id="clearAll" type="button">清空</button>
    </div>
    <div class="playlist" id="playlist" role="listbox" aria-label="已加载摄像头">
      <div class="empty-list">正在连接公开摄像头服务…</div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div id="globe"></div>
    <div class="topbar">
      <div class="search"><input id="search" aria-label="搜索已加载摄像头" placeholder="搜索国家、城市、摄像头…"></div>
      <button class="toolbar-btn" id="loadNearby" type="button">加载当前区域</button>
      <label class="toggle" title="开启后，新加载区域会与现有点位合并">
        <input id="accumulate" type="checkbox">
        <span>累计区域</span>
      </label>
      <button class="toolbar-btn" id="resetView" type="button" data-short="hide-mobile">回到东京</button>
      <div class="count" id="count">0 个公开点位</div>
    </div>
    <div class="status" id="status" data-kind="live">正在连接真实公开摄像头服务…</div>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="center-readout" id="centerCoords">查询中心 · —</div>
    <div class="globe-tools" aria-label="地球视图控制">
      <button class="tool-btn" id="zoomIn" type="button" title="放大地球" aria-label="放大地球">＋</button>
      <button class="tool-btn" id="zoomOut" type="button" title="缩小地球" aria-label="缩小地球">−</button>
      <button class="tool-btn" id="resetGlobe" type="button" title="重置视角" aria-label="重置视角">⌂</button>
      <button class="tool-btn" id="fullscreen" type="button" title="全屏" aria-label="全屏">⛶</button>
    </div>
    <div class="legend">🟢 可播放/预览　⚪ 来源页　· 中心准星 = 当前区域查询中心</div>
  </main>
</div>
<script src="../radio/vendor/globe.gl.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
