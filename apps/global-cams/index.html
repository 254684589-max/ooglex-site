<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环球实景 WINDOW · Ooglex</title>
<meta name="description" content="在 3D 地球上浏览全球 WINDOW 沉浸窗口，播放精选城市、海岸、山景、雨雪与夜景视频。">
<link rel="canonical" href="https://www.ooglex.com/apps/global-cams/">
<meta property="og:type" content="website">
<meta property="og:title" content="环球实景 WINDOW · Ooglex">
<meta property="og:description" content="全球 WINDOW 沉浸窗口：城市、海岸、山景、雨雪与夜景。">
<meta property="og:url" content="https://www.ooglex.com/apps/global-cams/">
<meta property="og:image" content="https://www.ooglex.com/assets/og-cover.png">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:#0b1020;--panel2:#10172a;--line:#24304a;--line2:#344463;--text:#eef3ff;--muted:#9aa8c3;--faint:#6f7d98;--accent:#68a8ff;--accent2:#2d6ec7;--warn:#ffd36b;--danger:#ff9b9b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
button,input{font:inherit}button{color:inherit}button,a,input{outline:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app-shell{display:grid;grid-template-columns:380px minmax(0,1fr);width:100%;height:100vh}
.sidebar{min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#0a0f1d,#080c16);border-right:1px solid var(--line);overflow:hidden;z-index:10}
.side-head{display:flex;align-items:center;gap:10px;padding:14px;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:19px;white-space:nowrap}.brand span{color:#4ee7b7;font-size:13px;margin-left:4px}
.window-only{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#cfe1ff;border:1px solid rgba(104,168,255,.38);padding:5px 8px;border-radius:999px;background:rgba(16,29,53,.7)}
.selected{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.selected-title{margin:0 0 4px;font-size:17px;line-height:1.35;max-height:46px;overflow:hidden}
.selected-meta{min-height:18px;color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:9px}
.viewer{position:relative;aspect-ratio:16/9;background:#02040a;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center;color:var(--faint);font-size:13px;text-align:center}
.viewer video{width:100%;height:100%;border:0;object-fit:cover;background:#000}.viewer-empty{padding:20px;line-height:1.7}
.viewer-controls{position:absolute;z-index:9;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:8px;border:1px solid rgba(104,168,255,.34);border-radius:14px;background:rgba(5,7,15,.86);backdrop-filter:blur(16px);box-shadow:0 12px 34px rgba(0,0,0,.28)}
.viewer:fullscreen .viewer-controls,.viewer:-webkit-full-screen .viewer-controls,.viewer.is-expanded .viewer-controls{display:flex}.viewer:fullscreen video,.viewer:-webkit-full-screen video,.viewer.is-expanded video{object-fit:contain}
.viewer.is-expanded{position:fixed;inset:0;z-index:1000;width:100vw;height:100dvh;max-width:none;aspect-ratio:auto;border:0;border-radius:0;background:#000}
.viewer-control{height:42px;min-width:88px;padding:0 14px;border:1px solid var(--line2);border-radius:10px;background:#10172a;color:var(--text);font-weight:700;cursor:pointer;white-space:nowrap;touch-action:manipulation}.viewer-control:hover{border-color:var(--accent)}.viewer-control.random{background:#11213b;border-color:#37679f}.viewer-control.close{min-width:74px;background:#17131a;border-color:#5b3a48;color:#ffd9e1}.viewer-control.close:hover{border-color:#b76078}.viewer-control[disabled]{opacity:.45;cursor:not-allowed}
.media-badge{position:absolute;z-index:3;top:8px;left:8px;display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border:1px solid rgba(104,168,255,.55);border-radius:999px;background:rgba(16,29,53,.88);backdrop-filter:blur(8px);font-size:10px;font-weight:800;letter-spacing:.04em;color:#dbeaff;pointer-events:none}
.media-badge[data-empty="true"]{display:none}
.selected-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--line2)}.btn.primary{background:#101d35;border-color:#2e5a92}.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.attribution{margin-top:8px;color:var(--faint);font-size:10.5px;line-height:1.45}.attribution a{color:var(--muted)}
.playlist-head{display:flex;align-items:center;gap:8px;padding:10px 14px 8px}
.playlist-head strong{font-size:14px}.playlist-head span{color:var(--muted);font-size:11px}.playlist-head .spacer{flex:1}
.random-mini{border:1px solid var(--line);background:#0d1424;color:var(--muted);cursor:pointer;padding:5px 8px;border-radius:8px;font-size:10.5px}.random-mini:hover{border-color:var(--accent);color:var(--text)}
.playlist-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding:0 10px 9px}
.sort-btn{min-height:34px;border:1px solid var(--line);border-radius:9px;background:#0d1424;color:var(--muted);font-size:11px;font-weight:700;cursor:pointer}
.sort-btn:hover{border-color:var(--line2);color:var(--text)}.sort-btn.active{border-color:var(--accent);background:#101d35;color:#fff}
.sort-btn .sort-note{display:block;margin-top:1px;font-size:8.5px;font-weight:500;opacity:.68}
.playlist{flex:1;min-height:0;overflow:auto;padding:0 8px 12px;scrollbar-width:thin;scrollbar-color:#33415d transparent}
.window-row{width:100%;display:grid;grid-template-columns:18px minmax(0,1fr);gap:9px;text-align:left;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text);padding:9px;cursor:pointer}
.window-row:hover{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.04)}
.window-row.active{background:rgba(104,168,255,.1);border-color:rgba(104,168,255,.36)}
.window-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;background:#68a8ff;box-shadow:0 0 0 3px rgba(104,168,255,.12)}
.window-main{min-width:0}.window-name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.window-sub{margin-top:3px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty-list{padding:28px 16px;color:var(--muted);text-align:center;font-size:12px;line-height:1.7}
.stage{position:relative;min-width:0;overflow:hidden;background:#05070f}#globe{position:absolute;inset:0}
.topbar{position:absolute;z-index:7;top:14px;left:14px;right:14px;display:flex;gap:8px;align-items:center;pointer-events:none}.topbar>*{pointer-events:auto}
.search{flex:1;min-width:160px;max-width:430px;background:rgba(5,7,15,.84);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;padding:0 12px}
.search input{width:100%;height:42px;border:0;background:transparent;color:var(--text);font-size:13px}
.toolbar-btn,.count{height:42px;display:inline-flex;align-items:center;justify-content:center;background:rgba(5,7,15,.84);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;color:var(--text)}
.toolbar-btn{padding:0 13px;cursor:pointer;white-space:nowrap}.toolbar-btn:hover{border-color:var(--accent)}.count{padding:0 11px;color:var(--muted);font-size:12px;white-space:nowrap}
.status{position:absolute;z-index:6;top:66px;left:14px;max-width:min(660px,calc(100% - 28px));padding:8px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,15,.82);color:#9fc6ff;font-size:11.5px;line-height:1.45;backdrop-filter:blur(12px)}
.status[data-kind="warn"]{color:var(--warn)}.status[data-kind="error"]{color:var(--danger)}
.center-readout{position:absolute;z-index:5;left:50%;bottom:17px;transform:translateX(-50%);padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(5,7,15,.72);color:var(--muted);font-size:10.5px;pointer-events:none;white-space:nowrap}
.crosshair{position:absolute;z-index:6;left:0;top:0;width:44px;height:44px;transform:translate(-50%,-50%);border:1px solid rgba(255,211,107,.92);border-radius:50%;pointer-events:none;opacity:0;box-shadow:0 0 0 4px rgba(255,211,107,.12),0 0 24px rgba(255,211,107,.34);transition:opacity .16s ease}
.crosshair.active{opacity:1}.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(255,211,107,.92)}.crosshair:before{width:14px;height:1px;left:14px;top:21px}.crosshair:after{width:1px;height:14px;left:21px;top:14px}
.globe-tools{position:absolute;z-index:7;right:14px;bottom:14px;display:grid;gap:8px}
.tool-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(5,7,15,.84);backdrop-filter:blur(12px);color:var(--text);font-size:18px;cursor:pointer}.tool-btn:hover{border-color:var(--accent)}
.legend{position:absolute;z-index:5;left:14px;bottom:14px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(5,7,15,.72);color:var(--muted);font-size:10.5px;pointer-events:none}
@media(max-width:1050px){.app-shell{grid-template-columns:340px minmax(0,1fr)}.count{display:none}}
@media(max-width:820px){
  html,body{height:auto;min-height:100%;overflow:auto}
  .app-shell{display:flex;flex-direction:column;width:100%;height:100dvh;min-height:100dvh;overflow:auto}
  .sidebar{order:1;flex:0 0 auto;overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .stage{order:2;flex:0 0 48vh;min-height:340px;overflow:hidden}
  .side-head{padding:10px 12px 8px}.brand{font-size:16px}.selected{display:block;padding:10px 12px 11px}
  .selected-title{margin:0 0 4px;font-size:15px;line-height:1.35;max-height:none}.selected-meta{margin-bottom:8px;font-size:11px;line-height:1.45}.viewer{width:100%;border-radius:12px}
  .selected-actions{grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.selected-actions .btn{min-height:40px;padding:7px 8px;font-size:12px}.attribution{display:none}
  .playlist-head{padding:10px 12px 7px}.playlist-tabs{padding:0 10px 8px;gap:5px}.sort-btn{min-height:36px;font-size:10.5px}.playlist{flex:none;max-height:36vh;padding:0 7px 10px}.window-row{padding:9px}.window-name{font-size:12.5px}
  .topbar{top:8px;left:8px;right:8px;gap:5px;flex-wrap:wrap}.search{order:2;flex-basis:100%;max-width:none}.search input{height:38px}.count{display:flex;height:34px;font-size:10.5px}.status{top:92px;left:8px;max-width:calc(100% - 16px);font-size:10.5px}
  .globe-tools{right:8px;bottom:8px;gap:6px}.tool-btn{width:40px;height:40px}.legend{display:none}.center-readout{bottom:10px;font-size:9.5px}
  .viewer-controls{top:max(8px,env(safe-area-inset-top));left:8px;right:8px;transform:none;justify-content:center;gap:5px;padding:6px}
  .viewer:fullscreen .viewer-controls,.viewer:-webkit-full-screen .viewer-controls,.viewer.is-expanded .viewer-controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
  .viewer-control{min-width:0;height:42px;padding:0 5px;font-size:11px;border-radius:9px}.viewer-control.close{grid-column:auto;height:42px}
}
@media(max-width:480px){
  .window-only{display:none}.selected{padding:9px 10px 10px}.selected-actions{grid-template-columns:1fr 1fr}.selected-actions .btn{min-height:40px;padding:6px}
  .playlist{max-height:38vh}.stage{flex-basis:44vh;min-height:320px}
  .viewer-controls{left:6px;right:6px;gap:4px;padding:5px}.viewer-control{height:40px;padding:0 3px;font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="WINDOW 播放列表">
    <div class="side-head">
      <div class="brand">🌐 环球实景 <span>V1.1</span></div>
      <span class="window-only">WINDOW ONLY</span>
    </div>
    <section class="selected" aria-live="polite">
      <h2 class="selected-title" id="windowName">选择一个沉浸窗口</h2>
      <div class="selected-meta" id="windowMeta">点击地球上的蓝色点，或从下方 WINDOW 播放列表选择。</div>
      <div class="viewer" id="viewer"><div class="media-badge" id="mediaBadge" data-empty="true">WINDOW</div><div class="viewer-empty">WINDOW 视频将在这里播放</div></div>
      <div class="selected-actions">
        <a class="btn primary" id="openSource" href="#" target="_blank" rel="noopener" aria-disabled="true">查看素材来源</a>
        <button class="btn" id="expandViewer" type="button">放大画面</button>
      </div>
      <div class="attribution" id="attribution">WINDOW 为许可预录视频；页面使用中文展示名；原始标题、作者、来源与许可证信息完整保留。</div>
    </section>
    <div class="playlist-head">
      <strong>WINDOW 播放列表</strong>
      <span id="listCount">0 个窗口</span>
      <span class="spacer"></span>
    </div>
    <div class="playlist-tabs" id="playlistTabs" aria-label="WINDOW 排序">
      <button class="sort-btn active" type="button" data-sort="featured">精选<span class="sort-note">质量优先</span></button>
      <button class="sort-btn" type="button" data-sort="latest">最新<span class="sort-note">新加入</span></button>
      <button class="sort-btn" type="button" data-sort="popular">热门<span class="sort-note">近 7 天</span></button>
    </div>
    <div class="playlist" id="playlist" role="listbox" aria-label="WINDOW 窗口列表">
      <div class="empty-list">正在加载 WINDOW 窗口库…</div>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div id="globe"></div>
    <div class="topbar">
      <div class="search"><input id="search" aria-label="搜索 WINDOW" placeholder="搜索国家、城市、景观…"></div>
      <div class="count" id="count">0 个 WINDOW</div>
    </div>
    <div class="status" id="status">正在连接 WINDOW 视频库…</div>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="center-readout" id="centerCoords">视图中心 · —</div>
    <div class="globe-tools" aria-label="地球视图控制">
      <button class="tool-btn" id="zoomIn" type="button" title="放大地球" aria-label="放大地球">＋</button>
      <button class="tool-btn" id="zoomOut" type="button" title="缩小地球" aria-label="缩小地球">−</button>
      <button class="tool-btn" id="resetGlobe" type="button" title="重置视角" aria-label="重置视角">⌂</button>
      <button class="tool-btn" id="fullscreen" type="button" title="全屏" aria-label="全屏">⛶</button>
    </div>
    <div class="legend">🔵 WINDOW = 精选许可沉浸视频 · 点击蓝色点播放</div>
  </main>
</div>
<script src="../radio/vendor/globe.gl.min.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
