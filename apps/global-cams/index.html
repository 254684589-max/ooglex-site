<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>环球实景 · Ooglex</title>
<meta name="description" content="转动 3D 地球，查看全球公开摄像头与实时实景。">
<style>
:root{color-scheme:dark;--bg:#05070f;--panel:#0b1020;--line:#24304a;--text:#eef3ff;--muted:#9aa8c3;--accent:#4ee7b7}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
#globe{position:fixed;inset:0}
.topbar{position:fixed;z-index:5;top:14px;left:14px;right:14px;display:flex;gap:10px;align-items:center;pointer-events:none}
.brand,.search,.count{pointer-events:auto;background:rgba(5,7,15,.78);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px}
.brand{padding:10px 13px;font-weight:700}.brand span{color:var(--accent)}
.search{flex:1;max-width:420px;padding:0 12px}.search input{width:100%;height:42px;border:0;outline:0;background:transparent;color:var(--text);font-size:14px}
.count{padding:10px 12px;color:var(--muted);font-size:13px}
.panel{position:fixed;z-index:6;right:16px;top:72px;width:min(390px,calc(100vw - 32px));max-height:calc(100vh - 88px);overflow:auto;background:rgba(7,11,24,.92);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;padding:14px;display:none}
.panel.open{display:block}.panel h2{margin:0 0 6px;font-size:18px}.meta{color:var(--muted);font-size:13px;margin-bottom:12px}
.viewer{aspect-ratio:16/9;background:#02040a;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:grid;place-items:center}
.viewer iframe,.viewer img{width:100%;height:100%;border:0;object-fit:cover}
.actions{display:flex;gap:8px;margin-top:12px}.btn{flex:1;text-align:center;text-decoration:none;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#10172a}
.btn.primary{background:#12382f;border-color:#246b59}.legend{position:fixed;left:14px;bottom:14px;z-index:5;background:rgba(5,7,15,.78);border:1px solid var(--line);border-radius:12px;padding:9px 11px;color:var(--muted);font-size:12px}
@media(max-width:700px){.count{display:none}.panel{top:auto;bottom:12px;right:12px;left:12px;width:auto;max-height:52vh}.brand{font-size:14px}.topbar{right:12px;left:12px}}
</style>
</head>
<body>
<div id="globe"></div>
<div class="topbar">
  <div class="brand">🌐 环球实景 <span>V0.1</span></div>
  <div class="search"><input id="search" placeholder="搜索国家、城市、摄像头…"></div>
  <div class="count" id="count">载入中…</div>
</div>
<div class="panel" id="panel">
  <h2 id="camName">摄像头</h2>
  <div class="meta" id="camMeta"></div>
  <div class="viewer" id="viewer">选择地球上的摄像头点位</div>
  <div class="actions">
    <a class="btn primary" id="openSource" target="_blank" rel="noopener">打开官方来源</a>
    <button class="btn" id="closePanel">关闭</button>
  </div>
</div>
<div class="legend">🟢 可播放/预览　⚪ 公开来源页 · 仅收录主动公开发布的摄像头</div>
<script src="../radio/vendor/globe.gl.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
