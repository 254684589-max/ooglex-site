<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公司供应链视图 · 全球产业链</title>
<meta name="description" content="查看单家标普500公司在全球产业链中的位置：SEC 官方 SIC 行业码判定的价值链环节、同行业同环节公司，以及可核验的原始申报出处。">
<link rel="canonical" href="https://www.ooglex.com/apps/supply-chain/company.html">
<meta name="robots" content="noindex">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0d13; --card:#141922; --line:rgba(255,255,255,0.09);
    --text:#eaf0f3; --dim:#93a0b2; --faint:#5f6c7e; --accent:#4a90d9;
    --up:#3fae7d; --down:#e0554f; --warn:#e4b53d;
    --s1:#c98b4b; --s2:#4a90d9; --s3:#7d6fd1; --s4:#3fae7d; --s5:#3aa8b8; --s6:#6b7a8d;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  body {
    min-height:100vh; color:var(--text);
    background:
      radial-gradient(820px 420px at 10% -8%, rgba(201,139,75,0.12), transparent 60%),
      radial-gradient(760px 400px at 92% 4%, rgba(74,144,217,0.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.55; overflow-x:hidden;
  }
  .page { max-width:1180px; margin:0 auto; padding:18px 16px 72px; }
  header { display:flex; align-items:center; margin-bottom:12px; }
  header a { color:var(--accent); text-decoration:none; font-size:0.95rem;
    min-height:44px; display:inline-flex; align-items:center; padding-right:12px; }
  header a:hover { opacity:.78; }
  a:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  .glass { background:linear-gradient(180deg, rgba(22,27,37,.94), rgba(16,20,28,.94));
    border:1px solid var(--line); border-radius:18px;
    box-shadow:0 24px 60px -34px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05); }
  .chip { font-size:.62rem; letter-spacing:.3px; padding:1px 5px; border-radius:3px;
    border:1px solid rgba(228,181,61,.45); color:var(--warn); white-space:nowrap; }
  .chip.ok { border-color:rgba(63,174,125,.45); color:#3fae7d; }
  .mono { font-family:var(--mono); font-variant-numeric:tabular-nums; }

  /* 身份条 */
  .ident { display:flex; align-items:center; gap:14px; margin-bottom:12px; flex-wrap:wrap; }
  .ident .zh { font-size:1.5rem; font-weight:800; }
  .ident .en { color:var(--dim); font-size:.85rem; }
  .facts { display:flex; gap:7px; margin-left:auto; flex-wrap:wrap; }
  .fact { font-size:.72rem; color:var(--dim); border:1px solid var(--line);
    border-radius:999px; padding:3px 11px; }
  .fact b { color:var(--text); }

  .notice { padding:12px 15px; border-left:3px solid var(--warn); margin-bottom:13px; }
  .notice h2 { font-size:.88rem; font-weight:700; color:#f0cf85; margin-bottom:4px; }
  .notice p { font-size:.8rem; color:var(--dim); }

  /* 视图切换 */
  .seg { display:inline-flex; padding:3px; gap:3px; border-radius:11px;
    border:1px solid var(--line); background:rgba(255,255,255,.03); }
  .seg button { appearance:none; border:0; background:transparent; color:var(--dim);
    font:inherit; font-size:.82rem; padding:7px 17px; border-radius:8px; cursor:pointer;
    min-height:44px; display:inline-flex; align-items:center; gap:7px; }
  .seg button:hover { color:var(--text); }
  .seg button[aria-pressed="true"] { background:rgba(74,144,217,.16); color:var(--text);
    box-shadow:inset 0 0 0 1px rgba(74,144,217,.42); }
  .viewhint { font-size:.75rem; color:var(--faint); }

  .cols { display:grid; grid-template-columns:1fr 318px; gap:14px; align-items:start; }
  /* 网格子项默认 min-width:auto，会被内容的最小宽度撑开。主栏里放了
     auto-fill 的冶炼厂清单之后，360px 下整列被撑到 441px、页面横向溢出 93px。
     显式 min-width:0 让它可以收缩。 */
  .cols > * { min-width:0; }
  .stagefig { padding:14px; min-height:470px; }
  /* 说明放在层级卡下方的正常流里。曾经用绝对定位钉在右下角，
     结果压在第三张卡片上——截图才看得出来。 */
  .fignote { margin-top:10px; text-align:right; }
  /* 图注里的 chip 装的是一整句话，不是短标签。.chip 的 nowrap 会让它在
     360px 下拉成 411px 宽、把页面撑出 78px 横向滚动。这里允许换行。 */
  .fignote .chip { white-space:normal; display:inline-block; text-align:left;
    line-height:1.55; max-width:100%; }

  /* 冶炼厂清单：多列排布，几百条也能一屏看个大概 */
  .smelters { padding:14px 16px; margin-top:14px; }
  /* min(230px,100%)：窄屏下单列可以窄于 230px，不会因为轨道下限而撑破容器。
     只加 .cols>*{min-width:0} 不够——那只解决外层收缩，轨道本身仍不肯变窄。 */
  .smelters .grid { display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));
    gap:2px 18px; }
  .smelters .grid > * { min-width:0; }
  .sm .nm { overflow-wrap:anywhere; }
  .sm { padding:6px 0; border-bottom:1px solid var(--line); }
  .sm .nm { font-size:.78rem; line-height:1.45; color:var(--text);
    text-decoration:none; display:inline; }
  a.sm-nm:hover { color:var(--accent); }
  .sm .meta { font-size:.69rem; color:var(--dim); margin-top:1px; }
  .sm .meta .cid { font-family:var(--mono); color:var(--faint); }

  /* 可选中的层级卡 */
  .picks { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px; }
  .pick { display:block; width:100%; text-align:left; appearance:none; font:inherit; color:inherit;
    cursor:pointer; border-radius:13px; padding:10px 12px; min-height:44px;
    background:linear-gradient(180deg, rgba(22,27,37,.94), rgba(16,20,28,.94)); }
  .pick.demo { border:1px dashed rgba(228,181,61,.4); background:rgba(228,181,61,.045); }
  .pick.demo[aria-pressed="true"] { border:1px dashed rgba(228,181,61,.85); background:rgba(228,181,61,.11); }
  .pick.real { border:1px solid rgba(63,174,125,.3); }
  .pick.real[aria-pressed="true"] { border:1px solid rgba(63,174,125,.62); background:rgba(63,174,125,.10); }
  .pick .hd { display:flex; align-items:center; gap:7px; margin-bottom:2px; }
  .pick .hd b { font-size:.83rem; }
  .pick .role { font-size:.7rem; color:var(--dim); }

  .side { display:flex; flex-direction:column; gap:11px; }
  .side h3 { font-size:.86rem; font-weight:700; margin-bottom:8px; }
  .kv { display:flex; justify-content:space-between; gap:8px; font-size:.75rem;
    color:var(--dim); padding:3px 0; }
  .peer { display:flex; align-items:center; gap:8px; padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.045); font-size:.79rem; }
  .peer:last-child { border-bottom:none; }
  .peer a { color:var(--text); text-decoration:none; flex:1; }
  .peer a:hover { color:var(--accent); }
  .peer .sym { font-family:var(--mono); font-size:.72rem; color:var(--faint); }

  .state { padding:26px 16px; text-align:center; color:var(--dim); font-size:.9rem; }
  .state.err { color:#f3a49f; }

  footer { margin-top:26px; text-align:center; color:var(--faint); font-size:.75rem; line-height:1.7; }
  footer a { color:var(--dim); text-decoration:none; }

  /* 手机降级：地图/辐射图不适合窄屏，直接不给图，只给层级卡与出处 */
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }
  @media (max-width:560px) {
    .page { padding:14px 12px 60px; }
    .ident .zh { font-size:1.25rem; }
    .facts { margin-left:0; width:100%; }
    .stagefig svg { display:none; }
    .stagefig { min-height:0; }
    .fignote { text-align:left; }
    .picks { grid-template-columns:1fr; }
    .seg { width:100%; }
    .seg button { flex:1; justify-content:center; padding:7px 10px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
  @media (prefers-contrast: more) { :root { --line:rgba(255,255,255,0.28); --dim:#c2ccd8; } }
</style>
</head>
<body>
<div class="page">
  <header><a href="./">← 全球产业链</a></header>

  <div id="body" hidden>
    <div class="ident">
      <div style="display:flex;align-items:baseline;gap:10px;">
        <span class="zh" id="c-zh"></span>
        <span class="en" id="c-en"></span>
      </div>
      <div class="facts" id="c-facts"></div>
    </div>

    <section class="glass notice" aria-label="数据范围声明">
      <h2 id="n-title"></h2>
      <p id="n-body"></p>
    </section>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;">
      <div class="seg" role="group" aria-label="视图切换" id="seg"></div>
      <span class="viewhint" id="viewhint"></span>
    </div>

    <div class="cols">
      <div>
        <div class="glass stagefig" id="fig"></div>
        <!-- 冶炼厂清单放主栏：它是这一页唯一的真实关系数据，一家公司动辄两三百条。
             塞进右侧窄栏会让它变成一个要滚半天的小窗，而左边空着大半屏。 -->
        <div id="smelters"></div>
      </div>
      <div class="side" id="side"></div>
    </div>
  </div>

  <div class="state" id="state">正在加载公司数据…</div>

  <footer>
    <p>数据仅供研究参考，不构成投资建议。</p>
    <p><a href="/privacy/">隐私政策</a> · <a href="/">Ooglex</a></p>
  </footer>
</div>
<script src="company.js" defer></script>
</body>
</html>
