<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="apple-touch-icon" href="/assets/favicon.svg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球产业链 · 标普500公司的价值链位置</title>
<meta name="description" content="标普500成分股按价值链环节分层：上游资源、中间制造、品牌整合、分销服务、平台服务与支持性行业。阶段由 SEC 官方 SIC 行业码判定，逐家可查依据，每日更新。">
<link rel="canonical" href="https://www.ooglex.com/apps/supply-chain/">
<meta property="og:type" content="website">
<meta property="og:title" content="全球产业链 · 标普500公司的价值链位置">
<meta property="og:description" content="标普500成分股按价值链环节分层，阶段由 SEC 官方 SIC 行业码判定，逐家可查依据，每日更新。">
<meta property="og:url" content="https://www.ooglex.com/apps/supply-chain/">

<meta name="twitter:card" content="summary_large_image">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0a0d13; --card:#141922; --line:rgba(255,255,255,0.09);
    --text:#eaf0f3; --dim:#93a0b2; --faint:#5f6c7e; --accent:#4a90d9;
    --up:#3fae7d; --down:#e0554f; --warn:#e4b53d;
    --s1:#c98b4b; --s2:#4a90d9; --s3:#7d6fd1; --s4:#3fae7d; --s5:#3aa8b8; --s6:#6b7a8d;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  body {
    min-height:100vh; color:var(--text);
    background:
      radial-gradient(820px 420px at 10% -8%, rgba(201,139,75,0.12), transparent 60%),
      radial-gradient(760px 400px at 92% 4%, rgba(74,144,217,0.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.55; overflow-x:hidden;
  }
  .page { max-width:1040px; margin:0 auto; padding:18px 16px 72px; }
  header { display:flex; align-items:center; margin-bottom:12px; }
  header a { color:var(--accent); text-decoration:none; font-size:0.95rem;
    min-height:44px; display:inline-flex; align-items:center; padding-right:12px; }
  header a:hover { opacity:.78; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline:2px solid var(--accent); outline-offset:3px; border-radius:6px; }

  .title { text-align:center; margin-bottom:14px; }
  .title h1 { font-size:1.8rem; letter-spacing:1px; font-weight:800;
    background:linear-gradient(92deg,#e0a96a,#4a90d9 55%,#3fae7d);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .title p { color:var(--dim); margin-top:6px; font-size:0.88rem; }
  .statusrow { display:flex; justify-content:center; gap:9px; margin-top:10px; flex-wrap:wrap; }
  .status { display:inline-flex; align-items:center; gap:7px; font-size:0.78rem; padding:4px 13px;
    border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,0.03); color:var(--dim); }
  .status b { color:var(--text); font-weight:600; }

  .glass { background:linear-gradient(180deg, rgba(22,27,37,.94), rgba(16,20,28,.94));
    border:1px solid var(--line); border-radius:18px;
    box-shadow:0 24px 60px -34px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05); }

  /* ── 覆盖率声明：必须一眼看到，不能藏在页脚 ── */
  .notice { padding:14px 16px; margin-bottom:16px; border-left:3px solid var(--warn); }
  .notice h2 { font-size:0.92rem; font-weight:700; color:#f0cf85; margin-bottom:5px; }
  .notice p { font-size:0.82rem; color:var(--dim); }
  .notice p + p { margin-top:5px; }
  .notice code { font-family:var(--mono); font-size:0.78rem; color:var(--text); }

  /* ── 按板块的覆盖情况 ── */
  .cov { padding:14px 16px; margin-bottom:16px; }
  .cov h2 { font-size:0.92rem; font-weight:700; margin-bottom:5px; }
  .cov > p { font-size:0.82rem; color:var(--dim); }
  .cov > p + div { margin-top:11px; }
  .cov > div + p { margin-top:11px; }
  .covrow { display:grid; grid-template-columns:6.2em 1fr 8.5em; gap:9px;
    align-items:center; padding:3px 0; font-size:0.78rem; }
  .covrow .s { color:var(--text); font-weight:600; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .covrow .t { height:7px; border-radius:4px; background:rgba(255,255,255,.07);
    overflow:hidden; display:flex; min-width:0; }
  .covrow .t i { display:block; height:100%; }
  .covrow .n { color:var(--faint); font-variant-numeric:tabular-nums;
    text-align:right; font-family:var(--mono); font-size:0.72rem; }
  .covkey { display:flex; flex-wrap:wrap; gap:5px 13px; margin-top:9px;
    font-size:0.72rem; color:var(--faint); }
  .covkey span { display:inline-flex; align-items:center; gap:5px; }
  .covkey i { width:9px; height:9px; border-radius:2px; flex:none; }
  @media (max-width:520px) {
    .covrow { grid-template-columns:5.2em 1fr; row-gap:2px; }
    .covrow .n { grid-column:2; text-align:left; }
  }

  .sec-h { display:flex; align-items:baseline; gap:10px; margin:22px 2px 10px; flex-wrap:wrap; }
  .sec-h h2 { font-size:1.05rem; font-weight:800; }
  .sec-h span { font-size:0.76rem; color:var(--faint); }

  /* ── 环节卡片：一条链，不是六个并排的方块 ────────────────────────
     旧版把六个环节平铺成六张一样的卡，读出来是六个互不相干的分类。
     实物链四段之间加箭头给出方向；平台服务与支持性行业不在实物流转链条上，
     用虚线分隔另起一组——虚线表示「支持」，不是「流转」。

     箭头用伪元素画在两卡之间的空隙里，**细、无标注、不按粗细编码**：
     站内没有环节到环节的关系数据（20,784 条边全是「公司 → 冶炼厂」），
     给箭头标上流量就是画数据不支持的东西。 */
  .chain { display:grid; gap:26px; grid-template-columns:repeat(4,1fr); }
  .offchain { display:grid; gap:26px; grid-template-columns:repeat(2,1fr); }
  .stage { position:relative; display:flex; flex-direction:column; gap:9px;
    padding:14px 15px 13px; text-align:left; width:100%; cursor:pointer;
    background:linear-gradient(180deg, rgba(22,27,37,.94), rgba(16,20,28,.94));
    border:1px solid var(--line); border-radius:16px; color:inherit; font:inherit;
    min-height:44px; transition:border-color .18s; }
  .stage:hover { border-color:rgba(255,255,255,0.2); }
  .stage[aria-expanded="true"] { border-color:var(--accent); }
  .stage .bar { height:3px; border-radius:2px; }
  /* 标题独占一行、不折行：旧版中英文并排挤掉宽度，四字标题被断成
     「上游资／源」「中间制／造」，这一条最伤专业感。英文降为 mono 小字副行。 */
  .stage .hd { display:flex; flex-direction:column; gap:2px; min-width:0; }
  .stage .nm { font-weight:700; font-size:1.02rem; letter-spacing:-0.01em;
    white-space:nowrap; }
  .stage .en { color:var(--faint); font-weight:400; font-size:0.66rem;
    font-family:var(--mono); letter-spacing:0.04em; line-height:1.3;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 主数字只留家数。旧版每卡三个涨跌数同样大小，六张卡 18 个百分数，
     一眼扫过去抓不住任何一个；另两个口径移到展开后的面板里，不丢。 */
  .stage .big { font-family:var(--mono); font-size:1.62rem; font-weight:600;
    font-variant-numeric:tabular-nums; line-height:1.05; }
  .stage .big s { text-decoration:none; font-size:0.8rem; color:var(--faint);
    margin-left:3px; }
  .stage .desc { color:var(--dim); font-size:0.74rem; line-height:1.45; }
  .stage .mcap { height:4px; border-radius:2px; background:rgba(255,255,255,0.07);
    overflow:hidden; }
  .stage .mcap i { display:block; height:100%; }
  .stage .foot { display:flex; justify-content:space-between; align-items:baseline;
    gap:8px; font-family:var(--mono); font-size:0.72rem; color:var(--faint);
    line-height:1.2; font-variant-numeric:tabular-nums; }
  .stage .foot b { font-weight:600; }
  .stage .note { color:var(--faint); font-size:0.7rem; line-height:1.45; }

  .chain .stage + .stage::before {
    content:""; position:absolute; left:-22px; top:50%;
    width:15px; height:1px; background:var(--faint); transform:translateY(-50%);
  }
  .chain .stage + .stage::after {
    content:""; position:absolute; left:-12px; top:50%;
    width:5px; height:5px; border-top:1.2px solid var(--faint);
    border-right:1.2px solid var(--faint);
    transform:translateY(-50%) rotate(45deg);
  }
  .offlabel { display:flex; align-items:center; gap:9px; margin:20px 2px 11px;
    font-family:var(--mono); font-size:0.68rem; color:var(--faint);
    letter-spacing:0.1em; }
  .offlabel::after { content:""; flex:1; height:1px;
    border-top:1px dashed rgba(255,255,255,0.16); }
  .up { color:var(--up); } .down { color:var(--down); } .flat { color:var(--dim); }

  @media (max-width:860px) {
    .chain { grid-template-columns:repeat(2,1fr); }
    /* 两列时第 3 张卡换行到下一行，行首那张不该带箭头 */
    .chain .stage:nth-child(3)::before,
    .chain .stage:nth-child(3)::after { display:none; }
  }
  @media (max-width:520px) {
    .chain, .offchain { grid-template-columns:1fr; gap:10px; }
    .chain .stage + .stage::before, .chain .stage + .stage::after { display:none; }
  }

  /* ── 环节的细分构成：SIC 两位大类 ──────────────────────────────
     「中间制造 142 家」说不出这 142 家是什么。按 SEC 官方 SIC 行业码展开，
     宽度即家数，同一环节内部的轻重立刻分得开。点一格筛出该组公司。
     分组只是把 SEC 的码换成中文名，不改归属，逐家可核验。 */
  .segwrap { padding:12px 15px 14px; border-bottom:1px solid var(--line); }
  .segwrap .lead { font-size:0.76rem; color:var(--faint); margin-bottom:9px; }
  .segrow { display:flex; gap:3px; }
  /* 宽度按家数，但给一个下限：最小的那几格按比例只有几十像素，标签会被切成
     「金…」「造…」，切掉的字是缺陷。比例略被压缩只是取整误差，
     而且每格都写着确切家数，数字本身从不含糊。 */
  .seg { border-radius:7px; padding:9px 10px 10px; min-width:112px; overflow:hidden;
    border:1px solid transparent; cursor:pointer; text-align:left;
    color:inherit; font:inherit; min-height:44px;
    transition:border-color .16s, background-color .16s; }
  .seg:hover { border-color:rgba(255,255,255,0.28); }
  .seg[aria-pressed="true"] { border-color:var(--accent); }
  .seg .sn { font-size:0.78rem; font-weight:600; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; display:block; }
  .seg .sc { font-family:var(--mono); font-size:0.68rem; opacity:0.75;
    font-variant-numeric:tabular-nums; display:block; margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .segwrap .rest { font-size:0.72rem; color:var(--faint); margin-top:9px; }
  .segwrap .perf2 { display:flex; gap:16px; flex-wrap:wrap; margin-top:11px;
    font-size:0.72rem; color:var(--faint); }
  .segwrap .perf2 b { font-family:var(--mono); font-size:0.86rem; font-weight:700;
    font-variant-numeric:tabular-nums; margin-left:5px; }
  /* 宽度不够时所有格子都会被压到 min-width，比例编码**完全失效**——
     六个等宽的条形什么都没说，长标签还被切。与其留一张失真的图，
     不如换成可读的两列，让每格里的家数文字承担量级。
     阈值取 860px：六格 × 112px 下限 + 间距，再加面板内边距，
     低于这个宽度就排不下一条还算得上比例的条。 */
  @media (max-width:860px) {
    .segrow { flex-wrap:wrap; }
    .seg { flex:1 1 44% !important; }
  }

  /* ── 展开的公司表 ── */
  .panel { margin-top:10px; padding:0; overflow:hidden; }
  .panel[hidden] { display:none !important; }
  .panel .cap { padding:12px 15px; border-bottom:1px solid var(--line);
    font-size:0.82rem; color:var(--dim); }
  .panel .cap b { color:var(--text); }
  .tablewrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:0.83rem; }
  th, td { padding:9px 12px; text-align:left; white-space:nowrap; }
  th { color:var(--faint); font-weight:600; font-size:0.72rem; letter-spacing:.4px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:rgba(18,23,32,.98); }
  tbody tr { border-bottom:1px solid rgba(255,255,255,0.045); }
  tbody tr:last-child { border-bottom:none; }
  td.num { font-family:var(--mono); font-variant-numeric:tabular-nums; text-align:right; }
  td.nm { white-space:normal; min-width:150px; }
  td.nm a.colink { color:var(--text); text-decoration:none;
    display:inline-block; min-height:24px; }
  td.nm a.colink:hover { color:var(--accent); text-decoration:underline; }
  td.nm small { color:var(--faint); display:block; font-size:0.72rem; }
  td.basis { white-space:normal; color:var(--dim); font-size:0.74rem; min-width:200px; max-width:340px; }
  td.basis a { color:var(--accent); text-decoration:none; }
  td.basis a:hover { text-decoration:underline; }
  .more { padding:11px 15px; color:var(--faint); font-size:0.78rem; border-top:1px solid var(--line); }

  /* ── 真实流向：环节 → 冶炼厂所在国别 ──────────────────────────
     **全站唯一一张带子宽度有实测含义的图。** 价值链那条链是定义顺序，
     没有环节到环节的关系数据；真正逐条挂着申报出处的只有「公司 → 冶炼厂」，
     所以能画成流量的只有这一层。 */
  .flowsec { padding:16px 18px 18px; margin-top:10px; }
  .flowsec .lead { font-size:0.8rem; color:var(--dim); margin-bottom:4px; }
  .flowsec .sub2 { font-size:0.74rem; color:var(--faint); margin-bottom:14px; }
  .flowscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .flowscroll svg { display:block; min-width:640px; }
  .flowkey { display:flex; gap:8px 18px; flex-wrap:wrap; margin-top:12px;
    font-size:0.72rem; color:var(--faint); }
  .flowkey span { display:inline-flex; align-items:center; gap:6px; }
  .flowkey i { width:9px; height:9px; border-radius:2px; flex:none;
    background:#2b3441; }

  /* ── 方法与来源 ── */
  details.meth { margin-top:18px; padding:0; }
  details.meth summary { padding:13px 16px; cursor:pointer; font-weight:700; font-size:0.92rem;
    list-style:none; min-height:44px; display:flex; align-items:center; gap:8px; }
  details.meth summary::-webkit-details-marker { display:none; }
  details.meth summary::before { content:"▸"; color:var(--accent); transition:transform .18s; }
  details.meth[open] summary::before { transform:rotate(90deg); }
  details.meth .body { padding:0 16px 15px; font-size:0.82rem; color:var(--dim); }
  details.meth .body p + p { margin-top:8px; }
  details.meth .body b { color:var(--text); }
  details.meth .body ul { margin:7px 0 0 18px; }
  details.meth .body li { margin-bottom:4px; }

  .state { padding:26px 16px; text-align:center; color:var(--dim); font-size:0.9rem; }
  .state.err { color:#f3a49f; }

  footer { margin-top:26px; text-align:center; color:var(--faint); font-size:0.75rem; line-height:1.7; }
  footer a { color:var(--dim); text-decoration:none; }

  @media (max-width:900px) { .chain { grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px) {
    .page { padding:14px 12px 60px; }
    .title h1 { font-size:1.42rem; }
    .chain, .offchain { grid-template-columns:1fr; }
    th, td { padding:8px 10px; }
    td.basis { max-width:none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition:none !important; }
  }
  @media (prefers-contrast: more) {
    :root { --line:rgba(255,255,255,0.28); --dim:#c2ccd8; --faint:#93a0b2; }
  }
</style>
</head>
<body>
<div class="page">
  <header><a href="/">← 返回首页</a></header>

  <div class="title">
    <h1>全球产业链</h1>
    <p>标普500成分股按价值链环节分层 · Global Supply Chain</p>
    <div class="statusrow" id="statusrow"></div>
  </div>

  <section class="glass notice" aria-label="数据范围声明">
    <h2>关于本页数据范围</h2>
    <p id="notice-coverage">本板块只收录有公开出处的信息，<b>不是完整供应链</b>。</p>
    <p id="notice-edges"></p>
    <p id="notice-basis"></p>
  </section>

  <!-- 按板块拆开的覆盖情况。缺口的成因必须按板块讲清楚：金融 0/70 与科技 34/84
       是两种不同的 0，前者是数据源的适用范围决定的，后者是还没抓到。 -->
  <section class="glass cov" id="cov" hidden aria-label="按板块的覆盖情况">
    <h2>为什么有的公司有数据、有的没有</h2>
    <p id="cov-lead"></p>
    <div id="cov-rows"></div>
    <p id="cov-foot"></p>
  </section>

  <div class="sec-h">
    <h2>实物价值链</h2>
    <span>从资源到终端，箭头表示环节顺序 · 点击展开该环节公司与细分构成</span>
  </div>
  <div class="chain" id="chain"></div>

  <div class="offlabel">链外环节 · 不在实物流转链条上</div>
  <div class="offchain" id="offchain"></div>

  <div class="glass panel" id="panel" hidden></div>

  <div class="sec-h">
    <h2>真实流向</h2>
    <span>各环节的公司 → 全球冶炼厂所在国别 · 带子宽度是实测关系条数</span>
  </div>
  <section class="glass flowsec" id="flowsec" hidden aria-label="关系流向">
    <p class="lead" id="flow-lead"></p>
    <p class="sub2" id="flow-sub"></p>
    <div class="flowscroll" id="flow-chart"></div>
    <div class="flowkey" id="flow-key"></div>
  </section>

  <details class="glass meth">
    <summary>数据方法与来源</summary>
    <div class="body" id="method"></div>
  </details>

  <div class="state" id="state">正在加载产业链数据…</div>

  <footer>
    <p>数据仅供研究参考，不构成投资建议。</p>
    <p><a href="/privacy/">隐私政策</a> · <a href="/">Ooglex</a></p>
  </footer>
</div>
<script src="app.js?v=6a736349" defer></script>
</body>
</html>
