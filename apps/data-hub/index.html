<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0b0a10; --ink:#f3f0ea; --dim:#9a94a6; --faint:#645f70;
    --gold:#d9b779; --up:#e2606a; --down:#4bbf9a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  body {
    min-height:100vh; color:var(--ink);
    background:
      radial-gradient(820px 460px at 88% -6%, rgba(217,183,121,.12), transparent 60%),
      radial-gradient(700px 500px at 6% 108%, rgba(120,110,150,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.55; overflow-x:hidden;
  }
  .page { max-width:980px; margin:0 auto; padding:18px 24px 64px; }

  header.top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  header.top a.back { color:var(--gold); text-decoration:none; font-size:0.9rem; }
  header.top a.back:hover { opacity:.8; }

  /* ── masthead：与附图一致，标题 + 一行副文 ── */
  .masthead { padding:22px 0 0; margin:0 0 28px; }
  .masthead h1 { margin:0; font-size:clamp(2.05rem, 5vw, 3.15rem); font-weight:560; letter-spacing:-0.02em;
    line-height:1.12; text-wrap:balance; }
  .masthead h1 b { font-weight:inherit; }
  .masthead .date { font-size:0.98rem; color:var(--dim); margin-top:10px; letter-spacing:0; font-weight:400; }

  /* ── 方案 B：四张疏朗大数字卡片 ── */
  .board {
    display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:stretch;
  }
  .hub-card {
    min-width:0; min-height:248px;
    display:flex; flex-direction:column;
    background:var(--sheet, var(--tint-2));
    border:1px solid var(--line, var(--tint-line));
    box-shadow:var(--shadow-1);
    border-radius:22px;
    padding:22px 28px 20px;
  }
  html[data-theme="ft"] .hub-card,
  html[data-theme="paper"] .hub-card {
    border-color:transparent;
    box-shadow:var(--shadow-2);
  }
  html[data-theme="ft"] .hub-card {
    box-shadow:0 12px 32px rgba(150, 110, 80, 0.12);
  }
  .pill {
    display:inline-flex; align-items:center; align-self:flex-start; max-width:100%;
    margin:0; padding:5px 12px 6px; border-radius:999px;
    background:var(--down-soft, var(--tint-3));
    color:var(--fear2, var(--gold));
    font-size:0.78rem; font-weight:600; letter-spacing:0.02em; line-height:1.25; font-family:inherit;
  }
  html[data-theme="ft"] .pill {
    background:#f6e3dc;
    color:#d15a4e;
  }
  .hero-slot { flex:1; display:flex; flex-direction:column; min-width:0; }
  .hero { flex:1; display:flex; min-width:0; padding:26px 0 8px; }
  .hero.side { align-items:center; justify-content:space-between; gap:14px 28px; flex-wrap:wrap; }
  .hero.stack { flex-direction:column; align-items:flex-start; justify-content:center; }
  .hero.people { flex-direction:column; align-items:flex-start; justify-content:center; gap:16px; }
  .nums { display:flex; align-items:baseline; gap:0.22em 0.32em; min-width:0; }
  .n1, .n2, .n3, .cap { text-decoration:none; color:var(--ink); }
  .n1, .n2, .n3 { font-variant-numeric:tabular-nums; line-height:0.92; letter-spacing:-0.045em; font-weight:520; }
  .n1 { font-size:clamp(3.15rem, 5.5vw, 4.85rem); }
  .n1.money { font-size:clamp(2.45rem, 4.4vw, 4.15rem); letter-spacing:-0.04em; }
  .n2 { font-size:clamp(1.65rem, 2.5vw, 2.2rem); font-weight:540; color:var(--fear2, var(--gold)); }
  .n3 { font-size:clamp(1.28rem, 2.15vw, 1.72rem); font-weight:560; }
  html[data-theme="ft"] .n2,
  html[data-theme="ft"] .accent { color:#e06a45; }
  .caps { display:flex; flex-direction:column; align-items:flex-start; gap:8px; min-width:0; }
  .caps.under { margin-top:16px; gap:5px; }
  .cap { font-size:0.98rem; line-height:1.35; font-weight:450; }
  .cap b { font-weight:650; }
  .accent { color:var(--fear2, var(--gold)); font-weight:600; }
  .rowline { display:flex; align-items:center; flex-wrap:wrap; gap:6px 16px; min-width:0; max-width:100%; }
  .rowline.minor { align-items:baseline; }
  .loading { color:var(--dim); font-size:0.95rem; align-self:center; }
  .more {
    margin-top:auto; padding-top:14px;
    font-size:0.74rem; line-height:1.7; color:var(--faint);
  }
  .more a { color:var(--faint); text-decoration:none; }
  .more a + a::before { content:" · "; color:var(--faint); }
  .hub-card a:hover { opacity:0.72; }
  .more a:hover { opacity:1; color:var(--ink); }
  .hub-card a:focus-visible { outline:2px solid var(--accent, var(--gold)); outline-offset:3px; border-radius:6px; }

  footer { margin-top:36px; padding-top:20px; border-top:1px solid var(--line, var(--tint-line));
    text-align:center; color:var(--faint); font-size:0.78rem; line-height:1.9;
    font-family:var(--mono); letter-spacing:0.02em; }

  @media (max-width:759px) {
    .page { padding:14px 16px 56px; }
    .board { grid-template-columns:1fr; gap:16px; }
    .hub-card { padding:20px 20px 16px; border-radius:20px; min-height:0; }
    .masthead { padding-top:12px; margin-bottom:20px; }
    .masthead h1 { letter-spacing:-0.015em; }
    .hero { padding-top:20px; }
    .n1 { font-size:clamp(3rem, 16vw, 4.4rem); }
    .n1.money { font-size:clamp(2.35rem, 11vw, 3.5rem); }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
