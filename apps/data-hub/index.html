<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#0b0a10; --ink:#f3f0ea; --dim:#9a94a6; --faint:#645f70;
    --gold:#d9b779; --up:#e2606a; --down:#4bbf9a;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  body {
    min-height:100vh; color:var(--ink);
    background:
      radial-gradient(820px 460px at 88% -6%, rgba(217,183,121,.12), transparent 60%),
      radial-gradient(700px 500px at 6% 108%, rgba(120,110,150,.10), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    line-height:1.55; overflow-x:hidden;
  }
  .page { max-width:1080px; margin:0 auto; padding:18px 24px 64px; }

  header.top { display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  header.top a.back { color:var(--gold); text-decoration:none; font-size:0.9rem; }
  header.top a.back:hover { opacity:.8; }

  /* ── masthead ── */
  .masthead { padding:12px 0 4px; margin:0 0 26px; }
  .kick { font-family:var(--mono); font-size:0.72rem; letter-spacing:0.28em; text-transform:uppercase; color:var(--gold); }
  .masthead h1 { margin:12px 0 0; font-size:clamp(2rem,5.2vw,3.15rem); font-weight:500; letter-spacing:0.5px;
    line-height:1.08; text-wrap:balance; }
  .masthead h1 b { font-weight:700; }
  .masthead .date { font-family:var(--mono); font-size:0.8rem; color:var(--dim); margin-top:12px; letter-spacing:0.02em; }

  /* ── 方案 B：四大分类轻盈浮起卡片 ── */
  .board {
    display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:start;
  }
  .hub-card {
    min-width:0;
    background:var(--sheet, var(--tint-2));
    border:1px solid var(--line, var(--tint-line));
    box-shadow:var(--shadow-1);
    border-radius:22px;
    padding:22px 22px 12px;
  }
  html[data-theme="ft"] .hub-card {
    background:var(--sheet);
    border-color:transparent;
    box-shadow:var(--shadow-2);
  }
  html[data-theme="paper"] .hub-card {
    background:var(--panel);
    border-color:transparent;
    box-shadow:var(--shadow-2);
  }
  .pill {
    display:inline-flex; align-items:center; max-width:100%;
    margin:0 0 2px; padding:5px 12px 6px; border-radius:999px;
    background:var(--down-soft, var(--tint-3));
    color:var(--fear2, var(--gold));
    font-size:0.78rem; font-weight:600; letter-spacing:0.04em; line-height:1.25; font-family:inherit;
  }
  .hub-mods { min-width:0; margin-top:4px; }

  .art { display:block; text-decoration:none; color:inherit; min-width:0;
    padding:14px 4px 16px; border-radius:12px; }
  .art + .art { border-top:1px solid var(--line, var(--tint-line)); }
  .art:hover { background:var(--tint-1); }
  .art:hover .hn .t { color:var(--accent, var(--gold)); }
  .art:focus-visible { outline:2px solid var(--accent, var(--gold)); outline-offset:2px; }
  .art .hn { display:flex; align-items:baseline; gap:6px 10px; flex-wrap:wrap; }
  .art .hn .t { font-size:1.02rem; font-weight:600; letter-spacing:0.01em; }
  .art .hn .tag { margin-left:auto; font-family:var(--mono); font-size:0.64rem; letter-spacing:0.06em;
    color:var(--faint); text-transform:uppercase; }
  .art .body { margin-top:2px; min-width:0; }
  .art .big { font-weight:500; font-size:clamp(2.35rem, 8vw, 3.5rem); line-height:0.95; letter-spacing:-.03em;
    margin:10px 0 2px; font-variant-numeric:tabular-nums; }
  .art .big small { display:block; font-size:0.78rem; font-weight:500; color:var(--dim); margin:8px 0 0;
    letter-spacing:0; line-height:1.45; white-space:normal; }
  .art .note { color:var(--dim); font-size:0.95rem; line-height:1.55; margin-top:8px; }
  .art .note b { color:var(--ink); font-weight:600; }
  .art .row { display:flex; align-items:baseline; justify-content:space-between; gap:8px 12px; flex-wrap:wrap;
    padding:7px 0; font-size:0.9rem; }
  .art .body .row:first-child { margin-top:10px; }
  .art .row .l { color:var(--dim); min-width:0; }
  .art .row .v { font-family:var(--mono); font-weight:500; font-variant-numeric:tabular-nums; text-align:right;
    margin-left:auto; min-width:0; }
  .art .news { font-size:1.02rem; font-weight:500; line-height:1.5; margin:12px 0 6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .art .sub { color:var(--dim); font-size:0.82rem; font-family:var(--mono); letter-spacing:0.02em; overflow-wrap:anywhere; }
  .art .upd { color:var(--faint); font-size:0.72rem; font-family:var(--mono); margin-top:12px; letter-spacing:0.04em; }
  .art .loading { color:var(--dim); font-size:0.86rem; margin-top:12px; }
  .up { color:var(--up); } .down { color:var(--down); } .dim { color:var(--dim); }

  footer { margin-top:36px; padding-top:20px; border-top:1px solid var(--line, var(--tint-line));
    text-align:center; color:var(--faint); font-size:0.78rem; line-height:1.9;
    font-family:var(--mono); letter-spacing:0.02em; }

  @media (min-width:1040px) {
    .hub-mods.pair {
      display:grid; grid-template-columns:1fr 1fr; column-gap:18px; align-items:start;
    }
    .hub-mods.pair > .art:nth-child(-n+2) { border-top:0; padding-top:10px; }
    .hub-mods.pair > .art:nth-child(1) .big { font-size:clamp(3.1rem, 4.6vw, 4.6rem); }
    .hub-mods.pair > .art:nth-child(2) .big {
      font-size:clamp(2.15rem, 3vw, 2.85rem);
      color:var(--fear2, var(--gold));
    }
    .hub-mods.pair > .art:nth-child(n+3) { grid-column:1 / -1; }
    .hub-mods:not(.pair) > .art:first-child .big { font-size:clamp(2.8rem, 4.2vw, 4.35rem); }
  }
  @media (max-width:759px) {
    .page { padding:14px 14px 56px; }
    .board { grid-template-columns:1fr; gap:14px; }
    .hub-card { padding:16px 14px 8px; border-radius:18px; }
    .masthead h1 { letter-spacing:0; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
