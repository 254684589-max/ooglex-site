<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>数据中心改版 · 方案 C 终端双栏</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css?v=0d16e197">
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem("ooglex.theme");if(t!=="ft"&&t!=="paper"&&t!=="dark")t=null;d.setAttribute("data-theme",t||"dark");if(t)d.setAttribute("data-theme-choice",t);}catch(e){}})();</script>
<script src="/assets/theme.js?v=20260926k" defer></script>
<link rel="stylesheet" href="kit.css">
<style>
  .page { max-width:1240px; margin:0 auto; padding:18px 28px 64px; }
  .mast { display:flex; align-items:flex-end; justify-content:space-between; gap:10px 24px; flex-wrap:wrap; margin:18px 0 22px; }
  .mast h1 { font-size:clamp(1.9rem,4.4vw,2.8rem); font-weight:600; letter-spacing:-.02em; line-height:1.1; margin-top:10px; }
  .mast .meta { color:var(--dim); font-size:.92rem; }
  .layout { display:grid; grid-template-columns:380px minmax(0,1fr); gap:28px; align-items:start; }

  /* ── 左栏：恐慌贪婪固定面板（三种主题下都用深底，最醒目） ── */
  .side { position:sticky; top:16px; display:block; text-decoration:none; border-radius:26px; padding:24px 24px 20px;
    background:#17141c; color:#f3f0ea; box-shadow:var(--shadow-2);
    --ink:#f3f0ea; --dim:#a39dad; --faint:#7d7787; --line:rgba(255,255,255,.12); --sheet:#17141c;
    --fg-xf:#ef5b54; --fg-f:#f08a55; --fg-n:#d8bd7c; --fg-g:#7cc59a; --fg-xg:#3fbf85; }
  .side .hd { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .side .hd b { font-size:1.05rem; }
  .side .hd span { font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; color:var(--faint); text-transform:uppercase; }
  .ring { position:relative; width:230px; max-width:100%; margin:18px auto 6px; aspect-ratio:1; }
  .ring svg { width:100%; height:100%; transform:rotate(-90deg); }
  .ring .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring .v { font-size:5rem; font-weight:750; letter-spacing:-.05em; line-height:.9; font-variant-numeric:tabular-nums; }
  .ring .z { font-size:1.2rem; font-weight:700; margin-top:6px; }
  .ring .d { font-size:.78rem; color:var(--dim); margin-top:4px; }
  .refs { display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin-top:14px; }
  .refs div { text-align:center; padding:9px 0; }
  .refs div + div { border-left:1px solid var(--line); }
  .refs .k { font-size:.7rem; color:var(--dim); }
  .refs .n { font-size:1.15rem; font-weight:700; font-variant-numeric:tabular-nums; }
  .side h3 { font-size:.76rem; color:var(--dim); font-weight:600; margin:16px 0 6px; letter-spacing:.04em; }
  .dots .r { display:grid; grid-template-columns:6.2em minmax(0,1fr) 1.8em; gap:10px; align-items:center; font-size:.84rem; padding:4px 0; }
  .dots .tr { position:relative; height:4px; border-radius:99px;
    background:linear-gradient(90deg, var(--fg-xf), var(--fg-f) 35%, var(--fg-n) 50%, var(--fg-g) 65%, var(--fg-xg)); opacity:.9; }
  .dots .tr i { position:absolute; top:50%; width:12px; height:12px; margin:-6px 0 0 -6px; border-radius:50%; background:#fff; border:2px solid #17141c; box-shadow:0 0 0 1px rgba(255,255,255,.5); }
  .dots .s { text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
  .dots .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--dim); }
  .side .box { height:70px; }
  .side .srcline { margin-top:12px; color:var(--faint); }

  /* ── 右栏：分组行情表 ── */
  .grp { background:var(--sheet); border-radius:20px; box-shadow:var(--shadow-1); padding:6px 22px 8px; }
  .grp + .grp { margin-top:16px; }
  .grp > h2 { display:flex; align-items:baseline; gap:10px; font-size:.95rem; font-weight:750; padding:12px 0 8px; }
  .grp > h2 small { font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; color:var(--faint); font-weight:400; text-transform:uppercase; }
  .row { display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,.95fr) minmax(0,1.3fr) 5.6em; gap:14px; align-items:center;
    padding:12px 8px; margin:0 -8px; border-top:1px solid var(--line); text-decoration:none; border-radius:10px; }
  .row:hover { background:var(--tint-1); }
  .row .nm b { display:block; font-size:.95rem; font-weight:650; }
  .row .nm i { font-style:normal; font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--faint); text-transform:uppercase; }
  .row .k { font-size:1.45rem; font-weight:700; letter-spacing:-.02em; font-variant-numeric:tabular-nums; line-height:1.15; overflow-wrap:anywhere; }
  .row .k.txt { font-size:1.02rem; letter-spacing:0; }
  .row .k small { display:block; font-size:.74rem; font-weight:500; color:var(--dim); letter-spacing:0; margin-top:1px; }
  .row .ex { font-size:.82rem; color:var(--dim); min-width:0; }
  .row .ex div { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .ex .v { color:var(--ink); }
  .row .ex .v.up { color:var(--up); } .row .ex .v.down { color:var(--down); }
  .row .tm { text-align:right; font-size:.68rem; font-family:var(--mono); color:var(--faint); line-height:1.5; }

  @media (max-width:980px) {
    .layout { grid-template-columns:1fr; }
    .side { position:static; display:grid; grid-template-columns:230px minmax(0,1fr); gap:0 26px; }
    .side .hd { grid-column:1 / -1; }
    .side .ring { grid-row:span 3; }
  }
  @media (max-width:640px) {
    .page { padding:12px 16px 56px; }
    .side { display:block; padding:20px 16px 16px; border-radius:22px; }
    .ring { width:200px; }
    .ring .v { font-size:4.2rem; }
    .grp { padding:4px 14px 6px; border-radius:16px; }
    .row { grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; }
    .row .nm { grid-column:1; }
    .row .k { grid-column:2; grid-row:1 / span 2; text-align:right; font-size:1.25rem; }
    .row .k.txt { font-size:.92rem; max-width:9em; }
    .row .ex { grid-column:1; }
    .row .ex div + div { display:none; }
    .row .tm { display:none; }
  }
</style>
</head>
<body>
<div class="demo-bar">设计稿 · 方案 C「终端双栏」 · 数据读自各应用现有 data.json · <a href="./">返回方案对比</a></div>
<div class="page">
  <a class="back" href="../../../">← Ooglex</a>
  <div class="mast">
    <div><div class="kick">数据中心 · The Data Center</div><h1>今日市场，一页读尽</h1></div>
    <div class="meta">16 个自动更新的数据应用 · <span id="mDate">—</span></div>
  </div>
  <div class="layout">
    <a class="side" href="../../fear-greed/" aria-label="打开恐慌与贪婪指数">
      <div class="hd"><b>恐慌与贪婪指数</b><span>Fear &amp; Greed</span></div>
      <div class="ring" id="ring"><div class="c"><div class="loading">加载中…</div></div></div>
      <div>
        <div class="refs" id="refs"></div>
        <h3>七项分项指标</h3>
        <div class="dots" id="dots"></div>
      </div>
      <div>
        <h3>近一年走势 <span id="trRange"></span></h3>
        <div class="box" id="trend"></div>
        <div class="srcline" id="fgSrc"></div>
      </div>
    </a>
    <main id="main"></main>
  </div>
  <footer class="foot" id="foot"></footer>
</div>
<script src="kit.js"></script>
<script>
(function () {
  var K = window.HubKit, esc = K.esc;
  var BK = ["xf", "f", "n", "g", "xg"];
  function bk(v) { return BK[K.FG_BANDS.indexOf(K.band(v))]; }
  var $ = function (id) { return document.getElementById(id); };

  K.fearGreed().then(function (d) {
    var v = d.score, r = d.refs || {}, C = 2 * Math.PI * 88;
    $("mDate").textContent = d.asOf || "—";
    var dv = r.close ? v - r.close.score : null;
    $("ring").innerHTML =
      "<svg viewBox='0 0 200 200' aria-hidden='true'><circle cx='100' cy='100' r='88' fill='none' stroke='rgba(255,255,255,.1)' stroke-width='14'/>" +
      "<circle cx='100' cy='100' r='88' fill='none' stroke='var(--fg-" + bk(v) + ")' stroke-width='14' stroke-linecap='round' stroke-dasharray='" +
      (C * v / 100).toFixed(1) + " " + C.toFixed(1) + "'/></svg>" +
      "<div class='c'><div class='v t-" + bk(v) + "'>" + v + "</div><div class='z t-" + bk(v) + "'>" + K.band(v).zh + "</div>" +
      (dv !== null ? "<div class='d'>较前收 " + (dv > 0 ? "▲ +" + dv : dv < 0 ? "▼ " + dv : "持平") + "</div>" : "") + "</div>";
    $("ring").setAttribute("role", "img");
    $("ring").setAttribute("aria-label", "恐慌与贪婪指数 " + v + "，" + K.band(v).zh);
    $("refs").innerHTML = [["close", "前收"], ["week", "一周前"], ["month", "一月前"], ["year", "一年前"]]
      .filter(function (x) { return r[x[0]]; }).map(function (x) {
        var s = r[x[0]].score;
        return "<div><div class='k'>" + x[1] + "</div><div class='n t-" + bk(s) + "'>" + s + "</div></div>";
      }).join("");
    $("dots").innerHTML = (d.indicators || []).map(function (i) {
      return "<div class='r' title='" + esc(i.desc) + "'><span class='nm'>" + esc(i.name) + "</span><span class='tr'><i style='left:" + i.score +
        "%'></i></span><span class='s t-" + bk(i.score) + "'>" + i.score + "</span></div>";
    }).join("");
    var h = d.history || [];
    $("trend").innerHTML = K.spark(h, { w: 330, h: 70 });
    if (h.length) $("trRange").textContent = "· " + h[0].t.slice(0, 7) + " → " + h[h.length - 1].t.slice(0, 7);
    $("fgSrc").textContent = "来源 " + (d.source || "CNN") + " · 日频，非实时 · 数据日期 " + (d.asOf || "—") + " · 更新于 " + K.relTime(d.updatedAt);
  }).catch(function () { $("ring").innerHTML = "<div class='c'><div class='loading'>暂不可用</div></div>"; });

  K.GROUPS.forEach(function (g) {
    var s = document.createElement("section");
    s.className = "grp";
    s.innerHTML = "<h2>" + g.name + "<small>" + g.en + "</small></h2>";
    g.folders.forEach(function (f) {
      var app = K.byFolder(f), a = document.createElement("a");
      a.className = "row"; a.href = "../../" + app.folder + "/";
      a.innerHTML = "<div class='nm'><b>" + app.name + "</b><i>" + app.en + "</i></div><div class='k'><span class='loading'>…</span></div><div class='ex'></div><div class='tm'></div>";
      s.appendChild(a);
      K.load(app).then(function (x) {
        if (x.err) { a.querySelector(".k").innerHTML = "<span class='loading'>" + x.err + "</span>"; return; }
        var key = x.news ? x.key : x.key;
        a.querySelector(".k").className = "k " + (x.keyText ? "txt " : "") + (x.tone ? "tone-" + x.tone : x.keyCls || "");
        a.querySelector(".k").innerHTML = key + "<small>" + x.sub + "</small>";
        var ex = (x.news ? ["<div>" + x.news + "</div>"] : []).concat(x.rows.map(function (r) {
          return "<div>" + r.l + " <span class='v " + r.c + "'>" + r.v + "</span></div>";
        }));
        a.querySelector(".ex").innerHTML = ex.join("");
        a.querySelector(".tm").innerHTML = app.freq + "<br>" + x.ago;
      });
    });
    $("main").appendChild(s);
  });
  $("foot").textContent = K.SOURCES;
})();
</script>
</body>
</html>
