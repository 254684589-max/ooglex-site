<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>数据中心改版 · 方案 B 情绪色带</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/theme.css?v=0d16e197">
<script>(function(){try{var d=document.documentElement,t=localStorage.getItem("ooglex.theme");if(t!=="ft"&&t!=="paper"&&t!=="dark")t=null;d.setAttribute("data-theme",t||"dark");if(t)d.setAttribute("data-theme-choice",t);}catch(e){}})();</script>
<script src="/assets/theme.js?v=20260926k" defer></script>
<link rel="stylesheet" href="kit.css">
<style>
  .page { max-width:1180px; margin:0 auto; padding:18px 28px 64px; }
  .mast { margin:18px 0 20px; }
  .mast h1 { font-size:clamp(1.9rem,4.4vw,2.8rem); font-weight:600; letter-spacing:-.02em; line-height:1.1; margin-top:10px; }
  .mast .meta { color:var(--dim); font-size:.92rem; margin-top:8px; }

  /* ── 头条：整块随情绪着色 ── */
  .hero { --hc:var(--fg-n); position:relative; display:block; text-decoration:none; border-radius:28px; overflow:hidden;
    padding:30px 34px 26px; color:var(--ink);
    background:linear-gradient(135deg, color-mix(in srgb, var(--hc) 22%, var(--sheet)) 0%, color-mix(in srgb, var(--hc) 8%, var(--sheet)) 60%, var(--sheet) 100%);
    box-shadow:var(--shadow-2); border:1px solid color-mix(in srgb, var(--hc) 30%, transparent); }
  .hero-top { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .hero-top b { font-size:1.05rem; font-weight:700; }
  .hero-top span { font-family:var(--mono); font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); }
  .hero-main { display:grid; grid-template-columns:auto minmax(0,1fr); gap:20px 44px; align-items:end; margin-top:10px; }
  .big { font-size:clamp(6rem,15vw,11rem); font-weight:750; line-height:.82; letter-spacing:-.06em; color:var(--hc); font-variant-numeric:tabular-nums; }
  .zone { font-size:clamp(1.5rem,3vw,2.1rem); font-weight:750; color:var(--hc); margin-top:14px; }
  .delta { font-size:.92rem; color:var(--dim); margin-top:4px; }
  /* 色带：五档 + 现值与历史参照的刻度 */
  .scale { position:relative; padding:52px 0 10px; }
  .bands { display:flex; height:16px; border-radius:99px; overflow:hidden; gap:3px; }
  .bands i { display:block; height:100%; }
  .bands i:first-child { border-radius:99px 0 0 99px; } .bands i:last-child { border-radius:0 99px 99px 0; }
  .blab { display:flex; margin-top:8px; font-size:.74rem; color:var(--dim); }
  .blab span { text-align:center; }
  .pin { position:absolute; top:0; transform:translateX(-50%); text-align:center; }
  .pin .tx { font-size:.82rem; font-weight:700; white-space:nowrap; background:var(--ink); color:var(--sheet); padding:3px 10px; border-radius:99px; }
  .pin .st { width:2px; height:26px; background:var(--ink); margin:0 auto; }
  .pin .dt { width:16px; height:16px; border-radius:50%; background:var(--hc); border:3px solid var(--ink); margin:-4px auto 0; }
  .hero-foot { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:28px; margin-top:6px; padding-top:18px;
    border-top:1px solid color-mix(in srgb, var(--ink) 12%, transparent); }
  .trend .hd { display:flex; justify-content:space-between; font-size:.78rem; color:var(--dim); margin-bottom:6px; }
  .trend .box { height:86px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-content:flex-start; }
  .chip { font-size:.8rem; padding:4px 10px; border-radius:99px; background:color-mix(in srgb, var(--sheet) 70%, transparent);
    border:1px solid var(--line); white-space:nowrap; }
  .chip b { font-variant-numeric:tabular-nums; margin-left:4px; }
  .chips h3 { width:100%; font-size:.78rem; color:var(--dim); font-weight:600; margin-bottom:2px; }
  .hero .srcline { margin-top:14px; }

  /* ── 风险三联：紧贴头条 ── */
  .trio { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin-top:14px; }
  .tri { display:block; text-decoration:none; padding:16px 20px; background:var(--sheet); border-radius:18px; box-shadow:var(--shadow-1); }
  .tri .n { font-size:.86rem; font-weight:650; display:flex; justify-content:space-between; gap:8px; }
  .tri .n i { font-style:normal; font-size:.72rem; color:var(--faint); font-weight:400; }
  .tri .v { display:flex; align-items:baseline; gap:10px; margin-top:6px; flex-wrap:wrap; }
  .tri .v b { font-size:2.1rem; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.05; }
  .tri .v span { font-size:.84rem; font-weight:600; }
  .tri .s { font-size:.8rem; color:var(--dim); margin-top:4px; }

  /* ── 数字墙：无卡片，细线分隔，像报纸行情版 ── */
  .wall { margin-top:40px; }
  .grp { display:grid; grid-template-columns:160px minmax(0,1fr); gap:0 24px; padding:22px 0; border-top:2px solid var(--ink); }
  .grp > h2 { font-size:1.15rem; font-weight:750; line-height:1.2; }
  .grp > h2 small { display:block; font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; color:var(--faint); font-weight:400; text-transform:uppercase; margin-top:6px; }
  .cells { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .cell { display:block; text-decoration:none; padding:4px 20px 14px; border-left:1px solid var(--line); min-width:0; }
  .cell:nth-child(3n+1) { border-left:0; padding-left:0; }
  .cell:nth-child(n+4) { border-top:1px solid var(--line); padding-top:14px; }
  .cell:hover .nm { text-decoration:underline; }
  .cell .nm { font-size:.86rem; font-weight:650; color:var(--dim); }
  .cell .k { font-size:2.2rem; font-weight:650; letter-spacing:-.03em; line-height:1.08; margin-top:6px; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .cell .k.txt { font-size:1.35rem; letter-spacing:-.01em; margin-top:10px; }
  .cell .sub { font-size:.82rem; margin-top:2px; }
  .cell .news { font-size:1rem; font-weight:650; margin-top:8px; line-height:1.4; }
  .cell .rw { font-size:.8rem; color:var(--dim); margin-top:6px; }
  .cell .rw .v { color:var(--ink); }
  .cell .ft { font-size:.66rem; color:var(--faint); font-family:var(--mono); margin-top:8px; }

  @media (max-width:900px) {
    .trio { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .hero-main { grid-template-columns:1fr; gap:4px; }
    .hero-foot { grid-template-columns:1fr; }
    .grp { grid-template-columns:1fr; }
    .grp > h2 { margin-bottom:12px; }
    .grp > h2 small { display:inline; margin-left:8px; }
  }
  @media (max-width:640px) {
    .page { padding:12px 16px 56px; }
    .hero { padding:22px 18px 20px; border-radius:22px; }
    .trio { grid-template-columns:1fr; gap:10px; }
    .tri { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:2px 12px; padding:13px 16px; }
    .tri .v { margin-top:0; grid-row:1 / span 2; grid-column:2; justify-content:flex-end; }
    .tri .v b { font-size:1.7rem; }
    .tri .n i { display:none; }
    .tri .v { flex-direction:column; align-items:flex-end; gap:0; } .tri .v span { font-size:.72rem; }
    .cells { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .cell, .cell:nth-child(3n+1) { padding:12px 12px 12px; border-left:1px solid var(--line); border-top:0; }
    .cell:nth-child(2n+1) { border-left:0; padding-left:0; }
    .cell:nth-child(n+3) { border-top:1px solid var(--line); }
    .cell .k { font-size:1.6rem; } .cell .k.txt { font-size:1.08rem; }
  }
</style>
</head>
<body>
<div class="demo-bar">设计稿 · 方案 B「情绪色带」 · 数据读自各应用现有 data.json · <a href="./">返回方案对比</a></div>
<div class="page">
  <a class="back" href="../../../">← Ooglex</a>
  <div class="mast">
    <div class="kick">数据中心 · The Data Center</div><h1>今日市场，一页读尽</h1>
    <div class="meta">16 个自动更新的数据应用 · <span id="mDate">—</span></div>
  </div>

  <a class="hero" id="hero" href="../../fear-greed/" aria-label="打开恐慌与贪婪指数">
    <div class="hero-top"><b>恐慌与贪婪指数</b><span>CNN Fear &amp; Greed Index</span></div>
    <div class="hero-main">
      <div><div class="big" id="big">—</div><div class="zone" id="zone">加载中…</div><div class="delta" id="delta"></div></div>
      <div class="scale" id="scale"></div>
    </div>
    <div class="hero-foot">
      <div class="trend"><div class="hd"><span>近一年走势（阴影：极度恐惧 &lt;25 / 极度贪婪 ≥76）</span><span id="trRange"></span></div><div class="box" id="trend"></div></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="srcline" id="fgSrc"></div>
  </a>

  <div class="trio" id="trio"></div>
  <div class="wall" id="wall"></div>
  <footer class="foot" id="foot"></footer>
</div>
<script src="kit.js"></script>
<script>
(function () {
  var K = window.HubKit, esc = K.esc;
  var BK = ["xf", "f", "n", "g", "xg"];
  function bk(v) { return BK[K.FG_BANDS.indexOf(K.band(v))]; }
  var $ = function (id) { return document.getElementById(id); };

  K.fearGreed().then(function (d) {
    var v = d.score, b = K.band(v), r = d.refs || {};
    $("mDate").textContent = d.asOf || "—";
    $("hero").style.setProperty("--hc", "var(--fg-" + bk(v) + ")");
    $("big").textContent = v;
    $("zone").textContent = b.zh;
    if (r.close) {
      var dv = v - r.close.score;
      $("delta").textContent = "较前收 " + (dv > 0 ? "▲ +" : dv < 0 ? "▼ " : "持平 ") + (dv || "") + "（前收 " + r.close.score + "）";
    }
    var lo = 0, bands = "", labs = "";
    K.FG_BANDS.forEach(function (x, i) {
      var hi = Math.min(x.to, 100), w = hi - lo;
      bands += "<i style='flex:" + w + ";background:" + x.c + ";opacity:" + (b === x ? 1 : .35) + "'></i>";
      labs += "<span style='flex:" + w + ";" + (b === x ? "color:var(--ink);font-weight:700" : "") + "'>" + x.zh + "</span>";
      lo = hi;
    });
    var refs = [["week", "一周前"], ["month", "一月前"], ["year", "一年前"]].filter(function (x) { return r[x[0]]; })
      .map(function (x) { return x[1] + " <b class='t-" + bk(r[x[0]].score) + "'>" + r[x[0]].score + "</b>"; }).join(" · ");
    if (refs) $("delta").insertAdjacentHTML("afterend", "<div class='delta'>" + refs + "</div>");
    $("scale").innerHTML = "<div class='pin' style='left:" + v + "%'><div class='tx'>今日 " + v + "</div><div class='st'></div></div>" +
      "<div class='bands'>" + bands + "</div><div class='blab'>" + labs + "</div>";
    // 现值圆点画在色带上
    $("scale").querySelector(".pin").insertAdjacentHTML("beforeend", "<div class='dt'></div>");
    var h = d.history || [];
    $("trend").innerHTML = K.spark(h, { w: 600, h: 86 });
    if (h.length) $("trRange").textContent = h[0].t + " → " + h[h.length - 1].t;
    $("chips").innerHTML = "<h3>七项分项指标</h3>" + (d.indicators || []).map(function (i) {
      return "<span class='chip' title='" + esc(i.desc) + "'>" + esc(i.name) + "<b class='t-" + bk(i.score) + "'>" + i.score + "</b></span>";
    }).join("");
    $("fgSrc").textContent = "来源 " + (d.source || "CNN") + " · 日频，非实时 · 数据日期 " + (d.asOf || "—") + " · 更新于 " + K.relTime(d.updatedAt);
  }).catch(function () { $("zone").textContent = "恐慌与贪婪指数暂不可用"; });

  // 风险三联：宏观风险、OFR 金融压力、AAII 散户情绪
  var trio = [
    { f: "macro-radar", n: "宏观风险监测", hint: "0–100，越低越紧" },
    { f: "ofr-monitor", n: "美国金融压力", hint: "OFR FSI，0 为平均" },
    { f: "superinvestors", n: "AAII 散户看涨", hint: "每周调查" },
    { f: "econ-calendar", n: "本周经济日历", hint: "高影响事件" }
  ];
  trio.forEach(function (t) {
    var app = K.byFolder(t.f), a = document.createElement("a");
    a.className = "tri"; a.href = "../../" + t.f + "/";
    a.innerHTML = "<div class='n'>" + t.n + "<i>" + t.hint + "</i></div><div class='v'><b>…</b></div><div class='s'></div>";
    $("trio").appendChild(a);
    K.load(app).then(function (x) {
      if (x.err) { a.querySelector(".v").innerHTML = "<span class='loading'>" + x.err + "</span>"; return; }
      if (x.news) {
        a.querySelector(".v").innerHTML = "<b>" + x.key + "</b><span>项事件</span>";
        a.querySelector(".s").innerHTML = "下一项：" + x.news;
        return;
      }
      var sub = t.f === "superinvestors" ? (x.rows[0] ? "看跌 " + x.rows[0].v : "") : x.sub;
      a.querySelector(".v").innerHTML = "<b class='" + (x.tone ? "tone-" + x.tone : "") + "'>" + x.key + "</b>" +
        (t.f !== "superinvestors" ? "<span class='tone-" + x.tone + "'>" + x.sub + "</span>" : "<span class='down'>" + sub + "</span>");
      a.querySelector(".s").textContent = app.freq + " · 更新于 " + x.ago;
    });
  });

  // 情绪与风险已经并进头条和四联，数字墙只排其余三类
  K.GROUPS.filter(function (g) { return g.id !== "risk"; }).forEach(function (g) {
    var s = document.createElement("section");
    s.className = "grp";
    s.innerHTML = "<h2>" + g.name + "<small>" + g.en + "</small></h2><div class='cells'></div>";
    var box = s.querySelector(".cells");
    g.folders.forEach(function (f) {
      var app = K.byFolder(f), a = document.createElement("a");
      a.className = "cell"; a.href = "../../" + app.folder + "/";
      a.innerHTML = "<div class='nm'>" + app.name + "</div><div class='bd'><div class='loading' style='margin-top:10px'>加载中…</div></div>";
      box.appendChild(a);
      K.load(app).then(function (x) {
        var h = "";
        if (x.err) h = "<div class='loading' style='margin-top:10px'>" + x.err + "</div>";
        else {
          // AAII 已在上方四联出现，这里改看 13F 持仓第一
          if (f === "superinvestors" && x.rows[1]) {
            x = { key: x.rows[1].l.replace(/^#1\s*/, ""), keyText: true, sub: "13F 持仓规模第一", rows: [{ l: "持仓", v: x.rows[1].v, c: "" }], ago: x.ago };
          }
          if (x.news) h += "<div class='news'>" + x.news + "</div>";
          else h += "<div class='k " + (x.keyText ? "txt " : "") + (x.tone ? "tone-" + x.tone : x.keyCls || "") + "'>" + x.key + "</div><div class='sub'>" + x.sub + "</div>";
          var r0 = x.rows[0];
          if (r0) h += "<div class='rw'>" + r0.l + " <span class='v " + r0.c + "'>" + r0.v + "</span></div>";
        }
        h += "<div class='ft'>" + app.freq + " · 更新于 " + x.ago + "</div>";
        a.querySelector(".bd").outerHTML = h;
      });
    });
    $("wall").appendChild(s);
  });
  $("foot").textContent = K.SOURCES;
})();
</script>
</body>
</html>
