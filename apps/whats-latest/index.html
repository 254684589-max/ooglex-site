  <style>
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink,#211f1d);
      background:var(--bg,#f6efe4);
      font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;
      line-height:1.65;
      -webkit-font-smoothing:antialiased;
    }
    a{color:inherit;text-decoration:none}
    button{font:inherit}
    :root{
      --news-red:#c92435;
      --news-gold:#b37a00;
      --news-green:#187b5a;
      --news-blue:#315f9d;
      --paper-line:rgba(72,57,44,.16);
      --paper-dim:#746d66;
      --paper-soft:rgba(118,93,68,.055);
      --paper-soft2:rgba(118,93,68,.085);
    }
    .top-rule{height:3px;background:var(--news-red)}
    .shell{max-width:1180px;margin:0 auto;padding:12px 26px 58px}
    .dateline{
      padding:0 0 11px;
      color:var(--paper-dim);
      border-bottom:1px solid var(--paper-line);
      font-size:13px;
      letter-spacing:.06em;
    }
    .mast{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      gap:28px;
      padding:17px 0 16px;
    }
    .identity{display:flex;align-items:center;gap:16px;min-width:0}
    .mark{
      width:50px;height:50px;border-radius:12px;flex:0 0 auto;
      background:
        radial-gradient(circle at 50% 50%,#e2a118 0 18%,#a52c2c 19% 43%,#a88311 44% 60%,#101820 61% 100%);
      box-shadow:0 3px 12px rgba(48,32,18,.14);
    }
    .identity h1{margin:0;font-size:31px;line-height:1.12;letter-spacing:.01em;font-weight:800}
    .identity p{margin:4px 0 0;color:var(--paper-dim);font-size:14px;letter-spacing:.23em}
    .edition{
      display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end;
      color:var(--paper-dim);font-size:13px;
    }
    .edition-pill,.edition-latest{
      min-height:34px;display:inline-flex;align-items:center;padding:0 12px;
      border:1px solid var(--paper-line);border-radius:7px;background:var(--paper-soft);
    }
    .edition-latest{color:var(--news-red);font-weight:700;background:transparent}
    .nav{
      display:flex;gap:30px;align-items:center;
      min-height:50px;border-bottom:1px solid var(--paper-line);
      color:var(--paper-dim);font-size:15px;font-weight:600;overflow-x:auto;scrollbar-width:none;
    }
    .nav::-webkit-scrollbar,.category-tabs::-webkit-scrollbar{display:none}
    .nav a{position:relative;white-space:nowrap;padding:15px 0 13px}
    .nav a.active{color:var(--ink,#211f1d)}
    .nav a.active:after{
      content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--news-red);
    }
    .category-tabs{
      display:flex;gap:9px;align-items:center;padding:12px 0 10px;
      border-bottom:1px solid var(--paper-line);overflow-x:auto;scrollbar-width:none;
    }
    .category-tabs button{
      white-space:nowrap;cursor:pointer;border:1px solid var(--paper-line);
      border-radius:7px;padding:7px 15px;color:var(--paper-dim);background:transparent;
      transition:background .15s,color .15s,border-color .15s;
    }
    .category-tabs button:hover{background:var(--paper-soft)}
    .category-tabs button.on{
      color:#fff;background:var(--news-red);border-color:var(--news-red);font-weight:700;
    }
    .lead{
      display:block;margin:0 0 18px;padding:12px 16px 12px 17px;
      border-left:4px solid var(--news-red);border-bottom:1px solid var(--paper-line);
      background:rgba(255,255,255,.24);
    }
    .lead .kicker{font-size:12px;color:var(--news-red);font-weight:750;letter-spacing:.08em;margin-bottom:4px}
    .lead .title{font-size:18px;font-weight:750;line-height:1.5}
    .lead .meta{margin-top:5px;color:var(--paper-dim);font-size:12.5px}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:54px;padding-top:17px}
    .brief-head{display:flex;align-items:center;gap:12px;margin:0 0 15px}
    .brief-head h2{margin:0;font-size:16px;color:var(--news-red);font-weight:800;letter-spacing:.03em}
    .brief-head span{height:1px;background:var(--paper-line);flex:1}
    .section{
      margin:0 0 22px;
    }
    .section-title{
      margin:0;padding:0 0 8px;
      color:var(--news-gold);font-size:13px;font-weight:800;letter-spacing:.10em;
      border-bottom:1px solid var(--paper-line);
    }
    .story{
      display:block;padding:15px 2px 14px;border-bottom:1px solid var(--paper-line);
      transition:background .15s;
    }
    .story:hover{background:var(--paper-soft)}
    .story-title{font-size:17px;font-weight:760;line-height:1.55}
    .story-summary{
      margin-top:5px;color:var(--paper-dim);font-size:14px;line-height:1.7;
    }
    .story-meta{
      margin-top:6px;color:var(--paper-dim);font-size:12.5px;
    }
    .story-meta .source{color:var(--news-gold);font-weight:700}
    .rail{border-left:1px solid var(--paper-line);padding-left:28px}
    .rail-block{padding:0 0 24px;margin-bottom:24px;border-bottom:1px dashed var(--paper-line)}
    .rail-label{color:var(--news-gold);font-size:12px;font-weight:800;letter-spacing:.10em;margin-bottom:7px}
    .rail-title{font-size:23px;line-height:1.25;font-weight:780;margin:0 0 11px}
    .rail-story{display:block;padding:11px 0 13px;border-top:1px solid var(--paper-line)}
    .rail-story:first-of-type{border-top:0}
    .rail-story .when{font-size:12px;color:var(--news-gold);margin-bottom:3px}
    .rail-story .t{font-size:15.5px;line-height:1.55;font-weight:650}
    .rail-story .m{margin-top:5px;color:var(--paper-dim);font-size:12px}
    .read-more{color:var(--news-red);font-weight:700}
    .market-grid{border-top:1px solid var(--paper-line)}
    .quote{
      display:grid;grid-template-columns:1fr auto;gap:12px;
      padding:9px 0;border-bottom:1px solid var(--paper-line);
    }
    .quote .name{font-size:14px}
    .quote .value{text-align:right;font-size:14px;font-weight:750;font-variant-numeric:tabular-nums}
    .quote .pct{display:block;font-size:11px;margin-top:1px}
    .quote .pct.up{color:var(--news-green)}
    .quote .pct.down{color:var(--news-red)}
    .quote .pct.flat{color:var(--paper-dim)}
    .empty{padding:34px 0;color:var(--paper-dim);text-align:center}
    .source-note{
      margin-top:32px;padding-top:17px;border-top:1px solid var(--paper-line);
      color:var(--paper-dim);font-size:12.5px;line-height:1.8;
    }
    .source-note b{color:var(--ink,#211f1d)}
    @media(max-width:900px){
      .layout{grid-template-columns:1fr;gap:26px}
      .rail{border-left:0;border-top:1px solid var(--paper-line);padding:24px 0 0}
    }
    @media(max-width:640px){
      .shell{padding:10px 17px 44px}
      .mast{align-items:flex-start;flex-direction:column;gap:13px}
      .edition{justify-content:flex-start}
      .identity h1{font-size:26px}
      .identity p{font-size:12px}
      .nav{gap:22px}
      .layout{padding-top:13px}
      .story-title{font-size:16px}
    }
    html[data-theme="dark"]{
      --paper-line:rgba(255,255,255,.12);
      --paper-dim:#a9a3a0;
      --paper-soft:rgba(255,255,255,.035);
      --paper-soft2:rgba(255,255,255,.055);
      --news-gold:#d3a345;
    }
    html[data-theme="dark"] .lead{background:rgba(255,255,255,.025)}
  </style>
