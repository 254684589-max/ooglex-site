<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标普500热力图 · Ooglex</title>
  <meta name="description" content="标普500成分股的当日热力图：按行业分块、按市值定面积、按当日涨跌上色。逐块标注涨跌数字，另有图例与数据表，颜色不是唯一编码。数据由站内每日公开管道生成。">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="theme-color" content="#070a0f">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a0f; --panel: #0c1119;
      --line: rgba(151, 169, 196, 0.15); --line-strong: rgba(151, 169, 196, 0.28);
      --ink: #f1f5f9; --muted: #8c98aa; --faint: #738196; --cyan: #54d8ff;
      --cyan-soft: rgba(84, 216, 255, 0.12);
      --up: #52d69a; --down: #ff7d86;
      --tile-ink-light: #f4f7fb; --tile-ink-dark: #08111a;
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      min-width: 320px; margin: 0; color: var(--ink); font-family: var(--sans);
      background:
        radial-gradient(900px 480px at 88% -10%, rgba(84, 216, 255, 0.08), transparent 64%),
        radial-gradient(700px 420px at 6% 4%, rgba(82, 214, 154, 0.06), transparent 60%),
        var(--bg);
    }
    .wrap { max-width: 1680px; margin: 0 auto; padding: 0 22px 56px; }
    .topbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 16px 0 20px; }
    .topbar a {
      color: var(--muted); text-decoration: none; font-size: 13px;
      min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 4px;
    }
    .topbar a:hover { color: var(--ink); border-color: var(--cyan); }
    .eyebrow { color: var(--cyan); font-family: var(--mono); font-size: 12px; letter-spacing: .22em; }
    h1 { margin: 6px 0 10px; font-size: clamp(26px, 4vw, 42px); letter-spacing: -.01em; }
    .lede { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.75; max-width: 82ch; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px;
      background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 22px; }
    .stat { background: var(--panel); padding: 12px 14px; }
    .stat span { display: block; color: var(--faint); font-size: 11px; letter-spacing: .08em; margin-bottom: 5px; }
    .stat b { font-family: var(--mono); font-size: 18px; font-weight: 600; }
    .panel { border: 1px solid var(--line); border-radius: 6px; padding: 16px;
      background: linear-gradient(180deg, rgba(12,18,27,.92), rgba(6,11,18,.92)); }
    .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .heat-shown { color: var(--muted); font-size: 13px; font-family: var(--mono); }
    #heat-limits { display: flex; flex-wrap: wrap; gap: 8px; }
    .heat-limit {
      min-width: 56px; min-height: 44px; padding: 0 14px; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: 3px; color: var(--muted);
      background: rgba(12,18,27,.7); font-family: var(--sans); font-size: 13px;
    }
    .heat-limit:hover { border-color: var(--cyan); color: var(--ink); }
    /* 选中态不只靠颜色：同时加粗，色觉差异下也分得出当前档位。 */
    .heat-limit[aria-pressed="true"] { border-color: var(--cyan); color: var(--cyan);
      background: var(--cyan-soft); font-weight: 700; }
    .heat-limit:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .canvas-wrap { position: relative; }
    #heat-canvas { position: relative; width: 100%; }
    .heat-sector { position: absolute; overflow: hidden; }
    .heat-sector-head { display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 0 4px; overflow: hidden; white-space: nowrap; }
    .heat-sector-name { color: var(--ink); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    .heat-sector-meta { color: var(--faint); font-family: var(--mono); font-size: 10px; }
    .heat-tile {
      position: absolute; display: flex; flex-direction: column; align-items: center;
      justify-content: center; overflow: hidden; text-decoration: none; border-radius: 2px;
      line-height: 1.15; transition: filter .12s ease, outline-color .12s ease;
      outline: 0 solid transparent;
    }
    .heat-ink-light { color: var(--tile-ink-light); }
    .heat-ink-dark { color: var(--tile-ink-dark); }
    .heat-tile:hover { filter: brightness(1.16); }
    .heat-tile:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; z-index: 3; }
    .heat-tile-name { font-weight: 700; letter-spacing: .01em; text-align: center; padding: 0 3px;
      max-width: 100%; overflow: hidden; white-space: nowrap; }
    /* 代码作为第二行：比中文名弱一档，避免和名字抢主次。 */
    .heat-tile-symbol { font-family: var(--mono); font-size: 11px; font-weight: 700;
      letter-spacing: -.02em; opacity: .72; }
    .heat-tile-pct { font-family: var(--mono); font-size: 10px; opacity: .92; }
    #heat-tip {
      position: absolute; z-index: 8; pointer-events: none; max-width: 300px;
      padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 4px;
      background: rgba(6, 11, 18, .97); color: var(--ink); font-size: 12px; line-height: 1.6;
      box-shadow: 0 10px 26px rgba(0,0,0,.5);
    }
    #heat-legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 14px; }
    .legend-label { color: var(--faint); font-size: 12px; }
    .legend-chip { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 2px; display: inline-block; }
    .heat-note { margin: 14px 0 0; color: var(--faint); font-size: 12px; line-height: 1.75; }
    #heat-table-toggle {
      margin-top: 16px; min-height: 44px; padding: 0 16px; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: 3px; color: var(--muted);
      background: rgba(12,18,27,.7); font-family: var(--sans); font-size: 13px;
    }
    #heat-table-toggle:hover { border-color: var(--cyan); color: var(--ink); }
    #heat-table-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    #heat-table-wrap { margin-top: 12px; overflow-x: auto; }
    .heat-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .heat-table th, .heat-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    .heat-table th { color: var(--faint); font-size: 11px; font-weight: 600; letter-spacing: .06em; }
    .heat-mono { font-family: var(--mono); }
    .heat-up { color: var(--up); } .heat-down { color: var(--down); }
    .heat-flat, .heat-unknown { color: var(--faint); }
    footer { margin-top: 28px; color: var(--faint); font-size: 12px; }
    footer a { color: var(--muted); }
    @media (max-width: 620px) {
      .wrap { padding: 0 14px 40px; }
      .heat-limit { flex: 1 1 auto; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="topbar">
      <a href="/">← Ooglex</a>
      <a href="../markets/">全球市场行情</a>
      <a href="../companies/">全球公司榜</a>
      <a href="../finance-terminal/">金融终端</a>
    </nav>
    <p class="eyebrow">S&amp;P 500 HEATMAP</p>
    <h1>标普500热力图</h1>
    <p class="lede">按行业分块，每块的面积正比于该公司的市值，颜色是它当日的涨跌。方格以中文公司名标注，放得下的大格再补上交易代码。每块瓦片上同时写出带 ▲▼ 的涨跌数字，另有图例与完整数据表——颜色不是唯一的编码方式。点开任一块即是该公司的完整行情页。</p>

    <div class="stats">
      <div class="stat"><span>覆盖成分股</span><b id="stat-count">…</b></div>
      <div class="stat"><span>合计市值</span><b id="stat-cap">…</b></div>
      <div class="stat"><span>数据日</span><b id="stat-asof">…</b></div>
      <div class="stat"><span>今日涨跌</span><b id="stat-breadth">…</b></div>
      <div class="stat"><span>未覆盖</span><b id="stat-missing">…</b></div>
    </div>

    <section class="panel" id="heat-root" aria-busy="true">
      <div class="bar">
        <span class="heat-shown" id="heat-shown">正在读取站内标普500快照…</span>
        <div id="heat-limits" role="group" aria-label="显示家数"></div>
      </div>
      <p id="heat-status" class="heat-note">正在读取站内每日管道生成的标普500快照…</p>
      <div class="canvas-wrap">
        <div id="heat-canvas" role="img" aria-label="标普500成分股按行业分块的市值与当日涨跌热力图"></div>
        <div id="heat-tip" role="tooltip" hidden></div>
      </div>
      <div id="heat-legend"></div>
      <p class="heat-note" id="heat-note"></p>
      <button type="button" id="heat-table-toggle" aria-expanded="false" aria-controls="heat-table-wrap">以数据表查看</button>
      <div id="heat-table-wrap" hidden><div id="heat-table-host"></div></div>
    </section>

    <footer>
      Ooglex · 标普500热力图 · 数据每日自动更新，非实时行情 · 仅供参考，非投资建议 ·
      <a href="../finance-terminal/terms.html">使用条款</a>
    </footer>
  </div>
  <script type="module" src="heatmap.mjs"></script>
</body>
</html>
