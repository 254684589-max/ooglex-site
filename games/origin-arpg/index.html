          dmgPlayer(f.dps, f.x, f.y);
        }
      }
      if(chance(dt * 14)) addPart(f.x + rnd(-f.r, f.r) * 0.8, f.y + rnd(-f.r, f.r) * 0.8, 0, -14, 0.6, `rgb(${f.color})`, 2);
    }
    if(f.type === 'trap' && !f.used && f.t >= f.arm){
      let trig = null;
      for(const e of G.enemies){ if(!e.dead && dist(e.x, e.y, f.x, f.y) < f.r * 0.55 + e.size){ trig = e; break; } }
      if(trig){
        f.used = true; f.dur = f.t + 0.35;
        aoeAt(f.x, f.y, f.r, f.coef, { stun: f.root, fx: 'vine', color: '#7ec84a', shake: 2 });
        sfx('stomp');
      }
    }
    if(f.t >= f.dur && f.type !== 'tele') G.fx.splice(i, 1);
  }
}
function updParts(dt){
  for(let i = G.parts.length - 1; i >= 0; i--){
    const p = G.parts[i];
    p.life -= dt;
    if(p.life <= 0){ G.parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if(p.grav) p.vy += p.grav * dt;
    p.vx *= Math.pow(0.05, dt); p.vy *= Math.pow(0.05, dt);
  }
  for(let i = G.texts.length - 1; i >= 0; i--){
    const t = G.texts[i];
    t.t += dt; t.y += t.vy * dt; t.vy *= Math.pow(0.2, dt);
    if(t.t >= t.dur) G.texts.splice(i, 1);
  }
}

/* ----------------------------- 20. 玩家更新 / 交互 / 世界节拍 ----------------------------- */
function nearestInteract(){
  const P = G.player;
  let best = null, bd = 26 * 26;
  for(const p of G.map.props){
    if(p.kind !== 'portal' && p.kind !== 'chest' && p.kind !== 'board') continue;
    if(p.kind === 'chest' && p.opened) continue;
    const d = dist2(P.x, P.y, p.x, p.y);
    if(d < bd){ bd = d; best = { type: p.kind, p }; }
  }
  for(const n of G.npcs){
    if(n.kind !== 'shop' && n.kind !== 'healer' && n.kind !== 'forge' && n.kind !== 'vault') continue;
    const d = dist2(P.x, P.y, n.x, n.y);
    if(d < bd){ bd = d; best = { type: n.kind, p: n }; }
  }
  return best;
}
function canEnterZone(z){
  const zd = ZONE_DEFS[z];
  if(!zd) return false;
  return !(zd.req && !G.bossKills[zd.req]);
}
function interactLabel(it){
  if(!it) return null;
  if(it.type === 'portal'){
    if(it.p.zone === 'town') return '回到 翡翠镇';
    if(it.p.zone === 'select') return '选择目的地（传送门）';
    const zd = ZONE_DEFS[it.p.zone];
    if(zd.req && !G.bossKills[zd.req]) return `${zd.name}（需击败${BOSS_DEFS[zd.req].name}）`;
    return `前往 ${zd.name}`;
  }
  if(it.type === 'chest') return '打开宝箱';
  if(it.type === 'board') return '查看悬赏板';
  if(it.type === 'shop') return '与莉娜交谈（商店）';
  if(it.type === 'healer') return '与艾草医师交谈（治疗）';
  if(it.type === 'forge') return '与铁匠戈姆交谈（重铸装备）';
  if(it.type === 'vault') return '与仓管员莫莉交谈（仓库）';
  return null;
}
function doInteract(){
  const it = nearestInteract();
  if(!it) return;
  if(it.type === 'portal'){
    const z = it.p.zone;
    if(z === 'town'){ fadeTo(() => enterTown()); sfx('portal'); return; }
    if(z === 'select'){ openUI('mapselect'); sfx('portal'); return; }
    const zd = ZONE_DEFS[z];
    if(zd.req && !G.bossKills[zd.req]){ toast(`需要先击败 ${BOSS_DEFS[zd.req].name}`, '#e05a5a'); sfx('error'); return; }
    fadeTo(() => enterZone(z)); sfx('portal');
  }
  else if(it.type === 'chest') openChest(it.p);
  else if(it.type === 'board') openUI('board');
  else if(it.type === 'shop'){ restockShop(); openUI('shop'); sfx('ui'); }
  else if(it.type === 'forge'){ openUI('forge'); sfx('ui'); }
  else if(it.type === 'vault'){ openUI('vault'); sfx('ui'); }
  else if(it.type === 'healer'){
    const P = G.player, cost = P.lvl * 6;
    if(P.hp >= P.stats.maxHP && P.mp >= P.stats.maxMP){ toast('你的状态很好，不需要治疗', '#7ec84a'); return; }
    if(P.gold < cost){ toast(`治疗需要 ${cost} 金币`, '#e05a5a'); sfx('error'); return; }
    P.gold -= cost; P.hp = P.stats.maxHP; P.mp = P.stats.maxMP;
    burst(P.x, P.y - 8, 18, '#7ec84a', 60); toast(`完全恢复！（-${cost} 金）`, '#7ec84a'); sfx('potion');
  }
}
function updPlayer(dt){
  const P = G.player, S = P.stats;
  // 计时器
  P.atkT = Math.max(0, P.atkT - dt);
  P.potCd = Math.max(0, P.potCd - dt);
  if(P.chillT > 0) P.chillT -= dt;
  P.dashCd = Math.max(0, P.dashCd - dt);
  P.invT = Math.max(0, P.invT - dt);
  P.hitFlash = Math.max(0, P.hitFlash - dt);
  for(let i = 0; i < 4; i++) P.skillCd[i] = Math.max(0, P.skillCd[i] - dt);
  for(let bi = P.buffs.length - 1; bi >= 0; bi--){
    const b = P.buffs[bi];
    b.t -= dt;
    if(b.k === 'regen') P.hp = Math.min(S.maxHP, P.hp + S.maxHP * b.v * dt);
    if(b.k === 'zap'){
      b.tk = (b.tk || 0) - dt;
      if(b.tk <= 0){
        b.tk = 0.55;
        const zt = nearestEnemy(P.x, P.y, 115);
        if(zt){
          const dm = rollDmg(b.v);
          addFx({ type: 'bolt', x1: P.x, y1: P.y - 10, x2: zt.x, y2: zt.y - 6, t: 0, dur: 0.16, c: '176,138,255' });
          dmgEnemy(zt, dm.v, { crit: dm.crit });
          addPart(zt.x, zt.y - 8, rnd(-30, 30), rnd(-50, -10), 0.3, '#b08aff', 2);
        }
      }
    }
    if(b.t <= 0) P.buffs.splice(bi, 1);
  }
  if(P.orbit){
    const o = P.orbit;
    o.t += dt; o.ang += dt * 5.2; o.tick -= dt;
    if(o.tick <= 0){
      o.tick = 0.12;
      for(let k = 0; k < o.n; k++){
        const a = o.ang + k * TAU / o.n;
        const bx = P.x + Math.cos(a) * 17, by = P.y - 7 + Math.sin(a) * 9;
        for(const e of G.enemies){
          if(e.dead || (e.orbT || 0) > 0) continue;
          if(dist(bx, by, e.x, e.y - 4) < 10 + e.size){
            const dm = rollDmg(o.coef);
            dmgEnemy(e, dm.v, { crit: dm.crit });
            e.orbT = 0.28;
            addPart(bx, by, rnd(-40, 40), rnd(-40, 40), 0.25, '#e8e0d0', 2);
          }
        }
      }
    }
    if(o.t >= o.dur) P.orbit = null;
  }
  // 回复
  P.regenAcc += dt;
  if(P.regenAcc >= 1){
    P.regenAcc -= 1;
    P.hp = Math.min(S.maxHP, P.hp + S.regen);
    P.mp = Math.min(S.maxMP, P.mp + S.mregen);
  }
  // 中毒
  if(P.poison){
    P.poison.t -= dt; P.poison.acc = (P.poison.acc || 0) + dt;
    if(P.poison.acc >= 0.6){ P.poison.acc -= 0.6; P.hp = Math.max(1, P.hp - P.poison.dps * 0.6); addText(P.x, P.y - 18, '☠', '#7ad84a', 9); }
    if(P.poison.t <= 0) P.poison = null;
  }
  // 熔岩
  if(tileAt(P.x, P.y + 2) === T_LAVA && P.dashT <= 0){
    P.lavaT += dt;
    if(P.lavaT >= 0.45){
      P.lavaT = 0;
      const v = Math.max(3, Math.round(S.maxHP * 0.07));
      P.hp -= v; P.hitFlash = 0.15;
      addText(P.x, P.y - 20, '-' + v, '#ff8c2a', 10);
      burst(P.x, P.y, 6, '#ff8c2a', 50); sfx('hurt');
      if(P.hp <= 0){ P.hp = 0; onPlayerDead(); return; }
    }
  } else P.lavaT = 0;
  const act = readActions();
  // 冲刺
  if(P.dashT > 0){
    P.dashT -= dt;
    const s = S.spd * (1 + buffVal('mspd')) * (P.chillT > 0 ? 0.6 : 1) * 3.3 * dt;
    moveEnt(P, Math.cos(P.dashA) * s, Math.sin(P.dashA) * s);
    if(chance(dt * 40)) addPart(P.x, P.y - 6, rnd(-10, 10), rnd(-10, 10), 0.25, '#e8e0d0', 2);
    P.walkT += dt * 12;
  } else if(act.mvx !== 0 || act.mvy !== 0){
    const s = S.spd * (1 + buffVal('mspd')) * (P.chillT > 0 ? 0.6 : 1) * dt;
    moveEnt(P, act.mvx * s, act.mvy * s);
    P.moving = true; P.walkT += dt * 8;
    if(!act.atk){
      P.dir = Math.abs(act.mvx) > Math.abs(act.mvy) ? (act.mvx > 0 ? 'side' : 'left') : (act.mvy > 0 ? 'down' : 'up');
      P.aim = Math.atan2(act.mvy, act.mvx);
    }
    P.lastMv = { x: act.mvx, y: act.mvy };
  } else P.moving = false;
  // 技能（位 1=左键 位 2=右键 位 3=Q 位 4=E；普攻作为技能放入任意位）
  for(let i = 0; i < 4; i++) if(act.skill[i] && !G.ui) castSkill(i);
  // 探索揭示
  G.revT = (G.revT || 0) - dt;
  if(G.revT <= 0){ G.revT = 0.18; reveal(G.map, P.x, P.y); }
}
function tryDash(){
  const P = G.player;
  if(P.dashCd > 0 || G.ui) return;
  const act = readActions();
  P.dashA = (act.mvx || act.mvy) ? Math.atan2(act.mvy, act.mvx) : P.aim;
  P.dashT = 0.17; P.dashCd = 1.1;
  sfx('dash');
  burst(P.x, P.y - 4, 6, '#e8e0d0', 50);
}
function updCamera(dt){
  const P = G.player, m = G.map;
  const tx = clamp(P.x - VW / 2, 0, Math.max(0, m.w * TS - VW));
  const ty = clamp(P.y - VH / 2, 0, Math.max(0, m.h * TS - VH));
  const k = 1 - Math.pow(0.0001, dt);
  G.cam.x = lerp(G.cam.x, tx, k);
  G.cam.y = lerp(G.cam.y, ty, k);
  if(G.cam.shake > 0) G.cam.shake = Math.max(0, G.cam.shake - dt * 14);
}
function updWorld(dt){
  G.t += dt; G.frame++;
  G.dayT = (G.dayT + dt) % 150;
  updTimers(dt);
  if(G.state !== 'play'){ updParts(dt); return; }
  if(!G.ui){
    // 限时悬赏倒计时
    if(G.quest && G.quest.type === 'timed' && G.quest.active && !G.quest.done){
      G.quest.timeLeft -= dt;
      if(G.quest.timeLeft <= 0){
        toast('限时悬赏失败：时间耗尽', '#e05a5a'); sfx('error');
        chat('✗ 限时悬赏失败，可在悬赏板重新接取', '#e05a5a');
        G.quest = null;
      }
    }
    updPlayer(dt);
    for(const e of G.enemies) updEnemy(e, dt);
    for(let i = G.enemies.length - 1; i >= 0; i--) if(G.enemies[i].dead) G.enemies.splice(i, 1);
    updProjs(dt);
    updFx(dt);
    updDrops(dt);
  }
  for(const n of G.npcs) updNPC(n, dt);
  updAmbient(dt);
  updParts(dt);
  updCamera(dt);
  if(G.tipT > 0){ G.tipT -= dt; if(G.tipT <= 0) G.tip = null; }
}
function toast(msg, color){ G.tip = { msg, color: color || '#e8e0d0' }; G.tipT = 2.4; }
function chat(msg, color){
  G.chat.push({ msg, color: color || '#cfd2da', t: G.t });
  if(G.chat.length > 7) G.chat.shift();
}

/* ----------------------------- 21. 渲染：世界 ----------------------------- */
const LC = mkCanvas(VW, VH), lctx = LC.getContext('2d');
const WHITE_CACHE = new Map();
function whiteOf(spr){
  if(!WHITE_CACHE.has(spr)) WHITE_CACHE.set(spr, tinted(spr, '#ffffff', 0.85));
  return WHITE_CACHE.get(spr);
}
function hexRGB(h){ const n = parseInt(h.slice(1), 16); return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255); }
function dayFactor(){ // 0=白天 1=深夜
  const t = G.dayT;
  if(t < 70) return 0;
  if(t < 92) return (t - 70) / 22;
  if(t < 132) return 1;
  if(t < 150) return 1 - (t - 132) / 18;
  return 0;
}
function heroFrame(frames, dir, walkT, moving){
  const set = frames[dir] || frames.down;
  if(!moving) return set[0];
  const f = Math.floor(walkT) % 2;
  return f === 0 ? set[1] : set[2];
}
function enemySprite(e){
  if(e.boss) return SPR.boss[e.spr];
  if(e.humanoid) return heroFrame(e.frames, e.dir === 'left' ? 'left' : (e.dir || 'down'), e.walkT, e.aggro || e.wandering);
  let arr = SPR.enemy[e.spr];
  if(e.side && e.face < 0 && SPR.enemy[e.spr + 'L']) arr = SPR.enemy[e.spr + 'L'];
  if(arr.length === 1) return arr[0];
  return arr[Math.floor(e.walkT * 1.4) % arr.length];
}
function drawPortal(g, x, y, t, locked){
  const pulse = 0.8 + Math.sin(t * 3) * 0.2;
  g.save();
  g.translate(x, y);
  const col = locked ? '120,120,140' : '110,200,255';
  const grd = g.createRadialGradient(0, -12, 1, 0, -12, 14);
  grd.addColorStop(0, `rgba(${col},${0.85 * pulse})`);
  grd.addColorStop(0.6, `rgba(${col},0.3)`);
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.beginPath(); g.ellipse(0, -12, 9, 13, 0, 0, TAU); g.fill();
  g.strokeStyle = `rgba(${col},0.9)`; g.lineWidth = 1;
  g.beginPath(); g.ellipse(0, -12, 7 * pulse, 11 * pulse, 0, 0, TAU); g.stroke();
  for(let i = 0; i < 3; i++){
    const a = t * 2.4 + i * TAU / 3;
    g.fillStyle = `rgba(${col},0.9)`;
    g.fillRect(Math.cos(a) * 6 - 1, -12 + Math.sin(a) * 10 - 1, 2, 2);
  }
  g.fillStyle = '#3a3346'; g.fillRect(-9, -2, 4, 3); g.fillRect(5, -2, 4, 3);
  g.restore();
}
function drawFountain(g, x, y, t){
  g.fillStyle = '#6a6774'; g.beginPath(); g.ellipse(x, y - 4, 16, 9, 0, 0, TAU); g.fill();
  g.fillStyle = '#86838f'; g.beginPath(); g.ellipse(x, y - 6, 16, 9, 0, 0, TAU); g.fill();
  g.fillStyle = '#2e5fa3'; g.beginPath(); g.ellipse(x, y - 6, 12, 6, 0, 0, TAU); g.fill();
  g.fillStyle = '#4d82c8';
  for(let i = 0; i < 4; i++){
    const a = t * 1.6 + i * TAU / 4;
    g.fillRect(x + Math.cos(a) * 7 - 1, y - 6 + Math.sin(a) * 3.4, 3, 1);
  }
  g.fillStyle = '#86838f'; g.fillRect(x - 2, y - 16, 4, 10);
  g.fillStyle = '#9c99a8'; g.fillRect(x - 3, y - 17, 6, 2);
  for(let i = 0; i < 3; i++){
    const ph = (t * 1.4 + i / 3) % 1;
    const px = x + Math.sin((t + i) * 2.1) * 3 * ph;
    g.fillStyle = `rgba(156,196,238,${1 - ph})`;
    g.fillRect(px - 0.5, y - 16 - 6 * ph + 8 * ph * ph, 1.5, 2);
  }
}
function renderWorld(){
  const m = G.map, P = G.player;
  const shk = G.cam.shake;
  const camX = Math.round(G.cam.x + (shk > 0 ? rnd(-shk, shk) : 0));
  const camY = Math.round(G.cam.y + (shk > 0 ? rnd(-shk, shk) : 0));
  bctx.fillStyle = '#0d0b1e'; bctx.fillRect(0, 0, VW, VH);
  const wf = Math.floor(G.t * 3);
  const x0 = Math.max(0, Math.floor(camX / TS)), x1 = Math.min(m.w - 1, Math.floor((camX + VW) / TS) + 1);
  const y0 = Math.max(0, Math.floor(camY / TS)), y1 = Math.min(m.h - 1, Math.floor((camY + VH) / TS) + 1);
  for(let ty = y0; ty <= y1; ty++){
    for(let tx = x0; tx <= x1; tx++){
      const id = m.g[ty * m.w + tx];
      const dx = tx * TS - camX, dy = ty * TS - camY;
      if(id === T_WALL){
        const below = gT(m, tx, ty + 1);
        const wth = THEME_WALLS[m.theme];
        bctx.drawImage(below !== T_WALL && below !== T_VOID ? ((wth && wth.face) || TILES.wallFace)
                                                            : ((wth && wth.top) || TILES.wallTop), dx, dy);
        continue;
      }
      const tth = THEME_TILES[m.theme];
      const arr = (tth && tth[id]) || TILES[id];
      if(!arr){ continue; }
      const img = (id === T_WATER || id === T_LAVA) ? arr[wf % arr.length] : arr[(tx * 7 + ty * 13) % arr.length];
      bctx.drawImage(img, dx, dy);
      if(id === T_WATER && gT(m, tx, ty - 1) !== T_WATER){ bctx.fillStyle = 'rgba(220,240,255,0.5)'; bctx.fillRect(dx, dy, TS, 1); }
    }
  }
  // 地面层特效（预警圈、毒云、传送门光圈在实体层）
  for(const f of G.fx){
    const sx = f.x - camX, sy = f.y - camY;
    if(f.type === 'tele'){
      const k = clamp(f.t / f.dur, 0, 1);
      if(f.t >= 0){
        bctx.fillStyle = `rgba(${f.color},${0.10 + k * 0.16})`;
        bctx.beginPath(); bctx.arc(sx, sy, f.r, 0, TAU); bctx.fill();
        bctx.strokeStyle = `rgba(${f.color},0.8)`; bctx.lineWidth = 1;
        bctx.beginPath(); bctx.arc(sx, sy, f.r * k, 0, TAU); bctx.stroke();
      }
      if(f.meteor && f.t >= 0){
        const fall = 1 - k;
        bctx.fillStyle = '#ff8c2a';
        bctx.beginPath(); bctx.arc(sx + fall * 30, sy - fall * 130, 4 + k * 2, 0, TAU); bctx.fill();
        bctx.fillStyle = '#ffd23c'; bctx.beginPath(); bctx.arc(sx + fall * 30, sy - fall * 130, 2, 0, TAU); bctx.fill();
      }
      if(f.sky === 'ice' && f.t >= 0){ /* 冰锥下坠流光 */
        const fall = 1 - k;
        bctx.fillStyle = f.mcol || '#9adcff';
        bctx.save(); bctx.translate(sx - fall * 14, sy - fall * 110); bctx.rotate(0.45);
        bctx.fillRect(-1.5, -6, 3, 12);
        bctx.fillStyle = '#ffffff'; bctx.fillRect(-0.5, -6, 1, 12);
        bctx.restore();
      }
    } else if(f.type === 'trap'){
      const armed = f.t >= f.arm;
      const pl = armed ? 0.5 + Math.sin(G.t * 6) * 0.3 : 0.25;
      bctx.strokeStyle = `rgba(126,200,74,${pl})`; bctx.lineWidth = 1;
      bctx.beginPath(); bctx.arc(sx, sy, f.r * 0.55, 0, TAU); bctx.stroke();
      bctx.fillStyle = `rgba(126,200,74,${armed ? 0.8 : 0.4})`;
      for(let k2 = 0; k2 < 5; k2++){
        const a = k2 * TAU / 5 + G.t * (armed ? 0.8 : 0);
        const px2 = sx + Math.cos(a) * f.r * 0.32, py2 = sy + Math.sin(a) * f.r * 0.32 * 0.6;
        bctx.beginPath(); bctx.moveTo(px2 - 2, py2 + 1); bctx.lineTo(px2, py2 - 4); bctx.lineTo(px2 + 2, py2 + 1); bctx.closePath(); bctx.fill();
      }
    } else if(f.type === 'vine'){
      const k = f.t / f.dur, hgt = 9 * (k < 0.4 ? k / 0.4 : 1) * (1 - Math.max(0, k - 0.7) / 0.3);
      bctx.fillStyle = `rgba(126,200,74,${1 - k * 0.6})`;
      bctx.beginPath(); bctx.moveTo(sx - 3, sy + 1); bctx.lineTo(sx, sy - hgt); bctx.lineTo(sx + 3, sy + 1); bctx.closePath(); bctx.fill();
      bctx.fillStyle = `rgba(80,140,50,${1 - k * 0.6})`;
      bctx.fillRect(sx - 0.5, sy - hgt * 0.6, 1, hgt * 0.6);
    } else if(f.type === 'cloud'){
      bctx.fillStyle = `rgba(${f.color},0.2)`;
      bctx.beginPath(); bctx.arc(sx, sy, f.r * Math.min(1, f.t * 4), 0, TAU); bctx.fill();
      bctx.strokeStyle = `rgba(${f.color},0.45)`;
      bctx.beginPath(); bctx.arc(sx, sy, f.r * Math.min(1, f.t * 4), 0, TAU); bctx.stroke();
    }
  }
  // 掉落物（光柱在实体下方）
  for(const d of G.drops){
    const sx = d.x - camX, sy = d.y - camY;
    if(sx < -20 || sy < -30 || sx > VW + 20 || sy > VH + 20) continue;
    const bob = Math.sin(G.t * 4 + d.x) * 1.5;
    if(d.kind === 'item'){
      const rc = RARITY[d.it.rarity];
      if(d.it.rarity >= 1){
        const grd = bctx.createLinearGradient(0, sy - 26, 0, sy);
        grd.addColorStop(0, 'rgba(0,0,0,0)');
        const cc = rc.c;
        grd.addColorStop(1, cc + 'aa');
        bctx.fillStyle = grd; bctx.fillRect(sx - 2, sy - 26, 4, 26);
      }
      bctx.fillStyle = 'rgba(8,6,16,0.4)'; bctx.beginPath(); bctx.ellipse(sx, sy + 1, 5, 2, 0, 0, TAU); bctx.fill();
      const ic = SPR.icons[d.it.icon];
      bctx.drawImage(ic, Math.round(sx - ic.width / 2), Math.round(sy - ic.height + bob - 2));
    } else if(d.kind === 'gold'){
      bctx.drawImage(SPR.coin, Math.round(sx - 4), Math.round(sy - 6 + bob));
    } else {
      const ic = SPR.icons[d.pk === 'hp' ? 'potionHP' : 'potionMP'];
      bctx.drawImage(ic, Math.round(sx - 6), Math.round(sy - 10 + bob));
    }
  }
  // 实体（按 y 排序）
  const DRAW = [];
  for(const p of m.props){
    if(p.x < camX - 40 || p.x > camX + VW + 40 || p.y < camY - 50 || p.y > camY + VH + 30) continue;
    DRAW.push({ y: p.y, p, t: 'prop' });
  }
  for(const e of G.enemies){ if(e.x > camX - 40 && e.x < camX + VW + 40 && e.y > camY - 40 && e.y < camY + VH + 40) DRAW.push({ y: e.y, e, t: 'enemy' }); }
  for(const n of G.npcs) DRAW.push({ y: n.y, n, t: 'npc' });
  if(P) DRAW.push({ y: P.y, t: 'player' });
  DRAW.sort((a, b) => a.y - b.y);
  for(const d of DRAW){
    if(d.t === 'prop'){
      const p = d.p, sx = p.x - camX, sy = p.y - camY;
      if(p.kind === 'fountain'){ drawFountain(bctx, sx, sy, G.t); continue; }
      if(p.kind === 'portal'){
        const zd = ZONE_DEFS[p.zone];
        drawPortal(bctx, sx, sy, G.t, !!(zd && zd.req && !G.bossKills[zd.req]));
        continue;
      }
      let spr = p.spr;
      if(p.kind === 'torch') spr = SPR.props.torch[Math.floor(G.t * 6) % 2];
      if(!spr) continue;
      bctx.drawImage(spr, Math.round(sx - spr.width / 2), Math.round(sy - spr.height));
      continue;
    }
    if(d.t === 'enemy'){
      const e = d.e, sx = Math.round(e.x - camX), sy = Math.round(e.y - camY);
      const spr = enemySprite(e);
      const bob = e.fly ? Math.sin(G.t * 6 + e.walkT) * 2 - 4 : (e.boss ? Math.sin(G.t * 2.4) * 1.2 : 0);
      bctx.drawImage(SPR.shadow, sx - 7, sy - 3);
      if(e.elite){
        const mc = e.mod ? e.mod.col : '255,210,60';
        // 双层地面光环
        bctx.strokeStyle = `rgba(${mc},${0.55 + Math.sin(G.t * 5) * 0.3})`; bctx.lineWidth = 1.5;
        bctx.beginPath(); bctx.ellipse(sx, sy - 1, e.size + 5, (e.size + 5) * 0.45, 0, 0, TAU); bctx.stroke();
        bctx.strokeStyle = `rgba(${mc},0.3)`; bctx.lineWidth = 1;
        bctx.beginPath(); bctx.ellipse(sx, sy - 1, e.size + 9, (e.size + 9) * 0.45, 0, 0, TAU); bctx.stroke();
        // 升腾粒子
        if(chance(0.14)) addPart(sx + camX + rnd(-e.size, e.size), e.y - rnd(0, 6), 0, -22, 0.5, `rgb(${mc})`, 1.6);
        // ward 护盾视觉
        if(e.mod && e.mod.k === 'ward' && e.wardT > 0){
          bctx.strokeStyle = `rgba(232,200,74,${0.5 + Math.sin(G.t * 10) * 0.3})`; bctx.lineWidth = 1.5;
          bctx.beginPath(); bctx.arc(sx, sy - spr.height / 2, spr.height * 0.7, 0, TAU); bctx.stroke();
        }
        bctx.lineWidth = 1;
      }
      const dy2 = Math.round(sy - spr.height + bob);
      bctx.drawImage(spr, Math.round(sx - spr.width / 2), dy2);
      if(e.hitFlash > 0) bctx.drawImage(whiteOf(spr), Math.round(sx - spr.width / 2), dy2);
      if(e.chill > 0){ bctx.fillStyle = 'rgba(120,200,255,0.25)'; bctx.fillRect(Math.round(sx - spr.width / 2), dy2, spr.width, spr.height); }
      if(e.stun > 0){ bctx.fillStyle = '#ffd23c'; const a = G.t * 6;
        bctx.fillRect(sx + Math.cos(a) * 6 - 1, sy - spr.height - 5 + Math.sin(a) * 2, 2, 2); }
      if(e.elite){
        // 精英血条更宽 + 词缀名牌
        const w2 = 24, by3 = sy - spr.height - 9 + bob;
        bctx.fillStyle = 'rgba(10,8,20,0.85)'; bctx.fillRect(sx - w2/2, by3, w2, 3);
        bctx.fillStyle = e.mod ? e.mod.c : '#ffd23c';
        bctx.fillRect(sx - w2/2, by3, w2 * clamp(e.hp / e.maxHP, 0, 1), 3);
        bctx.strokeStyle = 'rgba(0,0,0,0.5)'; bctx.strokeRect(sx - w2/2 - 0.5, by3 - 0.5, w2 + 1, 4);
        if(e.mod) txt(e.mod.name, sx, by3 - 11, { a: 'center', s: 9, b: true, c: e.mod.c });
      } else if(!e.boss && e.hp < e.maxHP){
        const w2 = 16;
        bctx.fillStyle = 'rgba(10,8,20,0.8)'; bctx.fillRect(sx - w2/2, sy - spr.height - 5 + bob, w2, 2.5);
        bctx.fillStyle = '#e05a5a';
        bctx.fillRect(sx - w2/2, sy - spr.height - 5 + bob, w2 * clamp(e.hp / e.maxHP, 0, 1), 2.5);
      }
      continue;
    }
    if(d.t === 'npc'){
      const n = d.n, sx = Math.round(n.x - camX), sy = Math.round(n.y - camY);
      const spr = heroFrame(n.frames, n.dir, n.walkT, n.moving);
      bctx.drawImage(SPR.shadow, sx - 7, sy - 3);
      bctx.drawImage(spr, sx - 8, sy - spr.height);
      continue;
    }
    // 玩家
    const sx = Math.round(P.x - camX), sy = Math.round(P.y - camY);
    bctx.drawImage(SPR.shadow, sx - 7, sy - 3);
    if(P.invT > 0 && Math.floor(G.t * 14) % 2 === 0){ /* 受击闪烁 */ }
    else {
      const spr = heroFrame(SPR.hero[P.cls], P.dir, P.walkT, P.moving || P.dashT > 0);
      const dy2 = sy - spr.height;
      bctx.drawImage(spr, sx - 8, dy2);
      if(P.hitFlash > 0) bctx.drawImage(whiteOf(spr), sx - 8, dy2);
      if(P.cls === 'mage') bctx.drawImage(SPR.magehat, sx - 7, dy2 - 4);
      for(let bi = 0; bi < Math.min(2, P.buffs.length); bi++){
        const b = P.buffs[bi];
        bctx.strokeStyle = b.c; bctx.globalAlpha = 0.4 + Math.sin(G.t * 7 + bi * 2) * 0.2;
        bctx.beginPath(); bctx.ellipse(sx, sy - 1, 8 + bi * 3, 4 + bi * 1.5, 0, 0, TAU); bctx.stroke();
      }
      bctx.globalAlpha = 1;
      if(P.orbit){
        const o = P.orbit;
        for(let k = 0; k < o.n; k++){
          const a = o.ang + k * TAU / o.n;
          const bx2 = sx + Math.cos(a) * 17, by2 = sy - 7 + Math.sin(a) * 9;
          bctx.save(); bctx.translate(bx2, by2); bctx.rotate(a + Math.PI / 2);
          bctx.fillStyle = '#dfe4ee'; bctx.fillRect(-1, -5, 2, 9);
          bctx.fillStyle = '#8a93a8'; bctx.fillRect(-1, 2, 2, 2);
          bctx.fillStyle = '#ffffff'; bctx.fillRect(-0.5, -5, 1, 6);
          bctx.restore();
          if(chance(0.06)) addPart(P.x + Math.cos(a) * 17, P.y - 7 + Math.sin(a) * 9, 0, 0, 0.18, '#e8e0d0', 1.5);
        }
      }
    }
  }
  // 投射物
  for(const p of G.projs){
    const sx = p.x - camX, sy = p.y - camY;
    if(p.spin){
      bctx.save(); bctx.translate(sx, sy); bctx.rotate(G.t * 16 + p.x * 0.1);
      bctx.fillStyle = '#8a5a30'; bctx.fillRect(-1, -5, 2, 10);
      bctx.fillStyle = p.color; bctx.fillRect(0, -5, 4, 4);
      bctx.fillStyle = '#fff0c0'; bctx.fillRect(3, -5, 1, 4);
      bctx.restore();
    } else if(p.arrow){
      const a = Math.atan2(p.vy, p.vx);
      bctx.save(); bctx.translate(sx, sy); bctx.rotate(a);
      bctx.fillStyle = '#8a5a30'; bctx.fillRect(-4, -0.5, 6, 1);
      bctx.fillStyle = p.color; bctx.fillRect(2, -1, 3, 2);
      bctx.restore();
    } else {
      const grd = bctx.createRadialGradient(sx, sy, 0.5, sx, sy, p.size + 3);
      grd.addColorStop(0, '#fff'); grd.addColorStop(0.4, p.color); grd.addColorStop(1, 'rgba(0,0,0,0)');
      bctx.fillStyle = grd;
      bctx.beginPath(); bctx.arc(sx, sy, p.size + 3, 0, TAU); bctx.fill();
    }
  }
  // 即时特效
  for(const f of G.fx){
    const sx = f.x - camX, sy = f.y - camY;
    if(f.type === 'slash'){
      const k = f.t / f.dur;
      bctx.strokeStyle = `rgba(232,224,208,${1 - k})`; bctx.lineWidth = 2.5;
      bctx.beginPath(); bctx.arc(sx, sy - 5, f.r, f.ang - 1.1 + k * 0.6, f.ang + 1.1 + k * 0.6); bctx.stroke();
      bctx.lineWidth = 1;
    } else if(f.type === 'whirl'){
      const k = f.t / f.dur;
      bctx.strokeStyle = `rgba(255,210,60,${1 - k})`; bctx.lineWidth = 2;
      const a0 = k * 9;
      bctx.beginPath(); bctx.arc(sx, sy - 4, f.r * (0.5 + k * 0.5), a0, a0 + 2.2); bctx.stroke();
      bctx.beginPath(); bctx.arc(sx, sy - 4, f.r * (0.4 + k * 0.5), a0 + Math.PI, a0 + Math.PI + 2.2); bctx.stroke();
      bctx.lineWidth = 1;
    } else if(f.type === 'ring'){
      const k = f.t / f.dur;
      bctx.strokeStyle = f.color; bctx.globalAlpha = 1 - k; bctx.lineWidth = 2;
      bctx.beginPath(); bctx.arc(sx, sy, f.r + (f.max - f.r) * k, 0, TAU); bctx.stroke();
      bctx.globalAlpha = 1; bctx.lineWidth = 1;
    } else if(f.type === 'bolt'){
      const k = f.t / f.dur;
      bctx.strokeStyle = `rgba(${f.c || '140,200,255'},${1 - k})`; bctx.lineWidth = 2;
      bctx.beginPath();
      const x1 = f.x1 - camX, yy1 = f.y1 - camY, x2 = f.x2 - camX, yy2 = f.y2 - camY;
      bctx.moveTo(x1, yy1);
      for(let s = 1; s <= 4; s++){
        const tt = s / 5;
        bctx.lineTo(lerp(x1, x2, tt) + rnd(-4, 4), lerp(yy1, yy2, tt) + rnd(-4, 4));
      }
      bctx.lineTo(x2, yy2); bctx.stroke();
      bctx.strokeStyle = `rgba(255,255,255,${1 - k})`; bctx.lineWidth = 1;
      bctx.beginPath(); bctx.moveTo(x1, yy1); bctx.lineTo(x2, yy2); bctx.stroke();
    } else if(f.type === 'arc'){
      const k = f.t / f.dur;
      bctx.strokeStyle = f.c || '#ffd23c'; bctx.globalAlpha = 1 - k; bctx.lineWidth = 3;
      bctx.beginPath(); bctx.arc(sx, sy, f.r * (0.7 + k * 0.5), f.a - 1.2 + k * 1.0, f.a + 1.2 + k * 1.0); bctx.stroke();
      bctx.lineWidth = 1.2; bctx.strokeStyle = '#ffffff';
      bctx.beginPath(); bctx.arc(sx, sy, f.r * (0.7 + k * 0.5) - 2, f.a - 0.8 + k * 1.0, f.a + 0.8 + k * 1.0); bctx.stroke();
      bctx.globalAlpha = 1;
    } else if(f.type === 'boltSky'){
      const k = f.t / f.dur;
      bctx.strokeStyle = `rgba(216,190,255,${1 - k})`; bctx.lineWidth = 2.5;
      bctx.beginPath(); bctx.moveTo(sx + 6, sy - VH);
      for(let s2 = 1; s2 <= 5; s2++) bctx.lineTo(sx + rnd(-7, 7), sy - (VH / 6) * (6 - s2) - 6);
      bctx.lineTo(sx, sy - 3); bctx.stroke();
      bctx.strokeStyle = `rgba(255,255,255,${1 - k})`; bctx.lineWidth = 1;
      bctx.beginPath(); bctx.moveTo(sx + 6, sy - VH); bctx.lineTo(sx, sy - 3); bctx.stroke();
      bctx.fillStyle = `rgba(232,220,255,${(1 - k) * 0.85})`;
      bctx.beginPath(); bctx.ellipse(sx, sy, 12 * (1 - k * 0.4), 5 * (1 - k * 0.4), 0, 0, TAU); bctx.fill();
      bctx.lineWidth = 1;
    } else if(f.type === 'after'){
      const k = f.t / f.dur;
      const fr = f.espr || heroFrame(SPR.hero[f.cls], f.dir, 0, false);
      bctx.globalAlpha = (1 - k) * 0.45;
      bctx.drawImage(fr, Math.round(sx - fr.width / 2), Math.round(sy - fr.height));
      bctx.globalAlpha = 1;
    } else if(f.type === 'aura'){
      const k = f.t / f.dur;
      bctx.strokeStyle = f.c; bctx.globalAlpha = (1 - k) * 0.9; bctx.lineWidth = 2;
      bctx.beginPath(); bctx.ellipse(sx, sy, 8 + k * 16, 4 + k * 8, 0, 0, TAU); bctx.stroke();
      bctx.globalAlpha = (1 - k) * 0.5;
      bctx.beginPath(); bctx.ellipse(sx, sy - k * 14, 7, 3.5, 0, 0, TAU); bctx.stroke();
      bctx.globalAlpha = 1; bctx.lineWidth = 1;
      if(chance(0.5)) addPart(f.x + rnd(-7, 7), f.y - rnd(0, 6), 0, -36, 0.5, f.c, 1.8);
    }
  }
  // 粒子
  for(const p of G.parts){
    bctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    bctx.fillStyle = p.color;
    bctx.fillRect(p.x - camX - p.size / 2, p.y - camY - p.size / 2, p.size, p.size);
  }
  bctx.globalAlpha = 1;
  // 光照与昼夜（由区域定义驱动）
  const zd = ZONE_DEFS[G.zone];
  let dark = 0, tint = null;
  if(G.zone === 'town' || (zd && zd.dayCycle)) dark = dayFactor() * 0.62;
  else if(zd){ dark = zd.dark || 0; tint = zd.tint || null; }
  if(dark > 0.04){
    lctx.clearRect(0, 0, VW, VH);
    lctx.fillStyle = `rgba(8,6,28,${dark})`;
    lctx.fillRect(0, 0, VW, VH);
    lctx.globalCompositeOperation = 'destination-out';
    const lights = [];
    for(const L of m.lights) lights.push(L);
    if(P) lights.push({ x: P.x, y: P.y - 6, r: (zd && zd.lightR) || 52, c: '255,220,160', steady: true });
    for(const p of G.projs) if(!p.arrow) lights.push({ x: p.x, y: p.y, r: 18, c: '255,200,120', steady: true });
    for(const L of lights){
      const sx = L.x - camX, sy = L.y - camY;
      if(sx < -L.r || sy < -L.r || sx > VW + L.r || sy > VH + L.r) continue;
      /* 玩家/弹体光圈恒定微呼吸；火把按各自固定相位摇曳（修复随移动频闪） */
      const fl = L.steady ? 0.985 + Math.sin(G.t * 2.2) * 0.015
                          : 0.92 + Math.sin(G.t * 9 + (L.ph != null ? L.ph : (L.ph = (L.x * 0.7 + L.y * 1.3) % TAU))) * 0.08;
      const grd = lctx.createRadialGradient(sx, sy, 1, sx, sy, L.r * fl);
      grd.addColorStop(0, 'rgba(0,0,0,1)');
      grd.addColorStop(0.55, 'rgba(0,0,0,0.75)');
      grd.addColorStop(1, 'rgba(0,0,0,0)');
      lctx.fillStyle = grd;
      lctx.beginPath(); lctx.arc(sx, sy, L.r * fl, 0, TAU); lctx.fill();
    }
    lctx.globalCompositeOperation = 'source-over';
    bctx.drawImage(LC, 0, 0);
  }
  if(tint){ bctx.fillStyle = tint; bctx.fillRect(0, 0, VW, VH); }
  G._cam = { x: camX, y: camY };
  /* 将低分辨率世界缓冲放大合成到主画布；缺少此步会导致进入地图后只显示黑色背景。 */
  ctx.drawImage(buf, 0, 0, W, H);
}
function w2s(x, y){ return { x: (x - G._cam.x) * 2, y: (y - G._cam.y) * 2 }; }

/* ----------------------------- 22. UI 基础设施（字体/面板/按钮/点击） ----------------------------- */
const FONT = (s, b) => `${b ? 'bold ' : ''}${s}px "Microsoft YaHei","PingFang SC",sans-serif`;
function txt(t, x, y, o){
  o = o || {};
  ctx.font = FONT(o.s || 13, o.b);
  ctx.textAlign = o.a || 'left';
  ctx.textBaseline = o.bl || 'top';
  if(o.shadow !== false){ ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillText(t, x + 1, y + 1); }
  ctx.fillStyle = o.c || '#e8e0d0';
  ctx.fillText(t, x, y);
}
function bar(x, y, w, h, frac, fg, bg){
  ctx.fillStyle = bg || '#16131f';
  ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
  ctx.fillStyle = '#000';
  ctx.fillRect(x, y, w, h);
  if(frac > 0){
    ctx.fillStyle = fg;
    ctx.fillRect(x, y, Math.max(1, Math.round(w * clamp(frac, 0, 1))), h);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fillRect(x, y, Math.max(1, Math.round(w * clamp(frac, 0, 1))), Math.max(1, h * 0.35 | 0));
  }
  ctx.strokeStyle = '#0a0812'; ctx.lineWidth = 1;
  ctx.strokeRect(x - 0.5, y - 0.5, w + 1, h + 1);
}
function panel(x, y, w, h, title){
  ctx.fillStyle = 'rgba(12,10,22,0.94)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = '#5a4a78'; ctx.lineWidth = 2;
  ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
  ctx.strokeStyle = '#241d38'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 4.5, y + 4.5, w - 9, h - 9);
  if(title){
    ctx.fillStyle = 'rgba(90,74,120,0.25)';
    ctx.fillRect(x + 5, y + 5, w - 10, 26);
    txt(title, x + w / 2, y + 11, { a: 'center', s: 15, b: true, c: '#f0e6c8' });
  }
}
function btn(x, y, w, h, label, cb, o){
  o = o || {};
  const hov = !o.disabled && Mouse.x >= x && Mouse.x <= x + w && Mouse.y >= y && Mouse.y <= y + h;
  ctx.fillStyle = o.disabled ? '#1a1726' : (hov ? (o.hot || '#4a3b66') : (o.bg || '#2c2342'));
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = o.disabled ? '#2a2438' : (hov ? '#9c86c8' : '#5a4a78');
  ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  if(label) txt(label, x + w / 2, y + h / 2, { a: 'center', bl: 'middle', s: o.s || 13, b: o.b,
      c: o.disabled ? '#6a6478' : (o.c || '#e8e0d0') });
  G.uiBtns.push({ x, y, w, h, cb, disabled: o.disabled });
  return hov;
}
function handleClicks(){
  if(!pendingClicks.length) return;
  const btns = G.uiBtns; /* 上一帧注册的按钮 */
  for(const c of pendingClicks){
    for(let i = btns.length - 1; i >= 0; i--){
      const b = btns[i];
      if(!b.disabled && c.x >= b.x && c.x <= b.x + b.w && c.y >= b.y && c.y <= b.y + b.h){
        sfx('ui'); b.cb(); break;
      }
    }
  }
  pendingClicks.length = 0;
}
/* 物品提示框：悬停物品 vs 已装备 —— 左右双栏对比（同类游戏惯例） */
function tipMeasure(it, price){
  const lines = itemLines(it);
  ctx.font = FONT(12);
  let w = 152;
  for(const l of lines) w = Math.max(w, ctx.measureText(l).width + 22);
  ctx.font = FONT(13, true);
  w = Math.max(w, ctx.measureText(it.name).width + 26);
  const h = 20 + 17 + 15 + lines.length * 15 + (price != null ? 16 : 0) + 8;
  return { lines, w, h };
}
function tipPanel(x, y, it, d, head, headC, price, extra){
  const rc = RARITY[it.rarity];
  const h = d.h + (extra && extra.length ? extra.length * 15 + 6 : 0);
  ctx.fillStyle = 'rgba(8,6,16,0.96)';
  ctx.fillRect(x, y, d.w, h);
  ctx.strokeStyle = rc.c; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, d.w - 1, h - 1);
  /* 顶部小标签条：明确哪边是悬停、哪边是已装备 */
  ctx.fillStyle = headC + '2e';
  ctx.fillRect(x + 1, y + 1, d.w - 2, 15);
  txt(head, x + d.w / 2, y + 4, { a: 'center', s: 10, b: true, c: headC });
  let yy = y + 21;
  txt(it.name, x + 10, yy, { c: rc.c, b: true, s: 13 }); yy += 17;
  txt(`${rc.name} · ${SLOT_NAME[it.slot] || ''}  iLv.${it.ilvl}`, x + 10, yy, { c: '#9a93ad', s: 11 }); yy += 15;
  for(const l of d.lines){
    txt(l, x + 10, yy, { s: 12, c: l === it.flavor ? '#c8a36a' : '#cfd2da' }); yy += 15;
  }
  if(price != null){ txt(`价格 ${price} 金币`, x + 10, yy, { s: 12, c: '#ffd23e' }); yy += 16; }
  if(extra && extra.length){
    yy += 3;
    ctx.strokeStyle = '#3a3152';
    ctx.beginPath(); ctx.moveTo(x + 8, yy - 2); ctx.lineTo(x + d.w - 8, yy - 2); ctx.stroke();
    for(const e2 of extra){ txt(e2.t, x + 10, yy, { s: 11, b: true, c: e2.c }); yy += 15; }
  }
  return h;
}
function drawTooltip(it, mx, my, opt){
  opt = opt || {};
  let cmp = opt.compare && it.kind === 'gear' ? G.player.equip[it.slot] : null;
  if(cmp && cmp.id === it.id) cmp = null;
  const d1 = tipMeasure(it, opt.price);
  if(!cmp){
    let x = mx + 14, y = clamp(my + 8, 6, H - 6 - d1.h);
    if(x + d1.w > W - 6) x = mx - d1.w - 14;
    x = clamp(x, 6, W - d1.w - 6);
    tipPanel(x, y, it, d1, opt.price != null ? '商品' : '物品', '#bfb8d8', opt.price);
    return;
  }
  /* 数值对比行（绿涨红跌），附在悬停面板底部 */
  const extra = [];
  const dif = (label, a, b) => {
    if(!a && !b) return;
    const dd = (a || 0) - (b || 0);
    extra.push({ t: `${label}  ${dd > 0 ? '▲ +' + dd : dd < 0 ? '▼ ' + dd : '— 持平'}`,
                 c: dd > 0 ? '#7ce08a' : dd < 0 ? '#ff7a7a' : '#9a93ad' });
  };
  dif('伤害对比', it.dmg, cmp.dmg);
  dif('护甲对比', it.armor, cmp.armor);
  const d2 = tipMeasure(cmp, null);
  const gap = 8, total = d1.w + d2.w + gap;
  const hMax = Math.max(d1.h + (extra.length ? extra.length * 15 + 6 : 0), d2.h);
  let x = mx + 14;
  if(x + total > W - 6) x = mx - total - 14;
  x = clamp(x, 6, W - total - 6);
  const y = clamp(my + 8, 6, H - 6 - hMax);
  /* 左：已装备 · 右：悬停物品 */
  tipPanel(x, y, cmp, d2, '已 装 备', '#9a93ad', null);
  tipPanel(x + d2.w + gap, y, it, d1, opt.price != null ? '商品 · 悬停' : '悬停物品', '#ffd98a', opt.price, extra);
}

/* ----------------------------- 23. HUD（战斗界面） ----------------------------- */
const SKILL_COLORS = ['#ffd23e', '#ff7a3c', '#5ec8ff', '#c06bff'];
function renderHUD(){
  const P = G.player; if(!P) return;
  const m = G.map;

  /* —— 左上：区域 / 等级 / 金币 —— */
  const zname = G.zone === 'town' ? '翡翠镇' : ZONE_DEFS[G.zone].name;
  ctx.fillStyle = 'rgba(10,8,20,0.55)';
  ctx.fillRect(8, 8, 200, 58);
  ctx.strokeStyle = '#3a3152'; ctx.strokeRect(8.5, 8.5, 199, 57);
  txt(zname, 16, 14, { s: 14, b: true, c: '#f0e6c8' });
  txt(`Lv.${P.lvl} ${CLASSES[P.cls].name}` + (G.ng > 0 ? ` · ${G.ng + 1}周目` : ''), 16, 32, { s: 12, c: '#bfb8d8' });
  /* 昼夜指示图标（仅有昼夜循环的区域显示） */
  const zdh = ZONE_DEFS[G.zone];
  if(G.zone === 'town' || (zdh && zdh.dayCycle)){
    const dt2 = G.dayT, ix = 190, iy = 22;
    const phase = dt2 < 70 ? 0 : dt2 < 92 ? 1 : dt2 < 132 ? 2 : dt2 < 150 ? 3 : 0;
    if(phase === 2){ /* 夜 — 弯月 */
      ctx.fillStyle = '#dce8ff';
      ctx.beginPath(); ctx.arc(ix, iy, 7, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(10,8,20,0.95)';
      ctx.beginPath(); ctx.arc(ix - 4, iy - 2, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = '#dce8ff';
      ctx.fillRect(ix - 12, iy - 6, 1, 1); ctx.fillRect(ix + 8, iy + 4, 1, 1); ctx.fillRect(ix + 5, iy - 8, 1, 1);
    } else { /* 日 / 暮 / 晨 — 太阳 */
      const col = phase === 0 ? '#ffd23e' : phase === 1 ? '#ff9a4a' : '#ffe8a8';
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      for(let k = 0; k < 8; k++){
        const a = k * TAU / 8 + G.t * 0.15;
        ctx.beginPath();
        ctx.moveTo(ix + Math.cos(a) * 8, iy + Math.sin(a) * 8);
        ctx.lineTo(ix + Math.cos(a) * 10.5, iy + Math.sin(a) * 10.5);
        ctx.stroke();
      }
      ctx.lineWidth = 1;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(ix, iy, 6, 0, TAU); ctx.fill();
      if(phase !== 0){ ctx.fillStyle = 'rgba(160,60,20,0.4)'; ctx.beginPath(); ctx.arc(ix, iy + 2, 5.5, Math.PI * 0.05, Math.PI * 0.95); ctx.fill(); }
    }
  }
  txt(`◆ ${P.gold}`, 120, 32, { s: 12, c: '#ffd23e' });
  bar(16, 50, 184, 5, P.xp / xpNeed(P.lvl), '#c8a850');
  txt(`经验 ${P.xp}/${xpNeed(P.lvl)}`, 18, 56, { s: 9, c: '#8d87a0', shadow: false });

  /* —— 任务追踪 —— */
  if(G.quest){
    const q = G.quest;
    ctx.fillStyle = 'rgba(10,8,20,0.5)';
    ctx.fillRect(8, 72, 200, 34);
    txt('◈ ' + q.name, 16, 76, { s: 12, b: true, c: '#ffd98a' });
    const urgent = q.type === 'timed' && q.active && q.timeLeft < 10;
    txt(questObjText(q), 16, 91, { s: 11, c: q.got >= q.need ? '#7ce08a' : urgent ? '#ff6a6a' : '#bfb8d8' });
  }

  /* —— 右上：小地图 —— */
  if(m && m.mini){
    const bw = 150, bh = 114, bx = W - bw - 10, by = 10;
    ctx.fillStyle = 'rgba(8,6,16,0.78)';
    ctx.fillRect(bx - 4, by - 4, bw + 8, bh + 8);
    ctx.strokeStyle = '#3a3152'; ctx.strokeRect(bx - 3.5, by - 3.5, bw + 7, bh + 7);
    const sc = Math.min(bw / m.w, bh / m.h);
    const mw = m.w * sc, mh = m.h * sc, ox = bx + (bw - mw) / 2, oy = by + (bh - mh) / 2;
    ctx.drawImage(m.mini, ox, oy, mw, mh);
    ctx.drawImage(m.fog, ox, oy, mw, mh);
    /* 标记点 */
    const dot = (wx, wy, c, r) => {
      ctx.fillStyle = c;
      ctx.fillRect(ox + (wx / TS) * sc - r, oy + (wy / TS) * sc - r, r * 2, r * 2);
    };
    for(const pr of m.props) if(pr.kind === 'portal') dot(pr.x, pr.y, '#54e0c8', 1.5);
    if(m.marks.boss){
      const b = m.marks.boss;
      if(!m.bossSeen && dist(P.x, P.y, b.x, b.y) < 190) m.bossSeen = true;
      if(m.bossSeen) dot(b.x, b.y, '#ff4a4a', 2);
    }
    for(const e of G.enemies){
      if(!e.dead && e.aggro && dist(e.x, e.y, P.x, P.y) < 170) dot(e.x, e.y, 'rgba(255,90,90,0.9)', 1);
    }
    dot(P.x, P.y, '#ffd23e', 2);
    if(G.zone === 'town') txt('北侧传送门 · 交互选择目的地', bx + bw / 2 - 2, by + bh + 6, { a: 'center', s: 9, c: '#8d87a0' });
  }

  /* —— Boss 血条 —— */
  if(G.boss && !G.boss.dead){
    const b = G.boss, bd = BOSS_DEFS[b.bossId];
    const bw2 = 430, bx2 = W / 2 - bw2 / 2;
    txt(`${bd.name} · ${bd.title}`, W / 2, 16, { a: 'center', s: 14, b: true, c: bd.color });
    bar(bx2, 36, bw2, 10, b.hp / b.maxHP, bd.color);
    if(b.phase === 1) txt('狂暴！', bx2 + bw2 + 10, 33, { s: 12, b: true, c: '#ff5a3c' });
  }

  /* —— 底部：生命/法力 + 技能栏 —— */
  const hy = H - 64;
  ctx.fillStyle = 'rgba(10,8,20,0.6)';
  ctx.fillRect(8, hy - 6, 226, 62);
  ctx.strokeStyle = '#3a3152'; ctx.strokeRect(8.5, hy - 5.5, 225, 61);
  bar(16, hy + 2, 200, 13, P.hp / P.stats.maxHP, P.hp / P.stats.maxHP < 0.3 ? '#ff3a3a' : '#d04848');
  txt(`${Math.ceil(P.hp)} / ${P.stats.maxHP}`, 116, hy + 3, { a: 'center', s: 10, c: '#fff' });
  bar(16, hy + 21, 200, 11, P.mp / P.stats.maxMP, '#3e7ad8');
  txt(`${Math.floor(P.mp)} / ${P.stats.maxMP}`, 116, hy + 21, { a: 'center', s: 9, c: '#dce8ff' });
  if(P.poison && P.poison.t > 0) txt('☠ 中毒', 16, hy + 38, { s: 11, c: '#8ade6a' });
  let bx0 = 70;
  for(let bi = 0; bi < Math.min(4, P.buffs.length); bi++){
    const b = P.buffs[bi], bw = b.n.length * 11 + 14;
    ctx.fillStyle = 'rgba(8,6,16,0.7)'; ctx.fillRect(bx0, hy + 36, bw, 16);
    ctx.fillStyle = b.c; ctx.fillRect(bx0, hy + 50, bw * clamp(b.t / b.dur, 0, 1), 2);
    txt('▲ ' + b.n, bx0 + 4, hy + 38, { s: 10, c: b.c });
    bx0 += bw + 6;
  }

  /* 技能槽 */
  const slotS = 44, gap = 7;
  const totalW = slotS * 4 + gap * 3;
  let sx = W / 2 - totalW / 2;
  const sy = H - slotS - 14;
  TOUCH.zones.length = 0;
  for(let i = 0; i < 4; i++){
    const key = P.loadout[i], sk = key ? SKILLS[key] : null;
    const x = sx + i * (slotS + gap);
    ctx.fillStyle = '#16131f';
    ctx.fillRect(x, sy, slotS, slotS);
    if(sk){
      const cc = skillColor(key);
      const noMana = P.mp < sk.mp;
      ctx.fillStyle = noMana ? '#3a3550' : cc;
      ctx.beginPath();
      ctx.moveTo(x + slotS / 2, sy + 7); ctx.lineTo(x + slotS - 9, sy + slotS / 2 - 2);
      ctx.lineTo(x + slotS / 2, sy + slotS - 11); ctx.lineTo(x + 9, sy + slotS / 2 - 2);
      ctx.closePath(); ctx.fill();
      txt(sk.name[0], x + slotS / 2, sy + slotS / 2 - 3, { a: 'center', bl: 'middle', s: 14, b: true,
          c: '#16131f', shadow: false });
      if(P.skillCd[i] > 0){
        const f = P.skillCd[i] / sk.cd;
        ctx.fillStyle = 'rgba(6,4,14,0.78)';
        ctx.fillRect(x, sy + slotS * (1 - f), slotS, slotS * f);
        txt(P.skillCd[i].toFixed(1), x + slotS / 2, sy + slotS / 2 - 2, { a: 'center', bl: 'middle', s: 12, b: true, c: '#fff' });
      }
      txt(sk.mp + '', x + slotS - 4, sy + slotS - 13, { a: 'right', s: 9, c: noMana ? '#ff7a7a' : '#7aa0e8' });
      if(!G.ui) G.uiBtns.push({ x, y: sy, w: slotS, h: slotS, cb: (j => () => castSkill(j))(i) });
      if(TOUCH.enabled && G.state === 'play' && !G.ui)
        TOUCH.zones.push({ id: 's' + (i + 1), x: x + slotS / 2, y: sy + slotS / 2, r: slotS / 2 + 2, act: 's' + (i + 1) });
      if(Mouse.x >= x && Mouse.x <= x + slotS && Mouse.y >= sy && Mouse.y <= sy + slotS && !G.ui){
        ctx.fillStyle = 'rgba(8,6,16,0.94)';
        const tw = 190, tx = clamp(x + slotS / 2 - tw / 2, 6, W - tw - 6), ty = sy - 64;
        ctx.fillRect(tx, ty, tw, 56);
        ctx.strokeStyle = cc; ctx.strokeRect(tx + 0.5, ty + 0.5, tw - 1, 55);
        txt(`${sk.name}  (耗蓝${sk.mp} / 冷却${sk.cd}s)`, tx + 8, ty + 6, { s: 11, b: true, c: cc });
        txt(sk.desc, tx + 8, ty + 22, { s: 10, c: '#cfd2da' });
        txt(key === 'basic' ? '通用 · 常驻普通攻击' : `「${skillMeta(key).bname}」系 第${skillMeta(key).tier + 1}阶 · Lv.${skillRank(key)}/5` + (skillRank(key) > 1 ? `（效果+${(skillRank(key) - 1) * 18}%）` : ''), tx + 8, ty + 38, { s: 9, c: '#8d87a0' });
      }
    } else {
      txt('+', x + slotS / 2, sy + slotS / 2 - 3, { a: 'center', bl: 'middle', s: 20, c: '#3e3852', shadow: false });
      txt('K', x + slotS / 2, sy + slotS - 13, { a: 'center', s: 9, c: '#55506a' });
      if(!G.ui) G.uiBtns.push({ x, y: sy, w: slotS, h: slotS, cb: () => { openUI('skilltree'); sfx('ui'); } });
    }
    ctx.strokeStyle = sk ? '#5a4a78' : '#2a2438';
    ctx.strokeRect(x + 0.5, sy + 0.5, slotS - 1, slotS - 1);
    txt(['L','R','Q','E'][i], x + 4, sy + 3, { s: 10, b: true, c: '#bfb8d8' });
  }
  if(P.sp > 0){
    const spw = 132, spx = W / 2 - spw / 2, spy = sy - 27;
    const gl = 0.6 + Math.sin(G.t * 4) * 0.25;
    ctx.fillStyle = 'rgba(8,6,16,0.88)'; ctx.fillRect(spx, spy, spw, 21);
    ctx.strokeStyle = `rgba(126,200,74,${gl})`; ctx.strokeRect(spx + 0.5, spy + 0.5, spw - 1, 20);
    txt(`技能点 ×${P.sp} · 按K强化`, spx + spw / 2, spy + 5, { a: 'center', s: 10, b: true, c: '#9ae08a' });
    if(!G.ui) G.uiBtns.push({ x: spx, y: spy, w: spw, h: 21, cb: () => { openUI('skilltree'); sfx('ui'); } });
  }

  /* 药剂 / 冲刺 */
  const px2 = sx - 58;
  ctx.drawImage(SPR.icons.potionHP, px2, sy + 2, 24, 24);
  txt('1×' + P.potions.hp, px2 + 12, sy + 28, { a: 'center', s: 10, c: P.potions.hp ? '#ff9a9a' : '#6a6478' });
  ctx.drawImage(SPR.icons.potionMP, px2 + 28, sy + 2, 24, 24);
  txt('2×' + P.potions.mp, px2 + 40, sy + 28, { a: 'center', s: 10, c: P.potions.mp ? '#9ab8ff' : '#6a6478' });
  if(P.potCd > 0){
    ctx.fillStyle = 'rgba(6,4,14,0.6)';
    ctx.fillRect(px2, sy + 2, 52, 24);
  }
  if(!G.ui){
    G.uiBtns.push({ x: px2, y: sy, w: 24, h: 30, cb: () => usePotion('hp') });
    G.uiBtns.push({ x: px2 + 28, y: sy, w: 24, h: 30, cb: () => usePotion('mp') });
  }
  const dx2 = sx + totalW + 14;
  ctx.strokeStyle = P.dashCd > 0 ? '#3a3550' : '#7ce0d8';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(dx2 + 14, sy + 16, 13, 0, TAU * (P.dashCd > 0 ? 1 - P.dashCd / 1.1 : 1)); ctx.stroke();
  ctx.lineWidth = 1;
  txt('冲', dx2 + 14, sy + 16, { a: 'center', bl: 'middle', s: 12, c: P.dashCd > 0 ? '#6a6478' : '#7ce0d8' });
  txt('空格', dx2 + 14, sy + 32, { a: 'center', s: 9, c: '#8d87a0' });

  /* 右下快捷键提示 */
  txt('I 背包  C 角色  M 音乐  H 帮助', W - 14, H - 18, { a: 'right', s: 10, c: 'rgba(160,152,180,0.75)' });

  /* —— 互动提示 —— */
  const it = nearestInteract();
  if(it){
    const s = w2s(it.x, it.y - 26);
    const label = interactLabel(it);
    ctx.font = FONT(12, true);
    const tw = ctx.measureText(label).width + 34;
    ctx.fillStyle = 'rgba(8,6,16,0.85)';
    ctx.fillRect(s.x - tw / 2, s.y - 10, tw, 20);
    ctx.strokeStyle = '#ffd98a'; ctx.strokeRect(s.x - tw / 2 + 0.5, s.y - 9.5, tw - 1, 19);
    txt('[E] ' + label, s.x, s.y, { a: 'center', bl: 'middle', s: 12, b: true, c: '#ffd98a' });
  }

  /* —— 聊天框 —— */
  let cy = H - 84;
  for(let i = G.chat.length - 1; i >= 0; i--){
    const c = G.chat[i], age = G.t - c.t;
    if(age > 11) continue;
    const a = age > 9 ? 1 - (age - 9) / 2 : 1;
    ctx.globalAlpha = a;
    ctx.font = FONT(11);
    const tw = ctx.measureText(c.msg).width;
    ctx.fillStyle = 'rgba(8,6,16,0.55)';
    ctx.fillRect(8, cy - 2, tw + 12, 16);
    txt(c.msg, 14, cy, { s: 11, c: c.color });
    ctx.globalAlpha = 1;
    cy -= 17;
  }

  /* —— NPC 气泡 —— */
  for(const n of G.npcs){
    if(!n.bubble || n.bubbleT <= 0) continue;
    const s = w2s(n.x, n.y - 22);
    ctx.font = FONT(11);
    const tw = ctx.measureText(n.bubble).width + 14;
    ctx.fillStyle = 'rgba(245,240,228,0.94)';
    ctx.fillRect(s.x - tw / 2, s.y - 18, tw, 18);
    ctx.beginPath();
    ctx.moveTo(s.x - 4, s.y); ctx.lineTo(s.x + 4, s.y); ctx.lineTo(s.x, s.y + 5);
    ctx.closePath(); ctx.fill();
    txt(n.bubble, s.x, s.y - 14, { a: 'center', s: 11, c: '#2a2430', shadow: false });
  }

  /* —— 伤害飘字 —— */
  for(const t of G.texts){
    const s = w2s(t.x, t.y);
    const a = 1 - Math.pow(t.t / t.dur, 2);
    ctx.globalAlpha = a;
    txt(t.txt, s.x, s.y, { a: 'center', s: t.size * 2, b: true, c: t.color });
    ctx.globalAlpha = 1;
  }

  /* —— 触屏控件 —— */
  if(TOUCH.enabled && G.state === 'play' && !G.ui){
    /* 摇杆 */
    if(TOUCH.joyId !== -1){
      ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(TOUCH.joyOx, TOUCH.joyOy, 42, 0, TAU); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath(); ctx.arc(TOUCH.joyOx + TOUCH.joyDx * 0.7, TOUCH.joyOy + TOUCH.joyDy * 0.7, 17, 0, TAU); ctx.fill();
      ctx.lineWidth = 1;
    }
    /* 辅助小键（技能位 s1-s4 由上方技能栏触屏区提供；这里是药水/冲刺/互动/菜单） */
    const ax = W - 70, ay = H - 130;
    const small = [
      { x: ax, y: ay, lab: '冲', tap: 'Space', big: true },
      { x: ax - 60, y: ay + 30, lab: '血', tap: 'Digit1' },
      { x: ax - 80, y: ay - 22, lab: '蓝', tap: 'Digit2' },
      { x: ax - 36, y: ay - 58, lab: '互', tap: 'KeyF' },
      { x: W - 26, y: 140, lab: '包', tap: 'KeyI' },
      { x: W - 26, y: 184, lab: '≡', tap: 'Escape' }
    ];
    for(const b of small){
      const rr = b.big ? 28 : 17;
      ctx.fillStyle = b.big ? 'rgba(90,200,216,0.4)' : 'rgba(44,35,66,0.6)';
      ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.beginPath(); ctx.arc(b.x, b.y, rr, 0, TAU); ctx.stroke();
      txt(b.lab, b.x, b.y, { a: 'center', bl: 'middle', s: b.big ? 16 : 13, b: b.big, c: '#e8e0d0' });
      TOUCH.zones.push({ id: b.lab, x: b.x, y: b.y, r: rr + 3, act: 'tap_' + b.tap, tap: b.tap });
    }
  }
}

/* ----------------------------- 24. 面板（背包/角色/商店/悬赏/暂停/设置/帮助） ----------------------------- */
function openUI(name){ G.ui = name; G.hover = null; G.treeSel = null; G.forgeSel = null; if(name === 'board' && !G.quest && !G.boardOffer) G.boardOffer = genQuest(); }
function closeUI(){ G.ui = null; G.hover = null; G.treeSel = null; }
const EQUIP_ORDER = ['weapon', 'helm', 'armor', 'boots', 'ring', 'amulet'];
const ATTR_NAME = { str: '力量', int: '智力', dex: '敏捷', vit: '体质' };
const ATTR_DESC = { str: '攻击 · 护甲', int: '技能伤害 · 法力', dex: '暴击 · 暴伤 · 移速', vit: '生命 · 生命回复' };

function drawItemCell(x, y, s, it, hovKey){
  ctx.fillStyle = '#16131f';
  ctx.fillRect(x, y, s, s);
  if(it){
    const rc = RARITY[it.rarity];
    ctx.fillStyle = rc.c + '22';
    ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
    const ic = SPR.icons[it.icon];
    if(ic) ctx.drawImage(ic, x + (s - 24) / 2, y + (s - 24) / 2, 24, 24);
    ctx.strokeStyle = rc.c;
  } else ctx.strokeStyle = '#2c2740';
  ctx.strokeRect(x + 0.5, y + 0.5, s - 1, s - 1);
  if(it && Mouse.x >= x && Mouse.x <= x + s && Mouse.y >= y && Mouse.y <= y + s){
    ctx.strokeStyle = '#fff';
    ctx.strokeRect(x + 1.5, y + 1.5, s - 3, s - 3);
    G.hover = Object.assign({ it, mx: Mouse.x, my: Mouse.y }, hovKey);
  }
}

/* ----------------------------- 仓库 ----------------------------- */
function vaultStore(which){ // 'char' | 'share'
  return which === 'share' ? G.acct.vault : curCharVault();
}
function depositItem(invIdx, which){
  const P = G.player, store = vaultStore(which);
  if(invIdx < 0 || invIdx >= P.inv.length) return;
  if(store.length >= VAULT_CAP){ toast('仓库已满', '#e05a5a'); sfx('error'); return; }
  const it = P.inv.splice(invIdx, 1)[0];
  store.push(it); sfx('ui'); persistAccount();
}
function withdrawItem(vIdx, which){
  const P = G.player, store = vaultStore(which);
  if(vIdx < 0 || vIdx >= store.length) return;
  if(P.inv.length >= INV_CAP){ toast('背包已满', '#e05a5a'); sfx('error'); return; }
  const it = store.splice(vIdx, 1)[0];
  P.inv.push(it); sfx('ui'); persistAccount();
}
function depositGold(amt){
  const P = G.player;
  amt = Math.min(amt, P.gold);
  if(amt <= 0) return;
  P.gold -= amt; G.acct.gold += amt; sfx('coin'); saveGame();
}
function withdrawGold(amt){
  amt = Math.min(amt, G.acct.gold);
  if(amt <= 0) return;
  G.acct.gold -= amt; G.player.gold += amt; sfx('coin'); saveGame();
}
function renderVault(){
  const P = G.player, a = G.acct;
  const pw = 660, ph = 446, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
  panel(px, py, pw, ph, '仓库 · 仓管员莫莉');
  btn(px + pw - 32, py + 6, 24, 24, '✕', closeUI);
  if(!G.vaultTab) G.vaultTab = 'char';
  // 标签
  btn(px + 20, py + 36, 110, 26, '角色仓库', () => G.vaultTab = 'char', { bg: G.vaultTab === 'char' ? '#4a3b66' : '#221c34', s: 12 });
  btn(px + 136, py + 36, 110, 26, '共享仓库', () => G.vaultTab = 'share', { bg: G.vaultTab === 'share' ? '#4a3b66' : '#221c34', s: 12 });
  const which = G.vaultTab;
  txt(which === 'char' ? '仅当前角色可存取' : '所有角色共享存取', px + 260, py + 43, { s: 10, c: '#8d87a0' });

  const cell = 34, cols = 8, gap = 2;
  // 左：背包
  txt(`背包 (${P.inv.length}/${INV_CAP})`, px + 24, py + 74, { s: 12, b: true, c: '#bfb8d8' });
  const ix0 = px + 24, iy0 = py + 92;
  for(let i = 0; i < INV_CAP; i++){
    const cx2 = ix0 + (i % 6) * (cell + gap), cy2 = iy0 + Math.floor(i / 6) * (cell + gap);
    const it = P.inv[i];
    drawItemCell(cx2, cy2, cell, it, { src: 'inv', idx: i });
    if(it) G.uiBtns.push({ x: cx2, y: cy2, w: cell, h: cell, cb: (ii => () => depositItem(ii, which))(i) });
  }
  txt('点击存入 →', ix0, iy0 + 4 * (cell + gap) + 6, { s: 10, c: '#7a8a98' });

  // 右：仓库
  const store = vaultStore(which);
  txt(`${which === 'char' ? '角色' : '共享'}仓库 (${store.length}/${VAULT_CAP})`, px + 360, py + 74, { s: 12, b: true, c: which === 'char' ? '#9adcff' : '#ffd98a' });
  const vx0 = px + 360, vy0 = py + 92;
  for(let i = 0; i < VAULT_CAP; i++){
    const cx2 = vx0 + (i % cols) * (cell + gap), cy2 = vy0 + Math.floor(i / cols) * (cell + gap);
    const it = store[i];
    drawItemCell(cx2, cy2, cell, it, { src: 'vault', idx: i });
    if(it) G.uiBtns.push({ x: cx2, y: cy2, w: cell, h: cell, cb: (ii => () => withdrawItem(ii, which))(i) });
  }
  txt('← 点击取出', vx0, vy0 + 5 * (cell + gap) + 6, { s: 10, c: '#7a8a98' });

  // 共享金库（底部）
  const gy = py + ph - 52;
  ctx.strokeStyle = '#2a2438'; ctx.beginPath(); ctx.moveTo(px + 20, gy - 8); ctx.lineTo(px + pw - 20, gy - 8); ctx.stroke();
  txt('共享金库：', px + 24, gy, { s: 12, b: true, c: '#ffd23e' });
  txt(`◆ ${a.gold}`, px + 104, gy, { s: 13, b: true, c: '#ffd23e' });
  txt(`（持有 ◆${P.gold}）`, px + 170, gy + 1, { s: 10, c: '#9a93ad' });
  btn(px + 280, gy - 4, 78, 24, '存入100', () => depositGold(100), { s: 10, bg: '#2a3320' });
  btn(px + 364, gy - 4, 78, 24, '存全部', () => depositGold(P.gold), { s: 10, bg: '#2a3320' });
  btn(px + 460, gy - 4, 78, 24, '取出100', () => withdrawGold(100), { s: 10, bg: '#332a20' });
  btn(px + 544, gy - 4, 78, 24, '取全部', () => withdrawGold(a.gold), { s: 10, bg: '#332a20' });
}

function renderInventory(){
  const P = G.player;

/* ----------------------------- 技能树：学习 / 装备 / 重置 ----------------------------- */
function learnSkill(id){
  const P = G.player, m = skillMeta(id);
  if(!m || m.cls !== P.cls) return false;
  const cur = skillRank(id);
  if(cur >= 5){ toast('该技能已达最高等级（5）', '#8d87a0'); return false; }
  if(cur === 0){
    if(P.lvl < m.lvl){ toast(`需要达到 Lv.${m.lvl}`, '#e05a5a'); sfx('error'); return false; }
    if(m.tier > 0){
      const prev = SKILL_TREE[P.cls][m.branch].skills[m.tier - 1];
      if(!P.learned[prev]){ toast(`需先习得「${SKILLS[prev].name}」`, '#e05a5a'); sfx('error'); return false; }
    }
  }
  if(P.sp < 1){ toast('技能点不足（升级获得）', '#e05a5a'); sfx('error'); return false; }
  P.sp--;
  P.learned[id] = cur + 1;
  if(cur === 0){
    const slot = P.loadout.indexOf(null);
    if(slot >= 0){ P.loadout[slot] = id; toast(`已习得并装备「${SKILLS[id].name}」（${['左键','右键','Q','E'][slot]} 施放）`, '#7ec84a'); }
    else toast(`已习得「${SKILLS[id].name}」，点击下方技能位装备`, '#7ec84a');
  } else {
    toast(`「${SKILLS[id].name}」强化至 ${cur + 1} 级！效果 +${(cur) * 18}%`, '#ffd23c');
    addFx({ type: 'aura', x: P.x, y: P.y, t: 0, dur: 0.5, c: skillColor(id) });
  }
  sfx('levelup'); saveGame();
  return true;
}
function assignSkill(slot, id){
  const P = G.player;
  if(!P.learned[id] || slot < 0 || slot > 3) return false;
  const ex = P.loadout.indexOf(id);
  if(ex >= 0 && ex !== slot) P.loadout[ex] = P.loadout[slot];
  P.loadout[slot] = id; P.skillCd[slot] = 0;
  sfx('ui'); saveGame();
  return true;
}
function clearSlot(slot){ G.player.loadout[slot] = null; sfx('ui'); saveGame(); }
function resetSkills(){
  const P = G.player, cost = 50 + P.lvl * 15;
  let spent = 0; for(const k in P.learned){ if(k === 'basic') continue; spent += skillRank(k); } // 普攻不计
  const refund = Math.max(0, spent - 3);
  if(refund <= 0){ toast('没有可重置的技能', '#8d87a0'); return false; }
  if(P.gold < cost){ toast(`重置需要 ${cost} 金币`, '#e05a5a'); sfx('error'); return false; }
  P.gold -= cost; P.sp += refund;
  P.learned = { basic: 1 }; P.loadout = ['basic', null, null, null];  // 普攻常驻在左键
  CLASSES[P.cls].skills.forEach((id, i) => { P.learned[id] = true; if(i < 3) P.loadout[i + 1] = id; });
  for(let i = 0; i < 4; i++) P.skillCd[i] = 0;
  G.treeSel = null;
  toast(`已重置技能，返还 ${refund} 技能点（-${cost} 金）`, '#ffd23c'); sfx('potion'); saveGame();
  return true;
}

      const canLearn = !learned && lvlOK && preOK && P.sp > 0;

      }

      ctx.fillStyle = learned ? '#1c1828' : '#14111d';
      ctx.fillRect(bx + 4, ny, bw - 8, nh);
      ctx.strokeStyle = sel ? `rgba(255,255,255,${pulse})`
        : learned ? br.color
        : canLearn ? `rgba(${hexRGB(br.color)},${pulse})` : '#2e2840';
      ctx.lineWidth = sel || learned ? 2 : 1;
      ctx.strokeRect(bx + 4.5, ny + 0.5, bw - 9, nh - 1);
      ctx.lineWidth = 1;
      const dim = learned || canLearn;
      txt(['Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ'][t], bx + 12, ny + 6, { s: 11, b: true, c: dim ? br.color : '#473f5e' });
      txt(sk.name, bx + 32, ny + 6, { s: 13, b: true, c: learned ? br.color : dim ? '#e8e0d0' : '#55506a' });
      if(learned) for(let p2 = 0; p2 < 5; p2++){
        ctx.fillStyle = p2 < rk ? br.color : '#2e2840';
        ctx.fillRect(bx + bw - 12 - (5 - p2) * 8, ny + 9, 6, 6);
      }
      txt(`耗蓝${sk.mp} · 冷却${sk.cd}s` + (rk > 1 ? ` · 已强化 +${(rk - 1) * 18}%` : ''), bx + 12, ny + 24, { s: 9, c: rk > 1 ? '#ffd98a' : dim ? '#8d87a0' : '#473f5e' });
      const dc = dim ? '#bfb8d8' : '#473f5e';
      if(sk.desc.length <= 19) txt(sk.desc, bx + 12, ny + 38, { s: 10, c: dc });
      else {
        txt(sk.desc.slice(0, 19), bx + 12, ny + 37, { s: 10, c: dc });

      }
      let stl, stc = '#55506a';
      if(sel){ stl = '▼ 点击下方槽位装备…'; stc = '#ffffff'; }
      else if(learned){ stl = rk >= 5 ? '已满级 · 点击装备' : '点击装备 · 右下可强化'; stc = '#8d87a0'; }
      else if(!lvlOK) stl = `Lv.${SKILL_TIERS[t]} 解锁`;
      else if(!preOK) stl = '需先习得上一阶技能';
      else if(P.sp < 1){ stl = '技能点不足'; stc = '#a08a4a'; }
      else { stl = '点击学习（消耗 1 技能点）'; stc = '#7ec84a'; }
      txt(stl, bx + 12, ny + nh - 11, { s: 9, c: stc });
      G.uiBtns.push({ x: bx + 4, y: ny, w: bw - 8, h: nh, cb: ((iid, lrn) => () => {
        if(lrn){ G.treeSel = G.treeSel === iid ? null : iid; sfx('ui'); }
        else if(learnSkill(iid)) G.treeSel = null;
      })(id, learned) });
      if(learned && rk < 5){ /* 强化按钮（后注册，点击优先于节点） */
        const ux = bx + bw - 66, uy = ny + nh - 18;
        ctx.fillStyle = P.sp > 0 ? '#24381f' : '#1d1928';
        ctx.fillRect(ux, uy, 58, 14);
        ctx.strokeStyle = P.sp > 0 ? `rgba(126,200,74,${0.6 + Math.sin(G.t * 5) * 0.3})` : '#3a3450';
        ctx.strokeRect(ux + 0.5, uy + 0.5, 57, 13);

        G.uiBtns.push({ x: ux, y: uy, w: 58, h: 14, cb: (iid => () => learnSkill(iid))(id) });
      } else if(learned){
        txt('MAX', bx + bw - 14, ny + nh - 17, { a: 'right', s: 9, b: true, c: '#ffd23c' });

  /* 底部：普攻常驻节点 + 四技能位 */

  }
  txt('技能位', sx0 - 48, sy0 + 13, { s: 11, b: true, c: '#bfb8d8' });
  for(let i = 0; i < 4; i++){
    const x = sx0 + i * (sw2 + sgap), key = P.loadout[i];
    ctx.fillStyle = '#16131f'; ctx.fillRect(x, sy0, sw2, sh2);
    const hl = 0.5 + Math.sin(G.t * 6) * 0.4;

let LOGO = null;

function renderTitleBg(){
  /* 夜空渐变 */
  const grd = ctx.createLinearGradient(0, 0, 0, H);
  grd.addColorStop(0, '#0a0820'); grd.addColorStop(0.55, '#1c1438'); grd.addColorStop(1, '#3a2148');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);
  /* 星空（固定种子） */
  const r = mulberry32(G.titleSeed);
  for(let i = 0; i < 110; i++){
    const x = r() * W, y = r() * H * 0.62, tw = 0.4 + Math.sin(G.t * (1 + r() * 2) + i) * 0.4;
    ctx.fillStyle = `rgba(255,240,210,${(0.25 + r() * 0.5) * (0.6 + tw)})`;
    ctx.fillRect(x, y, r() < 0.12 ? 2 : 1, r() < 0.12 ? 2 : 1);
  }
  /* 月亮 */
  ctx.fillStyle = '#f0e6c8';
  ctx.beginPath(); ctx.arc(W - 150, 92, 30, 0, TAU); ctx.fill();
  ctx.fillStyle = '#1c1438';
  ctx.beginPath(); ctx.arc(W - 162, 84, 26, 0, TAU); ctx.fill();
  /* 远山剪影两层 */
  const hill = (base, amp, step, col, seedOff) => {
    const rr = mulberry32(G.titleSeed + seedOff);
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.moveTo(0, H);
    let y = base;
    for(let x = 0; x <= W + step; x += step){
      y = clamp(y + (rr() - 0.5) * amp, base - 60, base + 36);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  };
  hill(H - 170, 44, 46, '#181230', 7);
  hill(H - 110, 34, 34, '#221636', 31);
  /* 地面与篝火余烬 */
  ctx.fillStyle = '#13101f'; ctx.fillRect(0, H - 58, W, 58);
  for(let i = 0; i < 26; i++){
    const ph = (G.t * 0.13 + i * 0.117) % 1;
    const x = ((i * 197.3) % W) + Math.sin(G.t + i) * 18;
    const y = H - 30 - ph * 250;
    ctx.fillStyle = `rgba(255,${120 + (i % 3) * 40},60,${(1 - ph) * 0.5})`;
    ctx.fillRect(x, y, 2, 2);
  }
}

function renderCharSelect(){
  renderTitleBg();
  txt('选择角色', W / 2, 30, { a: 'center', s: 22, b: true, c: '#f0e6c8' });
  const a = G.acct || newAccount();
  const chars = a.chars;
  txt(`账户共 ${chars.length} 个角色 · 共享金库 ◆${a.gold}`, W / 2, 60, { a: 'center', s: 11, c: '#9a93ad' });

  const cols = 4, cardW = 150, cardH = 200, gap = 18;
  const rows = Math.ceil((chars.length + 1) / cols);
  const totalW = cols * cardW + (cols - 1) * gap;
  const ox = W / 2 - totalW / 2, oy = 86;

  // 角色卡片
  for(let i = 0; i < chars.length; i++){
    const c = chars[i];
    const cx2 = ox + (i % cols) * (cardW + gap);
    const cy2 = oy + Math.floor(i / cols) * (cardH + gap);
    const isCur = a.cur === i;
    const hov = Mouse.x >= cx2 && Mouse.x <= cx2 + cardW && Mouse.y >= cy2 && Mouse.y <= cy2 + cardH;
    ctx.fillStyle = hov ? 'rgba(40,32,64,0.95)' : 'rgba(22,18,38,0.92)';
    ctx.fillRect(cx2, cy2, cardW, cardH);
    ctx.strokeStyle = isCur ? '#ffd23c' : hov ? CLASSES[c.cls].color : '#3a3152';
    ctx.lineWidth = isCur ? 2 : 1;

/* ----------------------------- 26. 流程（状态切换 / 进出区域 / 生死 / 周目） ----------------------------- */
function setState(s){
  G.state = s; G.ui = null;
  if(s === 'title'){ G.boss = null; setMusic('title'); }
}
function fadeTo(cb){
  if(G.fade && typeof G.fade === 'object'){ return; }
  G.fade = { t: 0, dur: 0.7, cb, fired: false };
}
function updFade(dt){
  const f = G.fade;
  if(!f || typeof f !== 'object') return;
  f.t += dt;
  if(!f.fired && f.t >= f.dur * 0.5){ f.fired = true; if(f.cb) f.cb(); }
  if(f.t >= f.dur) G.fade = null;
}
function renderFade(){
  const f = G.fade;
  if(!f || typeof f !== 'object') return;
  const half = f.dur * 0.5;
  const a = f.t < half ? f.t / half : 1 - (f.t - half) / half;
  ctx.fillStyle = `rgba(4,3,10,${clamp(a, 0, 1)})`;
  ctx.fillRect(0, 0, W, H);
}
function clearWorldEnts(){
  G.enemies = []; G.projs = []; G.drops = []; G.fx = []; G.texts = []; G.parts = [];
  G.boss = null;
}
function enterTown(){
  const m = genTown();

function startGame(cls){

/* ----------------------------- 27. 全局按键 ----------------------------- */
function processKeys(){
  for(const code of pendingKeys){
    if(G.state === 'title' || G.state === 'classSelect' || G.state === 'charSelect'){
      if(code === 'Escape'){
        if(G.ui) G.ui = null;
        else if(G.confirmDelete != null) G.confirmDelete = null;
        else if(G.state === 'classSelect') setState(G.acct && G.acct.chars.length ? 'charSelect' : 'title');
        else if(G.state === 'charSelect') setState('title');
      }
      continue;
    }
    if(G.state === 'dead' || G.state === 'victory') continue;
    /* play 状态 */
    if(G.ui){
      if(code === 'Escape' || (code === 'KeyI' && G.ui === 'inventory') || (code === 'KeyC' && G.ui === 'character') || (code === 'KeyK' && G.ui === 'skilltree')){
        if(G.uiBack && (G.ui === 'settings' || G.ui === 'help')){ openUI(G.uiBack); G.uiBack = null; }
        else closeUI();
        sfx('ui');
      }
      else if(code === 'KeyI' && G.ui !== 'inventory'){ openUI('inventory'); sfx('ui'); }
      else if(code === 'KeyC' && G.ui !== 'character'){ openUI('character'); sfx('ui'); }
      continue;
    }
    switch(code){
      case 'Digit1': usePotion('hp'); break;
      case 'Digit2': usePotion('mp'); break;
      case 'Space': tryDash(); break;
      case 'KeyF': doInteract(); break;
      case 'KeyI': openUI('inventory'); sfx('ui'); break;
      case 'KeyC': openUI('character'); sfx('ui'); break;
      case 'KeyK': openUI('skilltree'); sfx('ui'); break;
      case 'KeyH': G.uiBack = null; openUI('help'); sfx('ui'); break;
      case 'Escape': openUI('pause'); sfx('ui'); break;
      case 'KeyM':
        AU.musicVol = AU.musicVol > 0 ? 0 : 0.6;
        setVolumes();
        toast(AU.musicVol > 0 ? '音乐：开' : '音乐：关', '#bfb8d8');
        break;
      case 'KeyT':
        if(G.zone !== 'town'){ toast('正在返回翡翠镇…', '#7ce0d8'); fadeTo(enterTown); }
        break;
    }
  }
  pendingKeys.length = 0;
}

/* ----------------------------- 28. 存档（window.storage + 内存回退） ----------------------------- */
let MEM_SAVE = null;
const SAVE_KEY = 'origin_save_v1';      // 旧版单角色存档键（用于迁移）
const ACCT_KEY = 'origin_account_v1';   // 新版账户存档键
const VAULT_CAP = 40;                   // 仓库每页容量
/* 账户：多角色 + 共享仓库 + 共享金库。G.acct 为内存中的账户对象 */
let MEM_ACCT = null;
function newAccount(){
  return { v: 1, chars: [], cur: -1, vault: [], gold: 0, charVaults: {}, nextCharId: 1,
           settings: { musicVol: AU.musicVol, sfxVol: AU.sfxVol } };
}
function charLabel(c){ return `${CLASSES[c.cls].name} Lv.${c.lvl}`; }
function snapshot(){
  const P = G.player;
  return {
    v: 1, charId: P.charId, name: P.name, cls: P.cls, lvl: P.lvl, xp: P.xp, gold: P.gold, statPts: P.statPts,
    attrs: Object.assign({}, P.attrs), potions: Object.assign({}, P.potions),
    inv: P.inv.map(i => Object.assign({}, i)),
    equip: { weapon: P.equip.weapon, helm: P.equip.helm, armor: P.equip.armor,
             boots: P.equip.boots, ring: P.equip.ring, amulet: P.equip.amulet },
    sp: P.sp, learned: Object.assign({}, P.learned), loadout: P.loadout.slice(0, 4),
    bossKills: Object.assign({}, G.bossKills), ng: G.ng, kills: G.kills, questDone: G.questDone,
    itemId: ITEM_ID, musicVol: AU.musicVol, sfxVol: AU.sfxVol, tut: Object.assign({}, G.tut)
  };
}
function saveGame(){
  if(!G.player || !G.acct) return;
  const d = snapshot();
  MEM_SAVE = d; G.save = d;
  // 写回当前角色
  const a = G.acct;
  a.settings = { musicVol: AU.musicVol, sfxVol: AU.sfxVol };
  if(a.cur >= 0 && a.cur < a.chars.length) a.chars[a.cur] = d;
  persistAccount();
}
function persistAccount(){
  const a = G.acct; if(!a) return;
  MEM_ACCT = a;
  try{
    if(window.storage && window.storage.set){
      window.storage.set(ACCT_KEY, JSON.stringify(a)).then(() => { G.saveOK = true; }).catch(() => {});
    }
  }catch(err){ /* 仅内存 */ }
}
function adoptAccount(a){
  if(!a || !Array.isArray(a.chars)) return false;
  // 补全字段
  a.vault = a.vault || []; a.gold = a.gold || 0; a.charVaults = a.charVaults || {};
  a.nextCharId = a.nextCharId || (a.chars.length + 1);
  if(a.cur == null) a.cur = a.chars.length ? 0 : -1;
  G.acct = a;
  G.save = (a.cur >= 0 && a.chars[a.cur]) ? a.chars[a.cur] : null;
  G.saveOK = true;
  if(a.settings){ AU.musicVol = a.settings.musicVol != null ? a.settings.musicVol : AU.musicVol;
                  AU.sfxVol = a.settings.sfxVol != null ? a.settings.sfxVol : AU.sfxVol; setVolumes(); }
  return true;
}
function migrateOldSave(d){
  // 旧单角色存档 → 账户的第一个角色
  const a = newAccount();
  if(d && d.v === 1){
    d.charId = 1; if(!d.name) d.name = '冒险者';
    a.chars.push(d); a.cur = 0; a.nextCharId = 2;
  }
  return a;
}
function loadSaved(){
  // 内存兜底（同一会话内切角色等）
  if(MEM_ACCT){ adoptAccount(MEM_ACCT); }
  else if(MEM_SAVE){ adoptAccount(migrateOldSave(MEM_SAVE)); }
  else { G.acct = newAccount(); }
  // 异步读取持久化账户；若无则尝试迁移旧单角色档
  const tryMigrate = () => {
    // 无账户档，尝试迁移旧单角色档
    window.storage.get(SAVE_KEY).then(r2 => {
      if(r2 && r2.value){
        const d = JSON.parse(r2.value);
        if(d && d.v === 1 && (!G.acct || !G.acct.chars.length)){
          const a = migrateOldSave(d); adoptAccount(a); persistAccount();
        }
      }
    }).catch(() => {});
  };
  try{
    if(window.storage && window.storage.get){
      window.storage.get(ACCT_KEY).then(r => {
        if(r && r.value){
          const a = JSON.parse(r.value);
          if(a && a.v === 1 && Array.isArray(a.chars)) adoptAccount(a);
          else tryMigrate();
        } else tryMigrate();
      }).catch(() => tryMigrate());  // 账户键不存在（reject）也走迁移
    }
  }catch(err){}
}
function applySave(d){
  const P = newPlayer(d.cls);
  P.charId = d.charId || 0; P.name = d.name || CLASSES[d.cls].name;
  P.lvl = d.lvl; P.xp = d.xp; P.gold = d.gold; P.statPts = d.statPts;
  P.attrs = Object.assign({}, d.attrs); P.potions = Object.assign({}, d.potions);
  P.inv = (d.inv || []).map(i => Object.assign({}, i));
  for(const s in P.equip) P.equip[s] = d.equip && d.equip[s] ? Object.assign({}, d.equip[s]) : null;
  /* 技能树存档迁移：旧档默认三系一阶 + 按等级补发技能点 */
  P.sp = d.sp != null ? d.sp : Math.max(0, P.lvl - 1);
  if(d.learned){ P.learned = {}; for(const k in d.learned){ const v = d.learned[k]; P.learned[k] = v === true ? 1 : clamp(v | 0, 1, 5); } }
  const hadBasic = !!(d.learned && d.learned.basic);  // 该存档是否来自"普攻技能化"之后的版本
  P.learned['basic'] = 1;  // 普攻始终常驻可用
  if(d.loadout){ P.loadout = d.loadout.slice(0, 4); while(P.loadout.length < 4) P.loadout.push(null); }
  // 仅旧版存档（普攻技能化之前，loadout 无 basic 记录）才迁移：把普攻放到第一个空位（优先位1）
  if(!hadBasic && !P.loadout.includes('basic')){
    if(!P.loadout[0]) P.loadout[0] = 'basic';
    else { const empty = P.loadout.indexOf(null); if(empty >= 0) P.loadout[empty] = 'basic'; else P.loadout[0] = 'basic'; }
  }
  G.player = P;
  G.bossKills = Object.assign({}, d.bossKills); G.ng = d.ng || 0;
  G.kills = d.kills || 0; G.questDone = d.questDone || 0;
  G.quest = null; G.boardOffer = null;
  G.victShownNg = G.bossKills.demonlord ? G.ng : -1;
  G.tut = d.tut ? Object.assign({}, d.tut) : {};
  G.told = Object.assign({}, G.bossKills);
  if(d.itemId) ITEM_ID = Math.max(ITEM_ID, d.itemId);
  if(d.musicVol != null){ AU.musicVol = d.musicVol; AU.sfxVol = d.sfxVol; setVolumes(); }
  calcStats(P);
  P.hp = P.stats.maxHP; P.mp = P.stats.maxMP;
  G.chat = [];
  G.state = 'play';
  enterTown();
  chat(`欢迎回来，Lv.${P.lvl} ${CLASSES[P.cls].name}！`, '#7ce08a');
}

/* ----------------------------- 多角色账户操作 ----------------------------- */
function selectChar(idx){
  const a = G.acct; if(!a || idx < 0 || idx >= a.chars.length) return false;
  if(G.player && a.cur >= 0) saveGame(); // 先保存当前
  a.cur = idx;
  fadeTo(() => { applySave(a.chars[idx]); persistAccount(); });
  return true;
}
function deleteChar(idx){
  const a = G.acct; if(!a || idx < 0 || idx >= a.chars.length) return false;
  const removed = a.chars[idx];
  a.chars.splice(idx, 1);
  if(removed && a.charVaults) delete a.charVaults[removed.charId];
  if(a.cur === idx) a.cur = -1;
  else if(a.cur > idx) a.cur--;
  persistAccount();
  return true;
}
function switchToCharSelect(){
  if(G.player && G.acct && G.acct.cur >= 0) saveGame();
  G.confirmDelete = null;
  setState('charSelect');
}
function curCharVault(){
  const a = G.acct, P = G.player;
  if(!a || !P) return [];
  const id = P.charId || 0;
  if(!a.charVaults[id]) a.charVaults[id] = [];
  return a.charVaults[id];
}

/* ----------------------------- 29. 渲染调度 / 主循环 / 启动 ----------------------------- */
function render(){
  G.uiBtns = [];
  ctx.clearRect(0, 0, W, H);
  if(G.state === 'boot'){
    ctx.fillStyle = '#0a0816'; ctx.fillRect(0, 0, W, H);
    txt('载入中…', W / 2, H / 2, { a: 'center', s: 16, c: '#9a93ad' });
  }
  else if(G.state === 'title') renderTitle();
  else if(G.state === 'charSelect') renderCharSelect();
  else if(G.state === 'classSelect') renderClassSelect();
  else if(G.state === 'dead') renderDead();
  else if(G.state === 'victory') renderVictory();
  else if(G.state === 'play'){
    renderWorld();
    renderHUD();
    renderPanels();
  }
  /* 顶部提示 */
  if(G.tip && G.tipT > 0){
    const a = Math.min(1, G.tipT / 0.4);
    ctx.globalAlpha = a;
    ctx.font = FONT(14, true);
    const tw = ctx.measureText(G.tip.msg).width + 36;
    ctx.fillStyle = 'rgba(8,6,16,0.85)';
    ctx.fillRect(W / 2 - tw / 2, 64, tw, 30);
    ctx.strokeStyle = '#5a4a78'; ctx.strokeRect(W / 2 - tw / 2 + 0.5, 64.5, tw - 1, 29);
    txt(G.tip.msg, W / 2, 79, { a: 'center', bl: 'middle', s: 14, b: true, c: G.tip.color });
    ctx.globalAlpha = 1;
  }
  renderFade();
}

function tick(dt){
  dt = clamp(dt, 0, 0.05);
  handleClicks();
  processKeys();
  updFade(dt);
  if(G.state === 'play' || G.state === 'dead' || G.state === 'victory') updWorld(dt);
  else { G.t += dt; G.frame++; }
  render();
}

let _lastT = 0;
function loop(ts){
  const dt = _lastT ? (ts - _lastT) / 1000 : 0.016;
  _lastT = ts;
  tick(dt);
  requestAnimationFrame(loop);
}

function init(){
  buildSprites();
  loadSaved();
  setState('title');
  setMusic('title');
  if(!IS_TEST) requestAnimationFrame(loop);
}
init();

/* ----------------------------- 30. 测试接口 ----------------------------- */
if(IS_TEST){
  window.__GAME__ = {
    G, tick, render,
    key: c => { if(!Keys[c]) pendingKeys.push(c); Keys[c] = true; },
    keyUp: c => { Keys[c] = false; },
    press: c => { pendingKeys.push(c); },
    click: (x, y) => pendingClicks.push({ x, y }),
    mouseTo: (x, y) => { Mouse.x = x; Mouse.y = y; Mouse.moved = true; },
    mouseDown: v => { Mouse.down = v; },
    mouseRight: v => { Mouse.right = v; },
    start: startGame, applySave, snapshot, saveGame, loadSaved,
    enterZone, enterTown, canEnterZone, fadeTo, respawn, ngPlus, setState,
    spawnEnemy, spawnBoss, populateZone,
    makeItem, makePotion, equipItem, unequipItem, sellItem, buyItem, restockShop,
    castSkill, usePotion, giveXP, giveGold, calcStats, xpNeed,
    learnSkill, assignSkill, clearSlot, resetSkills, skillRank, SKILL_TREE, SKILL_TIERS, skillMeta, buffVal,
    rerollItem, rerollCost, diffName, ELITE_MODS, BRANCH_AFFIXES, rollDmg, branchKeyOf, respecAttrs, MUSIC, genQuest,
    selectChar, deleteChar, switchToCharSelect, curCharVault, depositItem, withdrawItem, depositGold, withdrawGold, newAccount, persistAccount, VAULT_CAP,
    canStand,
    dmgEnemy, dmgPlayer, killEnemy, openChest, doInteract, nearestInteract, tryDash,
    genQuest, questKill, readActions, openUI, closeUI,
    SKILLS, CLASSES, ENEMY_DEFS, BOSS_DEFS, ZONE_DEFS, ZONE_ORDER, RARITY, BASES, UNIQUES, SPR, TILES,
    get MEM_SAVE(){ return MEM_SAVE; }
  };
}
