<script>
'use strict';
/* ============================================================================
   《起源》 ORIGIN — 一款 16-bit 像素风浏览器 ARPG
   完整引擎：游戏循环 / 物理与碰撞 / 程序化像素美术 / 芯片音乐合成 /
   战斗 / 技能 / 战利品 / 商店 / 升级 / 多区域世界 / Boss / 动态城镇
   全部素材由代码程序化生成（AI 生成像素画与芯片音轨），零外部依赖。
   ============================================================================ */

/* ----------------------------- 0. 环境与常量 ----------------------------- */
const IS_TEST = (typeof window !== 'undefined') && !!window.__TEST_ENV__;
const W = 960, H = 540;          // 主画布（UI 分辨率）
const VW = 480, VH = 270;        // 世界缓冲（1x 像素空间，再放大 2 倍）
const TS = 16;                   // 图块尺寸
const TAU = Math.PI * 2;

/* ----------------------------- 1. 数学与工具 ----------------------------- */
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t){ return a + (b - a) * t; }
function dist(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return Math.sqrt(dx*dx + dy*dy); }
function dist2(ax, ay, bx, by){ const dx = ax - bx, dy = ay - by; return dx*dx + dy*dy; }
function angTo(ax, ay, bx, by){ return Math.atan2(by - ay, bx - ax); }
function rnd(a, b){ return a + Math.random() * (b - a); }
function rndi(a, b){ return Math.floor(rnd(a, b + 1)); }
function chance(p){ return Math.random() < p; }
function choice(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function mulberry32(seed){
  let s = seed >>> 0;
  return function(){
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let R = mulberry32(1234);                 // 地图生成用的可重置随机源
function Ri(a, b){ return Math.floor(a + R() * (b - a + 1)); }
function Rc(arr){ return arr[Math.floor(R() * arr.length)]; }
function fmt(n){ return n >= 10000 ? (n/1000).toFixed(1) + 'k' : Math.floor(n) + ''; }
function shade(hex, f){ // 颜色明暗调整 f: -1..1
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  if(f >= 0){ r += (255-r)*f; g += (255-g)*f; b += (255-b)*f; }
  else { r *= (1+f); g *= (1+f); b *= (1+f); }
  return '#' + ((1<<24) | (Math.round(r)<<16) | (Math.round(g)<<8) | Math.round(b)).toString(16).slice(1);
}
function rrect(c, x, y, w, h, r){ // 兼容性圆角矩形路径
  c.beginPath();
  c.moveTo(x+r, y); c.lineTo(x+w-r, y); c.quadraticCurveTo(x+w, y, x+w, y+r);
  c.lineTo(x+w, y+h-r); c.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  c.lineTo(x+r, y+h); c.quadraticCurveTo(x, y+h, x, y+h-r);
  c.lineTo(x, y+r); c.quadraticCurveTo(x, y, x+r, y);
  c.closePath();
}

/* ----------------------------- 2. 画布建立 ----------------------------- */
const canvas = document.createElement('canvas');
canvas.id = 'game'; canvas.width = W; canvas.height = H;
canvas.setAttribute('tabindex', '0');
document.body.appendChild(canvas);
const ctx = canvas.getContext('2d');
const buf = document.createElement('canvas'); buf.width = VW; buf.height = VH;
const bctx = buf.getContext('2d');
ctx.imageSmoothingEnabled = false; bctx.imageSmoothingEnabled = false;
(function(){ const b = document.getElementById('boot'); if(b && b.parentNode) b.parentNode.removeChild(b); })();

function mkCanvas(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

/* ----------------------------- 3. 输入系统 ----------------------------- */
const Keys = Object.create(null);
const Mouse = { x: W/2, y: H/2, down: false, right: false, wx: 0, wy: 0 };
let pendingClicks = [];     // UI 点击队列（屏幕坐标）
let pendingKeys = [];       // 按键按下事件队列（按帧消费）
const TOUCH = { enabled: false, joyId: -1, joyOx: 0, joyOy: 0, joyDx: 0, joyDy: 0, held: Object.create(null) };

function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  const sx = W / (r.width || W), sy = H / (r.height || H);
  return { x: (e.clientX - r.left) * sx, y: (e.clientY - r.top) * sy };
}
canvas.addEventListener('mousemove', e => { const p = canvasPos(e); Mouse.x = p.x; Mouse.y = p.y; Mouse.moved = true; });
canvas.addEventListener('mousedown', e => {
  e.preventDefault(); userGesture();
  const p = canvasPos(e); Mouse.x = p.x; Mouse.y = p.y;
  if(e.button === 0){ Mouse.down = true; pendingClicks.push({ x: p.x, y: p.y }); }
  else if(e.button === 2){ Mouse.right = true; }
});
window.addEventListener('mouseup', e => { if(e.button === 0) Mouse.down = false; else if(e.button === 2) Mouse.right = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('keydown', e => {
  userGesture();
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if(!Keys[e.code]) pendingKeys.push(e.code);
  Keys[e.code] = true;
});
window.addEventListener('keyup', e => { Keys[e.code] = false; });
window.addEventListener('blur', () => { for(const k in Keys) Keys[k] = false; Mouse.down = false; });

/* 触屏：左侧虚拟摇杆 + 右侧技能按钮（按钮区域在 UI 模块中注册到 TOUCH.zones） */
TOUCH.zones = []; // {id,x,y,r,act}
function touchAt(t){ return canvasPos({ clientX: t.clientX, clientY: t.clientY }); }
canvas.addEventListener('touchstart', e => {
  e.preventDefault(); userGesture(); TOUCH.enabled = true;
  for(const t of e.changedTouches){
    const p = touchAt(t);
    let hit = null;
    for(const z of TOUCH.zones){ if(dist(p.x, p.y, z.x, z.y) <= z.r * 1.25){ hit = z; break; } }
    if(hit){ TOUCH.held[t.identifier] = hit.act; if(hit.tap) pendingKeys.push(hit.tap); }
    else if(p.x < W * 0.45 && p.y > H * 0.35 && G.state === 'play' && !G.ui){
      TOUCH.joyId = t.identifier; TOUCH.joyOx = p.x; TOUCH.joyOy = p.y; TOUCH.joyDx = 0; TOUCH.joyDy = 0;
      Mouse.moved = false;
    } else {
      pendingClicks.push({ x: p.x, y: p.y }); Mouse.x = p.x; Mouse.y = p.y;
    }
  }
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for(const t of e.changedTouches){
    const p = touchAt(t);
    if(t.identifier === TOUCH.joyId){
      TOUCH.joyDx = clamp(p.x - TOUCH.joyOx, -52, 52); TOUCH.joyDy = clamp(p.y - TOUCH.joyOy, -52, 52);
    }
  }
}, { passive: false });
function touchEnd(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier === TOUCH.joyId){ TOUCH.joyId = -1; TOUCH.joyDx = 0; TOUCH.joyDy = 0; }
    delete TOUCH.held[t.identifier];
  }
}
canvas.addEventListener('touchend', touchEnd, { passive: false });
canvas.addEventListener('touchcancel', touchEnd, { passive: false });

function touchHeld(act){ for(const k in TOUCH.held) if(TOUCH.held[k] === act) return true; return false; }

/* 动作抽象层：键盘 / 触屏 统一为同一组动作 */
function readActions(){
  let mvx = 0, mvy = 0;
  if(Keys['KeyW'] || Keys['ArrowUp']) mvy -= 1;
  if(Keys['KeyS'] || Keys['ArrowDown']) mvy += 1;
  if(Keys['KeyA'] || Keys['ArrowLeft']) mvx -= 1;
  if(Keys['KeyD'] || Keys['ArrowRight']) mvx += 1;
  if(TOUCH.joyId !== -1 && (Math.abs(TOUCH.joyDx) > 8 || Math.abs(TOUCH.joyDy) > 8)){
    mvx = TOUCH.joyDx / 52; mvy = TOUCH.joyDy / 52;
  }
  const len = Math.sqrt(mvx*mvx + mvy*mvy);
  if(len > 1){ mvx /= len; mvy /= len; }
  return {
    mvx, mvy,
    skill: [
      Mouse.down || touchHeld('s1'),       // 技能位 1：左键
      Mouse.right || touchHeld('s2'),      // 技能位 2：右键
      Keys['KeyQ'] || touchHeld('s3'),     // 技能位 3：Q
      Keys['KeyE'] || touchHeld('s4')      // 技能位 4：E
    ]
  };
}

/* ----------------------------- 4. 音频引擎（芯片合成） ----------------------------- */
const AU = { ctx: null, master: null, mGain: null, sGain: null, musicVol: 0.6, sfxVol: 0.8,
             track: null, step: 0, nextT: 0, timer: null, enabled: false };

function userGesture(){
  if(AU.enabled || IS_TEST) { if(IS_TEST) AU.enabled = true; return; }
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    AU.ctx = new AC();
    AU.master = AU.ctx.createGain(); AU.master.gain.value = 0.5; AU.master.connect(AU.ctx.destination);
    AU.mGain = AU.ctx.createGain(); AU.mGain.gain.value = AU.musicVol * 0.32; AU.mGain.connect(AU.master);
    AU.sGain = AU.ctx.createGain(); AU.sGain.gain.value = AU.sfxVol; AU.sGain.connect(AU.master);
    AU.enabled = true;
    if(AU.track) startScheduler();
  }catch(err){ /* 无音频环境时静默运行 */ }
}
function setVolumes(){
  if(AU.mGain) AU.mGain.gain.value = AU.musicVol * 0.32;
  if(AU.sGain) AU.sGain.gain.value = AU.sfxVol;
}
function nfreq(n){ return 440 * Math.pow(2, (n - 69) / 12); } // MIDI -> Hz

/* --- 音效 --- */
function tone(type, f0, f1, dur, vol, t0, slideCurve){
  if(!AU.ctx) return;
  const t = t0 !== undefined ? t0 : AU.ctx.currentTime;
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if(f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur * (slideCurve || 1));
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(AU.sGain);
  o.start(t); o.stop(t + dur + 0.02);
}
let noiseBuf = null;
function noise(dur, vol, f, t0){
  if(!AU.ctx) return;
  if(!noiseBuf){
    noiseBuf = AU.ctx.createBuffer(1, AU.ctx.sampleRate * 0.5, AU.ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = t0 !== undefined ? t0 : AU.ctx.currentTime;
  const src = AU.ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  const flt = AU.ctx.createBiquadFilter(); flt.type = 'bandpass'; flt.frequency.value = f || 2000; flt.Q.value = 0.8;
  const g = AU.ctx.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  src.connect(flt); flt.connect(g); g.connect(AU.sGain);
  src.start(t); src.stop(t + dur + 0.02);
}

  error(){ tone('square', 220, 180, 0.14, 0.18); },
  quest(){ const t = AU.ctx ? AU.ctx.currentTime : 0; [659, 880, 1109].forEach((f, i) => tone('triangle', f, f, 0.18, 0.2, t + i * 0.08)); }

function playNote(type, midi, t, dur, vol, dest){
  if(!midi) return;
  const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
  o.type = type; o.frequency.value = nfreq(midi);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.02);
}
function schedule(){
  const tr = MUSIC[AU.track]; if(!tr || !AU.ctx) return;
  const stepDur = 60 / tr.bpm / 4;
  while(AU.nextT < AU.ctx.currentTime + 0.18){
    const i = AU.step % 32, t = AU.nextT;
    playNote('triangle', tr.bass[i], t, stepDur * 2.2, 0.5, AU.mGain);
    playNote('square', tr.lead[i], t, stepDur * 1.7, 0.22, AU.mGain);
    playNote('square', tr.arp[i] ? tr.arp[i] + 12 : 0, t, stepDur * 0.9, 0.08, AU.mGain);
    const d = tr.drum[i];
    if(d === 1){ // 底鼓
      const o = AU.ctx.createOscillator(), g = AU.ctx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.connect(g); g.connect(AU.mGain); o.start(t); o.stop(t + 0.14);
    } else if(d === 2 && noiseBufM()){ // 踩镲
      const src = AU.ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
      const f = AU.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
      const g = AU.ctx.createGain(); g.gain.setValueAtTime(0.12, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      src.connect(f); f.connect(g); g.connect(AU.mGain); src.start(t); src.stop(t + 0.07);
    }
    AU.nextT += stepDur; AU.step++;
  }
}
function noiseBufM(){
  if(noiseBuf || !AU.ctx) return !!noiseBuf;
  noiseBuf = AU.ctx.createBuffer(1, AU.ctx.sampleRate * 0.5, AU.ctx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return true;
}
function startScheduler(){
  if(AU.timer) clearInterval(AU.timer);
  if(!AU.ctx) return;
  AU.step = 0; AU.nextT = AU.ctx.currentTime + 0.06;
  AU.timer = setInterval(schedule, 40);
}
function tutHint(key, msg){
  if(!G || !G.tut || G.tut[key]) return;
  G.tut[key] = true;
  chat('💡 ' + msg, '#8ad8ff');
  toast(msg, '#8ad8ff');
  if(typeof saveGame === 'function') saveGame();
}
function setMusic(name){
  if(AU.track === name) return;
  AU.track = name;
  if(AU.ctx) startScheduler();
}

/* ----------------------------- 5. 程序化像素美术 -----------------------------
   所有精灵用字符画 + 调色板生成（AI 创作的像素画），. 为透明。 */
const SPR = {}; // 精灵库
function makeSprite(rows, pal, w, h){
  w = w || rows.reduce((m, r) => Math.max(m, r.length), 0);
  h = h || rows.length;
  const c = mkCanvas(w, h), g = c.getContext('2d');
  for(let y = 0; y < Math.min(h, rows.length); y++){
    const row = rows[y];
    for(let x = 0; x < Math.min(w, row.length); x++){
      const ch = row[x];
      if(ch === '.' || ch === ' ') continue;
      const col = pal[ch];
      if(!col) continue;
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}
function flipX(src){
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
function tinted(src, color, alpha){
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = alpha; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}

const T_VOID=0, T_GRASS=1, T_DIRT=2, T_WATER=3, T_STONE=4, T_WALL=5, T_LAVA=6,
      T_OBS=7, T_COBBLE=8, T_PLANK=9, T_SCORCH=10, T_PATH=11;
const SOLID_T = [1,0,0,1,0,1,0,0,0,0,0,0]; // 按图块 id 索引
const TILES = {};
function texTile(base, fn){
  const c = mkCanvas(TS, TS), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, TS, TS);
  if(fn) fn(g);
  return c;
}
function speckle(g, colors, n, rng){
  for(let i = 0; i < n; i++){
    g.fillStyle = colors[Math.floor(rng() * colors.length)];
    g.fillRect(Math.floor(rng() * TS), Math.floor(rng() * TS), 1, 1);
  }
}
function buildTiles(){
  const rng = mulberry32(99);
  TILES[T_GRASS] = [];
  for(let v = 0; v < 4; v++) TILES[T_GRASS].push(texTile('#4f9440', g => {
    speckle(g, ['#3f7a33', '#65aa4e', '#447f37'], 30, rng);
    for(let i = 0; i < 3; i++){ g.fillStyle = '#6ec46a'; g.fillRect(Math.floor(rng()*15), Math.floor(rng()*13), 1, 2); }
  }));
  TILES[T_DIRT] = [];
  for(let v = 0; v < 3; v++) TILES[T_DIRT].push(texTile('#8a6a42', g => speckle(g, ['#76582f', '#9c7c50', '#6b4e2a'], 24, rng)));
  TILES[T_WATER] = [];
  for(let f = 0; f < 3; f++) TILES[T_WATER].push(texTile('#2e5fa3', g => {
    g.fillStyle = '#4d82c8';
    for(let i = 0; i < 3; i++) g.fillRect((f*3 + i*5) % 10, (f*2 + i*5 + i*3) % 16, 5, 1);
    g.fillStyle = '#9cc4ee'; g.fillRect((f*5+3) % 14, (f*4+2) % 14, 2, 1);
  }));
  TILES[T_STONE] = [];
  for(let v = 0; v < 3; v++) TILES[T_STONE].push(texTile('#565462', g => speckle(g, ['#494754', '#646272', '#3f3d4a'], 26, rng)));
  TILES.wallTop = texTile('#221d2c', g => speckle(g, ['#2a2436', '#1a1622'], 20, rng));
  TILES.wallFace = texTile('#3a3346', g => {
    g.fillStyle = '#4a425c'; g.fillRect(0, 0, 16, 2);
    g.fillStyle = '#2c2738';
    g.fillRect(0, 6, 16, 1); g.fillRect(0, 12, 16, 1);
    g.fillRect(5, 2, 1, 4); g.fillRect(11, 7, 1, 5); g.fillRect(3, 13, 1, 3);
  });
  TILES[T_WALL] = [TILES.wallTop];
  TILES[T_LAVA] = [];
  for(let f = 0; f < 3; f++) TILES[T_LAVA].push(texTile('#c2401c', g => {
    g.fillStyle = '#ff7a2a';
    for(let i = 0; i < 4; i++) g.fillRect((i*5 + f*2) % 14, (i*4 + f*3) % 14, 3, 2);
    g.fillStyle = '#ffd23c';
    g.fillRect((f*4+2) % 13, (f*6+4) % 13, 2, 1); g.fillRect((f*7+8) % 13, (f*2+9) % 13, 1, 1);
  }));
  TILES[T_OBS] = [];
  for(let v = 0; v < 3; v++) TILES[T_OBS].push(texTile('#2b2330', g => {
    speckle(g, ['#352c3c', '#221b28'], 22, rng);
    if(v === 1){ g.fillStyle = '#ff7a2a'; g.fillRect(1 + Math.floor(rng()*14), 1 + Math.floor(rng()*14), 1, 1); }
  }));
  TILES[T_SCORCH] = [];
  for(let v = 0; v < 3; v++) TILES[T_SCORCH].push(texTile('#4a3030', g => speckle(g, ['#3a2424', '#5a3c38', '#2e1c1c'], 26, rng)));
  TILES[T_COBBLE] = [];
  for(let v = 0; v < 3; v++) TILES[T_COBBLE].push(texTile('#5e5b66', g => {
    const cs = ['#7d7a86', '#737080', '#86838f'];
    for(let yy = 0; yy < 2; yy++) for(let xx = 0; xx < 2; xx++){
      g.fillStyle = cs[Math.floor(rng()*3)];
      g.fillRect(xx*8+1, yy*8+1, 6, 6);
      g.fillStyle = '#94919e'; g.fillRect(xx*8+1, yy*8+1, 6, 1);
    }
  }));
  TILES[T_PLANK] = [texTile('#8a5a30', g => {
    g.fillStyle = '#6b4424'; g.fillRect(0,3,16,1); g.fillRect(0,8,16,1); g.fillRect(0,13,16,1);
    g.fillStyle = '#a8743e'; g.fillRect(0,0,16,1); g.fillRect(0,4,16,1); g.fillRect(0,9,16,1);
  })];
  TILES[T_PATH] = [];
  for(let v = 0; v < 3; v++) TILES[T_PATH].push(texTile('#c2a86a', g => speckle(g, ['#ad9357', '#d2ba80', '#9c854c'], 22, rng)));
}

/* ---- 程序化建筑 ---- */
function genBuilding(w, h, wall, roof, opt){
  opt = opt || {};
  const c = mkCanvas(w, h), g = c.getContext('2d');
  const roofH = Math.floor(h * 0.44);
  // 墙体
  g.fillStyle = wall; g.fillRect(2, roofH, w-4, h - roofH - 1);
  g.fillStyle = shade(wall, -0.22);
  for(let y = roofH + 5; y < h - 2; y += 6) g.fillRect(2, y, w-4, 1);
  g.fillStyle = '#1c1626';
  g.fillRect(1, roofH, 1, h - roofH - 1); g.fillRect(w-2, roofH, 1, h - roofH - 1); g.fillRect(2, h-1, w-4, 1);
  // 屋顶（梯形 + 瓦片线）
  for(let y = 0; y < roofH; y++){
    const inset = Math.max(0, Math.floor((roofH - y) * 0.5) - 1);
    g.fillStyle = (y % 4 === 3) ? shade(roof, -0.28) : roof;
    g.fillRect(inset, y, w - inset*2, 1);
  }
  g.fillStyle = shade(roof, 0.3); g.fillRect(Math.floor(roofH*0.5)-1, 0, w - (Math.floor(roofH*0.5)-1)*2, 2);
  g.fillStyle = '#1c1626'; g.fillRect(0, roofH-1, w, 1);
  // 门
  const dw = 12, dx = opt.doorX !== undefined ? opt.doorX : Math.floor(w/2 - dw/2);
  g.fillStyle = '#1c1208'; g.fillRect(dx-1, h-17, dw+2, 16);
  g.fillStyle = '#241409'; g.fillRect(dx, h-16, dw, 15);
  g.fillStyle = '#8a5a30'; g.fillRect(dx, h-16, dw, 2); g.fillRect(dx, h-16, 2, 15); g.fillRect(dx+dw-2, h-16, 2, 15);
  g.fillStyle = '#e8c84a'; g.fillRect(dx + dw - 4, h - 9, 1, 2);
  // 窗
  const wins = opt.windows !== undefined ? opt.windows : 2;
  for(let i = 0; i < wins; i++){
    const wx = i === 0 ? 7 : w - 15;
    g.fillStyle = '#1c1626'; g.fillRect(wx-1, roofH+5, 10, 10);
    g.fillStyle = opt.lit ? '#ffd86a' : '#2c3a5c'; g.fillRect(wx, roofH+6, 8, 8);
    g.fillStyle = '#1c1626'; g.fillRect(wx+3, roofH+6, 1, 8); g.fillRect(wx, roofH+9, 8, 1);
  }
  // 招牌
  if(opt.sign){
    g.fillStyle = '#6a4a2e'; g.fillRect(dx + dw + 3, roofH + 3, 14, 11);
    g.fillStyle = '#8a5a30'; g.fillRect(dx + dw + 4, roofH + 4, 12, 9);
    g.fillStyle = opt.sign; g.fillRect(dx + dw + 7, roofH + 6, 6, 5);
  }
  return c;
}

const ZONE_THEME_COLOR = {

let THEME_TILES = {}, THEME_WALLS = {};
function tintCanvas(src, color, alpha, lighten){
  const c = mkCanvas(src.width, src.height), g = c.getContext('2d');
  g.drawImage(src, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.globalAlpha = alpha;
  g.fillStyle = color;
  g.fillRect(0, 0, c.width, c.height);
  if(lighten){
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = lighten;
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, c.width, c.height);
  }
  g.globalAlpha = 1;
  g.globalCompositeOperation = 'source-over';
  return c;
}
function buildThemes(){
  THEME_TILES = {}; THEME_WALLS = {};
  const mk = (name, map, walls) => {
    const t = {};
    for(const id in map){
      const [col, a, l] = map[id];
      t[id] = TILES[id].map(sp => tintCanvas(sp, col, a, l));
    }
    THEME_TILES[name] = t;
    if(walls) THEME_WALLS[name] = { top: tintCanvas(TILES.wallTop, walls[0], walls[1]),
                                    face: tintCanvas(TILES.wallFace, walls[0], walls[1]) };
  };
  mk('swamp',  { [T_GRASS]: ['#3a5a30', 0.55], [T_WATER]: ['#3e5c42', 0.55], [T_DIRT]: ['#4a4434', 0.5] });
  mk('desert', { [T_GRASS]: ['#d8b86a', 0.78], [T_DIRT]: ['#c89a55', 0.5], [T_WATER]: ['#3a8ab8', 0.3] });
  mk('snow',   { [T_GRASS]: ['#e8eef8', 0.82, 0.06], [T_DIRT]: ['#b8c4d4', 0.6], [T_WATER]: ['#9ad0e8', 0.55, 0.08] });
  mk('coast',  { [T_GRASS]: ['#5aa050', 0.32], [T_WATER]: ['#1d4f9c', 0.5], [T_DIRT]: ['#d8c089', 0.62] });
  mk('grave',  { [T_STONE]: ['#4a4458', 0.55], [T_DIRT]: ['#3e3848', 0.55] }, ['#3a2a52', 0.4]);
  mk('ice',    { [T_STONE]: ['#7ab8d8', 0.55, 0.08], [T_DIRT]: ['#5a88a8', 0.5] }, ['#2a5a8a', 0.42]);

function gT(m, x, y){ return inB(m, x, y) ? m.g[y*m.w + x] : T_VOID; }

}
function solidAtPx(wx, wy){ return tileSolid(G.map, Math.floor(wx / TS), Math.floor(wy / TS)); }
function blockTile(m, x, y){ if(inB(m, x, y)) m.sx[y*m.w + x] = 1; }
function blockRect(m, x, y, w, h){ for(let j = y; j < y + h; j++) for(let i = x; i < x + w; i++) blockTile(m, i, j); }
function addProp(m, spr, px, py, opts){
  const p = Object.assign({ spr, x: px, y: py, kind: 'static' }, opts || {});
  m.props.push(p); return p;
}
function blob(m, cx, cy, r, tid){
  for(let dy = -r; dy <= r; dy++) for(let dx = -r; dx <= r; dx++){

function canStand(m, tx, ty){

}

  for(let i = 0; i < (tries || 400); i++){
    const x = Ri(2, m.w - 3), y = Ri(2, m.h - 3);
    if(canStand(m, x, y) && (!minD || dist(x, y, fromX, fromY) >= minD)) return { x, y };

function pickBossSpot(m, sxT, syT, minD){
  let best = null;
  for(let i = 0; i < 600; i++){
    const x = Ri(8, m.w - 9), y = Ri(8, m.h - 9);
    if(!canStand(m, x, y)) continue;
    const d = dist(x, y, sxT, syT);
    if(d >= minD) return { x, y };
    if(!best || d > best.d) best = { x, y, d };

function bfsFar(m, sx, sy){
  const dist = new Int32Array(m.w * m.h).fill(-1);

  let far = { x: sx, y: sy, d: 0 }, head = 0;
  while(head < q.length){
    const c = q[head++], cx = c % m.w, cy = (c / m.w) | 0;
    for(const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx = cx + dx, ny = cy + dy;
      if(!inB(m, nx, ny) || tileSolid(m, nx, ny)) continue;
      const ni = ny * m.w + nx;
      if(dist[ni] !== -1) continue;
      dist[ni] = dist[c] + 1; q.push(ni);
      if(dist[ni] > far.d) far = { x: nx, y: ny, d: dist[ni] };
    }
  }

}

    let x = x0, y = y0;
    while(x !== x1 || y !== y1){
      sT(m, x, y, T_PATH); sT(m, x+1, y, T_PATH);
      if(x !== x1 && (y === y1 || R() < 0.6)) x += Math.sign(x1 - x); else if(y !== y1) y += Math.sign(y1 - y);
    }
  };
  path(cx, cy - 9, cx, 9);            // 北：传送门
  path(cx - 9, cy, 16, cy - 6);       // 西：商店
  path(cx + 9, cy, 47, cy - 6);       // 东：医师
  path(cx, cy + 9, cx, h - 4);        // 南：入口
  path(cx - 6, cy + 7, 18, cy + 11);  // 西南：民居
  path(cx + 6, cy + 7, 46, cy + 11);  // 东南：民居
  // 边界树林
  for(let x = 0; x < w; x++) for(let y = 0; y < h; y++){
    if(x < 2 || y < 2 || x >= w - 2 || y >= h - 2){
      blockTile(m, x, y);

  m.marks.fountain = { x: cx*TS + 8, y: cy*TS + 8 };
  addProp(m, null, cx*TS + 8, cy*TS + 14, { kind: 'fountain' });
  blockRect(m, cx - 1, cy - 1, 3, 3);
  // 建筑
  const bld = (spr, tx, ty, name, markKey) => {

    addProp(m, spr, tx*TS + spr.width/2, ty*TS + spr.height, { kind: 'bld' });

  bld(SPR.buildings.house2, 44, 34, '民居', 'house2');
  bld(SPR.buildings.tavern, 26, 6, '酒馆');
  // 北侧传送台（单座传送门，交互打开地图选择界面）
  for(let x = cx - 6; x <= cx + 6; x++) for(let y = 9; y <= 13; y++) sT(m, x, y, T_STONE);
  const portalPx = cx * TS + 8, portalPy = 11 * TS;
  addProp(m, null, portalPx, portalPy, { kind: 'portal', zone: 'select' });
  m.marks.portals = [{ x: portalPx, y: portalPy, zone: 'select' }];
  blockRect(m, cx - 3, 9, 1, 2); blockRect(m, cx + 3, 9, 1, 2);
  // 铁匠（左下角民居前）
  m.marks.forge = { x: m.marks.house1.x, y: m.marks.house1.y + 6 };
  addProp(m, SPR.props.rock, m.marks.forge.x + 16, m.marks.forge.y + 2);
  // 仓库（右下角民居前）
  m.marks.vault = { x: m.marks.house2.x, y: m.marks.house2.y + 6 };
  addProp(m, SPR.props.sign, m.marks.vault.x - 18, m.marks.vault.y - 2, { kind: 'sign' });
  // 公告板
  m.marks.board = { x: (cx + 7)*TS, y: (cy - 7)*TS };
  addProp(m, SPR.props.sign, m.marks.board.x, m.marks.board.y, { kind: 'board' });
  // 火把（广场四周，光源）
  [[cx-8, cy-4], [cx+8, cy-4], [cx-8, cy+5], [cx+8, cy+5], [cx-1, 9], [cx+2, 9]].forEach(([x, y]) => {
    addProp(m, SPR.props.torch, x*TS + 8, y*TS + 12, { kind: 'torch' });
    m.lights.push({ x: x*TS + 8, y: y*TS + 4, r: 46, c: '255,150,60' });

    const r = R();
    const spr = r < 0.3 ? SPR.props.bush : r < 0.5 ? SPR.props.flowerR : r < 0.7 ? SPR.props.flowerY : r < 0.85 ? SPR.props.flowerB : SPR.props.tuft;
    addProp(m, spr, p.x*TS + 8, p.y*TS + 12);
    if(r < 0.3) blockTile(m, p.x, p.y);
  }
  [[10, 20], [11, 21], [40, 14]].forEach(([x, y]) => { addProp(m, SPR.props.barrel, x*TS+8, y*TS+12); blockTile(m, x, y); });
  m.marks.spawn = { x: cx*TS + 8, y: (cy + 12)*TS };
  buildMini(m);
  return m;
}

const MINI_C = ['#000', '#3f7a33', '#76582f', '#274e85', '#454352', '#191522', '#c2401c', '#221b26', '#5e5b66', '#6b4424', '#3a2424', '#ad9357'];
function buildMini(m){
  m.mini = mkCanvas(m.w, m.h);
  const g = m.mini.getContext('2d');
  for(let y = 0; y < m.h; y++) for(let x = 0; x < m.w; x++){
    g.fillStyle = MINI_C[m.g[y*m.w + x]] || '#000';
    g.fillRect(x, y, 1, 1);
    if(m.sx[y*m.w + x] && m.g[y*m.w+x] === T_GRASS){ g.fillStyle = '#2d5a28'; g.fillRect(x, y, 1, 1); }
  }
  m.fog = mkCanvas(m.w, m.h);
  const f = m.fog.getContext('2d');
  f.fillStyle = '#000'; f.fillRect(0, 0, m.w, m.h);
}
function reveal(m, wx, wy){
  if(!m.fog) return;
  const f = m.fog.getContext('2d');
  f.globalCompositeOperation = 'destination-out';
  f.beginPath(); f.arc(wx / TS, wy / TS, 8, 0, TAU); f.fill();
  f.globalCompositeOperation = 'source-over';
}

function skillMeta(id){
  if(id === 'basic') return { cls: null, branch: -1, tier: -1, lvl: 1, color: '#cfd2da', bname: '通用' };
  for(const cls in SKILL_TREE){
    const br = SKILL_TREE[cls];
    for(let b = 0; b < br.length; b++){
      const t = br[b].skills.indexOf(id);
      if(t >= 0) return { cls, branch: b, tier: t, lvl: SKILL_TIERS[t], color: br[b].color, bname: br[b].name };
    }
  }
  return null;
}

let ITEM_ID = 1;
function rollRarity(luck){
  let total = 0; const ws = RARITY.map((r, i) => { const w = r.w * (i >= 2 ? (1 + (luck || 0)) : 1); total += w; return w; });
  let roll = Math.random() * total;
  for(let i = 0; i < ws.length; i++){ roll -= ws[i]; if(roll <= 0) return i; }
  return 0;
}
function makeItem(ilvl, opt){
  opt = opt || {};
  ilvl = Math.max(1, Math.round(ilvl));
  const rarity = opt.rarity !== undefined ? opt.rarity : rollRarity(opt.luck || 0);
  let baseKey = opt.base;
  if(!baseKey){
    const slotRoll = Math.random();
    if(slotRoll < 0.34){
      const pool = (G.player && chance(0.75)) ? WEAPON_BY_CLASS[G.player.cls] : ['sword', 'axe', 'staff', 'bow'];
      baseKey = choice(pool);
    } else baseKey = choice(['helm', 'armor', 'boots', 'ring', 'amulet']);
  }
  const base = BASES[baseKey];
  const it = { id: ITEM_ID++, base: baseKey, slot: base.slot, icon: base.icon, rarity, ilvl, aff: {}, kind: 'gear' };
  const scale = 1 + 0.24 * (ilvl - 1);
  if(base.dmg) it.dmg = Math.round(rnd(base.dmg[0], base.dmg[1]) * scale * (1 + rarity * 0.07));
  if(base.armor) it.armor = Math.round(rnd(base.armor[0], base.armor[1]) * scale * (1 + rarity * 0.07));
  // 传说：尝试套用独特物品
  if(rarity === 4){
    const cands = UNIQUES.filter(u => u.base === baseKey && ilvl >= u.minLvl);
    if(cands.length && chance(0.8)){
      const u = choice(cands);
      it.name = u.name; it.proc = u.proc; it.flavor = u.flavor;
    }
  }
  const nAff = RARITY[rarity].affixes;
  // 武器与饰品可出现流派/技能词缀；护甲类只出通用词缀
  const slotAllowsSkill = (base.slot === 'weapon' || base.slot === 'ring' || base.slot === 'amulet');
  let pool = AFFIX_POOL.filter(a => !a.skill || slotAllowsSkill).slice();
  if(slotAllowsSkill){
    // 为玩家当前职业注入对应的 3 条流派伤害词缀
    const cls = (G.player && G.player.cls) || 'warrior';
    for(const ba of BRANCH_AFFIXES) if(ba.cls === cls) pool.push(ba);
  }
  for(let i = 0; i < nAff && pool.length; i++){
    const a = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const t = Math.random();
    it.aff[a.k] = Math.max(1, Math.round((a.lo + (a.hi - a.lo) * t) * (1 + 0.06 * (ilvl - 1))));
  }
  if(!it.name){
    it.name = base.name;
    if(rarity >= 2) it.name = choice(PREFIX) + it.name;
    if(rarity >= 3) it.name = it.name + choice(SUFFIX);
    else if(rarity === 1 && chance(0.5)) it.name = choice(PREFIX) + base.name;
  }
  it.price = Math.round((8 + ilvl * 6) * Math.pow(rarity + 1, 1.55) + (it.dmg || 0) + (it.armor || 0));
  return it;
}
function rerollCost(it){ return Math.round((30 + it.ilvl * 8) * Math.pow(it.rarity + 1, 1.4)); }
function rerollItem(it){
  const P = G.player;
  if(!it || it.kind !== 'gear'){ toast('只能重铸装备', '#e05a5a'); return false; }
  const nAff = RARITY[it.rarity].affixes;
  if(nAff <= 0){ toast('普通品质无词缀可重铸', '#8d87a0'); sfx('error'); return false; }
  const cost = rerollCost(it);
  if(P.gold < cost){ toast(`重铸需要 ${cost} 金币`, '#e05a5a'); sfx('error'); return false; }
  P.gold -= cost;
  // 重roll 词缀（沿用 makeItem 的池规则）
  const base = BASES[it.base];
  const slotAllowsSkill = (base.slot === 'weapon' || base.slot === 'ring' || base.slot === 'amulet');
  let pool = AFFIX_POOL.filter(a => !a.skill || slotAllowsSkill).slice();
  if(slotAllowsSkill){ for(const ba of BRANCH_AFFIXES) if(ba.cls === P.cls) pool.push(ba); }
  it.aff = {};
  for(let i = 0; i < nAff && pool.length; i++){
    const a = pool.splice(Math.floor(Math.random() * pool.length), 1)[0];
    const t = Math.random();
    it.aff[a.k] = Math.max(1, Math.round((a.lo + (a.hi - a.lo) * t) * (1 + 0.06 * (it.ilvl - 1))));
  }
  // 重铸不保留独特 proc 名称之外，名字保持
  calcStats(P);
  toast(`重铸完成（-${cost} 金）`, '#ffd23c'); sfx('levelup');
  addFx({ type: 'aura', x: P.x, y: P.y, t: 0, dur: 0.5, c: '#ffd23c' });

}

function genQuest(){
  const unlocked = ZONE_ORDER.filter(z => { const r = ZONE_DEFS[z].req; return !r || G.bossKills[r]; });
  const z = unlocked[unlocked.length - 1], zd = ZONE_DEFS[z];
  const elvl = zd.lvl + G.ng * 12;
  // 首领讨伐（区域 Boss 未击败时高几率）
  if(!G.bossKills[zd.boss] && chance(0.4)){
    return { type: 'boss', zone: z, target: zd.boss, name: `讨伐 ${BOSS_DEFS[zd.boss].name}`,
             need: 1, got: 0, gold: 80 + elvl * 22, xp: 50 + elvl * 26 };
  }
  const roll = Math.random();
  if(roll < 0.22){
    // 精英狩猎：击杀精英怪，奖励丰厚
    const need = rndi(2, 4);
    return { type: 'elite', zone: z, name: `精英狩猎 · ${zd.name}`, need, got: 0,
             desc: `击杀 ${need} 个精英怪`, gold: 60 + elvl * 16 + need * 14, xp: 44 + elvl * 20 + need * 12 };
  }
  if(roll < 0.42){
    // 限时速攻：限定时间内清剿
    const need = rndi(10, 16), limit = need * 4 + 20;
    return { type: 'timed', zone: z, name: `限时清剿 · ${zd.name}`, need, got: 0, limit, timeLeft: limit, active: false,
             desc: `${limit}秒内击杀 ${need} 只魔物`, gold: 50 + elvl * 12 + need * 4, xp: 40 + elvl * 16 + need * 5 };
  }
  const need = rndi(8, 14);
  return { type: 'kill', zone: z, name: `肃清 ${zd.name}`, need, got: 0,
           desc: `击杀 ${need} 只魔物`, gold: 30 + elvl * 9 + need * 3, xp: 24 + elvl * 12 + need * 4 };
}
function questObjText(q){
  if(q.type === 'boss') return q.got ? '已完成目标，回悬赏板交付' : `前往${ZONE_DEFS[q.zone].name}讨伐首领`;
  if(q.type === 'elite') return `${ZONE_DEFS[q.zone].name} 精英 ${q.got}/${q.need}`;
  if(q.type === 'timed'){
    const t = q.active ? `剩 ${Math.ceil(q.timeLeft)}s` : `限 ${q.limit}s · 击杀首怪计时`;
    return `${ZONE_DEFS[q.zone].name} ${q.got}/${q.need} · ${t}`;
  }
  return `${ZONE_DEFS[q.zone].name}击杀 ${q.got}/${q.need}`;
}
function questKill(zone, bossId, isElite){
  const q = G.quest;
  if(!q || q.done) return;
  if(q.type === 'kill' && q.zone === zone) q.got++;
  if(q.type === 'timed' && q.zone === zone){
    if(!q.active){ q.active = true; q.timeLeft = q.limit; }
    q.got++;
  }
  if(q.type === 'elite' && q.zone === zone && isElite) q.got++;
  if(q.type === 'boss' && bossId === q.target) q.got = 1;
  if(q.got >= q.need){
    q.done = true; G.questDone++;
    giveGold(q.gold); giveXP(q.xp);
    chat(`✓ 悬赏完成：${q.name}（+${q.gold}金 +${q.xp}经验）`, '#7ec84a');
    toast(`悬赏完成！奖励 ${q.gold} 金币`, '#7ec84a'); sfx('quest');
    G.quest = null;
  }
}

/* ----------------------------- 12. 物理 / 碰撞 ----------------------------- */
function circleHitsTiles(x, y, r, fly){
  const m = G.map;
  const x0 = Math.floor((x - r) / TS), x1 = Math.floor((x + r) / TS);
  const y0 = Math.floor((y - r) / TS), y1 = Math.floor((y + r) / TS);
  for(let ty = y0; ty <= y1; ty++) for(let tx = x0; tx <= x1; tx++){
    if(fly && gT(m, tx, ty) === T_WATER && !m.sx[ty*m.w + tx]) continue;
    if(tileSolid(m, tx, ty)) return true;
  }
  return false;
}
function moveEnt(e, dx, dy){
  if(dx !== 0 && !circleHitsTiles(e.x + dx, e.y, e.size, e.fly)) e.x += dx;
  if(dy !== 0 && !circleHitsTiles(e.x, e.y + dy, e.size, e.fly)) e.y += dy;
}
function tileAt(x, y){ return gT(G.map, Math.floor(x / TS), Math.floor(y / TS)); }

function calcStats(P){
  const C = CLASSES[P.cls];
  const a = { str: P.attrs.str, int: P.attrs.int, dex: P.attrs.dex, vit: P.attrs.vit };
  let dmgP = 0, hp = 0, mp = 0, crit = 0, critD = 0, spd = 0, armor = 0, regen = 0, mregen = 0, wdmg = 2;
  const procs = {};
  const skillAff = { cdr: 0, bdur: 0, srange: 0, branch: {} };
  for(const slot in P.equip){
    const it = P.equip[slot]; if(!it) continue;
    if(it.dmg) wdmg = it.dmg;
    if(it.armor) armor += it.armor;
    if(it.proc) procs[it.proc] = true;
    for(const k in it.aff){
      const v = it.aff[k];
      if(k === 'main'){ a.str += v; a.int += v; a.dex += v; a.vit += v; }
      else if(k === 'dmgP') dmgP += v; else if(k === 'hp') hp += v; else if(k === 'mp') mp += v;
      else if(k === 'crit') crit += v; else if(k === 'critD') critD += v; else if(k === 'spd') spd += v;
      else if(k === 'armor') armor += v; else if(k === 'regen') regen += v; else if(k === 'mregen') mregen += v;
      else if(k === 'cdr') skillAff.cdr += v; else if(k === 'bdur') skillAff.bdur += v;
      else if(k === 'srange') skillAff.srange += v;
      else if(k.startsWith('br_')){ const bk = k.slice(3); skillAff.branch[bk] = (skillAff.branch[bk] || 0) + v; }
    }
  }
  const main = a[C.main];
  if(procs.haste) spd += 15;
  /* 属性重做：每项都有清晰且有用的多重效果，鼓励主属性 + 副属性搭配
     力量：攻击 + 护甲（坦度）  智力：法力/法力回复 + 技能伤害%  敏捷：暴击率/暴伤 + 移速  体质：生命 + 生命回复 */
  const intSkillP = a.int * 0.4;             // 智力提供技能伤害%
  P.stats = {
    a, maxHP: Math.round(C.baseHP + a.vit * 11 + (P.lvl - 1) * 9 + hp),
    maxMP: Math.round(C.baseMP + a.int * 4 + (P.lvl - 1) * 3 + mp),
    atk: (wdmg + main * 0.6 + a.str * 0.18 + P.lvl * 0.7) * (1 + (dmgP + intSkillP) / 100),
    crit: 5 + a.dex * 0.45 + crit, critD: 1.5 + (a.dex * 0.5 + critD) / 100,
    armor: Math.round(armor + a.str * 0.6),
    spd: C.spd * (1 + (spd + a.dex * 0.08) / 100),
    regen: 0.6 + a.vit * 0.09 + regen, mregen: 2.4 + a.int * 0.12 + mregen,
    procs, wdmg, skillAff
  };
  P.hp = Math.min(P.hp, P.stats.maxHP); P.mp = Math.min(P.mp, P.stats.maxMP);
}
function respecAttrs(){
  const P = G.player;
  const spent = P.attrs.str + P.attrs.int + P.attrs.dex + P.attrs.vit - (P.baseAttrSum || 20);
  if(spent <= 0){ toast('没有可洗的属性点', '#8d87a0'); return false; }
  const cost = 40 + P.lvl * 10;
  if(P.gold < cost){ toast(`洗点需要 ${cost} 金币`, '#e05a5a'); sfx('error'); return false; }
  P.gold -= cost;
  P.attrs = { str: 5, int: 5, dex: 5, vit: 5 };
  P.statPts += spent;
  calcStats(P); P.hp = Math.min(P.hp, P.stats.maxHP); P.mp = Math.min(P.mp, P.stats.maxMP);
  toast(`已洗点，返还 ${spent} 属性点（-${cost} 金）`, '#ffd23c'); sfx('potion'); saveGame();
  return true;
}
function xpNeed(lvl){ return Math.floor(30 * Math.pow(lvl, 1.62)); }
function giveXP(n){
  const P = G.player; if(!P) return;

  while(P.xp >= xpNeed(P.lvl)){
    P.xp -= xpNeed(P.lvl); P.lvl++; P.statPts += 3; P.sp++;
    calcStats(P); P.hp = P.stats.maxHP; P.mp = P.stats.maxMP;
    addFx({ type: 'ring', x: P.x, y: P.y, r: 4, max: 50, t: 0, dur: 0.7, color: '#ffd23c' });

    toast('获得 1 技能点！按 K 打开技能树', '#7ec84a');
    tutHint('levelup', '升级了！按 C 打开角色面板分配属性点（力量/智力/敏捷/体质各有侧重）');

    sfx('levelup'); shake(3);
  }
}
function giveGold(n){ const P = G.player; if(P){ P.gold += Math.round(n); } }
function usePotion(kind){
  const P = G.player;
  if(!P || P.potCd > 0) return false;
  if(P.potions[kind] <= 0){ toast(kind === 'hp' ? '没有治疗药剂了（商店有售）' : '没有法力药剂了', '#e05a5a'); sfx('error'); return false; }
  P.potions[kind]--; P.potCd = 1.6;
  if(kind === 'hp'){ const v = Math.round(P.stats.maxHP * 0.45); P.hp = Math.min(P.stats.maxHP, P.hp + v); addText(P.x, P.y - 18, '+' + v, '#7ec84a', 10); burst(P.x, P.y - 8, 10, '#7ec84a', 40); }
  else { const v = Math.round(P.stats.maxMP * 0.6); P.mp = Math.min(P.stats.maxMP, P.mp + v); addText(P.x, P.y - 18, '+' + v + ' MP', '#6a9aff', 10); burst(P.x, P.y - 8, 10, '#6a9aff', 40); }
  sfx('potion'); return true;
}

/* ----------------------------- 14. 战斗核心 ----------------------------- */
function addText(x, y, txt, color, size){
  G.texts.push({ x: x + rnd(-3, 3), y, txt, color, size: size || 9, t: 0, dur: 0.9, vy: -26 });
}
function addPart(x, y, vx, vy, life, color, size, grav){
  if(G.parts.length > 400) return;
  G.parts.push({ x, y, vx, vy, life, max: life, color, size: size || 1.5, grav: grav || 0 });
}
function burst(x, y, n, color, spd){
  for(let i = 0; i < n; i++){
    const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
    addPart(x, y, Math.cos(a) * s, Math.sin(a) * s, rnd(0.25, 0.6), color, rnd(1, 2.4));
  }
}
function addFx(fx){ G.fx.push(fx); }
function shake(n){ G.cam.shake = Math.max(G.cam.shake, n); }
function buffVal(k){
  const P = G.player; if(!P || !P.buffs.length) return 0;
  let v = 0; for(const b of P.buffs) if(b.k === k) v += b.v;
  return v;
}
function rollDmg(coef, opt){
  const P = G.player, s = P.stats;
  let dmg = s.atk * coef * rnd(0.88, 1.12);
  dmg *= (1 + buffVal('dmg'));
  if(opt && opt.branch && s.skillAff){
    const bd = s.skillAff.branch[opt.branch] || 0;
    if(bd) dmg *= (1 + bd / 100);
  }
  const crit = (opt && opt.sure) || chance(s.crit / 100 + buffVal('crit'));
  if(crit) dmg *= s.critD;
  return { v: Math.max(1, Math.round(dmg)), crit };
}
function dmgEnemy(e, amt, opt){
  if(!e || e.dead) return;
  if(e.mod && e.mod.k === 'ward' && e.wardT > 0){
    addText(e.x, e.y - e.spr0H - 4, '免疫', '#e8c84a', 9);
    addFx({ type: 'ring', x: e.x, y: e.y - 4, r: e.size, max: e.size + 4, t: 0, dur: 0.2, color: '#e8c84a' });
    return;
  }
  {
    const lc = buffVal('leech');
    if(lc > 0 && !(opt && opt.noLeech)){
      const P2 = G.player;
      if(P2 && P2.hp > 0){ P2.hp = Math.min(P2.stats.maxHP, P2.hp + amt * lc); }
    }
  }
  opt = opt || {};
  e.hp -= amt; e.hitFlash = 0.12; e.aggro = true;
  addText(e.x, e.y - e.spr0H - 4, fmt(amt), opt.crit ? '#ffd23c' : '#fff', opt.crit ? 12 : 9);
  if(opt.crit) shake(1.5);
  const P = G.player, pr = P ? P.stats.procs : {};
  if(!opt.noProc && P){
    if(pr.burn || opt.burn) e.burn = { t: 2.2, dps: P.stats.atk * 0.18 };
    if(pr.chill || opt.chill) e.chill = Math.max(e.chill || 0, opt.chill || 1.6);
    if(pr.leech){ P.hp = Math.min(P.stats.maxHP, P.hp + amt * 0.06); }
    if(pr.quake && opt.crit && !opt.isQuake){
      enemiesInR(e.x, e.y, 36).forEach(o => { if(o !== e) dmgEnemy(o, Math.round(amt * 0.4), { noProc: true, isQuake: true }); });
      addFx({ type: 'ring', x: e.x, y: e.y, r: 4, max: 36, t: 0, dur: 0.3, color: '#c2a86a' });
    }
  }
  if(opt.stun) e.stun = Math.max(e.stun || 0, opt.stun);
  if(opt.kb){
    const a = angTo(opt.kb.x, opt.kb.y, e.x, e.y), f = e.heavy ? 30 : 90;
    e.kbx += Math.cos(a) * f; e.kby += Math.sin(a) * f;
  }
  burst(e.x, e.y - 4, 4, e.pc || '#e05a5a', 50);
  sfx('hit');
  if(e.hp <= 0) killEnemy(e);
}
function killEnemy(e){
  if(e.dead) return;
  e.dead = true;
  burst(e.x, e.y - 4, e.boss ? 50 : 14, e.pc || '#e05a5a', e.boss ? 120 : 70);
  giveXP(e.xp); G.kills++;
  dropLoot(e.x, e.y, e);
  questKill(G.zone, e.bossId, !!e.elite);
  sfx(e.boss ? 'roar' : 'die');
  if(e.boss) onBossDead(e);
}
function dmgPlayer(amt, srcX, srcY){
  const P = G.player;
  if(!P || P.invT > 0 || P.dashT > 0 || G.state !== 'play') return;
  const armor = P.stats.armor + buffVal('armor');
  const red = armor / (armor + 40 + 8 * P.lvl);
  let v = Math.max(1, Math.round(amt * (1 - red) * rnd(0.9, 1.1)));
  P.hp -= v; P.invT = 0.45; P.hitFlash = 0.2;
  addText(P.x, P.y - 22, '-' + v, '#ff6a6a', 11);
  burst(P.x, P.y - 8, 8, '#e05a5a', 60);
  if(srcX !== undefined){
    const tn = (P.stats.procs.thorns ? 0.35 : 0) + buffVal('thorns');
    const fa = buffVal('farmor');
    if(tn > 0 || fa > 0){
      const e = nearestEnemy(srcX, srcY, 26);
      if(e){
        if(tn > 0) dmgEnemy(e, Math.round(v * tn), { noProc: true, noLeech: true });
        if(fa > 0){ e.chill = Math.max(e.chill, fa); burst(e.x, e.y - 6, 6, '#9adcff', 50); }
      }
    }
  }
  shake(2.5); sfx('hurt');
  if(P.hp <= 0){ P.hp = 0; onPlayerDead(); }
}
function nearestEnemy(x, y, r){
  let best = null, bd = r * r;
  for(const e of G.enemies){
    if(e.dead) continue;
    const d = dist2(x, y, e.x, e.y);
    if(d < bd){ bd = d; best = e; }
  }
  return best;
}
function enemiesInR(x, y, r){
  const out = [];
  for(const e of G.enemies){ if(!e.dead && dist(x, y, e.x, e.y) <= r + e.size) out.push(e); }
  return out;
}

/* ----------------------------- 15. 投射物 / 范围伤害 / 技能 ----------------------------- */
function fireProj(o){
  G.projs.push(Object.assign({
    x: 0, y: 0, vx: 0, vy: 0, size: 3, life: 1.2, t: 0, owner: 'p', dmg: 5,
    color: '#fff', pierce: 0, hitSet: null, trail: 0
  }, o));
}
function aoeAt(x, y, r, coef, opt){
  opt = opt || {};
  const targets = enemiesInR(x, y, r);
  for(const e of targets){
    const d = opt.flat !== undefined ? { v: Math.max(1, Math.round(opt.flat)), crit: false } : rollDmg(coef, { branch: opt.branch });
    dmgEnemy(e, d.v, { crit: d.crit, kb: { x, y }, stun: opt.stun, chill: opt.chill, burn: opt.burn });
  }
  addFx({ type: 'ring', x, y, r: 6, max: r, t: 0, dur: 0.32, color: opt.color || '#ffd23c' });
  if(opt.fx === 'frost') for(let i = 0; i < 14; i++){ const a = rnd(0, TAU); addPart(x + Math.cos(a)*r*0.6, y + Math.sin(a)*r*0.6, Math.cos(a)*40, Math.sin(a)*40 - 20, 0.5, '#9adcff', 2); }
  if(opt.fx === 'rain') for(let i = 0; i < 16; i++) addPart(x + rnd(-r, r), y + rnd(-r, r), 0, 160, 0.35, '#e0e86a', 1.5);
  if(opt.fx === 'slam' || opt.fx === 'whirl') burst(x, y, 16, '#c2a86a', 90);
  if(opt.fx === 'vine') for(let i = 0; i < 11; i++)
    addFx({ type: 'vine', x: x + rnd(-r * 0.75, r * 0.75), y: y + rnd(-r * 0.7, r * 0.7), t: -rnd(0, 0.12), dur: 0.55 });
  shake(opt.shake !== undefined ? opt.shake : 2);
  return targets.length;
}
function aimPos(){
  const P = G.player;
  if(!TOUCH.enabled || Mouse.moved){
    return { x: Mouse.x / 2 + G.cam.x, y: Mouse.y / 2 + G.cam.y };
  }
  const e = nearestEnemy(P.x, P.y, 260);
  if(e) return { x: e.x, y: e.y };
  return { x: P.x + Math.cos(P.aim) * 80, y: P.y + Math.sin(P.aim) * 80 };
}
function setFacing(P, ang){
  P.aim = ang;
  const ax = Math.cos(ang), ay = Math.sin(ang);
  if(Math.abs(ax) > Math.abs(ay)) P.dir = ax > 0 ? 'side' : 'left';
  else P.dir = ay > 0 ? 'down' : 'up';
}
function playerBasic(){
  const P = G.player, C = CLASSES[P.cls], b = C.basic;
  if(P.atkT > 0) return false;
  P.atkT = C.atkCd;
  const aim = aimPos(), ang = angTo(P.x, P.y, aim.x, aim.y);
  setFacing(P, ang);
  if(b.type === 'melee'){
    const cx = P.x + Math.cos(ang) * b.range * 0.6, cy = P.y + Math.sin(ang) * b.range * 0.6;
    const targets = enemiesInR(cx, cy, b.range * 0.85);
    for(const e of targets){
      const d = rollDmg(b.coef);
      dmgEnemy(e, d.v, { crit: d.crit, kb: { x: P.x, y: P.y } });
    }
    addFx({ type: 'slash', x: P.x, y: P.y, ang, r: b.range + 6, t: 0, dur: 0.16, color: '#e8e0d0' });
    sfx('slash');
  } else {
    const d = rollDmg(b.coef);
    fireProj({ x: P.x + Math.cos(ang) * 8, y: P.y - 6 + Math.sin(ang) * 8,
      vx: Math.cos(ang) * b.spd, vy: Math.sin(ang) * b.spd, dmg: d.v, crit: d.crit,
      size: b.size, life: b.life, color: b.color, arrow: b.arrow, ang });
    sfx(b.arrow ? 'arrow' : 'shoot');
  }
  return true;
}
function skillRank(id){
  const v = G.player && G.player.learned[id];
  return v === true ? 1 : (v | 0);
}
function skillColor(id){ const m = skillMeta(id); return m ? m.color : '#bfb8d8'; }
function addBuff(k, v, dur, c, n){
  const P = G.player;
  for(let i = P.buffs.length - 1; i >= 0; i--) if(P.buffs[i].n === n && P.buffs[i].k === k) P.buffs.splice(i, 1);
  P.buffs.push({ k, v, t: dur, dur, c, n });
}
function castFx(color){
  const P = G.player;
  addFx({ type: 'ring', x: P.x, y: P.y, r: 4, max: 22, t: 0, dur: 0.26, color });
  for(let i = 0; i < 8; i++){
    const a = rnd(0, TAU);
    addPart(P.x + Math.cos(a) * 6, P.y - 8 + Math.sin(a) * 4, Math.cos(a) * 50, Math.sin(a) * 50 - 30, 0.3, color, 1.8);
  }
}
function castSkill(i){
  const P = G.player, key = P.loadout[i];
  if(!key){ toast('空技能位 · 按 K 打开技能树装备技能', '#8d87a0'); sfx('error'); return false; }
  if(key === 'basic'){ return playerBasic(); }  // 普攻：无蓝耗、用 atkCd 节流、可长按连发
  const sk = SKILLS[key];
  if(P.skillCd[i] > 0) return false;
  if(P.mp < sk.mp){ toast('法力不足', '#6a9aff'); sfx('error'); return false; }
  /* 技能等级倍率：每级 效果+18% · 持续+8% · 冷却-3.5% */
  const r = skillRank(key) || 1;
  const sa = P.stats.skillAff || { cdr: 0, bdur: 0, srange: 0, branch: {} };
  const BR = branchKeyOf(key);
  const RM = 1 + 0.18 * (r - 1), DM0 = 1 + 0.08 * (r - 1);
  const DM = DM0 * (1 + (sa.bdur || 0) / 100);       // 增益/持续含装备加成
  const SC = v => v ? v * DM : v;
  const RNG = 1 + (sa.srange || 0) / 100;             // 技能范围加成
  const dmgOpt = { branch: BR };
  const aim = aimPos(), ang = angTo(P.x, P.y, aim.x, aim.y);
  let tx = aim.x, ty = aim.y;
  const maxR = 130, dd = dist(P.x, P.y, tx, ty);
  if(dd > maxR){ tx = P.x + (tx - P.x) / dd * maxR; ty = P.y + (ty - P.y) / dd * maxR; }
  setFacing(P, ang);
  P.mp -= sk.mp; P.skillCd[i] = sk.cd * (1 - 0.035 * (r - 1)) * (1 - (sa.cdr || 0) / 100);
  castFx(sk.bcol || skillColor(key));
  if(sk.sfx) sfx(sk.sfx);
  if(sk.near){
    const nd = dist(P.x, P.y, tx, ty);
    if(nd > sk.near){ tx = P.x + (tx - P.x) / nd * sk.near; ty = P.y + (ty - P.y) / nd * sk.near; }
  }
  switch(sk.cast){
    case 'nova':
      aoeAt(P.x, P.y, sk.r * RNG, sk.coef * RM, { chill: SC(sk.chill), fx: sk.fx, branch: BR, color: sk.fx === 'frost' ? '#9adcff' : '#e8e0d0' });
      if(sk.fx === 'whirl') addFx({ type: 'whirl', x: P.x, y: P.y, r: sk.r, t: 0, dur: 0.4 });
      break;
    case 'charge': {
      const d = sk.distP;
      let nx = P.x, ny = P.y;
      for(let s = 0; s < d; s += 4){
        const cx = P.x + Math.cos(ang) * s, cy = P.y + Math.sin(ang) * s;
        if(circleHitsTiles(cx, cy, P.size)) break;
        nx = cx; ny = cy;
        addPart(cx, cy - 6, rnd(-20, 20), rnd(-20, 20), 0.3, '#e0a83c', 2);
      }
      enemiesInR((P.x + nx) / 2, (P.y + ny) / 2, d / 2 + 14).forEach(e => {
        const dm = rollDmg(sk.coef * RM, dmgOpt);
        dmgEnemy(e, dm.v, { crit: dm.crit, kb: { x: P.x, y: P.y } });
      });
      P.x = nx; P.y = ny; P.invT = Math.max(P.invT, 0.25); shake(2);
      break; }
    case 'buff':
      addFx({ type: 'aura', x: P.x, y: P.y, t: 0, dur: 0.55, c: sk.bcol || skillColor(key) });
      addText(P.x, P.y - 24, sk.name + '！', sk.bcol || skillColor(key), 11);
      break;
    case 'aoe':
      if(sk.delay){
        addFx({ type: 'tele', x: tx, y: ty, r: sk.r, t: 0, dur: sk.delay, color: sk.fx === 'vine' ? '126,200,74' : '255,210,60',
          cb: () => aoeAt(tx, ty, sk.r * RNG, sk.coef * RM, { stun: SC(sk.stun), chill: SC(sk.chill), fx: sk.fx, burn: sk.burn, branch: BR }) });
      } else aoeAt(tx, ty, sk.r * RNG, sk.coef * RM, { stun: SC(sk.stun), chill: SC(sk.chill), fx: sk.fx, burn: sk.burn, branch: BR });
      break;
    case 'proj': {
      const d = rollDmg(sk.coef * RM, { sure: sk.sure, branch: BR });
      fireProj({ x: P.x + Math.cos(ang) * 8, y: P.y - 6 + Math.sin(ang) * 8,
        vx: Math.cos(ang) * sk.spd, vy: Math.sin(ang) * sk.spd, dmg: d.v, crit: d.crit,
        size: sk.size, life: sk.life, color: sk.color, pierce: sk.pierce || 0,
        boomR: sk.r, burn: sk.burn, arrow: sk.arrow, ang, spin: sk.spin,
        chill: SC(sk.chill), stun: SC(sk.stun), trail: sk.trail || (sk.burn ? 1 : 0), hitSet: sk.pierce ? new Set() : null });
      break; }
    case 'fan': {
      for(let k = 0; k < sk.n; k++){
        const a2 = ang + (k - (sk.n - 1) / 2) * (sk.spread / (sk.n - 1) * 2);
        const d = rollDmg(sk.coef * RM, dmgOpt);
        fireProj({ x: P.x + Math.cos(a2) * 8, y: P.y - 6 + Math.sin(a2) * 8,
          vx: Math.cos(a2) * sk.spd, vy: Math.sin(a2) * sk.spd, dmg: d.v, crit: d.crit,
          size: sk.size || 2, life: sk.life || 1.0, color: sk.color || '#e0e86a',
          arrow: sk.arrow, burn: sk.burn, trail: sk.trail || 0, ang: a2 });
      }
      break; }
    case 'chain': {
      let from = { x: P.x, y: P.y - 6 }, cur = nearestEnemy(tx, ty, 70) || nearestEnemy(P.x, P.y, 130);
      const hit = new Set();
      for(let j = 0; j < sk.jumps && cur; j++){
        const d = rollDmg(sk.coef * RM, dmgOpt);
        addFx({ type: 'bolt', x1: from.x, y1: from.y, x2: cur.x, y2: cur.y - 6, t: 0, dur: 0.18, c: sk.bcolor });
        dmgEnemy(cur, d.v, { crit: d.crit });
        hit.add(cur); from = { x: cur.x, y: cur.y - 6 };
        let next = null, bd = sk.jr * sk.jr;
        for(const e of G.enemies){
          if(e.dead || hit.has(e)) continue;
          const dd2 = dist2(cur.x, cur.y, e.x, e.y);
          if(dd2 < bd){ bd = dd2; next = e; }
        }
        cur = next;
      }
      if(hit.size === 0){ addFx({ type: 'bolt', x1: P.x, y1: P.y - 6, x2: tx, y2: ty, t: 0, dur: 0.15, c: sk.bcolor }); }
      break; }
    case 'cloud':
      addFx({ type: 'cloud', x: tx, y: ty, r: sk.r * RNG, t: 0, dur: sk.dur * DM, dps: sk.dps * RM, tick: 0, color: sk.ccol || '110,200,80', vs: 'enemy' });
      break;
    case 'meteor':
      addFx({ type: 'tele', x: tx, y: ty, r: sk.r, t: 0, dur: sk.delay, color: '255,140,42', meteor: true,
        cb: () => { aoeAt(tx, ty, sk.r * RNG, sk.coef * RM, { burn: true, shake: 4, color: '#ff8c2a', branch: BR }); burst(tx, ty, 26, '#ff8c2a', 130); sfx('boom'); } });
      break;
    case 'dash': {
      let nx = P.x, ny = P.y;
      for(let s2 = 0; s2 < sk.distP; s2 += 4){
        const cx2 = P.x + Math.cos(ang) * s2, cy2 = P.y + Math.sin(ang) * s2;
        if(circleHitsTiles(cx2, cy2, P.size)) break;
        nx = cx2; ny = cy2;
        if(s2 % 12 === 0) addFx({ type: 'after', x: cx2, y: cy2, dir: P.dir, cls: P.cls, t: 0, dur: 0.32 });
      }
      P.x = nx; P.y = ny;
      break; }
    case 'blink': {
      const ox = P.x, oy = P.y;
      addFx({ type: 'after', x: ox, y: oy, dir: P.dir, cls: P.cls, t: 0, dur: 0.35 });
      aoeAt(ox, oy, sk.r * RNG, sk.coef * RM, { color: '#b08aff', shake: 1, branch: BR });
      const bd = dist(P.x, P.y, tx, ty) || 1;
      let nx = P.x, ny = P.y;
      for(let s2 = 0; s2 <= bd; s2 += 4){
        const cx2 = P.x + (tx - P.x) / bd * s2, cy2 = P.y + (ty - P.y) / bd * s2;
        if(circleHitsTiles(cx2, cy2, P.size)) break;
        nx = cx2; ny = cy2;
      }
      P.x = nx; P.y = ny; P.invT = Math.max(P.invT, 0.3);
      addFx({ type: 'bolt', x1: ox, y1: oy - 8, x2: nx, y2: ny - 8, t: 0, dur: 0.2, c: '176,138,255' });
      burst(nx, ny - 8, 14, '#b08aff', 100);
      aoeAt(nx, ny, sk.r * RNG, sk.coef * RM, { color: '#b08aff', shake: 2, branch: BR });
      break; }
    case 'orbit':
      P.orbit = { t: 0, dur: sk.dur * DM, n: sk.n, coef: sk.coef * RM, ang: rnd(0, TAU), tick: 0 };
      addFx({ type: 'ring', x: P.x, y: P.y, r: 6, max: 28, t: 0, dur: 0.32, color: '#e8e0d0' });
      break;
    case 'volley': {
      for(let k2 = 0; k2 < sk.n; k2++){
        const vx2 = tx + rnd(-sk.vr, sk.vr) * 0.8, vy2 = ty + rnd(-sk.vr, sk.vr) * 0.8;
        addFx({ type: 'tele', x: vx2, y: vy2, r: sk.sr, t: -k2 * 0.11, dur: sk.delay || 0.55,
          color: sk.tcol || '255,210,60', sky: sk.sky, mcol: sk.mcol,
          cb: () => {
            aoeAt(vx2, vy2, sk.sr * RNG, sk.coef * RM, { chill: SC(sk.chill), stun: SC(sk.stun), color: sk.mcol || '#ffd23c', shake: 1, branch: BR });
            if(sk.sky === 'bolt') addFx({ type: 'boltSky', x: vx2, y: vy2, t: 0, dur: 0.22 });
            burst(vx2, vy2 - 4, 12, sk.mcol || '#ffd23c', 90);
          } });
      }
      break; }
    case 'execute': {
      const tgt = nearestEnemy(tx, ty, 70) || nearestEnemy(P.x, P.y, 120);
      if(!tgt){ toast('没有可处刑的目标', '#8d87a0'); P.mp += sk.mp; P.skillCd[i] = 0.4; break; }
      addFx({ type: 'after', x: P.x, y: P.y, dir: P.dir, cls: P.cls, t: 0, dur: 0.32 });
      const dv = dist(P.x, P.y, tgt.x, tgt.y) || 1;
      const px2 = tgt.x - (tgt.x - P.x) / dv * (tgt.size + 9), py2 = tgt.y - (tgt.y - P.y) / dv * (tgt.size + 9);
      if(!circleHitsTiles(px2, py2, P.size)){ P.x = px2; P.y = py2; }
      const ea = angTo(P.x, P.y, tgt.x, tgt.y);
      setFacing(P, ea);
      const low = tgt.hp / tgt.maxHP < 0.35;
      const dm = rollDmg(sk.coef * RM * (low ? 2.5 : 1), dmgOpt);
      addFx({ type: 'arc', x: tgt.x, y: tgt.y - 6, a: ea, r: 22, t: 0, dur: 0.22, c: low ? '#ff5a5a' : '#ffd23c' });
      dmgEnemy(tgt, dm.v, { crit: dm.crit || low, kb: { x: P.x, y: P.y } });
      if(low) addText(tgt.x, tgt.y - 28, '处 刑 ！', '#ff5a5a', 12);
      shake(3);
      break; }
    case 'trap':
      addFx({ type: 'trap', x: tx, y: ty, r: sk.r, t: 0, dur: sk.dur, arm: 0.4, coef: sk.coef * RM, root: sk.root * DM, used: false });
      addText(tx, ty - 10, '陷阱已布设', '#7ec84a', 9);
      break;
  }
  /* 通用后置：增益 / 治疗 / 无敌帧 */
  if(sk.buffs) for(const b of sk.buffs) addBuff(b.k, b.v * RM, sk.dur * DM, sk.bcol || skillColor(key), sk.name);
  if(sk.heal){
    const hv = Math.round(P.stats.maxHP * sk.heal * RM);
    P.hp = Math.min(P.stats.maxHP, P.hp + hv);
    addText(P.x, P.y - 30, '+' + hv, '#7ce08a', 11);
    for(let k2 = 0; k2 < 6; k2++) addPart(P.x + rnd(-8, 8), P.y - rnd(0, 12), 0, -30, 0.6, '#7ce08a', 2);
  }
  if(sk.inv) P.invT = Math.max(P.invT, sk.inv);
  return true;
}

/* ----------------------------- 16. 战利品与背包 ----------------------------- */
const INV_CAP = 24;
function addDrop(d){ G.drops.push(Object.assign({ t: 0, vx: rnd(-46, 46), vy: rnd(-70, -30), z: 0, vz: 0 }, d)); }
function dropLoot(x, y, e){
  const zl = (ZONE_DEFS[G.zone] ? ZONE_DEFS[G.zone].lvl : 1) + G.ng * 12;
  const tier = e.tier || 0, luck = (e.elite ? 1.6 : 0) + (e.boss ? 2.8 : 0) + G.ng * 0.8;
  // 金币（产出下调约 30%）
  const gn = e.boss ? rndi(5, 8) : (chance(0.6) ? rndi(1, 2 + tier) : 0);
  for(let i = 0; i < gn; i++) addDrop({ kind: 'gold', amt: Math.round((1.4 + zl * 1.1 + tier * 2) * rnd(0.7, 1.4) * (e.boss ? 3 : 1)), x, y });
  // 药剂
  if(chance(e.boss ? 1 : (e.elite ? 0.4 : 0.05))) addDrop({ kind: 'potion', pk: chance(0.7) ? 'hp' : 'mp', x, y });
  // 装备：普通怪爆率大幅降低（约 4%），精英保底稀有，Boss 必爆多件
  if(e.boss){
    for(let i = 0; i < rndi(3, 4); i++){
      const it = makeItem(zl + tier + rndi(0, 2), { luck, rarity: i === 0 ? Math.max(2, rollRarity(luck + 1.5)) : undefined });
      addDrop({ kind: 'item', it, x, y }); lootSfx(it.rarity);
    }
  } else if(e.elite){
    // 精英必掉 1 件保底稀有 + 概率追加
    const it = makeItem(zl + tier + rndi(0, 2), { luck, rarity: Math.max(2, rollRarity(luck)) });
    addDrop({ kind: 'item', it, x, y }); lootSfx(it.rarity);
    if(chance(0.4)){ const it2 = makeItem(zl + tier + rndi(0, 1), { luck }); addDrop({ kind: 'item', it: it2, x, y }); lootSfx(it2.rarity); }
  } else {
    const gearC = 0.035 + tier * 0.012;
    if(chance(gearC)){
      const it = makeItem(zl + tier + rndi(0, 2), { luck });
      addDrop({ kind: 'item', it, x, y }); lootSfx(it.rarity);
    }
  }
}
function lootSfx(rarity){ sfx(rarity >= 3 ? 'levelup' : rarity >= 2 ? 'rare' : 'drop'); }
function openChest(p){

  addDrop({ kind: 'item', it: makeItem(zl + rndi(0, 2), { luck: 0.6 }), x: p.x, y: p.y });

  if(P.inv.length >= INV_CAP){ toast('背包已满', '#e05a5a'); sfx('error'); return; }

const ELITE_MODS = [
  { k: 'blaze',  name: '炽焰', c: '#ff7a2a', col: '255,122,42',  desc: '灼热光环' },

  { k: 'storm',  name: '雷涌', c: '#b08aff', col: '176,138,255', desc: '周期电击' },

  { k: 'ward',   name: '坚壁', c: '#e8c84a', col: '232,200,74',  desc: '周期免伤' },
  { k: 'vamp',   name: '噬血', c: '#e05a8a', col: '224,90,138',  desc: '攻击回血' }

function spawnEnemy(key, x, y, opt){
  opt = opt || {};
  const d = ENEMY_DEFS[key];
  const zl = (ZONE_DEFS[G.zone] ? ZONE_DEFS[G.zone].lvl : 1) + G.ng * 12;
  const hpMul = (1 + 0.22 * (zl - 1)) * (1 + G.ng * 0.4);
  const e = {
    key, name: d.name, x, y, size: d.size, hp: Math.round(d.hp * hpMul), maxHP: 0,
    dmg: Math.round(d.dmg * (1 + 0.14 * (zl - 1))), spd: d.spd, xp: Math.round(d.xp * (1 + 0.15 * (zl - 1))),
    ai: d.ai, tier: d.tier, fly: d.fly, heavy: d.heavy, poison: d.poison, lavaOK: d.lavaOK,
    spr: d.spr, humanoid: d.humanoid, side: d.side,
    aggro: false, dead: false, hitFlash: 0, stun: 0, chill: 0, burn: null,
    kbx: 0, kby: 0, wT: rnd(0, 2), wa: rnd(0, TAU), wandering: false, cd: rnd(0.3, 1),
    atkCd: d.atkCd || 1.0, projSpd: d.projSpd, projC: d.projC, atkR: d.atkR, fireP: d.fireP,
    walkT: rnd(0, 9), dir: 'down', face: 1, lungeT: 0, lungeCd: 0, vx: 0, vy: 0
  };
  if(opt.elite || (!opt.noElite && d.tier >= 0 && chance(0.06))){
    e.elite = true;
    e.mod = ELITE_MODS[Ri(0, ELITE_MODS.length - 1)];

    if(e.mod.k === 'swift') e.spd *= 1.35;
    else e.spd *= 1.05;
  }
  if(d.humanoid) e.frames = SPR[d.humanoid];
  const sp = e.humanoid ? e.frames.down[0] : SPR.enemy[e.spr][0];
  e.spr0H = sp.height;
  e.pc = { slimeG:'#5dbb63', slimeB:'#4f8fd8', slimeR:'#d85050', bat:'#6b4a8f', spider:'#7a4a9a',
           wolf:'#8a8f9a', hellhound:'#c25a4a', golem:'#9a968c', fgolem:'#ff7a2a', imp:'#ff8c5a',
           demon:'#a05060', mushroom:'#d8685a', goblin:'#7aa84e', skeleton:'#ddd7c2' }[key] || '#e05a5a';
  e.maxHP = e.hp;

function spawnBoss(id, x, y){

function populateZone(zoneId){
  const zd = ZONE_DEFS[zoneId], m = G.map;
  const sp = m.marks.spawn, bs = m.marks.boss;
  const packs = 78 + Ri(0, 16);
  for(let i = 0; i < packs; i++){
    const p = randFloor(m, 16, sp.x / TS, sp.y / TS);
    if(dist(p.x * TS, p.y * TS, bs.x, bs.y) < 11 * TS) continue;
    const n = Ri(2, 4), key = Rc(zd.enemies);
    for(let j = 0; j < n; j++){
      const ex = p.x * TS + Ri(-18, 18), ey = p.y * TS + Ri(-18, 18);
      if(!circleHitsTiles(ex, ey, 6)) spawnEnemy(chance(0.75) ? key : Rc(zd.enemies), ex, ey);
    }
  }
  spawnBoss(zd.boss, bs.x, bs.y);
}
function eProj(e, ang, spd, col, dmg, opt){
  opt = opt || {};
  fireProj({ owner: 'e', x: e.x + Math.cos(ang) * (e.size + 2), y: e.y - 5 + Math.sin(ang) * (e.size + 2),
    vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, dmg, size: opt.size || 3,
    life: opt.life || 2.2, color: col, trail: opt.trail || 0 });
}
function updEnemy(e, dt){
  const P = G.player;
  if(e.orbT) e.orbT = Math.max(0, e.orbT - dt);
  if(e.dead) return;
  if(e.hitFlash > 0) e.hitFlash -= dt;
  // 状态
  if(e.burn){
    e.burn.t -= dt; e.burn.acc = (e.burn.acc || 0) + dt;
    if(e.burn.acc >= 0.5){ e.burn.acc -= 0.5; dmgEnemyRaw(e, Math.max(1, Math.round(e.burn.dps * 0.5)), '#ff8c2a'); }
    if(chance(dt * 8)) addPart(e.x + rnd(-4, 4), e.y - rnd(2, 10), rnd(-8, 8), -30, 0.4, '#ff8c2a', 1.5);
    if(e.burn && e.burn.t <= 0) e.burn = null;
  }
  if(e.chill > 0){ e.chill -= dt; if(chance(dt * 5)) addPart(e.x + rnd(-5, 5), e.y - rnd(0, 8), 0, 10, 0.4, '#9adcff', 1.4); }
  if(e.stun > 0){ e.stun -= dt; return; }
  const pd = dist(e.x, e.y, P.x, P.y);
  if(pd > 480 && !e.boss) return; // 远处休眠
  // 精英词缀行为
  if(e.mod){
    if(e.aggro) tutHint('elite', '遇到精英怪！它带有词缀光环（颜色标识），更强但掉落更好');
    e.modT -= dt;
    if(e.mod.k === 'ward'){ e.wardT -= dt; if(e.wardT <= -2.4){ e.wardT = 1.2; } } // 每3.6s有1.2s护盾
    if(pd < 360){
      if(e.mod.k === 'blaze' && e.modT <= 0){ e.modT = 0.5;
        addFx({ type: 'cloud', x: e.x, y: e.y, r: 22, t: 0, dur: 0.6, dps: e.dmg * 0.5, tick: 0, color: '255,110,40', vs: 'player' });
      }
      if(e.mod.k === 'storm' && e.modT <= 0){ e.modT = 1.6;
        if(pd < 150){ addFx({ type: 'bolt', x1: e.x, y1: e.y - 8, x2: P.x, y2: P.y - 6, t: 0, dur: 0.18, c: e.mod.col });
          dmgPlayer(e.dmg * 0.7, e.x, e.y); } }
      if(e.mod.k === 'swift' && chance(dt * 12)) addFx({ type: 'after', x: e.x, y: e.y, dir: e.dir || 'down', cls: null, espr: enemySprite(e), t: 0, dur: 0.3 });
    }
  }
  const spdMul = (e.chill > 0 ? 0.45 : 1);
  // 击退
  if(Math.abs(e.kbx) > 1 || Math.abs(e.kby) > 1){
    moveEnt(e, e.kbx * dt, e.kby * dt);
    e.kbx *= Math.pow(0.0008, dt); e.kby *= Math.pow(0.0008, dt);
  }
  if(!e.aggro && pd < (e.boss ? 130 : 110)) e.aggro = true;
  if(e.boss){ updBoss(e, dt, pd, spdMul); return; }
  if(!e.aggro){
    // 漫游
    e.wT -= dt;
    if(e.wT <= 0){ e.wT = rnd(0.8, 2.2); e.wandering = chance(0.55); e.wa = rnd(0, TAU); }
    if(e.wandering){
      const s = e.spd * 0.35 * spdMul * dt;
      moveEnt(e, Math.cos(e.wa) * s, Math.sin(e.wa) * s);
      e.walkT += dt * 6; e.face = Math.cos(e.wa) >= 0 ? 1 : -1;
    }
    return;
  }
  e.cd -= dt;
  const ang = angTo(e.x, e.y, P.x, P.y);
  e.face = Math.cos(ang) >= 0 ? 1 : -1;
  e.dir = Math.abs(Math.cos(ang)) > Math.abs(Math.sin(ang)) ? (Math.cos(ang) > 0 ? 'side' : 'left') : (Math.sin(ang) > 0 ? 'down' : 'up');
  const touch = pd < e.size + P.size + 3;
  if(e.ai === 'ranged'){
    if(pd > e.atkR){ const s = e.spd * spdMul * dt; moveEnt(e, Math.cos(ang) * s, Math.sin(ang) * s); e.walkT += dt * 7; }
    else if(pd < e.atkR * 0.45){ const s = e.spd * 0.8 * spdMul * dt; moveEnt(e, -Math.cos(ang) * s, -Math.sin(ang) * s); e.walkT += dt * 7; }
    if(e.cd <= 0 && pd <= e.atkR * 1.15){
      e.cd = e.atkCd;
      eProj(e, ang + rnd(-0.06, 0.06), e.projSpd, e.projC, e.dmg, { trail: e.fireP ? 1 : 0 });
      sfx(e.fireP ? 'fire' : 'shoot');
    }
  } else if(e.ai === 'lunge'){
    if(e.lungeT > 0){
      e.lungeT -= dt;
      moveEnt(e, e.vx * dt, e.vy * dt);
    } else {
      e.lungeCd -= dt;
      const s = e.spd * spdMul * dt;
      if(pd > 16) { moveEnt(e, Math.cos(ang) * s, Math.sin(ang) * s); e.walkT += dt * 8; }
      if(e.lungeCd <= 0 && pd < 84 && pd > 18){
        e.lungeT = 0.32; e.lungeCd = rnd(1.7, 2.5);
        e.vx = Math.cos(ang) * e.spd * 2.6; e.vy = Math.sin(ang) * e.spd * 2.6;
        sfx('dash');
      }
    }
  } else if(e.ai === 'erratic'){
    const wob = Math.sin(G.t * 7 + e.walkT) * 0.9;
    const a2 = ang + wob;
    const s = e.spd * spdMul * dt;
    moveEnt(e, Math.cos(a2) * s, Math.sin(a2) * s);
    e.walkT += dt * 10;
  } else { // chase
    if(pd > e.size + P.size){
      const s = e.spd * spdMul * dt;
      moveEnt(e, Math.cos(ang) * s, Math.sin(ang) * s);
      e.walkT += dt * 7;
    }
  }
  // 接触伤害
  if(touch && e.cd <= 0 && e.ai !== 'ranged'){
    e.cd = 0.95;
    const before = P.hp;
    dmgPlayer(e.dmg, e.x, e.y);
    if(e.poison && P.hp > 0){ P.poison = { t: 2.4, dps: e.dmg * 0.22 }; addText(P.x, P.y - 30, '中毒！', '#7ad84a', 9); }
    if(e.mod && P.invT <= 0){ /* 注：dmgPlayer 命中后才触发 */ }
    if(e.mod && before > P.hp){
      const dealt = before - P.hp;
      if(e.mod.k === 'frost'){ P.chillT = 1.6; addText(P.x, P.y - 30, '冰缓！', '#7ad8ff', 9); }
      if(e.mod.k === 'vamp'){ e.hp = Math.min(e.maxHP, e.hp + dealt * 1.5); addPart(e.x, e.y - 6, 0, -20, 0.4, '#e05a8a', 2); }
    }
  }
}
function dmgEnemyRaw(e, amt, color){ // 持续伤害（不触发特效连锁）
  if(e.dead) return;
  e.hp -= amt;
  addText(e.x, e.y - e.spr0H - 2, fmt(amt), color || '#ff8c2a', 8);
  if(e.hp <= 0) killEnemy(e);
}

/* ---- Boss AI ---- */
function bossEngage(e){
  if(e.engaged) return;
  e.engaged = true; G.boss = e;
  setMusic(e.bossId === 'demonlord' ? 'finalboss' : 'boss');
  chat(`⚔ ${e.title} · ${e.name} 苏醒了！`, '#ff6b35');
  toast(`${e.name} 现身！`, BOSS_DEFS[e.bossId].color);
  sfx('roar'); shake(4);
}
function updBoss(e, dt, pd, spdMul){
  const P = G.player;
  if(!e.engaged){ if(pd < 150){ bossEngage(e); } else return; }
  if(e.phase === 0 && e.hp < e.maxHP * 0.5){
    e.phase = 1; e.cd = Math.min(e.cd, 0.5);
    if(e.bossId !== 'demonlord') setMusic('bossrage');
    chat(`${e.name} 被激怒了！`, '#ff6b35'); toast('Boss 进入狂暴状态！', '#ff6b35');
    burst(e.x, e.y - 10, 30, e.pc, 120); shake(4); sfx('roar');
  }
  const rage = e.phase === 1 ? 0.72 : 1;
  const ang = angTo(e.x, e.y, P.x, P.y);
  e.face = Math.cos(ang) >= 0 ? 1 : -1;
  // 移动（冲锋状态优先）
  if(e.lungeT > 0){
    e.lungeT -= dt; moveEnt(e, e.vx * dt, e.vy * dt);
    if(chance(dt * 20)) addPart(e.x + rnd(-8, 8), e.y - rnd(0, 8), 0, -20, 0.3, e.pc, 2);
  } else if(pd > e.size + P.size + 2){
    const s = e.spd * (e.phase === 1 ? 1.25 : 1) * spdMul * dt;
    moveEnt(e, Math.cos(ang) * s, Math.sin(ang) * s);
    e.walkT += dt * 6;
  }
  // 接触伤害
  e.tcd = (e.tcd || 0) - dt;
  if(pd < e.size + P.size + 3 && e.tcd <= 0){ e.tcd = 1.0; dmgPlayer(e.dmg * 0.8, e.x, e.y); }
  e.cd -= dt;
  if(e.cd > 0) return;
  e.cd = (e.bossId === 'demonlord' ? 2.1 : 2.5) * rage;
  const pat = e.pat++ % 3;
  if(e.arch === 'guardian'){
    if(pat === 0){ // 根须猛击：玩家脚下延迟范围
      const tx = P.x, ty = P.y;
      addFx({ type: 'tele', x: tx, y: ty, r: 36, t: 0, dur: 0.85, color: hexRGB(e.pc),
        cb: () => { if(dist(P.x, P.y, tx, ty) < 36 + P.size) dmgPlayer(e.dmg * 1.4, tx, ty);
          burst(tx, ty, 16, e.pc, 90); shake(3); sfx('stomp'); } });
    } else if(pat === 1){ // 种子散射
      for(let k = -2; k <= 2; k++) eProj(e, ang + k * 0.26, 130, e.pc, e.dmg, { size: 3 });
      sfx('shoot');
    } else { // 召唤
      let mn = 0; G.enemies.forEach(o => { if(!o.dead && !o.boss) mn++; });
      if(mn < 7){ for(let k = 0; k < 2; k++) spawnEnemy(e.minion || (chance(0.6) ? 'slimeG' : 'mushroom'), e.x + rnd(-30, 30), e.y + rnd(-30, 30), { noElite: true }); burst(e.x, e.y - 8, 14, e.pc, 70); sfx('portal'); }
      else e.cd = 0.8;
    }
  } else if(e.arch === 'skking'){
    if(pat === 0){ // 剑气波
      const n = e.phase === 1 ? 5 : 3;
      for(let k = 0; k < n; k++) eProj(e, ang + (k - (n-1)/2) * 0.3, 165, e.pc, e.dmg, { size: 4 });
      sfx('slash');
    } else if(pat === 1){ // 闪现突袭
      const a2 = rnd(0, TAU), nx = P.x + Math.cos(a2) * 34, ny = P.y + Math.sin(a2) * 34;
      if(!circleHitsTiles(nx, ny, e.size)){
        burst(e.x, e.y - 8, 12, e.pc, 80);
        e.x = nx; e.y = ny;
        burst(e.x, e.y - 8, 12, e.pc, 80); sfx('portal');
        const tx = P.x, ty = P.y;
        addFx({ type: 'tele', x: tx, y: ty, r: 30, t: 0, dur: 0.6, color: hexRGB(e.pc),
          cb: () => { if(dist(P.x, P.y, tx, ty) < 30 + P.size) dmgPlayer(e.dmg * 1.3, tx, ty); burst(tx, ty, 12, e.pc, 80); sfx('slash'); } });
      }
    } else { // 召唤骷髅
      let mn = 0; G.enemies.forEach(o => { if(!o.dead && !o.boss) mn++; });
      if(mn < 6){ for(let k = 0; k < 2; k++) spawnEnemy(e.minion || 'skeleton', e.x + rnd(-26, 26), e.y + rnd(-26, 26), { noElite: true }); sfx('portal'); }
      else e.cd = 0.7;
    }
  } else { // demonlord
    if(pat === 0){ // 环形火弹
      const n = e.phase === 1 ? 12 : 8;
      for(let k = 0; k < n; k++) eProj(e, (k / n) * TAU + G.t, 120, e.pc, e.dmg * 0.85, { size: 3, trail: 1 });
      sfx('fire');
    } else if(pat === 1){ // 熔岩池
      for(let k = 0; k < (e.phase === 1 ? 3 : 2); k++){
        const tx = P.x + rnd(-40, 40), ty = P.y + rnd(-40, 40);
        addFx({ type: 'tele', x: tx, y: ty, r: 26, t: 0, dur: 0.7, color: hexRGB(e.pc),
          cb: () => addFx({ type: 'cloud', x: tx, y: ty, r: 26, t: 0, dur: 3.2, dps: e.dmg * 0.45, tick: 0, color: hexRGB(e.pc), vs: 'player' }) });
      }
      sfx('fire');
    } else { // 恶魔冲锋
      e.lungeT = 0.5; e.vx = Math.cos(ang) * e.spd * 3.4; e.vy = Math.sin(ang) * e.spd * 3.4;
      sfx('roar'); shake(2);
      if(e.phase === 1){ // 狂暴期附加陨石
        for(let k = 0; k < 2; k++){
          const tx = P.x + rnd(-50, 50), ty = P.y + rnd(-50, 50);
          addFx({ type: 'tele', x: tx, y: ty, r: 30, t: 0, dur: 0.9, color: hexRGB(e.pc), meteor: true,
            cb: () => { if(dist(P.x, P.y, tx, ty) < 30 + P.size) dmgPlayer(e.dmg * 1.2, tx, ty);
              burst(tx, ty, 20, e.pc, 110); shake(3); sfx('boom'); } });
        }
      }
    }
  }
}

function updNPC(n, dt){
  if(n.bubbleT > 0){ n.bubbleT -= dt; if(n.bubbleT <= 0) n.bubble = null; }

  if(n.moving){
    const s = (n.kind === 'player' ? 46 : 30) * dt;
    const nx = n.x + Math.cos(n.wa) * s, ny = n.y + Math.sin(n.wa) * s;
    if(n.home && dist(nx, ny, n.home.x, n.home.y) > n.range){ n.wa += Math.PI; }
    else if(!circleHitsTiles(nx, ny, 4)){ n.x = nx; n.y = ny; }
    else n.wa = rnd(0, TAU);
    n.walkT += dt * 6;
    n.dir = Math.abs(Math.cos(n.wa)) > Math.abs(Math.sin(n.wa)) ? (Math.cos(n.wa) > 0 ? 'side' : 'left') : (Math.sin(n.wa) > 0 ? 'down' : 'up');
  }
}

function updProjs(dt){
  const P = G.player;
  for(let i = G.projs.length - 1; i >= 0; i--){
    const p = G.projs[i];
    p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    let dead = p.t >= p.life;
    if(!dead && circleHitsTiles(p.x, p.y, 2, true)) dead = true;
    if(p.trail && chance(dt * 30)) addPart(p.x, p.y, rnd(-12, 12), rnd(-12, 12), 0.3, p.color, 1.6);
    if(!dead){
      if(p.owner === 'p'){
        for(const e of G.enemies){
          if(e.dead) continue;
          if(p.hitSet && p.hitSet.has(e)) continue;
          if(dist(p.x, p.y, e.x, e.y - 4) < p.size + e.size + 2){
            if(p.boomR){
              aoeAt(p.x, p.y, p.boomR, 0, { skipRoll: true, flat: p.dmg, burn: p.burn, color: '#ff8c2a', shake: 2 });
              burst(p.x, p.y, 14, p.color, 90); sfx('boom');
              dead = true; break;
            }
            dmgEnemy(e, p.dmg, { crit: p.crit, kb: { x: p.x - p.vx * 0.01, y: p.y - p.vy * 0.01 }, burn: p.burn, chill: p.chill, stun: p.stun });
            if(p.pierce > 0){ p.pierce--; if(p.hitSet) p.hitSet.add(e); }
            else { dead = true; break; }
          }
        }
        if(dead && p.boomR && p.t >= p.life){ /* 飞到尽头自爆 */ }
      } else {
        if(P && dist(p.x, p.y, P.x, P.y - 4) < p.size + P.size + 1){
          dmgPlayer(p.dmg, p.x, p.y); dead = true;
        }
      }
    } else if(p.boomR && p.owner === 'p'){
      aoeAt(p.x, p.y, p.boomR, 0, { skipRoll: true, flat: p.dmg, burn: p.burn, color: '#ff8c2a', shake: 2 });
      burst(p.x, p.y, 14, p.color, 90); sfx('boom');
    }
    if(dead){ if(!p.boomR) burst(p.x, p.y, 3, p.color, 40); G.projs.splice(i, 1); }
  }
}
function updDrops(dt){
  const P = G.player;
  for(let i = G.drops.length - 1; i >= 0; i--){
    const d = G.drops[i];
    d.t += dt;
    if(d.t < 0.5){ d.x += d.vx * dt; d.y += d.vy * dt; d.vy += 260 * dt; }
    const pd = dist(d.x, d.y, P.x, P.y);
    const magnet = d.kind === 'item' ? 16 : 30;
    if(d.t > 0.4 && pd < magnet + 26 && d.kind !== 'item'){
      const a = angTo(d.x, d.y, P.x, P.y);
      d.x += Math.cos(a) * 150 * dt; d.y += Math.sin(a) * 150 * dt;
    }
    if(d.t > 0.35 && pd < magnet){
      if(pickupDrop(d)) G.drops.splice(i, 1);
    } else if(d.t > 120) G.drops.splice(i, 1);
  }
}
function updFx(dt){
  const P = G.player;
  for(let i = G.fx.length - 1; i >= 0; i--){
    const f = G.fx[i];
    f.t += dt;
    if(f.type === 'tele' && f.t >= f.dur){ if(f.cb) try{ f.cb(); }catch(err){} G.fx.splice(i, 1); continue; }
    if(f.type === 'cloud'){
      f.tick -= dt;
      if(f.tick <= 0){
        f.tick = 0.45;
        if(f.vs === 'enemy'){
          enemiesInR(f.x, f.y, f.r).forEach(e => dmgEnemyRaw(e, Math.max(1, Math.round(P.stats.atk * f.dps)), '#7ad84a'));
