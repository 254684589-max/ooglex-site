#wl-loading {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px 16px; text-align: center;
  background:
    radial-gradient(700px 420px at 50% 18%, rgba(179, 36, 26, .28), transparent 65%),
    radial-gradient(800px 500px at 50% 115%, rgba(232, 132, 58, .12), transparent 62%),
    #0a0605;
  transition: opacity .6s ease;
}
#wl-loading.hide { opacity: 0; pointer-events: none; }
#wl-loading::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px;
  background: linear-gradient(90deg, #b3241a, #e8843a, #ffd27a);
}
.wl-hat { width: 88px; height: 88px; filter: drop-shadow(0 0 18px rgba(232, 132, 58, .55)); animation: wl-bob 2.4s ease-in-out infinite; }
@keyframes wl-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.wl-title { font-size: clamp(30px, 7vw, 46px); font-weight: 800; letter-spacing: 4px; color: #e8843a; text-shadow: 0 0 18px rgba(232, 90, 30, .6); }
.wl-sub { color: #a9a69e; font-size: 14px; letter-spacing: 1px; margin-top: -10px; }
.wl-bar { width: min(360px, 78vw); height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .1); overflow: hidden; }
.wl-bar i { display: block; height: 100%; width: 0%; border-radius: 99px; background: linear-gradient(90deg, #b3241a, #e8843a); transition: width .25s; }
.wl-bar.indeterminate i { width: 35%; animation: wl-slide 1.4s ease-in-out infinite; }
@keyframes wl-slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
.wl-status { font-size: 14px; color: #d8d4ca; min-height: 20px; }
.wl-tip { font-size: 13px; color: #8f8c85; max-width: 440px; line-height: 1.7; min-height: 44px; }
.wl-note { font-size: 12px; color: #77746d; max-width: 440px; line-height: 1.7; }
.wl-portrait { display: none; font-size: 13px; color: #e8843a; }
@media (orientation: portrait) and (max-width: 820px) { .wl-portrait { display: block; } }
.wl-back {
  position: fixed; top: 20px; left: 16px; z-index: 11; color: #e8843a; text-decoration: none; font-size: 14px;
  padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(232, 132, 58, .4); background: rgba(10, 6, 5, .7);
}
.wl-back:focus-visible, .wl-btn:focus-visible { outline: 2px solid #e8843a; outline-offset: 2px; }
.wl-error { display: none; max-width: 480px; white-space: pre-line; background: #3a2020; border: 1px solid #8a3a30; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 1.7; color: #ffd8cf; text-align: left; }
.wl-error.show { display: block; }
.wl-btn { display: inline-block; margin-top: 4px; padding: 9px 20px; border-radius: 99px; background: #e8843a; color: #0a0605; font-weight: 700; text-decoration: none; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .wl-hat, .wl-bar.indeterminate i { animation: none; } #wl-loading { transition: none; } }
</style>

<body>
<canvas id="canvas" tabindex="0">你的浏览器不支持 canvas。</canvas>
<noscript>本游戏需要启用 JavaScript 才能运行。</noscript>

<div id="wl-loading" role="status" aria-live="polite">
  <a class="wl-back" id="wl-back" href="/games/emberfall3d/">← 返回介绍页</a>
  <svg class="wl-hat" viewBox="0 0 128 128" aria-hidden="true"><path d="M64 18c10 22 30 32 30 56a30 30 0 0 1-60 0c0-14 8-22 14-30 2 10 8 14 12 14-4-16 0-28 4-40z" fill="#e8843a"/><path d="M64 60c6 10 14 14 14 26a14 14 0 0 1-28 0c0-8 6-14 14-26z" fill="#ffd27a"/></svg>

  <div class="wl-status" id="wl-status">正在准备……</div>
  <div class="wl-tip" id="wl-tip"></div>
  <div class="wl-portrait">手机建议横屏</div>

  <div class="wl-note">这是开发中的技术原型：画面全部为占位几何体，不代表最终美术。<br>首次打开需要下载约 40 MB 的游戏引擎，之后浏览器会缓存。</div>
</div>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"ef-d7e256e6","experimentalVK":false,"fileSizes":{"ef-d7e256e6.pck":1386952,"ef-d7e256e6.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"ef-d7e256e6.pck"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const overlay = document.getElementById('wl-loading');
  const bar = document.getElementById('wl-bar');
  const fill = document.getElementById('wl-bar-fill');
  const status = document.getElementById('wl-status');
  const tip = document.getElementById('wl-tip');
  const errorBox = document.getElementById('wl-error');
  const tips = [
    '世界是一堆正在熄灭的篝火。',
    '火种能换来力量，也会烧掉别的东西。',
    '当前是移植 V0.1 的灰盒版本：玩法已可玩，模型仍是占位几何体。',
    '游戏会自动保存到当前浏览器，下次打开可以继续旅程。',
  ];
  let tipIndex = Math.floor(Math.random() * tips.length);
  function nextTip() { tip.textContent = tips[tipIndex % tips.length]; tipIndex += 1; }
  nextTip();
  const tipTimer = setInterval(nextTip, 4200);

  function mb(bytes) { return (bytes / 1048576).toFixed(1); }

  function showError(message) {
    clearInterval(tipTimer);
    bar.style.display = 'none';
    status.textContent = '加载失败';
    errorBox.textContent = message;
    const retry = document.createElement('a');
    retry.className = 'wl-btn';
    retry.href = window.location.pathname;
    retry.textContent = '刷新重试';
    errorBox.appendChild(document.createElement('br'));
    errorBox.appendChild(retry);
    errorBox.classList.add('show');
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    // 最常见的原因不是浏览器太旧，而是显卡加速被关掉，或显卡进程崩溃后浏览器暂时停用了 WebGL：给出能照着做的步骤
    let webgl1 = false;
    try { webgl1 = !!document.createElement('canvas').getContext('webgl'); } catch (e) { /* 不可用 */ }
    const noGL = missing.some(function (m) { return m.indexOf('WebGL2') === 0; });
    const steps = noGL ? [
      webgl1 ? '浏览器现在只提供旧版 WebGL 1，本游戏需要 WebGL 2。' : '浏览器现在没有提供 WebGL（3D 绘图）功能。',
      '通常是下面几种情况，按顺序试一下：',
      '1. 完全退出浏览器再打开（显卡进程崩溃后，浏览器会在本次运行中停用 WebGL；同时开着别的 3D 网页也可能触发）。',
      '2. Chrome / Edge：设置 → 系统 → 打开「使用图形加速功能（如果可用）」，然后重启浏览器。',
      '3. 在地址栏打开 chrome://gpu，看「WebGL2」一行是否为 Hardware accelerated。',
      '4. 换一个浏览器试试（Safari、Firefox、Edge）。',
    ] : ['请换用最新版 Chrome、Edge、Firefox 或 Safari。'];
    showError('无法启动游戏：你的浏览器缺少需要的功能\n（' + missing.join('；') + '）\n\n' + steps.join('\n'));
    console.log('EF_NO_WEBGL2 webgl1=' + webgl1);
    return;
  }

  status.textContent = '正在下载游戏……';
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        bar.classList.remove('indeterminate');
        const pct = Math.min(100, Math.round(current / total * 100));
        fill.style.width = pct + '%';
        status.textContent = '正在下载游戏 ' + pct + '%（' + mb(current) + ' / ' + mb(total) + ' MB）';
        if (current >= total) {
          status.textContent = '下载完成，正在启动引擎……';
        }
      } else {
        bar.classList.add('indeterminate');
      }
    },
  }).then(function () {
    clearInterval(tipTimer);
    overlay.classList.add('hide');
    setTimeout(function () { overlay.remove(); }, 700);
    const canvas = document.getElementById('canvas');
    canvas.focus();
  }, function (err) {
    console.error(err);
    showError('游戏启动时出错：' + (err && err.message ? err.message : String(err)));
  });
}());
</script>
</body>
