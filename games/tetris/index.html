<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="俄罗斯方块网页版：支持键盘与触屏操作，浏览器打开即玩。">
  <link rel="canonical" href="https://www.ooglex.com/games/tetris/">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:title" content="俄罗斯方块 · 网页版 | Ooglex 游戏中心">
  <meta property="og:description" content="经典俄罗斯方块，浏览器打开即玩，支持键盘与触屏操作。">
  <meta property="og:url" content="https://www.ooglex.com/games/tetris/">
  <meta property="og:image" content="https://www.ooglex.com/assets/og-cover.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>俄罗斯方块 · 网页版</title>
  <style>
    :root { --bg:#080b16; --panel:#12182b; --panel-2:#171f37; --line:rgba(255,255,255,.11); --text:#f5f7ff; --dim:#aeb9d5; --cyan:#4ee7ff; --purple:#a78bfa; --pink:#f472b6; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { min-height:100%; margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif; }
    body { background:radial-gradient(700px 420px at 12% 0%,rgba(78,231,255,.14),transparent 65%),radial-gradient(680px 450px at 94% 100%,rgba(167,139,250,.18),transparent 62%),var(--bg); }
    button { font:inherit; }
    .page { width:min(980px,100%); margin:0 auto; padding:18px 16px 34px; }
    .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; }
    .back { color:var(--cyan); text-decoration:none; font-weight:750; font-size:.92rem; }
    .back:hover { opacity:.82; }
    .brand { color:var(--dim); font-size:.82rem; }
    .brand b { color:#fff; }
    .hero { text-align:center; margin:3px 0 18px; }
    h1 { margin:0; font-size:clamp(1.7rem,5vw,2.5rem); letter-spacing:.04em; background:linear-gradient(100deg,var(--cyan),#fff 44%,var(--pink)); -webkit-background-clip:text; background-clip:text; color:transparent; }
    .hero p { margin:7px 0 0; color:var(--dim); font-size:.91rem; }
    .game-layout { display:grid; grid-template-columns:minmax(0,300px) minmax(220px,280px); justify-content:center; align-items:start; gap:18px; }
    .board-wrap { position:relative; width:min(300px,calc(100vw - 32px)); border-radius:16px; overflow:hidden; border:1px solid rgba(78,231,255,.28); background:#060915; box-shadow:0 20px 60px rgba(0,0,0,.44),0 0 44px rgba(78,231,255,.08); }
    #board { display:block; width:100%; height:auto; image-rendering:pixelated; }
    .overlay { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; padding:20px; text-align:center; background:linear-gradient(180deg,rgba(6,9,21,.28),rgba(6,9,21,.88)); transition:opacity .2s; }
    .overlay[hidden] { display:none; }
    .overlay-card { width:min(250px,100%); padding:20px 16px; border:1px solid var(--line); border-radius:16px; background:rgba(18,24,43,.94); box-shadow:0 16px 45px rgba(0,0,0,.45); }
    .overlay h2 { margin:0; font-size:1.35rem; }
    .overlay p { margin:8px 0 15px; color:var(--dim); font-size:.87rem; line-height:1.55; }
    .primary { cursor:pointer; width:100%; border:0; border-radius:10px; padding:11px 14px; color:#07101c; font-weight:850; background:linear-gradient(110deg,var(--cyan),#9cf4ff); box-shadow:0 8px 22px rgba(78,231,255,.24); }
    .primary:hover { filter:brightness(1.06); transform:translateY(-1px); }
    .side { display:grid; gap:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .stat,.card { background:rgba(18,24,43,.9); border:1px solid var(--line); border-radius:13px; }
    .stat { padding:11px 7px; text-align:center; }
    .stat span,.label { display:block; color:var(--dim); font-size:.69rem; font-weight:700; letter-spacing:.08em; }
    .stat strong { display:block; margin-top:4px; font-size:1.1rem; font-variant-numeric:tabular-nums; }
    .previews { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .card { padding:12px; min-height:122px; }
    .label { margin-bottom:7px; }
    .mini { width:100%; display:block; aspect-ratio:1.3; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
    .action { cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:10px 8px; color:var(--text); font-weight:750; background:var(--panel-2); }
    .action:hover { background:#202a49; border-color:rgba(78,231,255,.4); }
    .controls-card { padding:12px 14px; }
    .controls { margin:6px 0 0; padding:0; list-style:none; color:var(--dim); font-size:.78rem; line-height:1.85; }
    kbd { display:inline-block; min-width:18px; padding:1px 4px; border:1px solid rgba(255,255,255,.22); border-bottom-width:2px; border-radius:4px; color:#eef3ff; font-family:inherit; font-size:.69rem; text-align:center; }
    .mobile-controls { display:none; width:min(300px,100%); margin:14px auto 0; grid-template-columns:repeat(4,1fr); gap:8px; }
    .touch { min-height:47px; cursor:pointer; border:1px solid var(--line); border-radius:11px; color:#fff; font-size:1.15rem; background:rgba(23,31,55,.95); touch-action:manipulation; }
    .touch:active { background:#29365f; transform:scale(.96); }
    .touch.hard { background:linear-gradient(135deg,#6d4aff,#a78bfa); border-color:transparent; }
    .tip { margin:16px auto 0; max-width:580px; color:#8d9ab9; font-size:.76rem; text-align:center; line-height:1.6; }
    @media (max-width:650px) { .game-layout { grid-template-columns:1fr; justify-items:center; } .side { width:min(360px,100%); } .mobile-controls { display:grid; } .controls-card { display:none; } .top { margin-bottom:9px; } }
    @media (max-width:370px) { .page { padding-inline:10px; } .stats { gap:6px; } .card { min-height:104px; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <a class="back" href="../hub/">← 返回游戏中心</a>
      <span class="brand"><b>Ooglex</b> · 游戏中心</span>
    </header>
    <section class="hero"><h1>俄罗斯方块</h1><p>经典方块，浏览器打开即玩</p></section>
    <section class="game-layout" aria-label="俄罗斯方块游戏">
      <div class="board-wrap">
        <canvas id="board" width="300" height="600" aria-label="游戏棋盘"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <h2 id="overlayTitle">准备开始？</h2>
            <p id="overlayText">键盘或下方按钮都可以操作方块。</p>
            <button class="primary" id="startButton">开始游戏</button>
          </div>
        </div>
      </div>
      <aside class="side">
        <div class="stats" aria-label="游戏得分">
          <div class="stat"><span>得分</span><strong id="score">0</strong></div>
          <div class="stat"><span>等级</span><strong id="level">1</strong></div>
          <div class="stat"><span>消行</span><strong id="lines">0</strong></div>
        </div>
        <div class="previews">
          <div class="card"><span class="label">下一个</span><canvas class="mini" id="next" width="160" height="120"></canvas></div>
          <div class="card"><span class="label">最高分</span><strong id="highScore" style="font-size:1.4rem">0</strong><span style="display:block;color:var(--dim);font-size:.75rem;margin-top:8px">保存在此设备</span></div>
        </div>
        <div class="actions">
          <button class="action" id="pauseButton" type="button">⏸ 暂停</button>
          <button class="action" id="restartButton" type="button">↻ 重新开始</button>
        </div>
        <div class="card controls-card">
          <span class="label">键盘操作</span>
          <ul class="controls">
            <li><kbd>←</kbd> <kbd>→</kbd> 移动　<kbd>↓</kbd> 加速下落</li>
            <li><kbd>↑</kbd> / <kbd>X</kbd> 旋转　<kbd>空格</kbd> 直落</li>
            <li><kbd>P</kbd> 暂停</li>
          </ul>
        </div>
      </aside>
    </section>
    <div class="mobile-controls" aria-label="触屏操作">
      <button class="touch" data-action="left" aria-label="向左移动">←</button>
      <button class="touch" data-action="rotate" aria-label="旋转">↻</button>
      <button class="touch" data-action="right" aria-label="向右移动">→</button>
      <button class="touch" data-action="down" aria-label="加速下落">↓</button>
      <button class="touch hard" data-action="drop" aria-label="快速落下" style="grid-column:span 4">⇩ 快速落下</button>
    </div>
    <p class="tip">提示：连续消行可快速提升等级。游戏暂停或结束时，按按钮或键盘 <kbd>P</kbd> 继续。</p>
  </main>
  <script>
  (() => {
    'use strict';
    const COLS = 10, ROWS = 20, BLOCK = 30;
    const COLORS = { I:'#43e7ff', J:'#5b87ff', L:'#ffad47', O:'#ffe45c', S:'#62e88a', T:'#bd7bff', Z:'#ff637c' };
    const SHAPES = {
      I:[[1,1,1,1]], J:[[1,0,0],[1,1,1]], L:[[0,0,1],[1,1,1]], O:[[1,1],[1,1]],
      S:[[0,1,1],[1,1,0]], T:[[0,1,0],[1,1,1]], Z:[[1,1,0],[0,1,1]]
    };
    const boardCanvas = document.getElementById('board'), ctx = boardCanvas.getContext('2d');
    const nextCanvas = document.getElementById('next'), nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score'), levelEl = document.getElementById('level'), linesEl = document.getElementById('lines'), highEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay'), overlayTitle = document.getElementById('overlayTitle'), overlayText = document.getElementById('overlayText'), startButton = document.getElementById('startButton'), pauseButton = document.getElementById('pauseButton');
    let board, current, next, bag, score, lines, level, highScore = Number(localStorage.getItem('ooglex-tetris-high-score')) || 0, running = false, paused = false, lastTime = 0, dropCounter = 0, animationId;
    highEl.textContent = highScore.toLocaleString('zh-CN');

    function makeBoard() { return Array.from({length:ROWS}, () => Array(COLS).fill(null)); }
    function cloneShape(shape) { return shape.map(row => row.slice()); }
    function refillBag() { bag = ['I','J','L','O','S','T','Z'].sort(() => Math.random() - .5); }
    function takeType() { if (!bag || !bag.length) refillBag(); return bag.pop(); }
    function createPiece(type = takeType()) { const matrix = cloneShape(SHAPES[type]); return { type, matrix, x:Math.floor((COLS - matrix[0].length) / 2), y:-1 }; }
    function resetGame() { board = makeBoard(); bag = []; score = 0; lines = 0; level = 1; current = createPiece(); next = createPiece(); dropCounter = 0; updateStats(); draw(); drawNext(); }
    function startGame() { resetGame(); running = true; paused = false; overlay.hidden = true; pauseButton.textContent = '⏸ 暂停'; lastTime = performance.now(); cancelAnimationFrame(animationId); animationId = requestAnimationFrame(tick); }
    function updateStats() { scoreEl.textContent = score.toLocaleString('zh-CN'); levelEl.textContent = level; linesEl.textContent = lines; }
    function collide(piece, dx = 0, dy = 0, matrix = piece.matrix) {
      for (let y = 0; y < matrix.length; y++) for (let x = 0; x < matrix[y].length; x++) if (matrix[y][x]) {
        const bx = piece.x + x + dx, by = piece.y + y + dy;
        if (bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && board[by][bx])) return true;
      }
      return false;
    }
    function merge() { current.matrix.forEach((row,y) => row.forEach((cell,x) => { if (cell && current.y + y >= 0) board[current.y+y][current.x+x] = current.type; })); }
    function spawn() { current = next; current.x = Math.floor((COLS-current.matrix[0].length)/2); current.y = -1; next = createPiece(); drawNext(); if (collide(current)) gameOver(); }
    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) if (board[y].every(Boolean)) { board.splice(y,1); board.unshift(Array(COLS).fill(null)); cleared++; y++; }
      if (cleared) { const points = [0,100,300,500,800][cleared] || 0; score += points * level; lines += cleared; level = Math.floor(lines / 10) + 1; updateStats(); }
    }
    function lock() { merge(); clearLines(); spawn(); }
    function move(dx) { if (running && !paused && !collide(current,dx,0)) { current.x += dx; draw(); } }
    function softDrop() { if (!running || paused) return; if (!collide(current,0,1)) { current.y++; score++; updateStats(); } else lock(); dropCounter = 0; draw(); }
    function hardDrop() { if (!running || paused) return; let distance = 0; while (!collide(current,0,1)) { current.y++; distance++; } score += distance * 2; updateStats(); lock(); dropCounter = 0; draw(); }
    function rotate() {
      if (!running || paused) return;
      const rotated = current.matrix[0].map((_, i) => current.matrix.map(row => row[i]).reverse());
      for (const kick of [0,-1,1,-2,2]) if (!collide(current,kick,0,rotated)) { current.matrix = rotated; current.x += kick; draw(); return; }
    }
    function dropInterval() { return Math.max(90, 850 - (level-1)*65); }
    function tick(time) { if (!running) return; const delta = time - lastTime; lastTime = time; if (!paused) { dropCounter += delta; if (dropCounter >= dropInterval()) softDrop(); draw(); } animationId = requestAnimationFrame(tick); }
    function block(context, x, y, size, color, alpha = 1) { context.globalAlpha = alpha; context.fillStyle = color; context.fillRect(x*size+1,y*size+1,size-2,size-2); context.fillStyle = 'rgba(255,255,255,.28)'; context.fillRect(x*size+3,y*size+3,size-6,2); context.fillStyle = 'rgba(0,0,0,.19)'; context.fillRect(x*size+2,y*size+size-5,size-4,3); context.globalAlpha = 1; }
    function draw() {
      ctx.fillStyle = '#070a15'; ctx.fillRect(0,0,boardCanvas.width,boardCanvas.height);
      ctx.strokeStyle = 'rgba(255,255,255,.045)'; ctx.lineWidth = 1;
      for (let x=0;x<=COLS;x++) { ctx.beginPath(); ctx.moveTo(x*BLOCK+.5,0); ctx.lineTo(x*BLOCK+.5,ROWS*BLOCK); ctx.stroke(); }
      for (let y=0;y<=ROWS;y++) { ctx.beginPath(); ctx.moveTo(0,y*BLOCK+.5); ctx.lineTo(COLS*BLOCK,y*BLOCK+.5); ctx.stroke(); }
      board.forEach((row,y) => row.forEach((type,x) => { if (type) block(ctx,x,y,BLOCK,COLORS[type]); }));
      if (current) {
        let ghostY = current.y; while (!collide({...current,y:ghostY},0,1)) ghostY++;
        current.matrix.forEach((row,y) => row.forEach((cell,x) => { if (cell && ghostY+y >= 0) block(ctx,current.x+x,ghostY+y,BLOCK,COLORS[current.type],.2); }));
        current.matrix.forEach((row,y) => row.forEach((cell,x) => { if (cell && current.y+y >= 0) block(ctx,current.x+x,current.y+y,BLOCK,COLORS[current.type]); }));
      }
    }
    function drawNext() {
      nextCtx.clearRect(0,0,nextCanvas.width,nextCanvas.height); if (!next) return;
      const cell = 23, width = next.matrix[0].length*cell, height = next.matrix.length*cell, ox = (nextCanvas.width-width)/2, oy = (nextCanvas.height-height)/2;
      next.matrix.forEach((row,y) => row.forEach((filled,x) => { if (filled) { nextCtx.fillStyle = COLORS[next.type]; nextCtx.fillRect(ox+x*cell+1,oy+y*cell+1,cell-2,cell-2); nextCtx.fillStyle='rgba(255,255,255,.34)'; nextCtx.fillRect(ox+x*cell+3,oy+y*cell+3,cell-6,2); } }));
    }
    function setOverlay(title, text, button) { overlayTitle.textContent = title; overlayText.textContent = text; startButton.textContent = button; overlay.hidden = false; }
    function gameOver() { running = false; cancelAnimationFrame(animationId); if (score > highScore) { highScore = score; localStorage.setItem('ooglex-tetris-high-score',String(score)); highEl.textContent = highScore.toLocaleString('zh-CN'); setOverlay('新纪录！', `本局得分 ${score.toLocaleString('zh-CN')}，继续挑战吗？`, '再来一局'); } else setOverlay('游戏结束', `本局得分 ${score.toLocaleString('zh-CN')}，再试一次？`, '再来一局'); }
    function togglePause() { if (!running) return; paused = !paused; pauseButton.textContent = paused ? '▶ 继续' : '⏸ 暂停'; if (paused) setOverlay('已暂停', '按 P 或点击继续游戏。', '继续游戏'); else { overlay.hidden = true; lastTime = performance.now(); } }
    function act(action) { if (action === 'left') move(-1); if (action === 'right') move(1); if (action === 'down') softDrop(); if (action === 'rotate') rotate(); if (action === 'drop') hardDrop(); }
    startButton.addEventListener('click', () => { if (running && paused) togglePause(); else startGame(); });
    pauseButton.addEventListener('click', togglePause); document.getElementById('restartButton').addEventListener('click', startGame);
    document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('pointerdown', event => { event.preventDefault(); act(button.dataset.action); }));
    document.addEventListener('keydown', event => {
      const key = event.key.toLowerCase(); const actions = {arrowleft:'left',arrowright:'right',arrowdown:'down',arrowup:'rotate',x:'rotate',' ':'drop'};
      if (key in actions) { event.preventDefault(); act(actions[key]); } else if (key === 'p') { event.preventDefault(); togglePause(); }
    });
    resetGame();
  })();
  </script>
</body>
</html>
