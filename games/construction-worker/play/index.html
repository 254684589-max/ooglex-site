<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"cw-9476002c","experimentalVK":false,"fileSizes":{"cw-9476002c.pck":1289248,"cw-9476002c.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"mainPack":"cw-9476002c.pck"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
  const overlay = document.getElementById('cw-loading');
  const bar = document.getElementById('cw-bar');
  const fill = document.getElementById('cw-bar-fill');
  const status = document.getElementById('cw-status');
  const tip = document.getElementById('cw-tip');
  const errorBox = document.getElementById('cw-error');
  const tips = [
    '提示：走到砖堆跟前按 F 拿砖，再按一次多拿一块。',
    '提示：只有走进黄框卸货区放下的材料，才算任务进度。',
    '提示：体力低了会走不动、眼前发晃。站着歇会儿，或者去食堂吃饭。',
    '提示：施工楼南边的凉茶桶可以免费喝水。',
    '提示：晚上回宿舍睡觉，醒来就是第二天。别熬过凌晨两点！',
    '提示：搬得越多，搬运熟练度越高，一次能拿的砖就越多。',
  ];
  let tipIndex = Math.floor(Math.random() * tips.length);
  function nextTip() { tip.textContent = tips[tipIndex % tips.length]; tipIndex += 1; }
  nextTip();
  const tipTimer = setInterval(nextTip, 4200);

  function mb(bytes) { return (bytes / 1048576).toFixed(1); }

  function showError(message) {
    clearInterval(tipTimer);
    bar.style.display = 'none';
    status.textContent = '加载失败';
    errorBox.textContent = message;
    const retry = document.createElement('a');
    retry.className = 'cw-btn';
    retry.href = window.location.pathname;
    retry.textContent = '刷新重试';
    errorBox.appendChild(document.createElement('br'));
    errorBox.appendChild(retry);
    errorBox.classList.add('show');
  }

  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length !== 0) {
    showError('你的浏览器缺少运行本游戏需要的功能：\n' + missing.join('\n') + '\n\n请换用最新版 Chrome、Edge、Firefox 或 Safari（需要支持 WebGL 2）。');
    return;
  }

  status.textContent = '正在下载游戏……';
  engine.startGame({
    onProgress: function (current, total) {
      if (current > 0 && total > 0) {
        bar.classList.remove('indeterminate');
        const pct = Math.min(100, Math.round(current / total * 100));
        fill.style.width = pct + '%';
        status.textContent = '正在下载游戏 ' + pct + '%（' + mb(current) + ' / ' + mb(total) + ' MB）';
        if (current >= total) {
          status.textContent = '下载完成，正在启动引擎……';
        }
      } else {
        bar.classList.add('indeterminate');
      }
    },
  }).then(function () {
    clearInterval(tipTimer);
    overlay.classList.add('hide');
    setTimeout(function () { overlay.remove(); }, 700);
    const canvas = document.getElementById('canvas');
    canvas.focus();
  }, function (err) {
    console.error(err);
    showError('游戏启动时出错：' + (err && err.message ? err.message : String(err)));
  });
}());
</script>
