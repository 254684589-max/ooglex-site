<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>账户 · Ooglex</title><link rel="stylesheet" href="./auth.css"><script src="/assets/i18n.js?v=72e8d1ca" defer></script></head><body><header class="topbar"><a class="brand" href="/">OOGLEX</a><a class="back" href="/">返回首页</a></header><main class="shell"><section class="intro"><p class="eyebrow">OOGLEX ACCOUNT</p><h1>登录你的研究终端</h1><p>支持邮箱注册、登录、找回密码，以及 Free / Pro 权限识别。</p></section><section class="card" aria-live="polite"><div id="setup-state" class="hidden"><span class="badge">尚未连接</span><h2>账户前端已就位</h2><p>创建并连接 Supabase 项目后即可启用真实账户系统。</p><p class="muted">前端只允许放 Publishable Key，禁止放 service_role、数据库密码或邮件服务密钥。</p></div><div id="guest-state" class="hidden"><div class="tabs"><button id="tab-login" class="tab active" type="button">登录</button><button id="tab-signup" class="tab" type="button">注册</button></div><form id="login-form" class="form"><label>邮箱<input id="login-email" type="email" required autocomplete="email"></label><label>密码<input id="login-password" type="password" required minlength="8" autocomplete="current-password"></label><button class="primary" type="submit">登录</button><button id="forgot-button" class="link-button" type="button">忘记密码</button></form><form id="signup-form" class="form hidden"><label>邮箱<input id="signup-email" type="email" required autocomplete="email"></label><label>密码<input id="signup-password" type="password" required minlength="8" autocomplete="new-password"></label><label>昵称（可选）<input id="signup-name" type="text" maxlength="40"></label><button class="primary" type="submit">注册</button></form></div><div id="recovery-state" class="hidden"><form id="recovery-form" class="form"><h2>设置新密码</h2><label>新密码<input id="recovery-password" type="password" required minlength="8"></label><button class="primary" type="submit">更新密码</button></form></div><div id="user-state" class="hidden"><span class="badge success">已登录</span><h2>账户中心</h2><dl class="account-data"><div><dt>邮箱</dt><dd id="user-email">—</dd></div><div><dt>昵称</dt><dd id="user-name">—</dd></div><div><dt>会员</dt><dd id="user-plan">FREE</dd></div><div><dt>状态</dt><dd id="user-status">ACTIVE</dd></div></dl><button id="logout-button" class="secondary" type="button">退出登录</button></div><p id="message" class="message"></p></section></main><footer>账户系统 Beta · Ooglex</footer><script src="./config.js"></script><script type="module" src="./auth.js"></script></body></html>
